<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one column (max 640px) with 16px gutters. Home = brand header, track switch, search, unit grid (1 col → 2 cols ≥560px), about/sources.
   Unit = back bar, intro note, mode tabs (Learn / Cards / Quiz), then that mode's content. */
:root{
  --bg:#f8f3e8; --card:#fffdf8; --fg:#2a2317; --muted:#6f6454; --line:#e6dcc7; --chip:#efe7d6;
  --accent:#1d6b45; --accent-fg:#ffffff; --soft:#e3efe6; --warm:#b4471a; --gold:#e3b23c; --warn:#f8e6d5;
  --good:#1d6b45; --bad:#b83226;
  --display:'Fraunces',Georgia,'Times New Roman',serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17150f; --card:#211e16; --fg:#f1e9d8; --muted:#ada28c; --line:#383226; --chip:#2b271d;
  --accent:#5cc18c; --accent-fg:#0f2318; --soft:#1d3127; --warm:#ef8a5a; --gold:#e3b23c; --warn:#3a2a1b;
  --good:#5cc18c; --bad:#ff7d6e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17150f; --card:#211e16; --fg:#f1e9d8; --muted:#ada28c; --line:#383226; --chip:#2b271d;
  --accent:#5cc18c; --accent-fg:#0f2318; --soft:#1d3127; --warm:#ef8a5a; --gold:#e3b23c; --warn:#3a2a1b;
  --good:#5cc18c; --bad:#ff7d6e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;padding-inline:16px;padding-block:16px 56px}
#app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2.1rem} h2{font-size:1.5rem} h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.brand small{display:block;color:var(--muted);font-size:.95rem;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.seg button{border-radius:0;min-height:36px;padding:4px 12px;background:transparent;font-size:.9rem}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.track{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card);display:flex;flex-direction:column;gap:2px;min-width:0}
.track b{font-size:1.02rem}
.track span{color:var(--muted);font-size:.85rem}
.track[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}
.track:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.search{display:flex;flex-direction:column;gap:8px}
.search input{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.unit{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;min-width:0}
.unit:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.unit .ic{font-size:1.6rem;grid-row:span 3}
.unit b{font-size:1rem;line-height:1.25}
.unit small{color:var(--muted);font-size:.85rem;line-height:1.25}
.meter{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:0}
.sec-label{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.note-box{background:var(--soft);border-radius:14px;padding:12px 14px}
.warn{background:var(--warn);border-radius:12px;padding:10px 14px;font-size:.92rem}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:14px}
.tabs button{flex:1;background:transparent;min-height:40px}
.tabs button[aria-selected=true]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.known{border-color:var(--accent)}
.lbl{display:inline-block;align-self:flex-start;background:var(--chip);border-radius:8px;padding:2px 10px;font-weight:800;font-size:1.05rem}
.tgt{font-family:var(--display);font-size:1.45rem;line-height:1.3;overflow-wrap:anywhere}
.tgt .w{cursor:pointer;border-radius:6px;padding:0 1px}
.tgt .w.on{background:var(--gold);color:#2a2317}
.tgt .w.good{color:var(--good);text-decoration:underline;text-decoration-thickness:2px}
.tgt .w.bad{color:var(--bad);text-decoration:underline wavy}
.mng{overflow-wrap:anywhere}
.mng b{color:var(--warm)}
.nt{font-size:.92rem;color:var(--muted);overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:8px 14px;min-height:44px;cursor:pointer;background:var(--chip);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.main{background:var(--accent);color:var(--accent-fg)}
button.live{background:var(--bad);color:#fff}
button.sel{background:var(--accent);color:var(--accent-fg)}
button.link{background:transparent;padding:4px 0;min-height:36px;color:var(--accent);text-decoration:underline}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.res{font-size:.95rem;overflow-wrap:anywhere}
.res .sc{font-weight:800;font-variant-numeric:tabular-nums}
audio{width:100%;max-width:100%;height:40px}
.fc{background:var(--card);border:2px solid var(--line);border-radius:20px;min-height:220px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;cursor:pointer;user-select:none}
.fc .big{font-family:var(--display);font-size:1.8rem;line-height:1.25;overflow-wrap:anywhere}
.fc .hint{color:var(--muted);font-size:.85rem}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{justify-content:flex-start;text-align:left;background:var(--card);border:2px solid var(--line);font-weight:700;padding:10px 14px}
.opts button:disabled{opacity:1}
.opts button.right{border-color:var(--good);background:var(--soft)}
.opts button.wrong{border-color:var(--bad)}
.qprompt{font-family:var(--display);font-size:1.5rem;overflow-wrap:anywhere}
.big-score{font-family:var(--display);font-size:3rem;font-variant-numeric:tabular-nums}
.about{display:flex;flex-direction:column;gap:8px;font-size:.95rem}
.about ol{margin:0;padding-left:20px}

.stats{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.hometabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hometabs button{font-size:.88rem;padding:6px 4px;line-height:1.15}
.grp{font-family:var(--body);font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:.75rem;font-weight:700;background:var(--chip);color:var(--muted);border-radius:99px;padding:2px 8px;min-height:0}
.chip.flag{background:var(--warn);color:var(--warm)}
button.linkchip{min-height:28px;padding:2px 10px;color:var(--accent)}
.lsec{gap:10px}
.lsec h3{font-size:1.2rem}
.prose{line-height:1.6;max-width:65ch}
details summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:.9rem}
details p{margin-top:6px;color:var(--muted)}
.tablewrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--chip);font-weight:800;white-space:nowrap}
tr:last-child td{border-bottom:0}
.lsec .card{background:var(--bg);border-color:var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

const PHRASES=[{"id":"starter","en":"Starter: everyday chat","om":"Jalqaba: haasaa guyyaa guyyaa","icon":"⭐","group":"social","intros":{"pse":{"en":"26 everyday sentences for chatting with family and friends. Start here.","om":"Hima 26 maatii fi hiriyoota waliin haasa'uuf. Asii jalqabi."}},"items":[["How are you?","Akkam jirta?","","",0],["I am doing well, thank God.","Nagaan jira, Waaqayyoof galata.","","",0],["How was your day?","Guyyaan kee akkam ture?","","",0],["My day was good.","Guyyaan koo gaarii ture.","","",0],["Are you at home?","Mana jirtaa?","","",0],["I am at home.","Mana jira.","","",0],["I am at work.","Hojii irra jira.","","",0],["I am going to school.","Mana barumsaa deemaa jira.","","",0],["I went to church today.","Har'a waldaa deeme.","","",0],["What are you doing now?","Amma maal hojjechaa jirta?","","",0],["What did you do today?","Har'a maal hojjatte?","","",0],["I am cooking rice.","Ruuzii bilcheessaa jira.","","",0],["Did you eat?","Nyaatee jirtaa?","","",0],["I am tired and I want to sleep.","Dadhabee jira, rafuu barbaada.","","",0],["I am resting at home.","Mana keessa boqonnaa fudhachaa jira.","","",0],["Are you awake?","Dammaqxee jirtaa?","","",0],["I miss you.","Sin yaadaa jira.","","",0],["I love you.","Sin jaalladha.","","",0],["You are beautiful.","Ati bareedduudha.","","",0],["Thank you, my love.","Galatoomi, jaalallee koo.","","",0],["I want to see you soon.","Dhiyootti si arguu barbaada.","","",0],["When can we talk?","Yoom haasa'uu dandeenya?","","",0],["I am here for you.","Ani siif jira.","","",0],["Learning English is important.","Afaan Ingiliffaa baruun barbaachisaadha.","","",0],["God willing, we will go to church together.","Fedhaan Waaqayyoo yoo ta'e, waldaa waliin deemna.","","",0],["Good morning. Have a good day.","Akkam bulte? Guyyaa gaarii qabaadhu.","","",0]]},{"id":"greet","en":"Greetings","om":"Nagaa gaafachuu","icon":"👋","group":"social","intros":{"pse":{"en":"Oromo greetings follow the time of day: Akkam bulte? in the morning (literally 'How did you spend the night?') and Akkam oolte? later in the day. English 'How are you?' works at any time, and the expected answer is short ('Fine, thanks. And you?'), not a real health report. Use the plural/respect forms (Akkam bultan?) with elders, people you respect, and groups.","om":"Afaan Oromootiin nagaan yeroo guyyaatiin gaafatama: ganama 'Akkam bulte?', guyyaa booda 'Akkam oolte?'. Ingiliffaan 'How are you?' yeroo kamiyyuu ni fayyada, deebiin isaas gabaabaadha ('Fine, thanks. And you?') — waa'ee fayyaa kee guutummaatti himuu hin barbaachisu. Maanguddootaaf, nama kabajduuf fi garee namootaaf bifa baay'inaa (Akkam bultan?) fayyadami."},"rwb":{"en":"Oromo greetings are long and warm: people ask about your night, your day, your health and your family before getting down to business. Use the plural/respect forms (bultan, ooltan, jirtu) with elders, people you don't know well, and anyone with a title. The usual answer is Nagaa (peace) or Fayyaa (health), often followed by thanks to God — while in English a short 'Fine, thanks' is enough.","om":"Nagaan Oromoo dheeraa fi ho'aadha: dura waa'ee halkanii, guyyaa, fayyaa fi maatii gaafatanii booda gara dubbii seenu. Maanguddootaaf, nama hin beekneef fi nama maqaa kabajaa qabuuf unka kabajaa (bultan, ooltan, jirtu) fayyadami. Deebiin baramaan 'Nagaa' ykn 'Fayyaa' yoo ta'u, galata Waaqaatiin xumurama; Afaan Ingiliffaatiin garuu 'Fine, thanks' jechuun ni ga'a."}},"items":[["Hello! / Hi!","Akkam!","'Hi' is informal but fine with almost anyone in the US.","'Hi' salphaadha; Ameerikaatti nama hundaaf ni fayyada.",0],["Good morning.","Akkam bulte?","Respect/plural: Akkam bultan?","",0],["Good afternoon.","Akkam oolte?","Respect/plural: Akkam ooltan?","",0],["Good evening.","Akkam galgalte?","Respect/plural: Akkam galgaltan? 'Good evening' greets; 'Good night' is only for leaving or bedtime. Also: Galgala gaarii.","'Good evening' nagaa gaafachuuf; 'Good night' yeroo addaan baanu ykn ciisuuf qofa.",1],["Good morning, sir.","Akkam bultan, obboo?","Obboo = Mr./sir (respectful to a man); Aadde = Mrs./ma'am.","",0],["How are you?","Akkam jirta?","Respect/plural: Akkam jirtu?","",0],["I'm fine, thanks. And you?","Nagaadha, galatoomi. Ati hoo?","Also: Fayyaadha. Respect: Isin hoo?","",0],["I'm doing well, thank God.","Galanni Waaqayyoof haa ta'u, nagaadha.","Muslim speakers: Rabbiif galanni haa ta'u.","",0],["Not bad.","Hamaa miti.","","",0],["I can't complain.","Homaa hin jedhu.","Means 'I'm fine; nothing is wrong.'","Hiikni isaa 'nagaadha, rakkoo hin qabu' jechuudha.",0],["How's everything?","Wanti hundi akkam jira?","","",0],["How have you been?","Akkam turte?","Respect/plural: Akkam turtan? Used when you haven't seen someone for a while.","",0],["How's your family?","Maatiin kee akkam jiru?","Respect/plural: Maatiin keessan akkam jiru?","",0],["They're all well, thanks.","Hundi isaanii nagaadha, galatoomi.","","",0],["How's work?","Hojiin akkam jira?","Also: Hojiin akkam?","",0],["Long time no see!","Yeroo dheeraaf wal hin agarre!","Very common friendly form: Baay'ee badde! ('You've been gone a long time!') Also: Yeroo dheeraaf wal hin argine!","",0],["Where have you been?","Eessa turte?","Respect/plural: Eessa turtan?","",0],["I've been busy with work.","Hojiidhaan qabamee ture.","","",0],["It's so good to see you again!","Ammas si arguu kootti baay'een gammade!","","",0],["What's new?","Oduu haaraa maal qabda?","","",0],["Nothing much.","Homaa hin jiru.","Also: Waan haaraa hin jiru.","",0],["Say hi to your mom for me.","Haadha keetiin nagaa naaf jedhi.","","",0],["Sure, I'll tell her.","Tole, nan itti hima.","","",0],["Hi! / Hello!","Akkam!","Short and friendly. With elders use a full greeting such as Akkam jirtu?","Gabaabaa fi salphaadha. Maanguddootaaf nagaa guutuu, fakkeenyaaf 'Akkam jirtu?' gaafadhu.",0],["Hello! (lit. 'Peace!')","Nagaa!","Also the usual answer meaning 'I'm well'.","Deebii 'nagaan jira' jechuufis ni oola.",0],["I'm fine.","Nagaadha.","Also: Fayyaadha. / Gaariidha.","Akkasumas: Fayyaadha. / Gaariidha.",0],["Fine, thank God. And you?","Nagaa, galanni Waaqayyoof. Ati hoo?","Respect/plural: ... Isin hoo? Muslim speakers often say Rabbiif instead of Waaqayyoof.","Kabajaaf/baay'inaaf: ... Isin hoo? Musliimonni yeroo baay'ee 'Rabbiif' jedhu.",0],["Did you sleep well? / Good morning.","Nagaan bultee?","Respect/plural: Nagaan bultanii? Answer: Eeyyee, nagaan bule.","Kabajaaf/baay'inaaf: Nagaan bultanii? Deebii: Eeyyee, nagaan bule.",0],["Good afternoon. / How's your day going?","Akkam oolte?","Respect/plural: Akkam ooltan? Lit. 'How did you spend the day?' Used from midday into the evening.","Kabajaaf/baay'inaaf: Akkam ooltan? Hiikni isaa 'Guyyaa akkamitti oolte?' jechuudha; waaree booda hanga galgalaatti.",0],["Are the children well?","Ijoolleen nagaadhaa?","","",0],["How's your health?","Fayyaan kee akkam?","Respect/plural: Fayyaan keessan akkam?","Kabajaaf/baay'inaaf: Fayyaan keessan akkam?",0],["Is everything all right?","Nagaadhaa?","Lit. 'Is it peace?' Answer: Nagaa!","Deebii: Nagaa!",0],["And you?","Ati hoo?","Respect/plural: Isin hoo?","Kabajaaf/baay'inaaf: Isin hoo?",0],["Good morning, Mr. Elemo.","Obbo Elemoo, akkam bultan?","Titles and elders take the respectful plural (bultan), even for one person.","Nama maqaa kabajaa qabuu fi maanguddootaaf, tokkicha ta'anis, unka baay'inaa (bultan) fayyadamna.",0],["Good afternoon, Mother of Abdi.","Haadha Abdii, akkam ooltan?","Calling a mother by her firstborn's name is warm and respectful.","Haadha tokko maqaa angafa isheetiin waamuun kabajaa fi jaalala agarsiisa.",0]]},{"id":"leave","en":"Leave-taking and goodbyes","om":"Wal gaggeessuu","icon":"🚪","group":"social","intros":{"pse":{"en":"English speakers usually signal the end of a conversation first ('Well, I'd better get going') and then say goodbye. In Oromo culture people part with blessings such as Nagaan gali ('Go home in peace') and Nagaan turi ('Stay in peace'), and a host may walk a guest part of the way. 'Good night' is said only late in the evening or before bed.","om":"Ingiliffaan dura haasaa xumuruu akeeku ('Well, I'd better get going'), achiis 'Goodbye' jedhu. Aadaa Oromootiin namoonni eebbaan addaan bahu: 'Nagaan gali', 'Nagaan turi'; keessummaas karaa irratti ni geggeessu. 'Good night' galgala booda ykn yeroo ciisicha qofa jedhama."},"rwb":{"en":"Oromo has different goodbyes for the person leaving and the person staying: the one who leaves says Nagaan turi (stay in peace), and the one who stays answers Nagaan deemi or Nagaan gali (go / get home in peace). Nagaatti works for everyone. In English, 'Bye', 'See you' and 'Take care' are enough in most situations.","om":"Afaan Oromoo keessatti nama deemuu fi nama hafu biratti nagaatti jechuun garaagara: kan deemu 'Nagaan turi' jedha, kan hafu immoo 'Nagaan deemi' ykn 'Nagaan gali' jedhee deebisa. 'Nagaatti' nama hundaaf ni ta'a. Afaan Ingiliffaatiin 'Bye', 'See you' fi 'Take care' bakka hedduutti ni ga'u."}},"items":[["Goodbye.","Nagaatti.","Also: Nagaatti!","",0],["Bye! See you!","Nagaatti, wal argina!","","",0],["See you later.","Booda wal argina.","Also: Booda wal agarra.","",0],["See you tomorrow.","Boru wal argina.","Also: Boru wal agarra.","",0],["See you on Monday.","Wiixata wal argina.","","",0],["Good night.","Nagaan buli.","Respect/plural: Nagaan bulaa. Also heard: Halkan gaarii.","",0],["Have a nice day.","Nagaan ooli.","Respect/plural: Nagaan oolaa. Literally 'spend the day in peace'.","",0],["Get home safely.","Nagaan gali.","Said to the person going home. Respect/plural: Nagaan galaa.","",0],["Stay well. (said by the one leaving)","Nagaan turi.","Respect/plural: Nagaan turaa.","",0],["Take care.","Of eeggadhu.","Respect/plural: Of eeggadhaa.","",0],["Well, I'd better get going.","Egaa, deemuu qaba.","A polite way to start ending a conversation.","Haasaa xumuruuf karaa kabajaa.",0],["Sorry, I have to go now.","Dhiifama, amma deemuu qaba.","","",0],["I don't want to keep you any longer.","Yeroo kee caalaatti fudhachuu hin barbaadu.","","",0],["It was nice talking to you.","Waliin haasa'uun keenya na gammachiise.","","",0],["Let's talk more later.","Booda caalaatti haa haasofnu.","","",0],["Let's keep in touch.","Yeroo yeroon wal haa qunnamnu.","","",0],["Call me sometime.","Yeroo siif mijate naaf bilbili.","","",0],["Have a safe trip!","Imala gaarii siif haa ta'u!","Also common: Karaa nagaa!","",0],["Have fun!","Yeroo gaarii dabarsi!","","",0],["Come back soon!","Dafii nutti deebi'i!","","",0],["I'll miss you.","Baay'een si yaada.","","",1],["Bye — stay well. (said by the one leaving)","Nagaan turi.","Respect/plural: Nagaan turaa.","Kabajaaf/baay'inaaf: Nagaan turaa.",0],["Go in peace. (said to the one leaving)","Nagaan deemi.","Respect/plural: Nagaan deemaa.","Kabajaaf/baay'inaaf: Nagaan deemaa.",0],["Have a safe trip.","Karaa nagaa!","Also: Imala gaarii!","Akkasumas: Imala gaarii!",0],["Come back safely.","Nagaan deebi'i.","Respect/plural: Nagaan deebi'aa.","Kabajaaf/baay'inaaf: Nagaan deebi'aa.",0],["Welcome back!","Baga nagaan deebite!","Respect/plural: Baga nagaan deebitan!","Kabajaaf/baay'inaaf: Baga nagaan deebitan!",0],["I have to go now.","Amma deemuu qaba.","","",0],["It's getting dark; I have to go home.","Dukkanaa'aa jira; mana galuu qaba.","","",0],["Thanks for coming.","Waan dhufteef galatoomi.","Respect/plural: Waan dhuftaniif galatoomaa.","Kabajaaf/baay'inaaf: Waan dhuftaniif galatoomaa.",0]]},{"id":"meet","en":"Meeting people and introductions","om":"Wal barachuu fi of beeksisuu","icon":"🤝","group":"social","intros":{"pse":{"en":"At a first meeting Americans shake hands, say 'Nice to meet you' and move to first names quickly. Oromo speakers often ask where you are from and about your family, and use titles such as Obboo (Mr.) and Aadde (Mrs./Ms.) with older people. Questions about salary, religion or marital status are normal in Ethiopia but can feel too personal to Americans at first.","om":"Yeroo jalqabaaf wal arguun Ameerikaanonni harka wal fuudhu, 'Nice to meet you' jedhu, maqaa duraatiin wal waamuus ni jalqabu. Namoonni Oromoo eessaa akka dhufte fi waa'ee maatii kee ni gaafatu; maanguddootaaf 'Obboo' fi 'Aadde' jedhu. Gaaffiin waa'ee mindaa, amantii ykn fuudhaa fi heerumaa Ameerikaanotaaf yeroo jalqabaa dhuunfaa caalaa itti fakkaata."},"rwb":{"en":"When Oromos ask your name they use eenyu (who), not maal (what): Maqaan kee eenyu? People are often introduced by their relationship (my friend, my brother's wife), and asking where someone comes from is a normal, friendly question. In English, a handshake with 'Nice to meet you' is the standard first meeting.","om":"Oromoon maqaa gaafachuuf 'maal' osoo hin taane 'eenyu' fayyadama: Maqaan kee eenyu? Namni yeroo baay'ee hariiroo isaatiin (hiriyaa koo, haadha manaa obboleessa koo) beeksifama; 'Eessaa dhufte?' jedhanii gaafachuun gaaffii nagaa fi baramaadha. Afaan Ingiliffaatiin yeroo jalqabaaf wal argitan harka wal fuudhanii 'Nice to meet you' jechuun baramaadha."}},"items":[["Nice to meet you.","Si beekuu kootti gammadeera.","Respect/plural: Isin beekuu kootti gammadeera. Also: Baga wal barre!","",0],["Nice to meet you, too.","Anis si beekuu kootti gammadeera.","","",0],["What's your name?","Maqaan kee eenyu?","Respect/plural: Maqaan keessan eenyu?","",0],["My name is Lensa.","Maqaan koo Lensaa jedhama.","Also: Ani Lensaa jedhama.","",0],["Let me introduce myself.","Mee of siif haa beeksisu.","","",0],["This is my friend Tolosa.","Kun hiriyaa koo, Tolosaadha.","","",0],["I'd like you to meet my wife.","Haadha manaa koo siif haa beeksisu.","","",0],["Welcome!","Baga nagaan dhufte!","Respect/plural: Baga nagaan dhuftan!","",0],["Where are you from?","Eessaa dhufte?","Respect/plural: Eessaa dhuftan?","",0],["I'm from Adama.","Ani Adaamaa irraa dhufe.","","",0],["Where do you live?","Eessa jiraatta?","Respect/plural: Eessa jiraattu?","",0],["I live in Addis Ababa.","Ani Finfinnee keessa jiraadha.","","",0],["What do you do?","Maal hojjatta?","Asks about someone's job. Respect/plural: Maal hojjattu?","",0],["Are you a student?","Ati barataadhaa?","To a woman: Ati barattuudhaa?","",0],["How do you know Chala?","Caalaa akkamitti beekta?","","",0],["We went to school together.","Waliin barachaa turre.","","",0],["Have we met before?","Kana dura wal agarree beeknaa?","Also: Kanaan dura wal beeknaa?","",0],["You look familiar.","Akka waan si beeku natti fakkaata.","","",0],["Please call me Sam.","Maaloo Saam jedhii na waami.","","",0],["Make yourself at home.","Akka mana keetiitti of bilisoomsi.","","",1],["My name is Abdi.","Maqaan koo Abdiidha.","Also: Maqaan kiyya Abdiidha.","Akkasumas: Maqaan kiyya Abdiidha.",0],["I'm called Chaltu.","Ani Caaltuu jedhama.","Lit. 'I am called Chaltu.'","Afaan Ingiliffaatiin 'My name is...' ykn 'I'm...' caalaa baramaadha.",0],["What's his name?","Maqaan isaa eenyu?","","",0],["What's her name?","Maqaan ishee eenyu?","Also: Maqaan isii eenyu?","Akkasumas: Maqaan isii eenyu?",0],["This is my friend Tola.","Kun hiriyaa koo Tolaadha.","","",0],["This is my wife.","Kun haadha manaa kooti.","Husband: abbaa manaa. Also: niitii (wife), dhirsa (husband).","'Husband' = abbaa manaa / dhirsa; 'wife' = haadha manaa / niitii.",0],["Let me introduce you: this is Ali.","Mee wal baraa: kun Aliidha.","wal baruu = to get acquainted.","'wal baruu' jechuun 'get to know each other' jechuudha.",1],["Nice to meet you too.","Anis gammadeera.","","",0],["Please introduce us.","Maaloo, wal nu barsiisi.","","",0],["I'm from Jimma.","Ani Jimmaadhaa dhufe.","","",0],["Which country are you from?","Biyya kamirraa dhufte?","","",0],["I'm American.","Ani lammii Ameerikaati.","","",0],["I'm Oromo.","Ani Oromoodha.","","",0],["Sorry, I forgot your name.","Dhiifama, maqaa kee irraanfadhe.","","",0]]},{"id":"small_talk","en":"Small talk","om":"Haasaa salphaa","icon":"☕","group":"social","intros":{"pse":{"en":"Small talk is short, friendly chat about safe topics—weather, the weekend, sports, traffic—before or instead of serious talk. In the US it is normal even with strangers in a line or an elevator; avoid salary, age, weight and religion. In Oromo communities small talk usually includes asking after family, and in the countryside about rain, harvest and cattle.","om":"Haasaan salphaan waa'ee qilleensaa, dhuma torbanii, ispoortii fi tiraafikii haasa'uudha. Ameerikaatti nama hin beekne waliinis toora keessatti ni haasa'ama; garuu waa'ee mindaa, umurii, ulfaatina qaamaa fi amantii hin gaafatin. Hawaasa Oromoo keessatti waa'ee maatii, baadiyyaatti ammoo waa'ee roobaa, midhaanii fi loonii gaafachuun baratamaadha."},"rwb":{"en":"Friendly chat usually starts with how long you've been somewhere, whether you're settling in, and news of family and work. Oromo speakers often answer briefly and turn the question back (Ati hoo? — 'And you?'). Coffee is the natural setting for small talk.","om":"Haasaan salphaan yeroo baay'ee 'As hammam turte?', 'Bakka kana bartee?' fi oduu maatii fi hojii gaafachuun jalqaba. Namni deebii gabaabaa kennee gaaffii deebisee 'Ati hoo?' jedha. Teessumni bunaa bakka haasaa salphaa isa gaariidha."}},"items":[["Nice weather today, isn't it?","Har'a qilleensi gaariidha, mitii?","","",0],["It's so hot today!","Har'a baay'ee ho'eera!","","",0],["It looks like rain.","Roobuuf jedha.","","",0],["How was your weekend?","Dhuma torbanii akkam dabarsite?","","",0],["Did you do anything special?","Waan addaa hojjattee?","","",0],["I just relaxed at home.","Mana keessatti boqodhe.","","",0],["The traffic was terrible this morning.","Har'a ganama tiraafikiin baay'ee hamaa ture.","","",0],["Busy day?","Har'a hojiin sitti baay'atee?","","",0],["Did you see the game last night?","Kaleessa galgala taphicha ilaalteettaa?","","",0],["Have you been here before?","Kana dura asitti dhuftee beektaa?","","",0],["Do you come here often?","Yeroo baay'ee as dhufta?","","",0],["How long have you lived here?","Erga as jiraattee hangam ta'e?","","",0],["What a long line!","Toorri kun akkam dheeraa!","","",0],["By the way, did you hear about Gutu?","Dubbiin dubbii fida, waa'ee Guutuu dhageesseettaa?","Dubbiin dubbii fida ('talk brings talk') is a natural Oromo way to say 'by the way'.","",0],["How long have you been here?","As hammam turte?","","",0],["Are you getting used to it here?","Bakka kana bartee?","","",1],["I'm getting used to it.","Baraa jira.","","",1],["What are you doing here?","As maal hojjetta?","","",0],["I'm here for work.","Hojiif as jira.","","",0],["I came to visit relatives.","Firoota koo daawwachuuf dhufe.","","",0],["How do you find this country?","Biyyi kun akkam sitti fakkaata?","","",0],["I like it very much.","Baay'ee natti tola.","","",0],["People here really welcome guests.","Ummanni asii keessummaa baay'ee simata.","","",0],["What's new?","Oduu maaltu jira?","","",0],["Nothing much.","Homaa haaraa hin jiru.","","",0],["Are you free now?","Amma yeroo qabdaa?","","",0],["I'm busy; I don't have time.","Hojiin natti baay'ateera; yeroo hin qabu.","","",0],["Do you have time for coffee?","Buna dhuguuf yeroo qabdaa?","","",0]]},{"id":"polite","en":"Polite words and getting attention","om":"Jechoota kabajaa fi xiyyeeffannaa harkisuu","icon":"🙏","group":"social","intros":{"pse":{"en":"English uses 'please', 'thank you' and 'sorry' much more often than Oromo—even with family and in shops—so add them generously. Oromo shows respect mainly with plural forms (isin, -aa endings) and titles, so a direct Oromo request is not rude if the tone is warm. To get a stranger's attention in English, say 'Excuse me'; whistling, hissing or snapping fingers is rude in the US.","om":"Ingiliffaan 'please', 'thank you' fi 'sorry' Afaan Oromoo caalaa baay'ee fayyadamu — maatii fi suuqii keessattillee — kanaafuu baay'isii fayyadami. Afaan Oromoo kabaja bifa baay'inaatiin (isin, -aa) fi maqaa ulfinaatiin agarsiisa. Xiyyeeffannaa nama hin beekne harkisuuf 'Excuse me' jedhi; Ameerikaatti shuuquu ykn quba rukutuun safuu dhabummaadha."},"rwb":{"en":"Maaloo (please) and Galatoomi (thank you) are used much as in English, and Mee softens a command (Mee as koottu — 'come here, please'). Dhiifama covers both 'excuse me' and 'sorry'. Thank older people and groups with the plural Galatoomaa.","om":"'Maaloo' fi 'Galatoomi' akkuma Afaan Ingiliffaatti tajaajilu; ajaja laaffisuuf immoo 'Mee' ni jedhama (Mee as koottu). Jechi 'Dhiifama' 'excuse me' fi 'sorry' lamaanuu bakka bu'a. Maanguddootaa fi garee 'Galatoomaa' jedhii galateeffadhu."}},"items":[["Please.","Maaloo.","","",0],["Thank you.","Galatoomi.","Respect/plural: Galatoomaa.","",0],["Thank you very much.","Baay'ee galatoomi.","","",0],["You're welcome.","Homaa miti.","Also: Rakkoo hin qabu.","",0],["No problem.","Rakkoo hin qabu.","","",0],["Thanks for your help.","Gargaarsa keetiif galatoomi.","Also: Waan na gargaarteef galatoomi.","",0],["I really appreciate it.","Baay'een sin galateeffadha.","","",0],["Excuse me. (to get attention)","Dhiifama.","","",0],["Excuse me, sir / ma'am.","Dhiifama, obboo / aadde.","Obboo for a man, Aadde for a woman (mostly to older people).","",0],["Excuse me, can I get past?","Dhiifama, darbuu danda'aa?","","",0],["I'm sorry.","Dhiifama.","For sympathy (bad news): Nan gadda.","",0],["Sorry to bother you, but...","Si rakkisuu kootti dhiifama, garuu...","","",0],["Can I ask you something?","Waan tokko si gaafachuu danda'aa?","","",0],["May I come in?","Seenuu danda'aa?","","",0],["Please come in.","Maaloo seeni.","Respect/plural: Maaloo seenaa.","",0],["Please have a seat.","Maaloo taa'i.","Respect/plural: Maaloo taa'aa.","",0],["After you.","Ati dursi.","Respect/plural: Isin dursaa.","",0],["Look! / Look at this!","Ilaali! / Mee kana ilaali!","","",0],["Listen!","Dhaggeeffadhu!","Respect/plural: Dhaggeeffadhaa!","",0],["May I have your attention, please?","Maaloo, mee na dhaggeeffadhaa.","Used to address a group or audience.","",0],["Thank you for everything.","Waan hundaaf galatoomi.","","",0],["Excuse me. / Sorry.","Dhiifama.","One word for both getting attention and apologizing.","Jecha tokko: xiyyeeffannaa argachuufis, dhiifama gaafachuufis.",0],["Excuse me, may I get by?","Dhiifama, darbuu danda'aa?","","",0],["Please forgive me.","Maaloo naaf dhiisi.","Respect/plural: Maaloo naaf dhiisaa. Also: Naa irra dabri. (Eastern)","Kabajaaf/baay'inaaf: Maaloo naaf dhiisaa. Akkasumas: Naa irra dabri. (Bahaa)",0],["I apologize.","Dhiifama gaafadha.","","",0],["It was my fault.","Dogoggora kooti.","","",0],["Sorry I'm late.","Dhiifama, turee dhufe.","","",0],["Don't worry.","Hin yaadda'in.","Respect/plural: Hin yaadda'inaa.","Kabajaaf/baay'inaaf: Hin yaadda'inaa.",0],["OK. / All right.","Tole.","Also: Haa ta'u.","Akkasumas: Haa ta'u.",0],["I'm sorry to hear that.","Kana dhaga'uun na gaddisiise.","","",0]]},{"id":"phone","en":"On the phone","om":"Bilbilaan haasa'uu","icon":"📞","group":"social","intros":{"pse":{"en":"On the phone Americans answer 'Hello?' and the caller says who they are first ('Hi, this is Lensa'); businesses answer with the company name. Keep calls short and clear, and ask 'Is this a good time?' if the call is long. Asking 'Who are you?' bluntly, which is common in Ethiopia, can sound rude in English—say 'May I ask who's calling?'","om":"Ameerikaatti bilbila yeroo kaasan 'Hello?' jedhu; namni bilbilu dursee of beeksisa ('Hi, this is Lensa'). Dhaabbileen maqaa dhaabbataatiin deebisu. Bilbilli gabaabaa fi ifa haa ta'u; yoo dheerata ta'e 'Is this a good time?' jedhi. 'Eenyu ati?' jedhanii kallattiin gaafachuun Ingiliffaan safuu dhabummaa fakkaata — 'May I ask who's calling?' jedhi."},"rwb":{"en":"Phone calls start with Haloo, followed by a proper greeting — skipping it can sound abrupt. Callers often identify themselves with Ani ...dha. Mobile networks can be patchy, so phrases like 'I can't hear you' are very useful.","om":"Bilbilli 'Haloo' jedhee jalqaba, achiis nagaa gaafachuun itti aana — nagaa dhiisuun namatti hin tolu. Namni bilbilu 'Ani ...dha' jedhee of beeksisa. Neetworkiin yeroo tokko tokko rakkoo waan qabuuf, 'Si dhaga'uu hin danda'u' jechuun baay'ee barbaachisaadha."}},"items":[["Hello?","Haloo?","","",0],["Hi, this is Lensa.","Akkam, ani Lensaadha.","","",0],["May I ask who's calling?","Maaloo, eenyutu bilbilaa jira?","","",0],["May I speak to Mr. Gemechu?","Obbo Gammachuu waliin haasa'uu danda'aa?","","",0],["Speaking.","Anuma.","Means 'I'm the person you asked for.'","'Namni ati barbaaddu anuma' jechuudha.",0],["Hold on, please.","Maaloo xiqqoo eegi.","Respect/plural: Maaloo xiqqoo eegaa.","",0],["I'll put you through.","Isatti si dabarsa.","","",0],["He's not here right now.","Inni amma asi hin jiru.","","",0],["Would you like to leave a message?","Dhaamsa dhiisuu barbaaddaa?","","",0],["Can I take a message?","Dhaamsa siif fudhachuu danda'aa?","","",0],["Please tell him I called.","Maaloo akka ani bilbile itti himi.","","",0],["Could you ask her to call me back?","Maaloo akka isheen deebiftee naaf bilbiltu itti himi.","","",0],["What's your phone number?","Lakkoofsi bilbila keetii meeqa?","","",0],["Sorry, I can't hear you.","Dhiifama, si hin dhaga'u.","","",0],["You're breaking up.","Sagaleen kee citaa jira.","","",0],["Could you speak a little louder?","Sagalee kee xiqqoo ol kaasuu dandeessaa?","","",0],["I think I have the wrong number.","Lakkoofsa dogoggoraa bilbile natti fakkaata.","","",0],["Is this a good time to talk?","Amma haasa'uuf siif mijataadhaa?","","",0],["I'll call you back later.","Booda deebisee siif bilbila.","","",0],["I missed your call.","Bilbilli kee na darbe.","","",0],["I'll text you.","Ergaa barreeffamaa siif erga.","","",0],["Hello? (answering the phone)","Haloo?","Then greet properly: Akkam jirta?","Achiis nagaa gaafadhu: Akkam jirta?",0],["Who am I speaking to?","Eenyuun dubbachaa jira?","","",0],["It's Tola.","Ani Tolaadha.","","",0],["Can I speak to Chaltu?","Caaltuu dubbisuu danda'aa?","","",0],["Hold on a minute.","Daqiiqaa tokko na eegi.","Respect/plural: Daqiiqaa tokko na eegaa.","Kabajaaf/baay'inaaf: Daqiiqaa tokko na eegaa.",0],["She isn't here.","Isheen as hin jirtu.","","",0],["Can I leave a message?","Dhaamsa dhiisuu danda'aa?","","",0],["I'll call you back.","Deebisee siif nan bilbila.","","",0],["Call me.","Naaf bilbili.","Respect/plural: Naaf bilbilaa.","Kabajaaf/baay'inaaf: Naaf bilbilaa.",0],["I called you.","Siif bilbileera.","","",0],["I can't hear you.","Si dhaga'uu hin danda'u.","","",0],["There's no network.","Neetworkiin hin jiru.","","",1],["You've got the wrong number.","Lakkoofsa dogoggoraa bilbilte.","","",0]]},{"id":"requests","en":"Requests, favors and offers of help","om":"Gaaffii, oolmaa fi gargaarsa","icon":"🙋","group":"social","intros":{"pse":{"en":"English softens requests with 'Could you...?', 'Would you mind...?' and 'please'; a bare command ('Give me water') sounds rude even though the same imperative is normal in Oromo. The bigger the favor, the softer the form: 'Can you...?' for small things, 'I was wondering if you could...' for big ones. When offered something, Americans take your first answer literally—refusing once just to be polite, as in Ethiopia, may mean you don't get it.","om":"Ingiliffaan gaaffii 'Could you...?', 'Would you mind...?' fi 'please'n laaffisu; ajaja qofa ('Give me water') jechuun safuu dhabummaa fakkaata, Afaan Oromootiin garuu baratamaadha. Oolmaan guddaa yoo ta'e, bifni gaaffii laafaa ta'a. Wanti siif dhiyaatu yoo jiraate, Ameerikaanonni deebii kee isa jalqabaa fudhatu — 'lakki' jettee kabajaaf diddu yoo jette, hin argattu ta'a."},"rwb":{"en":"Polite requests use danda'uu (can): Na gargaaruu dandeessaa? (Can you help me?). Add Maaloo or Mee to soften an order. A quick offer can be just an infinitive question: Si gargaaruu? (Shall I help you?). In English, 'Could you...?' and 'Would you mind...?' sound especially polite.","om":"Gaaffiin kabajaa 'danda'uu' fayyadama: Na gargaaruu dandeessaa? Ajaja laaffisuuf 'Maaloo' ykn 'Mee' dabali. Gargaarsa dhiyeessuuf gaaffii gabaabaa 'Si gargaaruu?' jechuun ni danda'ama. Afaan Ingiliffaa keessatti 'Could you...?' fi 'Would you mind...?' caalaatti kabajaa qabu."}},"items":[["Can you help me?","Na gargaaruu dandeessaa?","Respect/plural: Na gargaaruu dandeessuu?","",0],["Could you do me a favor?","Oolmaa tokko naaf ooluu dandeessaa?","","",0],["Can I borrow your pen?","Qalama kee liqeeffachuu danda'aa?","Also: Qalama kee ergifachuu danda'aa?","",0],["Could you pass me the salt?","Soogidda naaf dabarsuu dandeessaa?","","",0],["Would you mind opening the window?","Maaloo, foddaa banuu dandeessaa?","Careful: to agree to 'Would you mind...?' you answer 'No, not at all.'","Of eeggadhu: 'Would you mind...?' jedhamtee yoo eeyyamte, 'No, not at all' jetta.",0],["Could you lend me 100 birr?","Qarshii dhibba tokko na liqeessuu dandeessaa?","","",0],["Can you give me a ride?","Konkolaataa keetiin na geessuu dandeessaa?","","",0],["I was wondering if you could help me with my homework.","Hojii manaa koo irratti na gargaaruu dandeessa laata?","Very polite, for a bigger favor.","",1],["Sure, no problem.","Tole, rakkoo hin qabu.","","",0],["Sorry, I can't right now.","Dhiifama, amma hin danda'u.","","",0],["I'm afraid I don't have any money.","Nan gadda, qarshii homaa hin qabu.","","",0],["Can I help you?","Si gargaaruu danda'aa?","Respect/plural: Isin gargaaruu danda'aa? Also: Si gargaaruu?","",0],["Do you need any help?","Gargaarsa barbaaddaa?","","",0],["Let me carry that for you.","Mee ani siif baadhadha.","","",0],["Would you like something to drink?","Waan dhugamu barbaaddaa?","","",0],["Shall I call a taxi for you?","Taaksii siif haa waamu?","","",0],["Yes, please. That would be great.","Eeyyee, maaloo. Baay'ee gaarii ta'a.","","",0],["No, thank you. I'm fine.","Lakki, galatoomi. Rakkoo hin qabu.","","",0],["Thanks, but I can manage.","Galatoomi, garuu ofii koon danda'a.","","",0],["That's very kind of you.","Garaa gaarummaa keetiif galatoomi.","","",0],["I'd be glad to help.","Si gargaaruuf nan gammada.","","",0],["Let me know if you need anything.","Waan tokko yoo barbaadde natti himi.","","",0],["Please help me.","Maaloo, na gargaari.","Respect/plural: Maaloo, na gargaaraa.","Kabajaaf/baay'inaaf: Maaloo, na gargaaraa.",0],["How can I help you?","Akkamitti si gargaaruu danda'a?","Respect/plural: Akkamitti isin gargaaruu danda'a?","Kabajaaf/baay'inaaf: Akkamitti isin gargaaruu danda'a?",0],["Could you give me some water?","Bishaan naaf kennuu dandeessaa?","","",0],["Please pass the salt.","Maaloo, soogidda naaf dabarsi.","","",0],["May I sit here?","As taa'uu danda'aa?","","",0],["Please lend me 100 birr.","Maaloo, qarshii dhibba tokko naa liqeessi.","","",0],["Can I talk to you?","Si dubbisuu danda'aa?","","",0],["Can you show me?","Natti agarsiisuu dandeessaa?","","",0],["Let me help you.","Mee si haa gargaaru.","","",0],["Can I use your phone?","Bilbila kee fayyadamuu danda'aa?","","",0],["Please keep your voice down.","Maaloo, sagalee kee gadi qabi.","","",0],["I need your help.","Gargaarsi kee na barbaachisa.","","",0]]},{"id":"plans","en":"Plans, invitations and excuses","om":"Karoora, affeerraa fi sababa","icon":"🗓️","group":"social","intros":{"pse":{"en":"English uses 'going to' or the present continuous for plans already decided ('I'm visiting my parents on Sunday') and 'might' for possibilities. When you turn down an invitation, give a short reason and, if you can, suggest another time ('Sorry, I can't on Friday—how about Saturday?'). A vague 'Maybe' often means 'No' in American English.","om":"Ingiliffaan karoora murtaa'eef 'going to' ykn yeroo ammaa itti fufaa ('I'm visiting my parents on Sunday'), waan ta'uu danda'uuf ammoo 'might' fayyadamu. Affeerraa yoo diddu, sababa gabaabaa kenni, yoo dandeessees yeroo biraa yaada kenni. Ameerikaanotaaf 'Maybe' jechuun yeroo baay'ee 'Lakki' jechuudha."},"rwb":{"en":"Arrange meetings with yoom (when) and sa'aa meeqatti (at what time), and confirm whether the time is Ethiopian or Western. Plans are often softened with 'God willing' (Yoo Waaqayyo jedhe). Being a little late is common socially, but not for official or work appointments.","om":"Beellama 'yoom' fi 'sa'aa meeqatti' jedhii qabadhu; sa'aa Itoophiyaa moo kan Awurooppaa akka ta'e mirkaneessi. Karoorri yeroo baay'ee 'Yoo Waaqayyo jedhe' jedhamee laaffifama. Hawaasa keessatti xiqqoo turuun baramaadha; beellama mootummaa ykn hojii irratti garuu yeroon ga'uu qabda."}},"items":[["What are you doing tonight?","Har'a galgala maal hojjatta?","","",0],["Any plans for the weekend?","Dhuma torbanii kanaaf karoora qabdaa?","","",0],["I'm visiting my parents on Sunday.","Dilbata maatii koo dubbisuuf deema.","","",0],["I'm going to start my own business.","Daldala mataa koo jalqabuuf karoorfadheera.","","",0],["I'm planning to learn English this year.","Bara kana Afaan Ingiliffaa baruuf karoorfadheera.","","",0],["I'm thinking about getting married next year.","Bara dhufu fuudhuuf yaadaa jira.","A woman says: heerumuuf (to get married, of a woman).","",0],["Would you like to see a movie with me?","Waliin fiilmii ilaaluu barbaaddaa?","","",0],["I'd love to! When?","Baay'een fedha! Yoom?","","",0],["How about Friday evening?","Jimaata galgala hoo?","","",0],["Sorry, I can't. I'm having dinner with a friend.","Dhiifama, hin danda'u. Hiriyaa koo waliin irbaata nyaadha.","","",0],["What about next Tuesday?","Kibxata dhufu hoo?","","",0],["That works for me.","Sun natti tola.","","",0],["Where should we meet?","Eessatti wal arginu?","","",0],["Let's meet in front of the cinema at six.","Sa'aatii 12tti sinimaa duratti wal haa argine.","Ethiopian time (12 = 6 p.m.).","",0],["Count me in!","Anis isin waliin jira!","","",0],["Let me check my schedule.","Mee sagantaa koo haa ilaalu.","","",0],["I'm not sure yet. I'll let you know.","Ammallee hin murteessine. Booda sitti hima.","","",0],["Maybe another time.","Yeroo biraa ta'a.","","",0],["I'm afraid I have to cancel.","Nan gadda, haquu qaba.","","",0],["Can we reschedule?","Guyyaa biraatti dabarsuu dandeenyaa?","","",0],["When shall we meet?","Yoom wal agarra?","","",0],["Shall we meet in the afternoon?","Waaree booda wal arguu?","","",0],["What time shall we meet tomorrow?","Boru sa'aa meeqatti wal agarra?","","",0],["We'll meet at 4 p.m.","Waaree booda sa'aa kudhanitti wal agarra.","4 p.m. = sa'aa kudhan on the Ethiopian clock.","Sa'aa 4 waaree booda (Awurooppaa) = sa'aa kudhan.",0],["I have an appointment tomorrow at 8 a.m.","Boru ganama sa'aa lamatti beellama qaba.","","",0],["Come next week.","Torbaan dhufu koottu.","Respect/plural: Torbaan dhufu koottaa.","Kabajaaf/baay'inaaf: Torbaan dhufu koottaa.",0],["I'm going to Ambo this weekend.","Dhuma torbaanii kanaa Amboo nan deema.","","",0],["Are you free on Sunday?","Dilbata yeroo qabdaa?","","",0],["I'll wait for you.","Sin eega.","","",0],["Let's put it off to another day.","Guyyaa biraatti haa dabarsinu.","","",0],["The meeting has been canceled.","Walgahiin haqameera.","","",0],["I'm on my way.","Karaa irran jira.","","",0],["I'll be there in ten minutes.","Daqiiqaa kudhan keessatti nan ga'a.","","",0],["Let me know if you'll be late.","Yoo turte natti himi.","","",0]]},{"id":"complaints","en":"Complaints and apologies","om":"Komii fi dhiifama gaafachuu","icon":"😔","group":"social","intros":{"pse":{"en":"English complaints are usually indirect and polite ('I'm afraid there's a problem with...'), and apologies are quick and frequent ('Sorry about that'). When someone apologizes, answer 'That's okay', 'No worries' or 'Don't worry about it'. In Oromo, Dhiifama is the all-purpose 'sorry', and Nan gadda ('I am sad') expresses regret or sympathy.","om":"Ingiliffaan komiin yeroo baay'ee kallattiin ala fi kabajaan dhiyaata ('I'm afraid there's a problem with...'); dhiifamni ammoo dafee fi yeroo baay'ee gaafatama ('Sorry about that'). Namni dhiifama si gaafannaan 'That's okay', 'No worries' ykn 'Don't worry about it' jedhi. Afaan Oromootiin 'Dhiifama' dhiifama hundaaf fayyada; 'Nan gadda' ammoo gaabbii ykn gadda agarsiisa."}},"items":[["I'd like to make a complaint.","Komii dhiyeessuu barbaada.","","",0],["I'm afraid there's a problem with my room.","Dhiifama, kutaa koo irratti rakkoon jira.","","",0],["This isn't good enough.","Kun gahaa miti.","","",0],["I've been waiting for an hour.","Sa'aatii tokko guutuu eegaa jira.","","",0],["You haven't returned my book.","Kitaaba koo naaf hin deebifne.","","",0],["You didn't call me yesterday.","Kaleessa naaf hin bilbilne.","","",0],["I'm really upset with you.","Dhuguma sitti aareera.","","",0],["The noise is driving me crazy.","Sagaleen kun na maraachisaa jira.","","",0],["Could you turn the music down, please?","Maaloo sagalee muuziqaa xiqqeessi.","","",0],["I'm so sorry.","Baay'ee dhiifama.","","",0],["I apologize. It was my fault.","Dhiifama gaafadha. Dogoggorri kan kooti.","","",0],["Sorry, I completely forgot.","Dhiifama, guutummaatti irraanfadhe.","","",0],["I didn't mean to.","Ani beekee hin goone.","","",0],["It won't happen again.","Kana booda hin irra deebi'u.","","",0],["Please forgive me.","Maaloo dhiifama naaf godhi.","","",0],["Let me have a look at it.","Mee haa ilaalu.","","",0],["I'll fix it right away.","Ammuma nan sirreessa.","","",0],["That's okay.","Rakkoo hin qabu.","","",0],["No worries.","Hin yaadda'in.","","",0],["It's not your fault.","Dogoggora kee miti.","","",0],["These things happen.","Kun yeroo baay'ee ni mudata.","","",0]]},{"id":"celebrate","en":"Celebrations and holidays","om":"Ayyaanaa fi cidha","icon":"🎉","group":"social","intros":{"pse":{"en":"Oromo holiday greetings follow the pattern Baga ... isin gahe! ('Congratulations, ... has reached you!'), while English uses 'Happy ...!' or 'Merry Christmas!'. Ethiopian Christmas (Qillee/Genna) is on January 7 and New Year on September 11; Irreecha is the Oromo thanksgiving festival after the rainy season. Americans make a big deal of birthdays, with cards, cake and the 'Happy Birthday' song.","om":"Afaan Oromootiin ayyaanaaf 'Baga ... isin gahe!' jenna; Ingiliffaan ammoo 'Happy ...!' ykn 'Merry Christmas!' jedhu. Qilleen Itoophiyaa Amajjii 7, Bara Haaraan ammoo Fulbaana 11 kabajama; Irreechi ayyaana galata Oromoo kan booda ganna kabajamuudha. Ameerikaanonni guyyaa dhalootaa baay'ee kabaju: kaardii, keekii fi faaruu 'Happy Birthday' qaba."},"rwb":{"en":"Holiday greetings congratulate people on reaching the day in peace: Baga ... nagaan isin ga'e! Major celebrations include Irreechaa (the Oromo thanksgiving festival), New Year in September, Christmas, Easter and the Eid holidays. Graduates hear Baga eebbifamte! (lit. 'congratulations on being blessed').","om":"Ayyaana irratti namoonni 'Baga ... nagaan isin ga'e!' jedhanii wal eebbisu. Ayyaanonni gurguddoon Irreechaa, Bara Haaraa (Fulbaana), Qillee, Faasikaa fi Iid ni argamu. Namni eebbifame 'Baga eebbifamte!' jedhamee eebbifama."}},"items":[["Happy birthday!","Baga dhalatte!","Respect/plural: Baga dhalattan! Also: Guyyaa dhalootaa gaarii!","",0],["How old are you turning?","Waggaa meeqa guutta?","","",0],["Merry Christmas!","Baga ayyaana Qillee isin gahe!","Also: Ayyaana Qillee gaarii!","",0],["Happy Easter!","Baga ayyaana Fasikaa isin gahe!","Also: Ayyaana Faasikaa gaarii!","",0],["Happy New Year!","Baga bara haaraan isin gahe!","Also: Baga bara haaraatiin isin ga'e!","",0],["Eid Mubarak!","Baga ayyaana Iidaa isin gahe!","","",0],["Happy Irreecha!","Baga ayyaana Irreechaa isin gahe!","","",0],["Same to you!","Isinis baga isin gahe!","","",1],["Congratulations!","Baga gammadde!","Respect/plural: Baga gammaddan!","",0],["Congratulations on your new baby!","Baga mucaa argatte!","","",1],["Congratulations on your wedding!","Baga gaa'ela keessaniin gammaddan!","","",1],["We're having a party on Saturday.","Sanbata cidha qabna.","","",0],["You're invited!","Affeeramteetta!","","",0],["Let's celebrate!","Haa kabajnu!","","",0],["Cheers!","Fayyaa keenyaaf!","Said when raising glasses.","",0],["Thanks for coming!","Waan dhuftaniif galatoomaa!","","",0],["Good luck!","Carraa gaarii!","Also: Hiree gaarii!","Akkasumas: Hiree gaarii!",0],["Happy holiday!","Baga ayyaanaan nagaan isin ga'e!","Also: Ayyaana gaarii!","Akkasumas: Ayyaana gaarii!",1],["Happy Irreechaa!","Baga Ayyaana Irreechaatiin nagaan isin ga'e!","Irreechaa: Oromo thanksgiving festival at the end of the rainy season.","Irreechaa: ayyaana galata Oromoo, dhuma gannaatti kabajamu.",1],["Happy Eid!","Ayyaana Iid gaarii!","","",1],["Congratulations on your graduation!","Baga eebbifamte!","Respect/plural: Baga eebbifamtan!","Kabajaaf/baay'inaaf: Baga eebbifamtan!",0],["We're having a wedding.","Cidha qabna.","","",0],["You're invited to our wedding.","Cidha keenyatti isin affeerra.","","",0],["May God give you children. (wedding blessing)","Waaqayyo ilmaan isiniif haa kennu.","","",1],["Well done! / Keep it up!","Jabaadhu!","Respect/plural: Jabaadhaa!","Kabajaaf/baay'inaaf: Jabaadhaa!",0]]},{"id":"wishes","en":"Good wishes, blessings and condolences","om":"Hawwii gaarii, eebba fi jajjabeessuu gaddaa","icon":"🕊️","group":"social","intros":{"pse":{"en":"Oromo conversation is full of blessings (eebba): elders bless the young, and kindness is answered with Waaqni siif haa kennu ('May God give to you'). English wishes are shorter—'Good luck', 'All the best', 'God bless'. When someone dies, say 'I'm so sorry for your loss'; Ethiopians visit the grieving family for days, while Americans may send a card or flowers and attend the funeral.","om":"Haasaan Oromoo eebbaan guutuudha: maanguddoonni dargaggoota eebbisu, waan gaarii godhameef 'Waaqni siif haa kennu' jenna. Ingiliffaan hawwiin gabaabaadha: 'Good luck', 'All the best', 'God bless'. Namni yoo du'e, 'I'm so sorry for your loss' jedhi. Itoophiyaatti maatii gaddaa guyyoota hedduuf ni jajjabeessina; Ameerikaanonni kaardii ykn abaaboo ergu, awwaalcha irrattis argamu."}},"items":[["Good luck!","Carraa gaarii!","Also: Milkaa'i!","",0],["All the best!","Waan gaarii hunda siif haa ta'u!","","",0],["Best wishes for your future!","Egereen kee gaarii haa ta'u!","","",0],["Fingers crossed!","Akka milkaa'u abdii qaba!","Means 'I hope it goes well.'","",0],["I hope you feel better soon.","Dafee akka fayyitu hawwa.","","",0],["God bless you.","Waaqayyo si haa eebbisu.","Muslim speakers: Rabbiin si haa eebbisu.","",0],["May God be with you.","Waaqayyo si wajjin haa ta'u.","","",0],["May all your wishes come true!","Hawwiin kee hundi siif haa milkaa'u!","","",0],["I wish you a long and healthy life.","Umrii dheeraa fi fayyaa siif hawwa.","","",0],["Thank you, may God reward you.","Galatoomi, Waaqni siif haa kennu.","","",0],["I'm so sorry for your loss.","Gadda isin mudateef baay'een gadda.","","",0],["May he rest in peace.","Waaqni lubbuu isaa jannata haa godhu.","For a woman: lubbuu ishee.","",0],["My thoughts are with you.","Yaadni koo isin waliin jira.","","",0],["May God give you patience.","Waaqni obsa isiniif haa kennu.","A very common Oromo condolence.","",0],["Stay strong.","Jabaadhu.","Respect/plural: Jabaadhaa.","",0]]},{"id":"opinions","en":"Opinions, agreeing and disagreeing","om":"Yaada kennuu, walii galuu fi mormuu","icon":"⚖️","group":"social","intros":{"pse":{"en":"English speakers soften opinions with 'I think', 'In my opinion' or 'I'm not sure, but...'. Saying 'You're wrong' directly sounds rude; Americans prefer 'I see what you mean, but...' or 'I'm not sure I agree'. In Oromo, Walii galla ('We agree with each other') is the key phrase for agreement.","om":"Ingiliffaan yaada laaffisuuf 'I think', 'In my opinion' ykn 'I'm not sure, but...' jedhu. 'You're wrong' kallattiin jechuun safuu dhabummaa fakkaata; Ameerikaanonni 'I see what you mean, but...' ykn 'I'm not sure I agree' filatu. Afaan Oromootiin walii galuu ibsuuf 'Walii galla' jenna."}},"items":[["I think so.","Akkasin yaada.","","",0],["I don't think so.","Akkas natti hin fakkaatu.","","",0],["In my opinion, ...","Akka yaada kootti, ...","","",0],["If you ask me, ...","Yoo na gaafatte, ...","","",0],["How do you feel about this?","Waa'ee kanaa maal yaadda?","","",0],["I agree.","Walii galla.","Also: Nan deeggara (I support it).","",0],["I agree with you.","Si waliin walii gala.","","",0],["You're absolutely right.","Ati guutummaatti sirriidha.","","",0],["Exactly!","Sirriidha!","","",0],["That's true.","Dhugaadha.","","",0],["I couldn't agree more.","Guutummaan guutuutti walii galla.","","",0],["Fair enough.","Tole, ni fudhadha.","Means: I accept your point.","",0],["I'm not sure about that.","Sana irratti shakkii qaba.","","",0],["I see what you mean, but...","Waan jechuu barbaaddu nan hubadha, garuu...","","",0],["I'm afraid I disagree.","Dhiifama, ani yaada biraa qaba.","","",0],["I totally disagree.","Guutummaatti walii hin gallu.","","",0],["That's not how I see it.","Ani akkas hin ilaalu.","","",0],["Let's agree to disagree.","Yaada adda addaa qabaachuu keenya haa fudhannu.","Means: we accept that we see it differently and stop arguing.","",0],["It depends.","Haala irratti hundaa'a.","","",0],["I've changed my mind.","Yaada koo jijjiireera.","","",0]]},{"id":"compliments","en":"Compliments","om":"Nama dinqisiifachuu","icon":"🌟","group":"social","intros":{"pse":{"en":"Americans compliment often—clothes, hair, work, cooking—and the normal reply is simply 'Thank you!', not a denial; refusing a compliment can sound like you want more. Avoid remarks about weight ('You've put on weight'), which may be friendly in Ethiopia but are offensive in the US.","om":"Ameerikaanonni yeroo baay'ee nama dinqisiifatu — uffata, rifeensa, hojii, nyaata — deebiin baratamaan 'Thank you!' qofa; 'lakki akkas miti' jechuun akka dinqisiifannaa dabalataa barbaaddu fakkaata. Waa'ee ulfaatina qaamaa ('You've put on weight') hin dubbatin; Itoophiyaatti jaalalaan jedhamuu danda'a, Ameerikaatti garuu nama aarsa."}},"items":[["You look great today!","Har'a baay'ee bareedde!","","",0],["I love your dress!","Uffanni kee baay'ee na hawwate!","","",0],["That jacket looks good on you.","Jaakeetiin sun sitti tola.","","",0],["That color really suits you.","Halluun sun baay'ee siif tola.","","",0],["Nice haircut!","Rifeensi kee bareedeera!","","",0],["You have a beautiful smile.","Kolfi kee bareedaadha.","","",1],["What a lovely home!","Manni kee akkam bareeda!","","",0],["Your English is really good.","Ingiliffaan kee baay'ee gaariidha.","","",0],["You're a great cook!","Nyaata qopheessuu baay'ee beekta!","","",0],["Thank you! That's so kind of you.","Galatoomi! Kun gaarummaa keeti.","","",0],["Thanks, I got it on sale.","Galatoomi, gatii hir'ifameen bite.","","",0],["You made my day!","Guyyaa koo gammachiifte!","","",0]]},{"id":"love","en":"Love, dating and marriage","om":"Jaalala, wal barachuu fi gaa'ela","icon":"❤️","group":"social","intros":{"pse":{"en":"Americans say 'I love you' often—to partners, family, even close friends—while in Oromo culture love is usually shown more than said, especially in public. Couples use pet names like 'honey', 'sweetheart' and 'babe'. Oromo jaalallee means 'sweetheart' (boyfriend or girlfriend); fuudhuu is used for a man marrying, heerumuu for a woman.","om":"Ameerikaanonni 'I love you' yeroo baay'ee jedhu — jaalallee, maatii, hiriyoota dhiyoofillee. Aadaa Oromoo keessatti garuu jaalalli jechaan caalaa gochaan mul'ata, keessumaa namoota duratti. Jaalallootni 'honey', 'sweetheart', 'babe' jedhanii wal waamu. Afaan Oromootiin dhiirri ni fuudha, dubartiin ni heerumti."},"rwb":{"en":"Talk about love is fairly private in Oromo culture; affection is shown more through care and respect than public words. Sin jaalladha means 'I love you'. Marriage verbs are gendered: a man fuudha, a woman heerumti — English uses 'marry' for both.","om":"Haasaan jaalalaa aadaa Oromoo keessatti dhuunfaadha; jaalalli caalaatti kunuunsaa fi kabajaan agarsiifama. 'Sin jaalladha' — 'I love you'. Gaa'elaaf dhiirri 'fuudha', dubartiin 'heerumti'; Afaan Ingiliffaa keessatti lamaanuu 'marry' jedhama."}},"items":[["I love you.","Sin jaalladha.","","",0],["I love you too.","Anis sin jaalladha.","","",0],["I miss you.","Si yaadeera.","Also: Baay'een si yaade.","",0],["You mean everything to me.","Ati anaaf waan hundaati.","","",0],["I can't stop thinking about you.","Si yaaduu dhiisuu hin dandeenye.","","",0],["I really like her.","Isheen na hawwatteetti.","","",0],["Will you be my girlfriend?","Jaalallee koo ta'uu ni feetaa?","Same question to a man: '...my boyfriend?'","",0],["He's my boyfriend.","Inni jaalallee kooti.","","",0],["They're dating.","Isaan wal jaallatu.","","",0],["We fell in love.","Jaalalaan qabamne.","","",0],["Will you marry me?","Naaf heerumtaa?","Said by a man. A woman asking a man: Na fuutaa?","",0],["We're engaged.","Kaadhimamneerra.","","",0],["He's my fiancé.","Inni kaadhimaa kooti.","","",0],["We got married last year.","Bara darbe gaa'ela raawwanne.","","",0],["This is my husband.","Kun abbaa manaa kooti.","","",0],["This is my wife.","Kun haadha manaa kooti.","Idiom: 'my better half' = my wife or husband.","",0],["They broke up.","Isaan addaan ba'an.","","",0],["They're divorced.","Isaan wal hiikaniiru.","","",0],["Do you love me?","Na jaallattaa?","","",0],["You are beautiful.","Ati bareedduudha.","To a man (handsome): Ati bareedaadha.","Dhiiraaf: Ati bareedaadha.",0],["I'm in love.","Jaalalli na qabeera.","","",0],["My darling / my love","Jaalallee koo","","",0],["I have a girlfriend.","Jaalallee qaba.","Same for 'I have a boyfriend'.","'I have a boyfriend' jechuufis akkasuma.",0],["Will you marry me? (a man to a woman)","Natti heerumtaa?","","",1],["We're getting married next month.","Ji'a dhufu cidha qabna.","","",0],["We're divorced.","Wal hiikneerra.","","",0],["Give me your phone number.","Lakkoofsa bilbila keetii naaf kenni.","","",0],["Can I see you again?","Ammas si arguu danda'aa?","","",0],["Let's be friends.","Hiriyoota haa taanu.","","",0]]},{"id":"relationships","en":"Friends and relationships","om":"Hiriyummaa fi walitti dhufeenya","icon":"🫂","group":"social","intros":{"pse":{"en":"English has precise words for relationships: a 'best friend' is your closest friend, an 'acquaintance' is someone you know a little, and a 'colleague' is someone you work with. Useful idioms: 'hit it off' (like each other at once), 'make up' (become friends again after a fight), 'drift apart' (slowly stop being close).","om":"Ingiliffaan walitti dhufeenyaaf jechoota addaa qaba: 'best friend' hiriyaa hunda caalaa dhiyoo, 'acquaintance' nama xiqqoo beektu, 'colleague' hiriyaa hojii. Jechamoota gargaaran: 'hit it off' (battalumatti wal jaallachuu), 'make up' (wal lolanii booda araaramuu), 'drift apart' (suuta suutaan walirraa fagaachuu)."}},"items":[["She's my best friend.","Isheen hiriyaa koo addaati.","","",0],["Our friendship is very strong.","Hiriyummaan keenya baay'ee cimaadha.","","",0],["He's just an acquaintance.","Inni nama ani beeku qofa.","","",0],["We've known each other since childhood.","Ijoollummaa irraa kaasee wal beekna.","","",0],["We hit it off right away.","Battalumatti wal jaallanne.","","",0],["We have a lot in common.","Waan baay'ee walfakkaatu qabna.","","",0],["They don't see eye to eye.","Isaan walii hin galan.","Idiom: they often disagree.","",0],["We drifted apart.","Suuta suutaan walirraa fagaanne.","","",0],["We had a fight, but we made up.","Wal loline, garuu araaramneerra.","","",0],["She always has my back.","Isheen yeroo hunda na deeggarti.","Idiom: she supports and defends me.","",0],["He's a fair-weather friend.","Inni hiriyaa yeroo gaarii qofaati.","A friend only when things are going well.","",0],["I trust him completely.","Guutummaatti isatti amana.","","",0],["They're like family to me.","Isaan anaaf akka maatiiti.","","",0],["My neighbors are really nice.","Olloonni koo baay'ee namoota gaariidha.","","",0]]},{"id":"address_titles","en":"Titles & forms of address","om":"Maqaa kabajaa fi waamicha","icon":"🎩","group":"social","intros":{"rwb":{"en":"Use Obbo (Mr.) for men and Aaddee (Mrs./Ms.) for women before the first name; Giiftii (Madam/Lady) is more formal. Parents are respectfully called after their firstborn child (Haadha Abdii, Abbaa Abdii), and respected people take plural verbs and the pronouns isin/isaan even when you mean one person. English titles go before the surname — but an Oromo second name is the father's name, not a family name.","om":"Dhiiraaf 'Obbo', dubartiif 'Aaddee' maqaa duratti fayyadami; 'Giiftii' caalaatti kabajaaf oola. Haadha fi abbaan yeroo baay'ee maqaa angafa isaaniitiin (Haadha Abdii, Abbaa Abdii) kabajaan waamamu; nama kabajamaaf, tokkicha yoo ta'eyyuu, 'isin/isaan' fi gochima baay'inaa fayyadamna. Afaan Ingiliffaa keessatti Mr., Mrs., Ms. maqaa maatii (surname) dura dhufa; maqaan lammaffaan Oromoo garuu maqaa abbaati."}},"items":[["Mr. Galana","Obbo Galaanaa","Obbo = Mr., used before a man's name. Written short as Ob.","Obbo maqaa dhiiraa dura dhufa; gabaabinaan 'Ob.' jedhamee barreeffama.",0],["Mrs. / Ms. Chaltu","Aaddee Caaltuu","Polite title for a woman. Traditionally for a woman without children; today the general 'Mrs./Ms.' Short: Aad.","Maqaa kabajaa dubartii; durii dubartii ijoollee hin qabneef ture, har'a dubartii hundaaf oola. Gabaabinaan: Aad.",0],["Madam Bontu (very formal)","Giiftii Boontuu","Like 'Lady' or 'Madam'; used in speeches and formal letters.","Haasaa fi xalayaa idilee keessatti kabaja olaanaa agarsiisa.",0],["Abdi's mother (polite address)","Haadha Abdii","A mother is respectfully called after her firstborn, often the eldest son.","Haati kabajaan maqaa angafa isheetiin waamamti.",0],["Abdi's father (polite address)","Abbaa Abdii","","",0],["Comrade / dear friend","Jaallee","Used between close friends and in political circles. Short: Jaal.","Hiriyoota dhihoo fi siyaasa keessatti oola. Gabaabinaan: Jaal.",0],["Is your father at home? (respectful)","Abbaan kee mana jiruu?","Respected people take plural verbs: jiru instead of jira.","Nama kabajamaaf gochima baay'inaa fayyadamna: 'jira' bakka 'jiru'.",0],["Do you know Mr. Tola? He is our teacher.","Obbo Tolaa ni beektaa? Isaan barsiisaa keenya.","isaan ('they') refers respectfully to one person.","'Isaan' nama tokko kabajaan agarsiisuuf ni oola.",0],["Please sit down. (to an elder)","Maaloo, taa'aa.","Use plural forms (isin, taa'aa) with anyone older or senior.","Nama umuriin ykn sadarkaan si caaluuf unka baay'inaa (isin, taa'aa) fayyadami.",0],["my son (an elder to a young man)","Ilma koo","","",0],["my daughter (an elder to a young woman)","Intala koo","","",0],["my brother (friendly address)","Obboleessa koo","","",0],["my sister (friendly address)","Obboleettii koo","","",0],["Teacher! (addressing a teacher)","Barsiisaa!","To/about a woman: Barsiistuu!","Dubartiif: Barsiistuu!",0],["Honorable Mr. Tola (formal speech)","Kabajamaa Obbo Tolaa","","",0],["What should I call you?","Maal jedhee si waamu?","Respect/plural: Maal jedhee isin waamu?","Kabajaaf/baay'inaaf: Maal jedhee isin waamu?",0]]},{"id":"hospitality","en":"Welcoming guests","om":"Keessummaa simachuu","icon":"🏡","group":"social","intros":{"rwb":{"en":"Guests are honored in Oromo culture: hosts insist that you come in, sit, eat and stay longer, and saying no once is often just politeness — expect to be asked again. Thank your hosts with the plural Galatoomaa. In English, hosts usually offer once or twice, and a simple 'No, thank you' is taken at face value.","om":"Aadaa Oromoo keessatti keessummaan ni kabajama: abbaan manaa akka seentu, teessu, nyaattu fi turtu si cimsee kadhata; al tokko 'lakki' jechuun yeroo baay'ee safuu qofa. Abbaa manaa 'Galatoomaa' jedhii galateeffadhu. Afaan Ingiliffaa keessatti keessummeessaan al tokko ykn lama qofa gaafata; 'No, thank you' jennaan akkuma jettetti fudhatama."}},"items":[["Welcome!","Baga nagaan dhufte!","Respect/plural: Baga nagaan dhuftan!","Kabajaaf/baay'inaaf: Baga nagaan dhuftan!",0],["Glad to find you well. (reply to a welcome)","Baga nagaan si argadhe.","Respect/plural: Baga nagaan isin argadhe.","Kabajaaf/baay'inaaf: Baga nagaan isin argadhe.",1],["Welcome to our home.","Baga mana keenyatti dhufte.","","",0],["May I come in?","Seenuu danda'aa?","","",0],["Please come in.","Maaloo, seeni.","Respect/plural: Maaloo, seenaa.","Kabajaaf/baay'inaaf: Maaloo, seenaa.",0],["Please have a seat.","Maaloo, taa'i.","Respect/plural: Maaloo, taa'aa.","Kabajaaf/baay'inaaf: Maaloo, taa'aa.",0],["Shall I make you coffee?","Buna siif danfisuu?","Respect/plural: Buna isiniif danfisuu? Also: Buna siif dhaabuu? (Eastern)","Kabajaaf/baay'inaaf: Buna isiniif danfisuu? Akkasumas: Buna siif dhaabuu? (Bahaa)",0],["Would you like tea or coffee?","Shaayii moo buna barbaadda?","Respect/plural: Shaayii moo buna barbaaddu? Also: feeta instead of barbaadda (Eastern)","Kabajaaf/baay'inaaf: Shaayii moo buna barbaaddu? Akkasumas: 'feeta' bakka 'barbaadda' (Bahaa)",0],["Can I get you something to drink?","Waan dhugamu siif kennuu?","Respect/plural: Waan dhugamu isiniif kennuu?","Kabajaaf/baay'inaaf: Waan dhugamu isiniif kennuu?",0],["Would you like something to eat?","Waa nyaachuu barbaaddaa?","Respect/plural: Waa nyaachuu barbaadduu?","Kabajaaf/baay'inaaf: Waa nyaachuu barbaadduu?",0],["Please eat — help yourself.","Maaloo, nyaadhu.","Respect/plural: Maaloo, nyaadhaa.","Kabajaaf/baay'inaaf: Maaloo, nyaadhaa.",0],["Have some more.","Itti dabaladhu.","Respect/plural: Itti dabaladhaa.","Kabajaaf/baay'inaaf: Itti dabaladhaa.",0],["Thank you, I'm full.","Galatoomi, quufeera.","","",0],["The food was delicious.","Nyaanni baay'ee mi'aawaa ture.","","",0],["Please stay a little longer.","Maaloo, xiqqoo turi.","Respect/plural: Maaloo, xiqqoo turaa.","Kabajaaf/baay'inaaf: Maaloo, xiqqoo turaa.",0],["Thank you for inviting me.","Waan na affeertaniif galatoomaa.","Plural, as said to hosts. To one person: Waan na affeerteef galatoomi.","Maatii keessummeessuuf unka baay'inaa. Nama tokkoof: Waan na affeerteef galatoomi.",0],["Thank you for your hospitality.","Waan na simattaniif galatoomaa.","","",0]]},{"id":"coffee","en":"The coffee ceremony","om":"Aadaa bunaa","icon":"☕","group":"social","intros":{"rwb":{"en":"Coffee (buna) is the heart of Oromo hospitality: beans are roasted, pounded and brewed in front of guests, incense is lit, and people talk while the cups go round. It is polite to stay for more than one round, and in the countryside coffee is often drunk with salt or butter. Buna qalaa — coffee beans fried in butter — is prepared for blessings and special occasions.","om":"Bunni wiirtuu keessummeessuu Oromooti: bunni fuuldura keessummootaatti waadamee, tumamee ni danfifama; ixaanni ni aarfama, namoonnis yeroo siiniin naannoftu ni haasa'u. Al tokkoo ol turuun safuudha; baadiyyaatti bunni soogiddaan ykn dhadhaadhaan dhugama. Buna qalaa — buna dhadhaan waadame — eebbaa fi ayyaana addaatiif qophaa'a."}},"items":[["Let's have coffee.","Buna haa dhugnu.","","",0],["Come over for coffee.","Buna dhuguuf koottu.","Respect/plural: Buna dhuguuf koottaa.","Kabajaaf/baay'inaaf: Buna dhuguuf koottaa.",0],["Invite the neighbors for coffee.","Ollaa buna dhuguuf affeeri.","","",0],["I'll make the coffee.","Buna nan danfisa.","Also: Buna nan dhaaba. (Eastern)","Akkasumas: Buna nan dhaaba. (Bahaa)",0],["Roast the coffee beans.","Buna waadi.","","",0],["Pound the coffee.","Buna tumi.","","",1],["Light the incense.","Ixaana aarsi.","","",0],["Bring the cups.","Siinii fidi.","","",0],["The coffee is ready.","Bunni qophaa'eera.","","",0],["Pour the coffee.","Buna naqi.","","",0],["Do you take sugar or salt in it?","Sukkaara moo soogidda itti godhatta?","In the countryside coffee is often drunk with salt, sometimes with butter.","Baadiyyaatti bunni yeroo baay'ee soogiddaan, yeroo tokko tokko dhadhaadhaan dhugama.",0],["Have another cup.","Siinii biraa dhugi.","Respect/plural: Siinii biraa dhugaa.","Kabajaaf/baay'inaaf: Siinii biraa dhugaa.",0],["That's enough for me, thank you.","Galatoomi, na ga'eera.","","",0],["Thank you for the coffee.","Bunaaf galatoomi.","Respect/plural: Bunaaf galatoomaa.","Kabajaaf/baay'inaaf: Bunaaf galatoomaa.",0],["Let's prepare buna qalaa.","Buna qalaa haa qopheessinu.","Coffee beans fried in butter, made for blessings and special occasions.","Buna dhadhaan waadame; eebbaa fi ayyaana addaatiif qophaa'a.",1]]},{"id":"personal","en":"Personal questions","om":"Gaaffii dhuunfaa","icon":"🪪","group":"social","intros":{"rwb":{"en":"Personal questions — age, marriage, where you live and were born — are normal in Oromo conversation and show interest, not rudeness. Men 'marry' with fuudhuu and women with heerumuu. In English-speaking cultures, age, income and marriage can feel private, so ask carefully.","om":"Gaaffiin dhuunfaa — umrii, fuudhaa fi heeruma, bakka jireenyaa fi dhalootaa — haasaa Oromoo keessatti baramaadha; xiyyeeffannaa agarsiisa malee safuu hin cabsu. Dhiirri 'fuudha', dubartiin immoo 'heerumti'. Aadaa Ingiliffaa keessatti umriin, galiin fi gaa'elli dhimma dhuunfaa ta'uu danda'u; of eeggannoon gaafadhu."}},"items":[["Where do you live?","Eessa jiraatta?","Respect/plural: Eessa jiraattu?","Kabajaaf/baay'inaaf: Eessa jiraattu?",0],["I live in Finfinnee.","Ani Finfinnee jiraadha.","Finfinnee is the Oromo name of Addis Ababa.","Finfinneen maqaa Oromoo Addis Ababaati.",0],["I live in the town of Nekemte.","Ani magaalaa Naqamtee keessa jiraadha.","","",0],["What's your address?","Teessoon kee eessa?","","",0],["Where were you born?","Eessatti dhalatte?","Respect/plural: Eessatti dhalattan?","Kabajaaf/baay'inaaf: Eessatti dhalattan?",0],["I was born in Adama.","Ani Adaamaatti dhaladhe.","","",0],["How old are you?","Umriin kee meeqa?","Respect/plural: Umriin keessan meeqa? Traditional: Ganni kee meeqa? ('How many rainy seasons have you seen?')","Kabajaaf/baay'inaaf: Umriin keessan meeqa? Akka aadaatti: Ganni kee meeqa?",0],["I'm twenty-five.","Umriin koo waggaa digdamii shani.","","",0],["Are you married? (to a man)","Fuutee jirtaa?","To/about a woman: Heerumtee jirtaa?","Dubartiif: Heerumtee jirtaa?",1],["Yes, I'm married. (a man)","Eeyyee, fuudheera.","A woman says: Eeyyee, heerumeera.","Dubartiin: Eeyyee, heerumeera.",0],["No, I'm single. (a man)","Lakki, hin fuune.","A woman says: Lakki, hin heerumne.","Dubartiin: Lakki, hin heerumne.",0],["Do you live abroad?","Biyya alaa jiraattaa?","","",0],["Yes, I live in America.","Eeyyee, Ameerikaa jiraadha.","","",0],["Where does your family live?","Maatiin kee eessa jiraatu?","","",0],["What's your father's name?","Maqaan abbaa keetii eenyu?","An Oromo full name is: own name + father's name + grandfather's name.","Maqaan guutuun: maqaa ofii + maqaa abbaa + maqaa akaakayyuu.",0],["My brother lives in Jimma.","Obboleessi koo Jimmaa jiraata.","","",0]]},{"id":"faith","en":"Faith & blessings","om":"Amantaa fi eebba","icon":"🕊️","group":"social","intros":{"rwb":{"en":"Religion is part of everyday speech: people thank God in greetings and add 'God willing' to plans. Christians usually say Waaqayyo, Muslims Rabbii, and Waaqa is the traditional Oromo name for God (Waaqeffannaa). Blessings from elders (eebba) are highly valued.","om":"Amantaan haasaa guyyaa guyyaa keessa jira: namoonni nagaa keessatti Waaqa galateeffatu, karoora irratti 'Yoo Waaqayyo jedhe' dabalu. Kiristaanonni 'Waaqayyo', Musliimonni 'Rabbii' jedhu; amantaa aadaa Oromoo (Waaqeffannaa) keessatti immoo Uumaan 'Waaqa' jedhama. Eebbi maanguddootaa baay'ee kabajama."}},"items":[["Praise God!","Waaqayyo haa galatoomu!","Muslim speakers: Rabbiin haa galatoomu!","Musliimonni: Rabbiin haa galatoomu!",0],["God willing.","Yoo Waaqayyo jedhe.","Muslim speakers: Yoo Rabbiin jedhe.","Musliimonni: Yoo Rabbiin jedhe.",0],["May God bless you.","Waaqayyo si haa eebbisu.","Respect/plural: Waaqayyo isin haa eebbisu.","Kabajaaf/baay'inaaf: Waaqayyo isin haa eebbisu.",0],["May God give you health.","Waaqayyo fayyaa siif haa kennu.","","",0],["May God be with you.","Waaqayyo si wajjin haa ta'u.","Respect/plural: Waaqayyo isin wajjin haa ta'u.","Kabajaaf/baay'inaaf: Waaqayyo isin wajjin haa ta'u.",0],["May God give you a long life.","Waaqayyo umurii dheeraa siif haa kennu.","","",0],["My condolences. (lit. 'May God comfort you')","Waaqayyo isin haa jajjabeessu.","","",0],["Be strong. (to someone grieving)","Jajjabaadhu.","Respect/plural: Jajjabaadhaa.","Kabajaaf/baay'inaaf: Jajjabaadhaa.",0],["May he rest in peace.","Waaqayyo lubbuu isaa haa boqochiisu.","For a woman: lubbuu ishee.","Dubartiif: lubbuu ishee.",0],["Let's pray.","Haa kadhannu.","","",0],["Amen.","Ameen.","","",0],["I'm going to church.","Mana kiristaanaa deemaa jira.","Orthodox church: bataskaana.","Ortodoksii: bataskaana.",1],["I'm going to the mosque.","Masjiida deemaa jira.","","",0]]},{"id":"charity","en":"Giving & people asking for help","om":"Kennaa fi kadhattoota","icon":"🤲","group":"social","intros":{"rwb":{"en":"If someone asks you for money and you cannot give, it is polite to say Si haa gargaaru ('May [God] help you') — or Isin haa gargaaru to an older person — rather than ignoring them. Giving small change or food is common, especially on religious days. Keep your tone kind and respectful.","om":"Namni yoo si kadhatee kennuu hin dandeenye, callisuu irra 'Si haa gargaaru' (nama gurguddaaf 'Isin haa gargaaru') jechuun safuudha. Qarshii xixiqqaa ykn nyaata kennuun baramaadha, keessattuu guyyoota amantaa irratti. Sagalee laafaa fi kabajaa qabuun dubbadhu."}},"items":[["May God help you. (when you can't give)","Si haa gargaaru.","Respect/plural: Isin haa gargaaru. Short for Waaqayyo si haa gargaaru. Use Isin with an older person.","Kabajaaf/baay'inaaf: Isin haa gargaaru. Kun 'Waaqayyo si haa gargaaru' gabaabsee jechuudha. Nama gurguddaaf 'Isin' fayyadami.",0],["May God provide for you.","Waaqayyo siif haa kennu.","","",0],["Sorry, I can't today.","Dhiifama, har'a hin danda'u.","","",0],["I don't have any change today.","Har'a qarshii xixiqqaa hin qabu.","","",0],["Next time.","Yeroo biraa.","","",0],["I already gave.","Duraan kenneera.","","",0],["Here, take this.","Kunoo, fudhu.","Respect/plural: Kunoo, fudhaa.","Kabajaaf/baay'inaaf: Kunoo, fudhaa.",0],["Would you like some food?","Nyaata barbaaddaa?","","",0],["Let me buy you some bread.","Mee daabboo siif haa bitu.","","",0],["Please help me. (asking passers-by)","Maaloo na gargaaraa.","","",0],["For God's sake...","Waaqaaf jedhii...","","",1],["Thank you, may God reward you.","Galatoomi, Waaqayyo siif haa deebisu.","","",1]]},{"id":"boundaries","en":"Standing your ground","om":"Of kabachiisuu","icon":"✋","group":"social","intros":{"rwb":{"en":"These phrases help you refuse firmly or stop unwanted behavior. Keep your voice calm, and use the plural (Na dhiisaa) when speaking to a group. Some (like Afaan qabadhu!) are rude — use them only when really necessary.","om":"Jechoonni kun cimsitee didduuf ykn amala hin barbaachifne dhaabsisuuf si gargaaru. Sagalee tasgabbaa'aan dubbadhu; garee yoo dubbatte unka baay'inaa (Na dhiisaa) fayyadami. Tokko tokko (Afaan qabadhu!) safuu hin qaban — yoo baay'ee barbaachise qofa fayyadami."}},"items":[["No, I don't want it.","Lakki, hin barbaadu.","","",0],["Leave me alone.","Na dhiisi.","Respect/plural: Na dhiisaa.","Kabajaaf/baay'inaaf: Na dhiisaa.",0],["Go away!","Asii deemi!","Respect/plural: Asii deemaa!","Kabajaaf/baay'inaaf: Asii deemaa!",0],["Don't touch me.","Na hin tuqin.","Respect/plural: Na hin tuqinaa.","Kabajaaf/baay'inaaf: Na hin tuqinaa.",0],["Stop that!","Sana dhiisi!","","",0],["Don't follow me.","Na duukaa hin bu'in.","","",0],["You're bothering me.","Na jeeqaa jirta.","","",0],["What are you looking at?","Maal ilaalaa jirta?","","",0],["You're lying.","Sobaa jirta.","","",0],["That's not fair.","Sun haqa miti.","","",0],["I'd like to be alone.","Kophaa koo ta'uun barbaada.","","",0],["Shut up! (rude)","Afaan qabadhu!","","",1],["I'll call the police.","Poolisii nan waama.","","",0]]},{"id":"yesno","en":"Yes/no questions & short answers","om":"Gaaffii eeyyee/lakki","icon":"✅","group":"basics","intros":{"rwb":{"en":"A yes/no question is often made just by lengthening the last vowel and raising your voice: Barsiisaadha → Barsiisaadhaa? Answer with Eeyyee (yes) or Lakki (no) and repeat the verb: Eeyyee, nan dhuga. English instead uses do/does/is and short answers like 'Yes, I do.'","om":"Gaaffiin eeyyee/lakki yeroo baay'ee dubbachiiftuu dhumaa dheeressuu fi sagalee ol kaasuun uumama: Barsiisaadha → Barsiisaadhaa? 'Eeyyee' ykn 'Lakki' jedhii gochima irra deebi'i: Eeyyee, nan dhuga. Afaan Ingiliffaa keessatti do/does/is fayyadamuun gaaffii uumna; deebii gabaabaaf 'Yes, I do.' jedhama."}},"items":[["Yes.","Eeyyee.","Also: Ee.","Akkasumas: Ee.",0],["No.","Lakki.","Miti means 'it is not'; Lakki is the answer 'no'.","'Miti' = 'it is not'; deebiin 'no' jedhu 'Lakki' jedhama.",0],["Is Abdi a teacher?","Abdiin barsiisaadhaa?","","",0],["Yes, he is.","Eeyyee, barsiisaadha.","","",0],["No, he isn't.","Lakki, barsiisaa miti.","","",0],["Do you drink coffee?","Buna ni dhugdaa?","Respect/plural: Buna ni dhugduu?","Kabajaaf/baay'inaaf: Buna ni dhugduu?",0],["No, I don't.","Lakki, hin dhugu.","","",0],["Have you eaten?","Nyaattee?","Respect/plural: Nyaattanii?","Kabajaaf/baay'inaaf: Nyaattanii?",0],["Not yet.","Ammallee hin nyaanne.","Lit. 'I still haven't eaten.'","Afaan Ingiliffaatiin gabaabinaan 'Not yet' jedhama.",0],["Are you tired?","Dadhabdee?","Respect/plural: Dadhabdanii?","Kabajaaf/baay'inaaf: Dadhabdanii?",0],["Are they at home?","Isaan mana jiruu?","Answers: Eeyyee, jiru. / Lakki, hin jiran.","Deebii: Eeyyee, jiru. / Lakki, hin jiran.",0],["Is she with Kuma?","Isheen Kumaa wajjin jirtii?","","",0],["Really?","Dhuguma?","Also: Dhugaa keetii?","Akkasumas: Dhugaa keetii?",0],["I think so.","Akkas natti fakkaata.","","",0],["I don't think so.","Akkas natti hin fakkaatu.","","",0],["Maybe.","Ta'uu danda'a.","Also: Tarii.","Akkasumas: Tarii.",0]]},{"id":"negatives","en":"Saying no & negatives","om":"Haaluu fi hima dhabamsaa","icon":"🚫","group":"basics","intros":{"rwb":{"en":"Verbs are negated with hin before the verb (hin beeku — I don't know); nouns and adjectives with miti after them (barsiisaa miti — not a teacher). The past
