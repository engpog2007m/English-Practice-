 woman"],["adeera","adaadaa","paternal uncle / aunt"],["dureessa","dureettii","rich man / rich woman"],["barataa","barattuu","student"],["barsiisaa","barsiistuu","teacher"],["hojjetaa","hojjettuu","worker"]]}},{"h_en":"Endings that signal gender","h_om":"Xumura saala agarsiisan","p_en":"Some endings are reliable clues: -eessa (m) ↔ -eettii (f); -aa (m) ↔ -tuu/-ttuu/-duu (f) for people who do something and for many adjectives; and the 'the' endings -icha (m) ↔ -ittii (f): namicha 'the man', namittii 'the woman'. Many women's names end in -tuu or -ii (Caaltuu, Boontuu, Hawwii), many men's names in -aa (Caalaa, Tolaa)."},{"h_en":"Things and places","h_om":"Wantoota fi bakkeewwan","p_en":"Most things are treated as masculine. A few common nouns are usually feminine: aduu (sun), biyya (country), magaalaa (town), lafa (land). Gender of things can vary from region to region, so follow what you hear around you; you will be understood either way.","ex":[["The sun has risen.","Aduun baate.","baate: feminine verb form.","",0],["Our country is beautiful.","Biyyi keenya bareedduudha.","bareedduu: feminine adjective.","",0],["This town is big.","Magaalaan tun guddoodha.","","",0]]},{"h_en":"Agreement in action","h_om":"Walsimsiisa","p_en":"Once you know a noun's gender, make everything around it match.","ex":[["The man came; the woman came.","Namichi dhufe; namittiin dhufte.","","",0],["Our (female) teacher has come.","Barsiistuun keenya dhufte.","","",0],["This girl is tall.","Intalli tun dheertuudha.","","",0]]}]},{"id":"demonstratives","en":"This, that, these, those","om":"Kun, sun, kunneen, sunneen","icon":"👉","level":1,"summary_en":"Oromo demonstratives follow the noun and have one form for subjects and another for everything else.","summary_om":"Jechoota 'kun, kana, sun, sana' fi bifa baay'ina isaanii akkamitti akka fayyadamnu.","sections":[{"h_en":"The forms","h_om":"Bifa isaanii","p_en":"Each demonstrative has a SUBJECT form (when the noun is the subject of the sentence) and a BASE form (object, after postpositions, everywhere else). 'This' has a feminine form tun/tana, though many speakers use kun/kana for both genders.","table":{"head":["","Subject form","Base form"],"rows":[["this (m)","kun","kana"],["this (f)","tun","tana"],["that","sun","sana"],["these","kunneen","kanneen"],["those","sunneen","sanneen"]]}},{"h_en":"On their own","h_om":"Kophaatti","p_en":"Used alone they mean 'this one, that one':","ex":[["What is this?","Kun maali?","","",0],["Take this.","Kana fudhu.","","",0],["Who is that?","Sun eenyu?","","",0],["Whose are these?","Kanneen kan eenyuuti?","","",0]]},{"h_en":"After a noun","h_om":"Maqaa booda","p_en":"Put the demonstrative after the noun. If the noun is the subject, both the noun and the demonstrative take subject forms: Manni kun guddaadha 'This house is big'. As an object: Mana kana bite 'He bought this house'. With plural nouns, the singular base form kana/sana is also common in speech.","ex":[["This house is big.","Manni kun guddaadha.","","",0],["He bought this house.","Mana kana bite.","","",0],["This is my sister.","Tun obboleettii kooti.","","",0],["These are new students.","Kunneen barattoota haaraadha.","","",0]]},{"h_en":"With endings and related words","h_om":"Maxxantoota waliin","p_en":"The base forms take case endings like nouns: kanaaf 'for this; therefore', kanaan 'with this', sana booda 'after that', kana dura 'before this'. Related place and manner words: as / asi 'here', achi 'there', asii 'from here', akkana 'like this', akkas 'like that, so'.","ex":[["Who lives in that house?","Mana sana keessa eenyutu jiraata?","","",0],["What did you do after that?","Sana booda maal goote?","","",0]]}]},{"id":"possessives","en":"Possessives: my, your, his…","om":"Abbummaa: koo, kee, isaa…","icon":"🔑","level":1,"summary_en":"Possessive words follow the noun (mana koo 'my house'), and 'mine, yours' are formed with kan.","summary_om":"Wanti kan eenyuu akka ta'e ibsuu: mana koo, kitaaba Caalaa, kan kooti.","sections":[{"h_en":"My, your, his…","h_om":"Koo, kee, isaa…","p_en":"The possessive word comes after the noun and does not change for the subject form of the noun: mana koo 'my house', manni koo 'my house' (as subject).","table":{"head":["English","Afaan Oromoo","Example"],"rows":[["my","koo (also kiyya)","mana koo – my house"],["your (one person)","kee","maqaa kee – your name"],["his","isaa","haadha isaa – his mother"],["her","ishee (also isii)","abbaa ishee – her father"],["our","keenya","biyya keenya – our country"],["your (plural / respect)","keessan","mana keessan – your home"],["their","isaanii","ijoollee isaanii – their children"]]}},{"h_en":"Owner nouns: Chala's house","h_om":"Abbaa qabeenyaa: mana Caalaa","p_en":"To say 'X's Y', put the owner after the thing: mana Caalaa 'Chala's house'. If the owner ends in a short vowel, lengthen it (intala → uffata intalaa 'the girl's clothes'); if it ends in a consonant, add -ii (maqaa Galaanii 'Galaan's name')."},{"h_en":"Mine, yours, his: kan …","h_om":"Kan koo, kan kee…","p_en":"kan means 'the one of'. kan koo = mine, kan kee = yours, kan isaa = his, kan ishee = hers, kan keenya = ours, kan keessan = yours (pl.), kan isaanii = theirs, kan Caalaa = Chala's. As a statement add -ti ('is'): Kun kan kooti 'This is mine'. As a question lengthen it: Kun kan keetii? 'Is this yours?'","ex":[["Whose is this book? – It's Chala's.","Kitaabni kun kan eenyuuti? – Kan Caalaati.","","",0],["Is this yours?","Kun kan keetii?","","",0]]},{"h_en":"Possessives with endings","h_om":"Abbummaa fi maxxantoota","p_en":"Endings go on the possessive word, with -ti- inserted after a long vowel: mana kootti 'at/to my house', harka isaatiin 'with his hand', abbaa keessaniif 'for your father'.","ex":[["Come to my house.","Mana kootti koottu.","","",0],["He writes with his left hand.","Harka bitaa isaatiin barreessa.","","",0],["My name is Bontu.","Maqaan koo Boontuu jedhama.","","",0],["Where is your father?","Abbaan kee eessa jira?","","",0],["Do you know Chala's house?","Mana Caalaa beektaa?","","",0]]},{"h_en":"Regional/variant: feminine possessives","h_om":"Garaagarummaa naannoo","p_en":"In eastern Oromo (Hararghe) and in some textbooks, 'my, your, our' change when the thing owned is feminine: intala tiyya / too 'my daughter', obboleettii tee 'your sister', teenya 'our', teessan 'your (pl.)'. Central and western speakers use koo/kiyya, kee, keenya, keessan for everything. Both are correct; this course uses the second set."}]},{"id":"jiraachuu","en":"Jiraachuu: to be somewhere, 'there is'","om":"Jiraachuu: argamuu fi jiraachuu","icon":"📍","level":1,"summary_en":"jira (from jiraachuu) says where someone or something is, and whether something exists; jiraachuu also means 'to live'.","summary_om":"Jira, jirta, jirti… bakka itti argamnu ibsuu fi 'jira / hin jiru' jechuuf.","sections":[{"h_en":"Being somewhere","h_om":"Bakka tokko jiraachuu","p_en":"For location and existence Oromo uses jira, not -dha. Compare Inni barsiisaadha 'He is a teacher' with Inni mana jira 'He is at home'. Its present forms are irregular and must be memorized.","table":{"head":["Person","is / are (present)","is not","was / were","was not"],"rows":[["ani","jira","hin jiru","ture","hin turre"],["ati","jirta","hin jirtu","turte","hin turre"],["inni","jira","hin jiru","ture","hin turre"],["isheen","jirti","hin jirtu","turte","hin turre"],["nuti","jirra","hin jirru","turre","hin turre"],["isin","jirtu (also jirtan)","hin jirtan","turtan","hin turre"],["isaan","jiru (also jiran)","hin jiran","turan","hin turre"]]}},{"h_en":"There is / there isn't","h_om":"Jira / hin jiru","p_en":"With a subject noun, jira means 'there is', hin jiru 'there isn't'. Use the subject form of the noun and plural jiru for plural things.","ex":[["Is there water? – Yes, there is.","Bishaan jiraa? – Eeyyee, ni jira.","","",0],["No problem.","Rakkoo hin jiru.","Literally: there is no problem.","",0],["There are many students in the classroom.","Barattoonni hedduun kutaa keessa jiru.","","",0]]},{"h_en":"Asking where","h_om":"Eessa jira?","p_en":"Eessa + jira is the standard 'where is…?' question. The verb agrees with the person or thing you ask about.","ex":[["Where are you? – I'm at home.","Eessa jirta? – Mana jira.","","",0],["I wasn't at work yesterday.","Kaleessa hojii irra hin turre.","","",0],["How are you? (lit. how are you being?)","Akkam jirta?","","",0]]},{"h_en":"Jiraachuu = to live; the future","h_om":"Jiraachuu: jiraachuu fi yeroo dhufu","p_en":"Used as a regular -chuu verb, jiraachuu means 'to live (somewhere)': jiraadha, jiraatta, jiraata, jiraatti, jiraanna, jiraattu, jiraatu; past jiraadhe, jiraatte, jiraate… The same forms also give 'there will be': ni jiraata.","ex":[["Where do you live? – I live in Finfinne.","Eessa jiraatta? – Finfinnee jiraadha.","","",0],["There will be a meeting tomorrow.","Boru walgahiin ni jiraata.","","",0]]}]},{"id":"qabaachuu","en":"To have: qabaachuu","om":"Qabaachuu","icon":"🎒","level":1,"summary_en":"qaba 'I have / he has' is one of the most useful verbs; it also expresses hunger, thirst and 'must'.","summary_om":"Qaba, qabda, qabdi… waan qabnu fi hin qabne ibsuuf.","sections":[{"h_en":"Present and negative","h_om":"Yeroo ammaa fi haalaa","p_en":"The infinitive is qabaachuu, but the present uses the short stem qab-. The thing owned comes before the verb.","table":{"head":["Person","have","don't have"],"rows":[["ani","qaba","hin qabu"],["ati","qabda","hin qabdu"],["inni","qaba","hin qabu"],["isheen","qabdi","hin qabdu"],["nuti","qabna","hin qabnu"],["isin","qabdu (also qabdan)","hin qabdan"],["isaan","qabu (also qaban)","hin qaban"]]},"ex":[["I have one sister and two brothers.","Obboleettii tokkoo fi obboleessa lama qaba.","","",0],["She has three children.","Isheen ijoollee sadii qabdi.","","",0],["I don't have a car.","Konkolaataa hin qabu.","","",0],["Do you have time?","Yeroo qabdaa?","","",0]]},{"h_en":"Past: had","h_om":"Yeroo darbe","p_en":"For 'had', add ture/turte… after the present form: qaba ture 'I/he had', qabdi turte 'she had', qabna turre 'we had'. 'Didn't have': hin qabu ture.","ex":[["I had a car.","Konkolaataa qaba ture.","","",0],["At that time I didn't have money.","Yeroo sana maallaqa hin qabu ture.","","",0]]},{"h_en":"The full verb qabaachuu","h_om":"Qabaachuu guutuu","p_en":"The long form appears in the infinitive, in commands and for future 'will have': Ijoollee qabaachuu barbaada 'I want to have children'; Obsa qabaadhu! 'Be patient!' (lit. have patience).","ex":[["Be patient!","Obsa qabaadhu!","","",0]]},{"h_en":"Feelings and states with qaba","h_om":"Miira qaba waliin","p_en":"Oromo 'has' many states that English 'is': Beela qaba 'I'm hungry' (I have hunger), Dheebuu qaba 'I'm thirsty', Hojii qaba 'I'm busy' (I have work). qaba after an infinitive means 'must': Deemuu qaba 'I have to go' (see the lesson on obligation). Do not confuse it with qabuu 'to hold, catch': Poolisiin hattuu qabe 'The police caught the thief'.","ex":[["I'm hungry.","Beela qaba.","","",0],["I'm busy today.","Har'a hojii qaba.","","",0]]}]},{"id":"present_tense","en":"Present tense of regular verbs","om":"Yeroo ammaa: gochimoota idilee","icon":"▶️","level":1,"summary_en":"Take the stem of the verb and add a personal ending; the same form covers 'I go', 'I'm going (habitually)' and often 'I will go'.","summary_om":"Gochimoota idilee yeroo ammaatiin akkamitti akka jijjiiramanii fi akkamitti akka haalaman.","sections":[{"h_en":"Infinitive and stem","h_om":"Jecha bu'uuraa fi hundee","p_en":"Verbs are listed in the infinitive, which ends in -uu: deemuu (to go), dhufuu (to come), beekuu (to know). Remove -uu to get the stem: deem-, dhuf-, beek-. All forms are built on the stem."},{"h_en":"The personal endings","h_om":"Xumura namaa","p_en":"Add these endings to the stem. Note that 'I' and 'he' share one form, and 'you (sg.)' and 'she' differ only by -ta / -ti.","table":{"head":["Person","Ending","deemuu (go)","dhufuu (come)","beekuu (know)"],"rows":[["ani","-a","deema","dhufa","beeka"],["ati","-ta","deemta","dhufta","beekta"],["inni","-a","deema","dhufa","beeka"],["isheen","-ti","deemti","dhufti","beekti"],["nuti","-na","deemna","dhufna","beekna"],["isin","-tu (-tan)","deemtu","dhuftu","beektu"],["isaan","-u (-an)","deemu","dhufu","beeku"]]}},{"h_en":"The little word ni","h_om":"Jecha 'ni'","p_en":"In positive main clauses a small marker ni often stands right before the verb: Ni dhufa 'He comes'. With 'I' it becomes nan: Nan beeka 'I know'. ni is used mostly when nothing else (object, place, time word) comes before the verb, and it is optional; it is never used with hin, in questions with question words, or in subordinate clauses. Regional forms: nin (for nan), and in some areas ni is used much more freely.","ex":[["I know him.","Ani isa nan beeka.","","",0],["She comes.","Isheen ni dhufti.","","",0]]},{"h_en":"Negative present: hin …","h_om":"Haalaa yeroo ammaa","p_en":"Put hin before the verb and change the endings: -u for ani and inni, -tu for ati and isheen, -nu for nuti, -tan for isin, -an for isaan.","table":{"head":["Person","goes","doesn't go"],"rows":[["ani","deema","hin deemu"],["ati","deemta","hin deemtu"],["inni","deema","hin deemu"],["isheen","deemti","hin deemtu"],["nuti","deemna","hin deemnu"],["isin","deemtu","hin deemtan"],["isaan","deemu","hin deeman"]]},"ex":[["She doesn't know English.","Isheen Afaan Ingiliffaa hin beektu.","","",0],["We aren't going today.","Har'a hin deemnu.","","",0]]},{"h_en":"What the present covers","h_om":"Hiika yeroo ammaa","p_en":"The present form expresses habits and general truths ('Tola goes to work every day'), and with a time word also the future ('They're coming tomorrow'). For an action happening right now, use the continuous (deemaa jira). Regional/variant: for isin and isaan, central and western speakers say -tu and -u (deemtu, deemu); eastern speakers often say -tan and -an (deemtan, deeman). The negative always uses -tan / -an.","ex":[["Tola goes to work every day.","Tolaan guyyaa hunda hojiitti deema.","","",0],["They're coming tomorrow.","Isaan boru dhufu.","","",0],["Where are you going?","Ati eessa deemta?","","",0],["We're leaving now.","Nuti amma deemna.","","",0]]}]},{"id":"past_tense","en":"Past tense","om":"Yeroo darbe","icon":"⏪","level":1,"summary_en":"The past uses the endings -e, -te, -ne, -tan, -an; the negative past is simply hin … -ne for everyone.","summary_om":"Xumura -e, -te, -ne, -tan, -an fi haalaa 'hin …ne'.","sections":[{"h_en":"Past endings","h_om":"Xumura yeroo darbee","p_en":"Add the past endings to the stem. As in the present, 'I' = 'he' and 'you (sg.)' = 'she', so pronouns are helpful.","table":{"head":["Person","Ending","deemuu","dhufuu","bituu (buy)"],"rows":[["ani","-e","deeme","dhufe","bite"],["ati","-te","deemte","dhufte","bitte"],["inni","-e","deeme","dhufe","bite"],["isheen","-te","deemte","dhufte","bitte"],["nuti","-ne","deemne","dhufne","binne"],["isin","-tan","deemtan","dhuftan","bittan"],["isaan","-an","deeman","dhufan","bitan"]]}},{"h_en":"Sound changes","h_om":"Jijjiirama sagalee","p_en":"When the stem ends in t, the t of the ending merges with it (bit + te → bitte) and t + n becomes nn (bit + ne → binne). Similar small changes happen with other consonants; they are collected in the lesson on verb groups."},{"h_en":"Negative past: hin … -ne","h_om":"Haalaa yeroo darbee","p_en":"The negative past is the easiest form in the language: hin + stem + -ne, identical for all persons. Use the pronoun to make clear who did not do it.","ex":[["I didn't see him.","Ani isa hin argine.","","",0],["They didn't come yesterday.","Isaan kaleessa hin dhufne.","","",0]]},{"h_en":"Time words for the past","h_om":"Jechoota yeroo darbee","p_en":"kaleessa (yesterday), dheengadda (the day before yesterday), eda (last night), torbaan darbe (last week), ji'a darbe (last month), bara darbe (last year), amma (just now). ni is usually not used in the past. To ask a past question, lengthen the last vowel: Nyaatte → Nyaattee? 'Did you eat?'; Dhufan → Dhufanii? 'Did they come?'","ex":[["We went to Adama yesterday.","Kaleessa Adaamaa deemne.","","",0],["She came last year.","Isheen bara darbe dhufte.","","",0],["We bought a new house.","Mana haaraa binne.","","",0],["Where were you last night?","Eda eessa turte?","","",0],["Where did you go?","Eessa dhaqxe?","dhaquu = to go to a destination; deemuu = to go, walk, leave.","",0]]}]},{"id":"questions","en":"Asking questions","om":"Gaaffii gaafachuu","icon":"❓","level":1,"summary_en":"Make yes/no questions by lengthening the last vowel; put question words where the answer would go.","summary_om":"Gaaffii eeyyee/lakki fi jechoota gaaffii (maal, eenyu, eessa, yoom…).","sections":[{"h_en":"Yes/no questions","h_om":"Gaaffii eeyyee/lakki","p_en":"Take the statement, lengthen its final vowel and let your voice rise. Words ending in -an add -ii. Word order does not change.","table":{"head":["Statement","Question","English"],"rows":[["Ni dhufta.","Ni dhuftaa?","Are you coming?"],["Barataadha.","Barataadhaa?","Are you a student?"],["Nyaatte.","Nyaattee?","Did you eat?"],["Isheen ni dhufti.","Isheen ni dhuftii?","Is she coming?"],["Isaan dhufan.","Isaan dhufanii?","Did they come?"]]}},{"h_en":"Answering","h_om":"Deebii kennuu","p_en":"Yes = Eeyyee (short: Ee). No = Lakki. Miti means 'it is not (so)' and answers questions about identity or description. It is natural to repeat the verb in the answer.","ex":[["Are you coming? – Yes, I'm coming. / No, I'm not.","Ni dhuftaa? – Eeyyee, nan dhufa. / Lakki, hin dhufu.","","",0],["Is she a teacher? – No, she isn't.","Isheen barsiistuudhaa? – Lakki, barsiistuu miti.","","",0]]},{"h_en":"Question words","h_om":"Jechoota gaaffii","p_en":"Question words stay in the position of the answer, usually just before the verb.","table":{"head":["English","Afaan Oromoo","Example"],"rows":[["what","maal","Maal barbaadda? – What do you want?"],["what is (it)?","maali","Hojiin kee maali? – What is your job?"],["who","eenyu","Maqaan kee eenyu? – What is your name?"],["where","eessa","Eessa jiraatta? – Where do you live?"],["when","yoom","Yoom deebita? – When will you come back?"],["how","akkam","Akkam jirta? – How are you?"],["how, in what way","akkamitti","Akkamitti dhufte? – How did you come?"],["why","maaliif","Maaliif boossa? – Why are you crying?"],["how many / how much (price)","meeqa","Kun meeqa? – How much is this?"],["how much (amount)","hammam (also hangam)","Bishaan hammam barbaadda? – How much water do you want?"],["which","kam","Kam barbaadda? – Which one do you want?"],["whose","kan eenyu","Kun kan eenyuuti? – Whose is this?"]]}},{"h_en":"Question words with endings","h_om":"Jechoota gaaffii maxxantoota waliin","p_en":"Question words take the same endings as nouns: eessaa 'from where', eessatti 'to / at where', eenyuuf 'for whom', maaliin 'with what, by what means', meeqatti 'at what (time), for how much', kamiin 'by which'.","ex":[["Where are you from?","Eessaa dhufte?","Literally: from where did you come?","",0],["Where were you born?","Eessatti dhalatte?","","",0],["How old are you?","Umuriin kee meeqa?","","",0],["What time shall we meet?","Sa'aa meeqatti wal arginaa?","","",0]]},{"h_en":"Who did it? The ending -tu","h_om":"Eenyutu? Maaltu?","p_en":"When the question word is the SUBJECT, it takes -tu, and so does the answer: Eenyutu dhufe? 'Who came?' – Caalaatu dhufe 'Chala did (came)'. Maaltu ta'e? 'What happened?'","ex":[["Who came? – Chala came.","Eenyutu dhufe? – Caalaatu dhufe.","","",0]]},{"h_en":"'Or' in questions: moo","h_om":"Gaaffii 'moo' waliin","p_en":"In questions 'or' is moo (in statements it is yookiin). Use hoo for 'and what about…?'","ex":[["Tea or coffee?","Shaayii moo buna?","","",0],["Are you coming today or tomorrow?","Har'a moo boru dhufta?","","",0]]}]},{"id":"imperatives","en":"Commands, 'don't' and 'let's'","om":"Ajaja, dhorkaa fi 'haa'","icon":"📣","level":1,"summary_en":"Commands add -i (one person) or -aa (several people or respect); 'don't' is hin … -in / -inaa; 'let's' uses haa.","summary_om":"Ajaja tokkichaa fi baay'inaa, 'hin …in' fi 'haa deemnu'.","sections":[{"h_en":"Positive commands","h_om":"Ajaja","p_en":"Singular (one person you address as ati): stem + -i. Plural or respectful (isin): stem + -aa. Verbs ending in -chuu use -adhu / -adhaa.","table":{"head":["Infinitive","Do! (sg.)","Do! (pl./respect)","Don't! (sg.)","Don't! (pl./respect)"],"rows":[["deemuu (go)","deemi","deemaa","hin deemin","hin deeminaa"],["dhuguu (drink)","dhugi","dhugaa","hin dhugin","hin dhuginaa"],["kennuu (give)","kenni","kennaa","hin kennin","hin kenninaa"],["taa'uu (sit)","taa'i","taa'aa","hin taa'in","hin taa'inaa"],["deebi'uu (return)","deebi'i","deebi'aa","hin deebi'in","hin deebi'inaa"],["nyaachuu (eat)","nyaadhu","nyaadhaa","hin nyaatin","hin nyaatinaa"],["dubbachuu (speak)","dubbadhu","dubbadhaa","hin dubbatin","hin dubbatinaa"],["dhufuu (come)","koottu","koottaa","hin dhufin","hin dhufinaa"]]}},{"h_en":"Irregular commands","h_om":"Ajaja addaa","p_en":"'Come!' is koottu (pl. koottaa), although 'don't come' is regular: hin dhufin. Other common ones: fudhu 'take!' (from fuudhuu), ka'i 'get up!', kaa'i 'put (it) down!', dhaqi 'go (there)!'. Some regions also use the special form beenu / beenaa 'go!'."},{"h_en":"Negative commands","h_om":"Dhorkaa","p_en":"hin + stem + -in (sg.) or -inaa (pl.). For -chuu verbs the stem ends in -at: hin nyaatin, hin dubbatin, hin sodaatin 'don't be afraid'.","ex":[["Don't be afraid.","Hin sodaatin.","","",0],["Close the door.","Balbala cufi.","","",0]]},{"h_en":"Let's / let him: haa","h_om":"Haa","p_en":"haa + a present-type form gives 'let…': haa deemnu 'let's go', haa dhufu 'let him come', haa dhuftu 'let her come', haa dhufan 'let them come', haa ta'u 'all right, so be it'.","ex":[["Let's go!","Haa deemnu!","","",0],["Let him come.","Inni haa dhufu.","","",0]]},{"h_en":"Softening a command","h_om":"Ajaja laaffisuu","p_en":"Add maaloo 'please' or mee 'come on, just' and use object pronouns: Naa kenni 'Give (it to) me', Mee as koottu 'Come here, would you'. With elders and strangers, use the plural (respect) form.","ex":[["Come here!","As koottu!","","",0],["Please speak slowly.","Maaloo, suuta dubbadhu.","","",0],["Give it to me.","Naa kenni.","","",0],["Sit down and eat. (to guests)","Taa'aa, nyaadhaa.","","",0]]}]},{"id":"numbers_money","en":"Numbers, counting and money","om":"Lakkoofsa, lakkaa'uu fi maallaqa","icon":"🔢","level":1,"summary_en":"Learn the number system, ordinal numbers with -ffaa, how to count things (singular noun + number) and how to talk about prices.","summary_om":"Lakkoofsa, lakkoofsa tartiibaa (-ffaa), wantoota lakkaa'uu fi gatii gaafachuu.","sections":[{"h_en":"1 to 19","h_om":"1 hanga 19","p_en":"11–19 are formed with kudha ('ten-and') + the unit.","table":{"head":["#","Afaan Oromoo","#","Afaan Oromoo"],"rows":[["0","zeeroo (also duwwaa)","10","kudhan"],["1","tokko","11","kudha tokko"],["2","lama","12","kudha lama"],["3","sadii","13","kudha sadii"],["4","afur","14","kudha afur"],["5","shan","15","kudha shan"],["6","jaha","16","kudha jaha"],["7","torba","17","kudha torba"],["8","saddeet","18","kudha saddeet"],["9","sagal","19","kudha sagal"]]}},{"h_en":"Tens, hundreds, thousands","h_om":"Kurnoota, dhibbaa fi kumaa","p_en":"The tens end in -ama. In 21–99 that final -a becomes -ii before the unit: digdama (20) → digdamii tokko (21). Hundreds and thousands are counted like nouns (dhibba lama = 200) and joined to the rest with fi, whose preceding vowel lengthens.","table":{"head":["Number","Afaan Oromoo"],"rows":[["20 / 21","digdama / digdamii tokko"],["30","soddoma"],["40","afurtama"],["50","shantama"],["60","jaatama"],["70","torbaatama"],["80","saddeettama"],["90","sagaltama"],["100","dhibba (dhibba tokko)"],["105","dhibba tokkoo fi shan"],["250","dhibba lamaa fi shantama"],["1,000","kuma (kuma tokko)"],["2,025","kuma lamaa fi digdamii shan"],["1,000,000","miliyoona"]]}},{"h_en":"Counting things","h_om":"Wantoota lakkaa'uu","p_en":"The number comes AFTER the noun, and the noun normally stays singular: kitaaba sadii 'three books', barataa shan 'five students'. Ask with meeqa 'how many?' for countable things and hammam 'how much?' for amounts. Quantity words: xiqqoo 'a little, some', hedduu / baay'ee 'many, a lot'. tokko 'one' has a feminine form takka in many areas (intala takka). Group words: lamaanuu 'both', sadeenuu 'all three'; si'a lama 'twice', al tokko 'once', walakkaa 'half'.","ex":[["How many children do you have? – Three.","Ijoollee meeqa qabda? – Sadii.","","",0],["He bought three books.","Kitaaba sadii bite.","","",0],["Both came.","Lamaanuu dhufan.","","",0]]},{"h_en":"Ordinal numbers: -ffaa","h_om":"Lakkoofsa tartiibaa: -ffaa","p_en":"Add -ffaa: tokkoffaa (1st; also jalqabaa), lammaffaa (2nd), sadaffaa (3rd), afraffaa (4th), shanaffaa (5th), jahaffaa (6th), torbaffaa (7th), saddeettaffaa (8th), saglaffaa (9th), kurnaffaa (10th), digdamaffaa (20th). Like other describing words they follow the noun: kutaa sadaffaa 'third grade'. Some textbooks also give older forms in -eessaa (sadeessaa 'the third').","ex":[["She is in third grade.","Isheen kutaa sadaffaa barachaa jirti.","","",0]]},{"h_en":"Arithmetic words","h_om":"Herrega","p_en":"ida'uu (to add, +), hir'isuu (to subtract, −), baay'isuu (to multiply, ×), hiruu (to divide, ÷), walqixa (equal, =), caalaa (more), xiqqaa (less)."},{"h_en":"Money and prices","h_om":"Maallaqa fi gatii","p_en":"Ethiopian money: qarshii (birr) and saantima (cent); 100 saantima = 1 qarshii. maallaqa or horii = money. The price question is Meeqa? or Gatiin isaa meeqa? Use -n for 'for (a price)' and -tti for 'per': qarshii shantamaan 'for 50 birr', kiiloo tokkotti 'per kilo'. Useful words: qaalii (expensive), rakasaa (cheap), jijjiirraa (change), kaffaluu (to pay), liqaa (debt, loan), liqeeffachuu (to borrow money), liqeessuu (to lend).","ex":[["How much is this? – Two hundred birr.","Kun meeqa? – Qarshii dhibba lama.","","",0],["It's very expensive; lower the price a little.","Baay'ee qaaliidha; xiqqoo hir'isi.","","",0],["He bought it for fifty birr.","Qarshii shantamaan bite.","","",0],["How much is one kilo?","Kiiloon tokko meeqa?","","",0]]}]},{"id":"verb_classes","en":"Verb groups and sound changes","om":"Gareewwan gochimaa fi jijjiirama sagalee","icon":"⚙️","level":2,"summary_en":"Endings that begin with t or n cause small, predictable sound changes; learn the four verb groups and the main assimilation rules.","summary_om":"Gochimoota -chuu, kanneen dubbifamaa lamaan xumuraman fi kanneen hudhaa qaban akkamitti akka jijjiiraman.","sections":[{"h_en":"Why verb forms change","h_om":"Maaliif jijjiiramu?","p_en":"The endings for ati, isheen, nuti and isin begin with t or n (-ta, -ti, -na, -tu; past -te, -ne, -tan). When such an ending meets the last consonant of the stem, the sounds adjust to be easier to say, much as English 'in + possible' becomes 'impossible'. Once you know the patterns, every verb becomes predictable. Group 1 (regular verbs like deemuu, dhufuu, beekuu) has no changes and was covered in the present-tense lesson."},{"h_en":"Group 2: verbs in -chuu","h_om":"Garee 2: gochimoota -chuu","p_en":"A very large group (nyaachuu eat, dubbachuu speak, barachuu learn, taphachuu play, hojjechuu work, bitachuu buy for oneself). 'I' ends in -dha, 'he' in -ta, and t + n becomes nn.","table":{"head":["Person","eats","doesn't eat","ate","eat! / don't eat!"],"rows":[["ani","nyaadha","hin nyaadhu","nyaadhe",""],["ati","nyaatta","hin nyaattu","nyaatte","nyaadhu / hin nyaatin"],["inni","nyaata","hin nyaatu","nyaate",""],["isheen","nyaatti","hin nyaattu","nyaatte",""],["nuti","nyaanna","hin nyaannu","nyaanne",""],["isin","nyaattu","hin nyaattan","nyaattan","nyaadhaa / hin nyaatinaa"],["isaan","nyaatu","hin nyaatan","nyaatan",""]]},"ex":[["I speak a little Afaan Oromoo.","Afaan Oromoo xiqqoo nan dubbadha.","","",0],["We work together.","Waliin hojjenna.","hojjechuu: also hojjachuu (hojjadha, hojjatta) in some regions.","",0]]},{"h_en":"Group 3: stems ending in two consonants","h_om":"Garee 3: hundee dubbifamaa lamaan xumuramu","p_en":"If the stem ends in two consonants (arg-, kenn-, barreess-), an i is slipped in before endings that start with a consonant, because Oromo never puts three consonants together.","table":{"head":["Person","arguu (see): present","past","kennuu (give): present","past"],"rows":[["ani","arga","arge","kenna","kenne"],["ati","argita","argite","kennita","kennite"],["inni","arga","arge","kenna","kenne"],["isheen","argiti","argite","kenniti","kennite"],["nuti","argina","argine","kennina","kennine"],["isin","argitu","argitan","kennitu","kennitan"],["isaan","argu","argan","kennu","kennan"]]},"ex":[["Whom did you see today?","Har'a eenyu argite?","","",0]]},{"h_en":"Group 4: stems with a glottal stop","h_om":"Garee 4: hundee hudhaa qabu","p_en":"Verbs like ka'uu (get up), ta'uu (become), bu'uu (go down) and deebi'uu (return) lose the ' before t or n; the vowel before it becomes long (except i). dhaga'uu (hear) and danda'uu (be able) follow a special pattern with -ss- and -ny-.","table":{"head":["Person","ka'uu","deebi'uu","dhaga'uu"],"rows":[["ani","ka'a","deebi'a","dhaga'a"],["ati","kaata","deebita","dhageessa"],["inni","ka'a","deebi'a","dhaga'a"],["isheen","kaati","deebiti","dhageessi"],["nuti","kaana","deebina","dhageenya"],["isin","kaatu","deebitu","dhageessu"],["isaan","ka'u","deebi'u","dhaga'u"],["past (ani / ati / nuti)","ka'e / kaate / kaane","deebi'e / deebite / deebine","dhaga'e / dhageesse / dhageenye"]]},"ex":[["Can you hear me?","Na dhageessaa?","","",0],["She will come back.","Isheen ni deebiti.","","",0]]},{"h_en":"Consonant + t / n: the assimilation rules","h_om":"Seera walfakkeessuu","p_en":"These rules apply in every tense. Learn them as sound pairs rather than verb by verb.","table":{"head":["Stem ends in","Change","Example (infinitive → form)","English"],"rows":[["b","b + t → bd","qabuu → qabda","you hold / have"],["g","g + t → gd","dhuguu → dhugda","you drink"],["d","d + t → dd","fiduu → fidda","you bring"],["q","q + t → qx","dhiquu → dhiqxa","you wash"],["x","x + t → xx","fixuu → fixxa","you finish"],["dh","dh + t → tt, dh + n → nn","jedhuu → jetta, jenna","you say, we say"],["t","t + n → nn","bituu → binna","we buy"],["l","l + n → ll","galuu → galla","we go home"],["r","r + n → rr","turuu → turra","we stay"]]},"ex":[["What are you bringing?","Maal fidda?","","",0],["Do you drink tea?","Shaayii dhugdaa?","","",0],["Did you finish your work?","Hojii kee fixxee?","","",0],["We're going home.","Nuti mana galla.","","",0]]},{"h_en":"Two irregular favorites","h_om":"Gochimoota addaa lama","p_en":"godhuu (to do, make): godha, goota, godha, gooti, goona, gootu, godhu; past godhe, goote, goone, gootan, godhan; infinitive also gochuu. fedhuu (to want; mainly eastern): fedha, feeta, fedha, feeti, feena; past fedhe, feete, feene.","ex":[["What are you doing?","Maal gochaa jirta?","","",0],["What do you want? (eastern)","Maal feeta?","","",0]]}]},{"id":"plurals","en":"Plural nouns","om":"Baay'ina maqaa","icon":"👥","level":2,"summary_en":"Oromo has several plural endings (-oota, -lee, -wwan, -een, -an …); learn each noun's plural with the noun, and don't pluralize after numbers.","summary_om":"Maqaa baay'isuuf -oota, -lee, -wwan, -een fi kkf fayyadamna.","sections":[{"h_en":"How plurals work","h_om":"Akkaataa baay'inaa","p_en":"There is no single plural rule; each noun takes its own ending, and some take more than one. -oota is the most common, and a sensible guess if you don't know. Plurals are used less than in English: after numbers and quantity words the noun usually stays singular, and a singular noun can refer to a group (nama 'person, people')."},{"h_en":"-oota","h_om":"-oota","p_en":"Drop the final vowel and add -oota. Nouns for people who do something (ending -taa) double the t.","table":{"head":["Singular","Plural","English"],"rows":[["nama","namoota","person → people"],["biyya","biyyoota","country"],["fira","firoota","relative"],["hiriyyaa","hiriyyoota","friend"],["waggaa","waggoota","year"],["guyyaa","guyyoota","day"],["dubartii","dubartoota","woman"],["barataa","barattoota","student"],["hojjetaa","hojjettoota","worker"]]}},{"h_en":"-lee and -wwan","h_om":"-lee fi -wwan","p_en":"Many nouns ending in a long vowel keep it and add -lee or -wwan.","table":{"head":["Singular","Plural","English"],"rows":[["maqaa","maqaalee","name"],["rakkoo","rakkoolee","problem"],["waraqaa","waraqaalee","paper"],["meeshaa","meeshaalee","thing, tool"],["lammii","lammiilee","citizen"],["hojii","hojiiwwan","work, job"],["saree","sareewwan","dog"],["lukkuu","lukkuuwwan","chicken"],["tulluu","tulluuwwan","hill"]]}},{"h_en":"-een and -an (with doubling)","h_om":"-een fi -an","p_en":"Some short nouns double their last consonant and add -een; others add -an or -aan.","table":{"head":["Singular","Plural","English"],"rows":[["mana","manneen","house"],["laga","laggeen","river"],["muka","mukkeen","tree"],["quba","qubbeen","finger"],["farda","fardeen","horse"],["ilma","ilmaan","son → children"],["obboleessa","obboleeyyan","brother"],["gaara","gaarran","mountain"],["jaala","jaallan","comrade, friend"]]}},{"h_en":"Other patterns and irregulars","h_om":"Bifa biroo","p_en":"-eessa / -eettii → -eeyyii: dureessa → dureeyyii (rich people). -olii / -ootii: jaarsa → jaarsolii (elders), abbaa → abbootii (fathers). Irregular: mucaa (child) → ijoollee (children); sa'a (cow) → loon (cattle). Plurals take the subject ending too: barattoota → barattoonni (also barattootni).","ex":[["The students are in the classroom.","Barattoonni kutaa keessa jiru.","","",0],["I came with my friends.","Hiriyyoota koo waliin dhufe.","","",0],["The children are playing.","Ijoolleen taphachaa jiru.","","",0]]},{"h_en":"No plural after numbers","h_om":"Lakkoofsa booda baay'ina hin barbaachisu","p_en":"With a number the noun normally stays singular: kitaaba sadii 'three books', nama shan 'five people'. With hedduu / baay'ee 'many' both are heard: nama hedduu or namoota hedduu.","ex":[["He bought three books.","Kitaaba sadii bite.","","",0],["I saw five people.","Nama shan arge.","nama stays singular after shan.","",0]]}]},{"id":"subject_definite","en":"The subject ending and 'the' (-icha / -ittii)","om":"Mallattoo raawwataa fi '-icha/-ittii'","icon":"🎯","level":2,"summary_en":"A noun that is the subject of a sentence gets an ending (-n, -ni or -i); -icha / -ittii mean 'the (particular one)'; -tu puts focus on the subject.","summary_om":"Maqaan raawwataa ta'e -n, -ni ykn -i fudhata; -icha fi -ittii immoo 'the' jechuudha.","sections":[{"h_en":"Why nouns change as subjects","h_om":"Maaliif jijjiirama?","p_en":"Oromo marks the subject of a sentence with an ending (the nominative case). The plain form is used for objects, after postpositions and when citing a word. Compare: Saree arge 'He saw a dog' (object, plain) – Sareen dhufe 'The dog came' (subject, marked). Pronouns have their own subject forms (ani, inni…), so this rule is for nouns."},{"h_en":"Choosing the ending","h_om":"Xumura filachuu","p_en":"The ending depends on how the noun ends.","table":{"head":["Noun ends in","Ending","Examples"],"rows":[["a long vowel","-n","barataa → barataan, saree → sareen, Caalaa → Caalaan, hojii → hojiin"],["short vowel after one consonant","-ni (drop the vowel)","nama → namni, laga → lagni, kitaaba → kitaabni"],["…same, with sound merging","n+n → nn, t+n → nn, l+n → ll","mana → manni, buna → bunni, nyaata → nyaanni, gaala → gaalli"],["short vowel after two consonants","-i (drop the vowel)","farda → fardi, ilma → ilmi, harka → harki, biyya → biyyi"],["special cases","","haadha → haati, intala → intalli (also intalti), lafa → lafti"]]}},{"h_en":"Adjectives agree","h_om":"Ibsi maqaa ni walsima","p_en":"An adjective describing the subject noun also takes the ending: Namni dheeraan dhufe 'The tall man came'. Possessives and demonstratives use their own forms: manni koo, manni kun.","ex":[["The tall man came.","Namni dheeraan dhufe.","","",0],["The teacher has arrived.","Barsiisaan dhufeera.","","",0],["The coffee has gone cold.","Bunni qabbanaa'eera.","","",0]]},{"h_en":"'The': -icha and -ittii","h_om":"-icha fi -ittii","p_en":"Oromo usually leaves definiteness unmarked: nama can be 'a person' or 'the person'. To point to a specific, already-known one, add -icha (masculine) or -ittii (feminine), replacing the final vowel. Subject forms: -ichi and -ittiin. Examples: namicha / namichi 'the man', namittii / namittiin 'the woman', mucicha 'the boy', saricha 'the dog', kitaabicha 'the book', magaalattii 'the town', biyyattii 'the country'. Regional/variant: some speakers and older textbooks use -icha/-ittii only for people and animals; in today's media it is common with things too.","ex":[["The man is at home.","Namichi mana jira.","","",0],["I have read the book.","Kitaabicha dubbiseera.","","",0],["The town is very beautiful.","Magaalattiin baay'ee bareedduudha.","","",0]]},{"h_en":"Focus on the subject: -tu","h_om":"Xiyyeeffannoo: -tu","p_en":"To stress WHO did something ('It was Chala who…'), add -tu to the subject instead of the normal ending. This is obligatory with subject question words: Eenyutu…? Maaltu…? The verb is then usually in the plain 'he' form.","ex":[["It was Chala who came.","Caalaatu dhufe.","","",0],["What happened?","Maaltu ta'e?","","",0]]}]},{"id":"object_pronouns","en":"Object pronouns, 'myself' and 'each other'","om":"Bamaqaa wantaa, of fi wal","icon":"🔁","level":2,"summary_en":"Learn me/you/him… (na, si, isa…), their forms with endings (naaf, natti, narraa), the reflexive of / ofii, and the reciprocal wal.","summary_om":"Na, si, isa, ishee…, naaf, natti, narraa, akkasumas of fi wal.","sections":[{"h_en":"Object pronouns","h_om":"Bamaqaa wantaa","p_en":"Object pronouns stand right before the verb: na (me), si (you), isa (him), ishee (her), nu (us), isin (you pl.), isaan (them). With 'I' as subject, the focus ending -n often attaches to the object: Sin jaalladha 'I love you' (si + n).","ex":[["I love you.","Sin jaalladha.","","",0],["Did you see him?","Isa argitee?","","",0],["I know her.","Ishee nan beeka.","","",0],["Help us.","Nu gargaari.","","",0]]},{"h_en":"Pronouns with endings","h_om":"Bamaqaa maxxantoota waliin","p_en":"Pronouns take case endings like nouns. The most used are 'to/for', 'to/at' and 'from'.","table":{"head":["Subject","Object","to (give)","for","to / at","from","by / with"],"rows":[["ani","na","naa","naaf","natti","narraa","naan"],["ati","si","sii","siif","sitti","sirraa","siin"],["inni","isa","isaa","isaaf","isatti","isarraa","isaan"],["isheen","ishee","ishee","isheef","isheetti","isheerraa","isheen"],["nuti","nu","nuu","nuuf","nutti","nurraa","nuun"],["isin","isin","isinii","isiniif","isinitti","isinirraa","isiniin"],["isaan","isaan","isaanii","isaaniif","isaanitti","isaanirraa","isaaniin"]]}},{"h_en":"naa, naaf or natti?","h_om":"naa, naaf moo natti?","p_en":"All three can translate 'to me', with different shades: naa / naaf = to me as receiver or for my benefit (Naa kenni 'Give it to me'; Siif fide 'I brought it for you'); natti = towards me, used with telling, calling and handing something over to keep for a while (Natti himi 'Tell me'; Natti bilbili 'Call me').","ex":[["I brought this book for you.","Kitaaba kana siif fide.","","",0],["Tell me.","Natti himi.","","",0],["We borrowed from them.","Isaanirraa liqeeffanne.","","",0]]},{"h_en":"Myself: of and ofii","h_om":"Of fi ofii","p_en":"of (eastern: if) is the reflexive object 'oneself' for all persons: Of eeggadhu 'Take care of yourself', Inni of ilaala 'He looks at himself'. ofii + possessive means 'my own / myself' for emphasis: ofii koo, ofii kee, ofii isaa… ; ofumaan / ofiin = 'by oneself'.","ex":[["Take care of yourself!","Of eeggadhu!","","",0],["I did this work by myself.","Hojii kana ofumaan hojjedhe.","","",0]]},{"h_en":"Each other: wal","h_om":"Wal","p_en":"wal = 'each other / one another'. It also forms many common words: waliin / wajjin 'together, with', walitti 'together, to each other', walii galuu 'to agree'.","ex":[["See you tomorrow! (lit. we'll see each other)","Boru wal arginaa!","","",0],["We must help each other.","Wal gargaaruu qabna.","","",0],["We agreed.","Walii galle.","","",0]]}]},{"id":"cases","en":"Case endings: of, to, at, from, for, by","om":"Maxxantoota maqaa: -tti, -rraa, -f, -n","icon":"🧭","level":2,"summary_en":"Oromo attaches endings to nouns where English uses prepositions: -tti (at, to), -rraa (from), -f (for), -n (by, with) and a long vowel for 'of'.","summary_om":"Bakka, kallattii, madda, faayidaa fi meeshaa ibsuuf xumura maqaa.","sections":[{"h_en":"Overview","h_om":"Walumaagalaan","p_en":"Endings attach to the last word of the noun phrase. After a consonant an extra vowel is added (usually -ii- / -i-), and after possessive pronouns -ti- is inserted (kootti, isaatiin).","table":{"head":["Meaning","Ending","Examples"],"rows":[["of (owner)","lengthen final vowel; + -ii after consonant","mana barataa (the student's house), maqaa Galaanii (Galaan's name)"],["for, to (purpose, receiver)","-f, -dhaaf, -iif","barataaf (for the student), hojiidhaaf (for work), Galaaniif (for Galaan)"],["at, in, to, on (time)","-tti","Finfinneetti (in Finfinne), manatti (at home), sa'aa lamatti (at two)"],["from","-rraa; also -dhaa / -aa","Finfinneerraa (from Finfinne), hojiirraa (from work), manaa (from home)"],["by, with, in (means, language, manner)","-n, -dhaan, -iin, -tiin","harkaan (by hand), konkolaataan (by car), Afaan Oromootiin (in Oromo)"],["with (together)","waliin / wajjin (word)","Caalaa waliin (with Chala)"]]}},{"h_en":"-tti: at, in, to, per","h_om":"-tti","p_en":"-tti marks location, direction and points in time, and also 'per': guyyaatti al tokko 'once a day', kiiloo tokkotti 'per kilo'.","ex":[["We'll meet at school.","Mana barumsaatti wal argina.","","",0],["Come at two o'clock.","Sa'aa lamatti koottu.","","",0]]},{"h_en":"From: -rraa, -dhaa, -aa","h_om":"Irraa","p_en":"-rraa (literally 'from on') is the most common 'from'. With some place words a plain long vowel or -dhaa is used: manaa ba'e 'he left the house', eessaa? 'from where?'.","ex":[["He came back from work.","Hojiirraa deebi'e.","","",0],["Where are you from?","Eessaa dhufte?","","",0]]},{"h_en":"For: -f, -dhaaf, -iif","h_om":"-f, -dhaaf, -iif","p_en":"-f marks the person something is for, and purpose. A short final vowel lengthens first (nama → namaaf). After a long vowel you may add -f or -dhaaf.","ex":[["He came to study (for studies).","Barnootaaf dhufe.","","",0],["I bought it for my mother.","Haadha kootiif bite.","","",0]]},{"h_en":"By, with, in: -n","h_om":"-n, -dhaan, -iin","p_en":"The instrumental ending expresses the tool, the means of transport, the language, the manner, and the doer in passive sentences. After a long vowel use -n or -dhaan; after a consonant -iin.","ex":[["We came by car.","Konkolaataan dhufne.","","",0],["Write in Afaan Oromoo.","Afaan Oromootiin barreessi.","","",0],["How (by what means) did you come?","Maaliin dhufte?","","",0],["He eats with his hands.","Harkaan nyaata.","","",0]]}]},{"id":"postpositions","en":"Location words (postpositions)","om":"Jechoota bakkaa: irra, keessa, jala…","icon":"📦","level":2,"summary_en":"Words for 'on, in, under, behind, before, after' come after the noun, and can take -tti or -rraa.","summary_om":"Jechoota bakka fi yeroo ibsan maqaa booda dhufan.","sections":[{"h_en":"The main postpositions","h_om":"Maxxantoota ijoo","p_en":"Most come AFTER the noun. A few (gara, waa'ee, hanga) come BEFORE it.","table":{"head":["Afaan Oromoo","English","Example"],"rows":[["irra","on, over","minjaala irra – on the table"],["keessa","in, inside","mana keessa – in the house"],["jala","under","siree jala – under the bed"],["bira","beside; at someone's place","barsiisaa bira – at the teacher's"],["cinaa","next to","baankii cinaa – next to the bank"],["duuba","behind","mana duuba – behind the house"],["fuuldura","in front of","hoteela fuuldura – in front of the hotel"],["gidduu (also jidduu)","between, among","manneen lamaan gidduu – between the two houses"],["gubbaa","on top of","mana gubbaa – on the roof"],["naannoo","around, near","naannoo gabaa – around the market"],["dura / booda","before / after","nyaata dura – before the meal"],["malee","without, except","shukkaara malee – without sugar"],["waliin / wajjin","with","hiriyyaa koo waliin – with my friend"],["gara … (before noun)","towards","gara Finfinnee – towards Finfinne"],["waa'ee … (before noun)","about","waa'ee Oromoo – about the Oromo"],["hanga … (before noun)","until, as far as","hanga boruu – until tomorrow"]]}},{"h_en":"Adding -tti and -rraa","h_om":"-tti fi -rraa dabaluu","p_en":"Postpositions behave like nouns: add -tti for 'at/in' (keessatti, irratti, jalatti) and -rraa or a long vowel for 'from' (irraa, keessaa, jalaa, biraa). irra + -rraa is often written joined to the noun: minjaala irra = minjaalarra.","ex":[["Get out of the house.","Mana keessaa ba'i.","","",0],["Take it from the table.","Minjaala irraa fudhu.","","",0],["Look under the bed.","Siree jala ilaali.","","",0]]},{"h_en":"Time: dura, booda, keessatti","h_om":"Yeroo: dura, booda","p_en":"The same words work for time: hojii booda 'after work', nyaata dura 'before meals', waggaa lama dura 'two years ago', ji'a tokko keessatti 'within a month'.","ex":[["Wash your hands before eating.","Nyaata dura harka kee dhiqadhu.","","",0],["See you after work.","Hojii booda wal arginaa.","","",0]]},{"h_en":"With pronouns","h_om":"Bamaqaa waliin","p_en":"Postpositions follow the object form of pronouns: na bira 'next to me', si waliin 'with you', nu gidduu 'between us', isa duuba 'behind him', na malee 'without me'.","ex":[["Sit next to me.","Na bira taa'i.","","",0],["I drink coffee without sugar.","Buna shukkaara malee dhuga.","","",0]]},{"h_en":"Directions","h_om":"Kallattii","p_en":"mirga (right), bitaa (left), kallattiin (straight, directly), fuuldura (ahead), duuba (back). 'Turn left' = Gara bitaatti goradhu.","ex":[["We are going towards Finfinne.","Gara Finfinnee deemaa jirra.","","",0],["I'm reading a book about Oromo history.","Kitaaba waa'ee seenaa Oromoo dubbisaan jira.","","",0]]}]},{"id":"adjectives","en":"Adjectives and comparison","om":"Ibsa maqaa fi walbira qabuu","icon":"📏","level":2,"summary_en":"Adjectives follow the noun, agree in gender and number, and compare with irra / caalaa ('than, more than').","summary_om":"Ibsa maqaa: bakka, saala, baay'ina fi walbira qabuu (irra, caalaa, hunda caalaa).","sections":[{"h_en":"Position and use","h_om":"Bakka fi itti fayyadama","p_en":"An adjective comes right after its noun: mana guddaa 'a big house', nama gaarii 'a good person'. As a predicate it ends the sentence with the 'is' ending: Manni kun guddaadha. When the noun is the subject, the adjective takes the subject ending too: Namni dheeraan sun eenyu? 'Who is that tall man?'","ex":[["He bought a big house.","Mana guddaa bite.","","",0],["Who is that tall man?","Namni dheeraan sun eenyu?","","",0]]},{"h_en":"Masculine and feminine","h_om":"Dhiira fi dhalaa","p_en":"Many adjectives have a feminine form, used with feminine nouns and female persons. Typical changes: -aa → -oo or -tuu/-duu/-ttuu; -acha → -attii. Some (adii, gaarii, qulqulluu) never change.","table":{"head":["English","Masculine","Feminine"],"rows":[["big","guddaa","guddoo"],["small","xiqqaa","xiqqoo"],["tall, long","dheeraa","dheertuu"],["short","gabaabaa","gabaabduu"],["beautiful, handsome","bareedaa","bareedduu"],["fat","furdaa","furdoo"],["thin","qallaa","qalloo"],["red","diimaa","diimtuu"],["black","gurraacha","gurraattii"],["new","haaraa","haaroo"],["strong","jabaa","jabduu"],["clever, strong","cimaa","cimtuu"],["white / good","adii / gaarii","adii / gaarii"]]},"ex":[["This girl is beautiful.","Intalli tun bareedduudha.","","",0]]},{"h_en":"Plural adjectives","h_om":"Ibsa maqaa baay'inaa","p_en":"Many adjectives form a plural by repeating their first syllable (with a doubled consonant): guddaa → gurguddaa, xiqqaa → xixiqqaa, dheeraa → dhedheeraa, diimaa → diddiimaa, adii → adaadii, gaarii → gaggaarii, bareedaa → babbareedaa, jabaa → jajjabaa. Others take -oota (cimaa → cimoota). Using the singular adjective with a plural noun is also common: manneen guddaa.","ex":[["They have big houses.","Manneen gurguddaa qabu.","","",0]]},{"h_en":"Comparing: irra and caalaa","h_om":"Walbira qabuu: irra fi caalaa","p_en":"Oromo adjectives have no '-er' form. Say 'A B-from big': Caalaan Tolaa irra dheeraadha 'Chala is taller than Tola'. For extra clarity add caalaa ('exceeding'): Caalaan Tolaa caalaa dheeraadha.","ex":[["Chala is taller than Tola.","Caalaan Tolaa irra dheeraadha.","","",0],["Finfinne is bigger than Adama.","Finfinneen Adaamaa caalaa guddoodha.","","",0]]},{"h_en":"The most: hunda caalaa","h_om":"Hunda caalaa","p_en":"For the superlative compare with 'all': hunda caalaa or hunda irra. baay'ee / hedduu = 'very'.","ex":[["She is the tallest of all.","Isheen hunda caalaa dheertuudha.","","",0],["This is the best.","Kun hunda irra gaariidha.","","",0]]},{"h_en":"As … as, like","h_om":"Akka …","p_en":"akka (akkuma) = 'like, as': Inni akka abbaa isaa dheeraadha 'He is as tall as his father'. Adjectives also describe distance and time: karaa gabaabaa 'a short way, shortcut', yeroo dheeraa 'a long time'.","ex":[["He is as tall as his father.","Inni akka abbaa isaa dheeraadha.","","",0],["Do you know a shortcut?","Karaa gabaabaa beektaa?","","",0]]}]},{"id":"continuous_perfect","en":"Continuous and perfect tenses","om":"Yeroo itti fufaa fi xumuramaa","icon":"🔄","level":2,"summary_en":"Use -aa jira for 'is doing', -aa ture for 'was doing', -eera for 'has done' and -ee ture for 'had done'.","summary_om":"'Deemaa jira', 'deemaa ture', 'deemeera' fi 'deemee ture'.","sections":[{"h_en":"Present continuous: -aa jira","h_om":"Yeroo ammaa itti fufaa","p_en":"For an action in progress, add -aa to the stem and follow it with jira, which agrees with the subject. -chuu verbs use -chaa (nyaachaa, dubbachaa). With 'I', the focus -n is often attached: deemaan jira.","table":{"head":["Person","is going","is eating"],"rows":[["ani","deemaan jira","nyaachaan jira"],["ati","deemaa jirta","nyaachaa jirta"],["inni","deemaa jira","nyaachaa jira"],["isheen","deemaa jirti","nyaachaa jirti"],["nuti","deemaa jirra","nyaachaa jirra"],["isin","deemaa jirtu","nyaachaa jirtu"],["isaan","deemaa jiru","nyaachaa jiru"]]},"ex":[["What are you doing?","Maal hojjechaa jirta?","","",0],["I'm eating.","Nyaachaan jira.","","",0],["It's raining.","Roobni roobaa jira.","","",0]]},{"h_en":"Negative and past continuous","h_om":"Haalaa fi yeroo darbe itti fufaa","p_en":"Negative: -aa hin jiru / hin jirtu / hin jirru / hin jirtan / hin jiran. Past continuous: replace jira with ture / turte / turre / turtan / turan; negative -aa hin turre. Regional/variant: in the east you will also hear -utti jira and -aati jira (nyaachutti jira 'he is eating'); all three mean the same.","ex":[["He isn't working today.","Har'a hojjechaa hin jiru.","","",0],["When you called, I was sleeping.","Yeroo ati bilbilte, rafaa ture.","","",0]]},{"h_en":"Present perfect: -eera","h_om":"Yeroo xumuramaa: -eera","p_en":"For 'has done' (a past action that matters now) use the past form + -era / -iiru: deemeera 'I have / he has gone'.","table":{"head":["Person","has gone","has eaten"],"rows":[["ani","deemeera","nyaadheera"],["ati","deemteerta","nyaatteerta"],["inni","deemeera","nyaateera"],["isheen","deemteerti","nyaatteerti"],["nuti","deemneerra","nyaanneerra"],["isin","deemtaniirtu","nyaattaniirtu"],["isaan","deemaniiru","nyaataniiru"]]},"ex":[["Have you eaten?","Nyaatteertaa?","In speech also: Nyaatteeraa?","",0],["They have arrived.","Isaan dhufaniiru.","","",0]]},{"h_en":"Long perfect and past perfect","h_om":"-ee jira fi -ee ture","p_en":"An equivalent long form uses -ee + jira: deemee jira, deemtee jirta, deemnee jirra, deemanii jiru. Replace jira with ture for the past perfect 'had done'. The negative of the perfect is the negative past (hin deemne); 'not yet' adds ammallee.","ex":[["When I arrived, he had already left.","Yeroo ani ga'e, inni deemee ture.","","",0],["He hasn't come yet.","Ammallee hin dhufne.","","",0]]}]},{"id":"future","en":"Talking about the future","om":"Yeroo dhufu ibsuu","icon":"⏩","level":2,"summary_en":"Oromo has no separate future tense: use the present form with a time word, or -uuf jira for 'about to'.","summary_om":"Yeroo dhufuuf gochima yeroo ammaa fi jechoota yeroo fayyadamna; '-uuf jira' immoo waan dhihootti raawwatamuuf jiru ibsa.","sections":[{"h_en":"Present form + time word","h_om":"Yeroo ammaa + jecha yeroo","p_en":"The ordinary present (ni deema, nan dhufa) already covers the future. A time word or the context makes it clear. The negative is the normal present negative.","ex":[["I'll come tomorrow.","Boru nan dhufa.","","",0],["Next week we're going to Adama.","Torbaan dhufu Adaamaa deemna.","","",0],["I won't come tomorrow.","Boru hin dhufu.","","",0],["Next month she'll start a new job.","Ji'a dhufu hojii haaraa jalqabdi.","","",0]]},{"h_en":"About to: -uuf jira","h_om":"-uuf jira","p_en":"Infinitive + -f ('for') + jira means 'be about to, be going to (very soon)'. In the past, -uuf ture means 'was about to'.","ex":[["It's about to rain.","Roobuuf jira.","","",0],["I'm about to leave.","Deemuuf jira.","","",0],["I was about to call you.","Sitti bilbiluuf ture.","","",0]]},{"h_en":"Probably, maybe","h_om":"Tarii, ta'a","p_en":"Add ta'a ('it may be') after the verb, or start with tarii ('perhaps'). ta'uu danda'a = 'it is possible'.","ex":[["It will probably rain tomorrow.","Boru ni rooba ta'a.","","",0],["Perhaps he'll come tomorrow.","Tarii boru dhufa.","","",0]]},{"h_en":"Future time words","h_om":"Jechoota yeroo dhufuu","p_en":"boru (tomorrow), iftaan (the day after tomorrow), torbaan dhufu (next week), ji'a dhufu (next month), bara dhufu (next year), booda (later), yeroo dhihootti (soon), gara fuulduraatti (in the future)."},{"h_en":"Future in 'when/if' clauses","h_om":"Yeroo dhufu hima 'yoo' keessatti","p_en":"After yoo ('if, when') Oromo uses the PAST form even for future events: Yoo Finfinnee geesse, natti bilbili 'When you get to Finfinne, call me'. Regional/variant: some textbooks also use -uuf jiraachuu (deemuuf jiraadha) for a firm 'I will go'; you may meet it, but the plain present is more common.","ex":[["When you get to Finfinne, call me.","Yoo Finfinnee geesse, natti bilbili.","","",0],["In the future I want to be a doctor.","Gara fuulduraatti doktora ta'uu barbaada.","","",0]]}]},{"id":"become","en":"Ta'uu: to become, to be, to happen","om":"Ta'uu: ta'uu fi uumamuu","icon":"🌱","level":2,"summary_en":"ta'uu means 'become', supplies 'be' where -dha cannot (future, infinitive, commands), and means 'happen' in many everyday phrases.","summary_om":"Ta'uu: ta'uu, uumamuu fi 'haa ta'u'.","sections":[{"h_en":"Forms of ta'uu","h_om":"Bifa ta'uu","p_en":"ta'uu is a glottal-stop verb: before t and n the ' disappears and the a becomes long (taata, taane).","table":{"head":["Person","present","negative","past","negative past"],"rows":[["ani","ta'a","hin ta'u","ta'e","hin taane"],["ati","taata","hin taatu","taate","hin taane"],["inni","ta'a","hin ta'u","ta'e","hin taane"],["isheen","taati","hin taatu","taate","hin taane"],["nuti","taana","hin taanu","taane","hin taane"],["isin","taatu","hin taatan","taatan","hin taane"],["isaan","ta'u","hin ta'an","ta'an","hin taane"]]}},{"h_en":"'Be' in the future, infinitive and commands","h_om":"'Be' yeroo dhufuu fi ajaja keessatti","p_en":"-dha only works in the present. For 'will be', 'to be' and 'be!' use ta'uu: Doktora nan ta'a 'I will be a doctor', Barsiisaa ta'uu barbaada 'I want to be a teacher', Gaarii ta'i! 'Be good!' (pl. ta'aa).","ex":[["I want to be a teacher.","Barsiisaa ta'uu barbaada.","","",0],["Be good!","Gaarii ta'i!","","",0]]},{"h_en":"Has become: ta'eera, ta'ee jira","h_om":"Ta'eera","p_en":"The perfect means 'has become': Inni dureessa ta'eera 'He has become rich'; Isheen barsiistuu taateerti 'She has become a teacher'. The long form ta'ee jira means the same.","ex":[["He has become rich.","Inni dureessa ta'eera.","","",0]]},{"h_en":"Is becoming: ta'aa jira","h_om":"Ta'aa jira","p_en":"The continuous describes a gradual change.","ex":[["Food prices are getting expensive.","Gatiin nyaataa qaalii ta'aa jira.","","",0]]},{"h_en":"Everyday expressions","h_om":"Jechama guyyaa guyyaa","p_en":"Maal ta'e? / Maaltu ta'e? 'What happened?'; Maal si ta'e? 'What's wrong with you?'; Ni ta'a 'OK, it's possible'; Hin ta'u 'No, that won't do'; Haa ta'u 'All right, let it be'; Haa ta'u malee 'However'; Akkam ta'e? 'How did it go?'","ex":[["What happened?","Maaltu ta'e?","","",0],["Can we meet tomorrow? – Sure.","Boru wal arguu dandeenyaa? – Ni ta'a.","","",0]]}]},{"id":"negation","en":"Saying no: all the negatives","om":"Dhabamsa (haalaa)","icon":"🚫","level":2,"summary_en":"Oromo negates with hin before verbs and miti after nouns; this lesson brings all negative patterns together.","summary_om":"Hin, miti, hin turre, hin …ne fi jechoota haalaa homaa, eenyullee, gonkumaa.","sections":[{"h_en":"Overview","h_om":"Walumaagalaan","p_en":"Two words do almost all the work: hin (before a verb) and miti (after a noun or adjective).","table":{"head":["Pattern","Positive","Negative","English (negative)"],"rows":[["is (noun/adj.)","Barataadha.","Barataa miti.","He isn't a student."],["was (noun/adj.)","Barataa ture.","Barataa hin turre.","He wasn't a student."],["present","Ni deema.","Hin deemu.","He doesn't go."],["past","Deeme.","Hin deemne.","He didn't go."],["continuous","Deemaa jira.","Deemaa hin jiru.","He isn't going."],["perfect","Deemeera.","(Ammallee) hin deemne.","He hasn't gone (yet)."],["location / existence","Mana jira.","Mana hin jiru.","He isn't at home."],["have","Qaba.","Hin qabu.","He doesn't have."],["command","Deemi!","Hin deemin!","Don't go!"]]}},{"h_en":"Present negative endings","h_om":"Xumura haalaa yeroo ammaa","p_en":"Compared with the positive: -a → -u, -ta → -tu, -ti → -tu, -na → -nu, -tu → -tan, -u → -an. The past negative is simply hin + -ne for everyone (hin nyaanne, hin deebine, hin taane).","ex":[["I haven't eaten yet.","Ammallee hin nyaanne.","","",0]]},{"h_en":"Nothing, nobody, never","h_om":"Homaa, eenyullee, gonkumaa","p_en":"Negative words combine with hin (a double negative is normal): homaa 'anything / nothing', eenyullee 'anyone / no one', gonkumaa 'ever / never, not at all', kamiyyuu 'any (one) at all'. hin … malee means 'only' (lit. not … except).","ex":[["I don't know anything.","Homaa hin beeku.","","",0],["Nobody came.","Eenyullee hin dhufne.","","",0],["I never drink (alcohol).","Gonkumaa hin dhugu.","","",0],["I drink only tea.","Shaayii malee hin dhugu.","","",0]]},{"h_en":"Fail to, not do: baachuu and dhabuu","h_om":"Baachuu fi dhabuu","p_en":"infinitive + baate ('didn't do') is used especially in 'if' clauses: Yoo dhufuu baatte 'if you don't come'. dhabuu 'to lack, fail to' expresses 'couldn't': Isa argachuu dhabe 'I couldn't find him'.","ex":[["If you don't come, let me know.","Yoo dhufuu baatte, natti himi.","","",0],["I couldn't find him.","Isa argachuu dhabe.","","",0]]},{"h_en":"Negative questions","h_om":"Gaaffii haalaa","p_en":"Lengthen the final vowel as usual: Hin dhuftuu? 'Aren't you coming?' Maaliif + negative asks 'why don't…?': Maaliif hin nyaattu? 'Why don't you eat?'","ex":[["Why don't you eat?","Maaliif hin nyaattu?","","",0]]}]},{"id":"obligation_requests","en":"Must, need and polite requests","om":"Dirqama, barbaachisummaa fi gaaffii kabajaa","icon":"🙏","level":2,"summary_en":"Say 'must' with infinitive + qaba, 'need' with barbaachisa, and be polite with maaloo, mee and danda'uu.","summary_om":"'-uu qaba', '…barbaachisa', 'maaloo' fi 'mee'.","sections":[{"h_en":"Must, have to: -uu qaba","h_om":"-uu qaba","p_en":"Infinitive + the present of qabaachuu ('have'): Deemuu qaba 'I have to go'. qaba agrees with the subject (qabda, qabdi, qabna, qabdu, qabu). With 'I', the infinitive often takes -n: Deemuun qaba. In the past: deemuu qaba ture 'I had to go'. Negative: hin qabu = 'must not, should not'.","ex":[["I have to go now.","Amma deemuu qaba.","","",0],["You must take this medicine.","Dawaa kana fudhachuu qabda.","","",0],["You must not smoke here.","Asitti tamboo xuuxuu hin qabdu.","","",0]]},{"h_en":"Need: … barbaachisa","h_om":"… barbaachisa","p_en":"barbaachisa means 'is necessary to'. The person who needs is the object (na, si, isa…), and the thing needed is the subject; with plural things use barbaachisu.","ex":[["You need rest.","Boqonnaan si barbaachisa.","","",0],["What do you need?","Maal si barbaachisa?","","",0],["We need to learn Afaan Oromoo.","Afaan Oromoo barachuun nu barbaachisa.","","",0]]},{"h_en":"Duty: -uun narra jira","h_om":"-uun narra jira","p_en":"Another strong 'must' is 'X-ing is on me': infinitive + -n + narra jira (sirra, isarra, nurra…). Past: narra ture.","ex":[["I must finish this work.","Hojii kana xumuruun narra jira.","","",0]]},{"h_en":"Please and softeners","h_om":"Maaloo fi mee","p_en":"maaloo = please; mee = 'come on, just' (softens a request); dhiifama = excuse me, sorry; galatoomi = thank you (respect: galatoomaa). With elders, use plural (respect) commands.","ex":[["Please give me some water.","Maaloo, bishaan naa kenni.","","",0],["Come here a moment.","Mee as koottu.","","",0],["Please sit down. (respectful)","Maaloo, taa'aa.","","",0]]},{"h_en":"Asking politely: can you…? may I…?","h_om":"Gaaffii kabajaa","p_en":"Turn a request into a question with danda'uu ('to be able'): …dandeessaa? 'can you…?', …nan danda'aa? 'may I…?'. For borrowing: liqeeffachuu (money, food – things used up), ergifachuu (objects you give back).","ex":[["Can you help me?","Na gargaaruu dandeessaa?","","",0],["May I sit here?","Asitti taa'uu nan danda'aa?","","",0],["May I borrow your pen?","Qalama kee ergifachuu nan danda'aa?","","",0]]}]},{"id":"want_like_can","en":"Want, like, prefer and can","om":"Barbaaduu, jaallachuu, filachuu fi danda'uu","icon":"❤️","level":2,"summary_en":"Express wishes with barbaaduu, likes with jaallachuu, preferences with caalaa / wayya, and ability with danda'uu.","summary_om":"Fedhii, jaalala, filannoo fi dandeettii ibsuu.","sections":[{"h_en":"Want: barbaaduu","h_om":"Barbaaduu","p_en":"barbaaduu means 'to want' and also 'to look for'. Put the thing or the infinitive before it. Regional/variant: in eastern speech fedhuu (fedha, feeta) is the usual 'want', and barbaaduu means only 'look for'.","ex":[["I want water.","Bishaan barbaada.","","",0],["What do you want?","Maal barbaadda?","","",0],["I want to go home.","Mana deemuu barbaada.","","",0]]},{"h_en":"Like, love: jaallachuu","h_om":"Jaallachuu","p_en":"jaallachuu (also spelled jaalachuu) is a -chuu verb: jaalladha, jaallatta, jaallata, jaallatti, jaallanna, jaallattu, jaallatu.","ex":[["I like coffee.","Buna nan jaalladha.","","",0],["I like reading.","Dubbisuu jaalladha.","","",0],["She doesn't like meat.","Isheen foon hin jaallattu.","","",0]]},{"h_en":"Prefer: caalaa, filachuu, wayya","h_om":"Caalaa, filachuu, wayya","p_en":"Say 'A more-than B I like': Shaayii caalaa buna jaalladha 'I prefer coffee to tea'. filachuu = to choose, prefer: Kam filatta? 'Which do you prefer?' wayya = 'is better': Kun naaf wayya 'This is better for me'; Har'a deemuu wayya 'It's better to go today'.","ex":[["I prefer coffee to tea.","Shaayii caalaa buna jaalladha.","","",0],["Which do you prefer?","Kam filatta?","","",0],["It's better to go today.","Har'a deemuu wayya.","","",0]]},{"h_en":"Wanting someone else to act: akka","h_om":"Akka …","p_en":"To want SOMEONE to do something, use akka 'that' + a dependent verb. Dependent forms look like the negative present without hin: ani deemu, ati deemtu, inni deemu, isheen deemtu, nuti deemnu, isin deemtan, isaan deeman.","ex":[["I want you to come.","Akka dhuftu barbaada.","","",0],["Do you want him to go?","Akka inni deemu barbaaddaa?","","",0]]},{"h_en":"Can: danda'uu","h_om":"Danda'uu","p_en":"danda'uu follows the dhaga'uu pattern. Put the infinitive before it.","table":{"head":["Person","can","can't","could (past)"],"rows":[["ani","danda'a","hin danda'u","danda'e"],["ati","dandeessa","hin dandeessu","dandeesse"],["inni","danda'a","hin danda'u","danda'e"],["isheen","dandeessi","hin dandeessu","dandeesse"],["nuti","dandeenya","hin dandeenyu","dandeenye"],["isin","dandeessu","hin dandeessan","dandeessan"],["isaan","danda'u","hin danda'an","danda'an"]]},"ex":[["Can you speak Afaan Oromoo? – A little.","Afaan Oromoo dubbachuu dandeessaa? – Xiqqoo nan danda'a.","","",0],["I can't come today.","Har'a dhufuu hin danda'u.","","",0],["It's possible.","Ni danda'ama.","","",0]]},{"h_en":"Know how to: beekuu","h_om":"Beekuu","p_en":"For skills, beekuu 'to know' is often used: Konkolaataa oofuu beektaa? 'Can you (do you know how to) drive?'","ex":[["I can't swim.","Bishaan daakuu hin beeku.","","",0]]}]},{"id":"adverbs","en":"Adverbs: how, when, where, how often","om":"Ibsa gochimaa","icon":"🏃","level":2,"summary_en":"Adverbs usually stand just before the verb; many are formed from nouns and adjectives with -n or -tti.","summary_om":"Akkamitti, yoom, eessatti fi hammam akka raawwatame ibsuu.","sections":[{"h_en":"Position","h_om":"Bakka","p_en":"Adverbs normally come before the verb (and after the subject): Inni suuta deema 'He walks slowly'. Time adverbs can also start the sentence."},{"h_en":"Manner: how","h_om":"Haala","p_en":"suuta / suutaan (slowly), dafii / dafee (quickly, in a hurry), saffisaan (fast), sirriitti (properly, correctly), gaariitti (well), akkas (like that), akkasumaan (for nothing; just like that). Many are made with -n or -tti: jabina (strength) → jabinaan (strongly, hard), dhugaa (truth) → dhugaan (truly), gammachuu (joy) → gammachuun (happily).","ex":[["He walks slowly.","Inni suuta deema.","","",0],["Come quickly!","Dafii koottu!","","",0],["You speak Afaan Oromoo well.","Afaan Oromoo sirriitti dubbatta.","","",0]]},{"h_en":"Time: when","h_om":"Yeroo","p_en":"amma (now), ammuma (right now), har'a (today), kaleessa (yesterday), boru (tomorrow), duraan (before, previously), booda (later), ammas (again, still), ammallee (still; with a negative: not yet), hanga ammaatti (until now), kana booda (from now on)."},{"h_en":"Frequency: how often","h_om":"Irra deddeebii","p_en":"yeroo hunda (always), yeroo baay'ee (often), yeroo tokko tokko (sometimes), darbee darbee (now and then), gonkumaa + negative (never), al tokko (once), si'a lama (twice), guyyaa guyyaan (daily), torbaanitti al tokko (once a week).","ex":[["He always gets up early.","Yeroo hunda ganama ka'a.","","",0],["We sometimes drink coffee.","Yeroo tokko tokko buna dhugna.","","",0],["We meet once a week.","Torbaanitti al tokko wal argina.","","",0]]},{"h_en":"Place: where","h_om":"Bakka","p_en":"as / asi (here), achi (there), ala (outside), keessa (inside), ol (up), gad (down), fagoo (far), dhihoo (near). Common commands: Ol ka'i! 'Stand up!', Gad taa'i! 'Sit down!'","ex":[["Sit here.","As taa'i.","","",0]]},{"h_en":"Degree: how much","h_om":"Hammam","p_en":"baay'ee / hedduu (very, a lot), xiqqoo (a little), guutummaatti (completely), daran (even more), akkaan (extremely), hamma tokko (somewhat).","ex":[["I'm very happy.","Baay'ee gammadeera.","","",0]]}]},{"id":"time_calendar","en":"Time, days, months and the Ethiopian calendar","om":"Sa'aa, guyyoota, ji'oota fi dhaha Itoophiyaa","icon":"🕰️","level":2,"summary_en":"Tell time the Ethiopian way (the day starts at dawn), name the days and months, and understand the 13-month calendar.","summary_om":"Sa'aa akka lakkoofsa Itoophiyaatti, guyyoota torbanii, ji'oota fi waqtiilee.","sections":[{"h_en":"The Ethiopian clock","h_om":"Sa'aa Itoophiyaa","p_en":"In Ethiopia the day is counted from dawn, so the clock runs six hours 'behind' the Western one: 7 a.m. is sa'aa tokko (hour one), noon is sa'aa jaha, 6 p.m. is sa'aa kudha lama. The night count starts again at dusk: 7 p.m. is sa'aa tokko again. Rule of thumb: subtract (or add) six, and always add the part of the day (ganama, waaree, galgala, halkan) to avoid confusion. If you mean Western time, say so: akka lakkoofsa Awurooppaatti.","table":{"head":["Western time","Afaan Oromoo (Ethiopian time)"],"rows":[["7:00 a.m.","ganama sa'aa tokko"],["8:00 a.m.","ganama sa'aa lama"],["9:00 a.m.","ganama sa'aa sadii"],["12:00 noon","waaree, sa'aa jaha"],["3:00 p.m.","waaree booda sa'aa sagal"],["6:00 p.m.","galgala sa'aa kudha lama"],["8:00 p.m.","galgala sa'aa lama"],["12:00 midnight","halkan walakkaa (sa'aa jaha)"]]}},{"h_en":"Asking and telling the time","h_om":"Sa'aa gaafachuu fi himuu","p_en":"What time is it? = Sa'aatiin meeqa? (also Sa'aa meeqa?). 'At' a time takes -tti: sa'aa lamatti 'at two (8 a.m.)'. Minutes past the hour are added with fi: sa'aa sadii fi walakkaa 'half past three (9:30 a.m.)', sa'aa lamaa fi ruubii 'quarter past two (8:15 a.m.)', sa'aa lamaa fi daqiiqaa kudhan '8:10 a.m.'. Before the hour, say what is missing: sa'aa sadii jechuuf daqiiqaa kudhan hir'a 'ten to three (8:50 a.m.)'.","ex":[["What time is it? – It's 9:30 (Ethiopian 3:30).","Sa'aatiin meeqa? – Sa'aa sadii fi walakkaa.","","",0],["We start work at 8 a.m.","Ganama sa'aa lamatti hojii jalqabna.","","",0],["We'll meet at 1 p.m.","Waaree booda sa'aa torbatti wal argina.","","",0]]},{"h_en":"Parts of the day and nearby days","h_om":"Kutaa guyyaa fi guyyoota dhihoo","p_en":"barii / subii (dawn, early morning), ganama (morning), waaree (noon), waaree booda (afternoon), galgala (evening), halkan (night), halkan walakkaa (midnight). har'a (today), kaleessa (yesterday), dheengadda (day before yesterday), boru (tomorrow), iftaan (day after tomorrow), eda (last night), har'a galgala (this evening, tonight), torbaan (week), ji'a (month), waggaa / bara (year), barana (this year).","ex":[["Come in the evening.","Galgala koottu.","","",0]]},{"h_en":"Days of the week","h_om":"Guyyoota torbanii","p_en":"Days are capitalized. 'On Monday' is gaafa Wiixataa or simply Wiixata.","table":{"head":["English","Afaan Oromoo","Note"],"rows":[["Monday","Wiixata",""],["Tuesday","Qibxata","Also: Kibxata"],["Wednesday","Roobii","Also: Arbaa"],["Thursday","Kamisa",""],["Friday","Jimaata",""],["Saturday","Sanbata","Also: Sanbata Xiqqaa"],["Sunday","Dilbata","Also: Sanbata Guddaa"]]},"ex":[["Today is Thursday.","Har'a Kamisa.","","",0],["We don't work on Saturday.","Gaafa Sanbataa hin hojjennu.","","",0]]},{"h_en":"Months and the Ethiopian calendar","h_om":"Ji'oota fi dhaha Itoophiyaa","p_en":"The Ethiopian calendar, used for everyday dates, has 12 months of 30 days plus a short 13th month (5 days, 6 in a leap year). The year begins on 1 Fulbaana (11 September, or 12 September in some years) and its number is 7–8 years behind the Western year. The Oromo month names are used for these Ethiopian months; in other contexts (and in some books) the same names are used for the Western months, Amajjii = January and so on. Dates below are for a common year and can shift by one day.","table":{"head":["Month","Ethiopian month runs (approx.)","Western month of the same name"],"rows":[["Fulbaana","11 Sep – 10 Oct","September"],["Onkoloolessa","11 Oct – 9 Nov","October"],["Sadaasa","10 Nov – 9 Dec","November"],["Muddee","10 Dec – 8 Jan","December"],["Amajjii","9 Jan – 7 Feb","January"],["Guraandhala","8 Feb – 9 Mar","February"],["Bitootessa","10 Mar – 8 Apr","March"],["Ebla","9 Apr – 8 May","April"],["Caamsa","9 May – 7 Jun","May"],["Waxabajjii","8 Jun – 7 Jul","June"],["Adoolessa","8 Jul – 6 Aug","July"],["Hagayya","7 Aug – 5 Sep","August"],["Qaammee","6 – 10 Sep (13th month)","–"]]},"ex":[["The new year begins in Fulbaana.","Waggaan haaraan ji'a Fulbaanaa keessa jalqaba.","","",0]]},{"h_en":"Seasons","h_om":"Waqtiilee","p_en":"The seasons follow the rains rather than temperature: Ganna (June–August, main rainy season), Birraa (September–November, after the rains, flowers and harvest), Bona (December–February, dry season), Arfaasaa (March–May, short rains). Names and periods vary by region; some books call the December–February dry season Badheessa.","ex":[["The rainy season starts in June.","Ganni ji'a Waxabajjii keessa jalqaba.","","",0]]}]},{"id":"conjunctions","en":"Joining words: and, but, or, so","om":"Walqabsiistota: fi, garuu, yookiin, moo","icon":"🔗","level":3,"summary_en":"Link nouns with fi, sentences with -ee or -s, contrast with garuu / immoo, give options with yookiin / moo, and reasons with kanaafuu and sababa.","summary_om":"Fi, -s, garuu, yookiin, moo, kanaafuu fi sababa.","sections":[{"h_en":"And: fi, -s and -ee","h_om":"Fi, -s fi -ee","p_en":"fi joins nouns and noun phrases (the word before it lengthens its final vowel): Caalaa fi Tolaa, harkaa fi miila. For a list, put fi before the last item: buna, aannan fi daabboo. To join two actions done one after another, Oromo prefers the -ee form of the first verb ('having done'): Ka'ee deeme 'He got up and left' (she: Kaatee deemte; we: Kaanee deemne). -s on a word means 'also, and': Anis nan dhufa 'I'll come too'.","ex":[["He got up and left.","Ka'ee deeme.","","",0],["I'll come too.","Anis nan dhufa.","","",0],["Chala and Tola are both students.","Caalaa fi Tolaan lamaanuu barattoota.","","",0]]},{"h_en":"Even: -llee","h_om":"-llee","p_en":"-llee (also -illee after a consonant) means 'even, also': Anillee 'even I', Har'allee 'even today'. With a negative it reinforces the 'not'.","ex":[["He didn't come even today.","Har'allee hin dhufne.","","",0]]},{"h_en":"But: garuu, immoo","h_om":"Garuu, immoo","p_en":"garuu = 'but'. immoo (also ammoo) = 'but, whereas, as for', and is placed after the word it contrasts. haa ta'u malee = 'however'.","ex":[["I want to go, but I don't have time.","Deemuu barbaada, garuu yeroo hin qabu.","","",0],["I drink coffee, whereas he drinks tea.","Ani buna dhuga, inni immoo shaayii dhuga.","","",0]]},{"h_en":"Or: yookiin and moo","h_om":"Yookiin fi moo","p_en":"yookiin (also yookaan) = 'or' in statements and commands; yookiin … yookiin = 'either … or'. moo = 'or' in questions.","ex":[["I'll come today or tomorrow.","Har'a yookiin boru nan dhufa.","","",0],["Are you coming today or tomorrow?","Har'a moo boru dhufta?","","",0]]},{"h_en":"So and because","h_om":"Kanaafuu fi sababa","p_en":"kanaafuu / kanaaf = 'so, therefore'. 'Because' can be said several ways: waan … -f (Waan dhukkubsadheef 'because I was sick'), sababa … -tiin ('because of …'), sababni isaa … ('the reason is …').","ex":[["I'm sick, so I'm not going to work.","Dhukkubsadheera, kanaafuu hojii hin deemu.","","",0],["I didn't come because I was sick.","Waan dhukkubsadheef hin dhufne.","","",0],["He didn't come because of the rain.","Sababa roobaatiin hin dhufne.","","",0]]},{"h_en":"Also, moreover, besides","h_om":"Akkasumas, kana malees","p_en":"akkasumas (also, moreover), kana malees (besides this), lamaanuu (both), hundi isaanii (all of them). These help you build longer, connected texts."}]},{"id":"clauses","en":"When, if, after, while, until","om":"Yoo, yeroo, erga, osoo, hanga","icon":"🧵","level":3,"summary_en":"Subordinate clauses come before the main clause and use dependent verb forms; learn yeroo, yoo, erga, osoo/utuu and hanga.","summary_om":"Hima lama walitti hidhuu: yeroo, haala fi sababa ibsuu.","sections":[{"h_en":"Dependent verb forms","h_om":"Bifa gochimaa hirkataa","p_en":"Inside 'when / if / until / that' clauses the PRESENT has special dependent forms without ni; they look like the negative present minus hin. Past forms do not change. The subordinate clause normally comes first.","table":{"head":["Person","main clause","dependent clause"],"rows":[["ani","(nan) deema","… deemu"],["ati","(ni) deemta","… deemtu"],["inni","(ni) deema","… deemu"],["isheen","(ni) deemti","… deemtu"],["nuti","(ni) deemna","… deemnu"],["isin","(ni) deemtu","… deemtan"],["isaan","(ni) deemu","… deeman"]]}},{"h_en":"When: yeroo, gaafa","h_om":"Yeroo, gaafa","p_en":"yeroo ('time') introduces 'when' clauses: Yeroo ani dhufe … 'When I came …'. gaafa ('on the day') is similar and common for future events. With 'I', yeroo often takes -n: yeroon dhufu 'when I come'.","ex":[["When I came, you weren't there.","Yeroo ani dhufe, ati hin turre.","","",0],["When you have free time, read a book.","Yeroo boqonnaa qabdu, kitaaba dubbisi.","","",0],["I'll be happy when you come.","Gaafa dhuftu nan gammada.","","",0]]},{"h_en":"If: yoo","h_om":"Yoo","p_en":"yoo + PAST form = 'if / when' for real conditions, even about the future. Negative: yoo … hin -ne or yoo …-uu baate. For unreal conditions ('if I had known…') use osoo or utuu, with ture in the main clause.","ex":[["If it rains, we'll stay at home.","Yoo roobe, mana turra.","","",0],["If you get time, call me.","Yoo yeroo argatte, natti bilbili.","","",0],["If I had known, I would have come.","Osoo beekee, nan dhufa ture.","","",0]]},{"h_en":"After, since: erga","h_om":"Erga","p_en":"erga … booda = 'after'; erga alone = 'since'. (Eastern: eega.)","ex":[["After we ate, we left.","Erga nyaanne booda deemne.","","",0],["It's been two years since I came here.","Erga ani as dhufe waggaa lama ta'eera.","","",0]]},{"h_en":"While, before: osoo / utuu","h_om":"Osoo / utuu","p_en":"osoo (also utuu, odoo) + continuous = 'while': osoo … jirruu 'while we were …'. With a negative command-type form it means 'before / without': osoo hin deemin 'before going, without going'.","ex":[["While we were eating, the power went out.","Osoo nyaachaa jirruu, ibsaan dhaame.","","",0],["Tell me before you go.","Osoo hin deemin, natti himi.","","",0]]},{"h_en":"Until: hanga … -tti","h_om":"Hanga … -tti","p_en":"hanga (also hamma) + dependent verb + -tti = 'until': hanga ani deebi'utti 'until I come back'. With nouns: hanga boruu 'until tomorrow', hanga ammaatti 'until now'.","ex":[["Stay here until I come back.","Hanga ani deebi'utti as turi.","","",0]]}]},{"id":"verbal_nouns","en":"Infinitives and verbal nouns","om":"Maqaa gochimaa: -uu, -uun, -uuf","icon":"🧪","level":3,"summary_en":"The infinitive in -uu works as a noun: 'to go, going'. With endings it gives -uun (as subject), -uuf (in order to) and -uudhaan (by doing).","summary_om":"-uu, -uun, -uuf fi -uudhaan: gochima akka maqaatti fayyadamuu.","sections":[{"h_en":"Two verbs together","h_om":"Gochima lama walitti","p_en":"To say 'want to go', 'like reading', 'started working', put the infinitive BEFORE the conjugated verb. This is how English 'to …' and '-ing' after a verb are expressed.","ex":[["I want to go.","Deemuu barbaada.","","",0],["I like reading.","Dubbisuu jaalladha.","","",0],["He started working.","Hojjechuu jalqabe.","","",0],["She forgot to call.","Bilbiluu dagatte.","","",0]]},{"h_en":"As subject: -uun","h_om":"Akka raawwataatti: -uun","p_en":"When the verbal noun is the subject of the sentence, it takes the subject ending -n: Barachuun … 'Learning …'.","ex":[["Learning Afaan Oromoo is easy.","Afaan Oromoo barachuun salphaadha.","","",0],["Smoking is bad for your health.","Tamboo xuuxuun fayyaaf hamaadha.","","",0]]},{"h_en":"Purpose: -uuf","h_om":"Kaayyoo: -uuf","p_en":"-uuf = 'in order to, for …ing': Barachuuf dhufe 'He came to study'. Maal gochuuf? 'To do what? What for?'","ex":[["He came to study.","Barachuuf dhufe.","","",0],["She got up to drink water.","Bishaan dhuguuf kaate.","","",0]]},{"h_en":"Means: -uudhaan","h_om":"Karaa: -uudhaan","p_en":"-uudhaan (or -uun) = 'by …ing'.","ex":[["A language is learned by speaking it.","Afaan dubbachuudhaan baratama.","","",0]]},{"h_en":"With possessives","h_om":"Abbummaa waliin","p_en":"Verbal nouns take possessives like any noun: dhufuu kee 'your coming'. This gives natural ways to thank and to refer to actions.","ex":[["Thank you for coming.","Dhufuu keetiif galatoomi.","","",0]]}]},{"id":"derived_verbs","en":"Causative, passive and 'self' verbs","om
