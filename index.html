0],["My feet hurt.","Miilli koo na dhukkuba.","'feet' is the plural of 'foot'.","'feet' baay'ina 'foot' ti.",0]]}]},{"id":"articles","en":"Articles: a, an, the","om":"Jechoota 'a, an, the'","icon":"🅰️","level":1,"summary_en":"Afaan Oromoo has no articles – learn when English needs a/an, the, or nothing.","summary_om":"Afaan Oromoo jechoota 'a, an, the' hin qabu – yoom akka Ingiliffi a/an, the yookiin homaa akka barbaadu baradhu.","sections":[{"h_en":"Why articles are hard for Oromo speakers","h_om":"Maaliif 'a, an, the' Oromootaaf ulfaata","p_en":"Afaan Oromoo has no words like 'a', 'an' or 'the'. It shows 'the' with an ending (namicha = the man, intalattii = the girl) or with kun/sun, and 'a' with tokko (nama tokko = a man) – but often it uses nothing at all. English almost always needs an article before a singular countable noun. 'Ani barsiisaadha' is 'I am a teacher', never 'I am teacher'.","p_om":"Afaan Oromoo jechoota akka 'a', 'an' yookiin 'the' hin qabu. 'The' dhuma maqaatiin (namicha, intalattii) yookiin kun/suniin agarsiisa; 'a' immoo tokkoon (nama tokko) – garuu yeroo baay'ee homaa hin fayyadamu. Ingiliffi maqaa lakkaa'amu tokkichaa dura yeroo hunda jechoota kana keessaa tokko barbaada. 'Ani barsiisaadha' jechuun 'I am a teacher' jechuudha; 'I am teacher' gonkumaa miti."},{"h_en":"A or an?","h_om":"A moo an?","p_en":"Use 'a' or 'an' with one countable thing that is not specific, or when you say what someone or something is. Choose by the first SOUND, not the letter: 'a' before a consonant sound (a book, a university /yuu/, a one-way ticket /w/), 'an' before a vowel sound (an apple, an egg, an hour – h is silent, an umbrella).","p_om":"'A' yookiin 'an' wanta lakkaa'amu tokko kan addatti hin beekamne yookiin wanti tokko maal akka ta'e yeroo himnu fayyadami. Filannoon sagalee jalqabaa irratti hundaa'a, qubee irratti miti: sagalee dubbifamaa dura 'a' (a book, a university /yuu/, a one-way ticket /w/), sagalee dubbachiiftuu dura 'an' (an apple, an egg, an hour – h hin dubbifamu, an umbrella).","table":{"head":["a + consonant sound","an + vowel sound"],"rows":[["a car","an orange"],["a house","an hour"],["a uniform /yuu/","an umbrella"],["a European /yuu/","an engineer"],["a one-birr coin /w/","an MP3 /em/"]]}},{"h_en":"The","h_om":"The","p_en":"Use 'the' when the listener knows exactly which thing you mean: because you mentioned it before ('I saw a dog. The dog was black.'), because there is only one (the sun, the moon, the world, the president), or because the situation makes it clear ('Close the door, please'). Also: with superlatives (the best), the same, ordinal numbers (the first), rivers, seas and mountain ranges (the Nile, the Red Sea), and country names with 'Republic/States/Kingdom' (the USA, the UK).","p_om":"'The' yeroo dhaggeeffataan wanta kam akka jechaa jirtu sirriitti beeku fayyadami: waan duraan dubbatteef ('I saw a dog. The dog was black.'), waan tokkicha qofa ta'eef (the sun, the moon, the world, the president), yookiin haalli dubbii ifa waan godhuuf ('Close the door, please'). Akkasumas: ibsa hunda caalaa wajjin (the best), the same, lakkoofsa sadarkaa (the first), laggeen, galaanotaa fi tulluuwwan walitti aanan (the Nile, the Red Sea), akkasumas maqaa biyyoota 'Republic/States/Kingdom' qaban (the USA, the UK)."},{"h_en":"No article","h_om":"Homaa hin barbaachisu","p_en":"Use no article for general ideas with plural or uncountable nouns ('I like coffee.' 'Dogs are friendly.'), and with names of people, cities, most countries and languages (Tola, Adama, Ethiopia, Afaan Oromoo, English). Also in fixed phrases: have breakfast, go to school / to work / to bed / to church, at home, by bus.","p_om":"Yaada waliigalaa maqaa baay'inaa yookiin maqaa hin lakkaa'amne wajjin homaa hin fayyadamin ('I like coffee.' 'Dogs are friendly.'). Maqaa namootaa, magaalotaa, biyyoota baay'ee fi afaanotaa wajjinis homaa hin barbaachisu (Tola, Adama, Ethiopia, Afaan Oromoo, English). Jechama murtaa'oo keessattis: have breakfast, go to school / to work / to bed / to church, at home, by bus.","table":{"head":["Wrong / Dogoggora","Right / Sirrii"],"rows":[["I am teacher.","I am a teacher."],["She is engineer.","She is an engineer."],["The life is hard.","Life is hard."],["I go to the school by the bus.","I go to school by bus."],["Sun is very hot.","The sun is very hot."],["He speaks the English.","He speaks English."]]},"ex":[["I saw a dog. The dog was black.","Saree tokko arge. Sareen sun gurraacha ture.","First mention: a. Second mention: the.","Yeroo jalqabaa: a. Yeroo lammaffaa: the.",0],["She is a nurse.","Isheen narsiidha.","","",0],["The sun rises in the east.","Aduun baha irraa baati.","","",0],["I like coffee, but I don't like tea.","Buna nan jaalladha, garuu shaayii hin jaalladhu.","","",0],["He goes to school by bus.","Inni awtobisiin mana barumsaa deema.","","",0],["I arrived an hour ago.","Sa'aatii tokko dura ga'e.","","",0],["Close the door, please.","Maaloo balbala cufi.","","",0]]}]},{"id":"pronouns","en":"Pronouns and this / that","om":"Bamaqaa fi this / that","icon":"👥","level":1,"summary_en":"Subject and object pronouns, 'it', and the demonstratives this, that, these, those.","summary_om":"Bamaqaa raawwataa fi raawwatamaa, 'it', akkasumas this, that, these, those.","sections":[{"h_en":"Subject pronouns","h_om":"Bamaqaa raawwataa","p_en":"Subject pronouns come before the verb. English 'you' is used for one person and for many, and it is always polite – there is no separate respect form like 'isin'. English has 'it' for things and animals, while Afaan Oromoo uses inni or isheen. 'They' is for people and things, men and women.","p_om":"Bamaqaan raawwataa gochima dura dhufa. 'You' Ingiliffaa nama tokkoofis namoota baay'eefis tajaajila, yeroo hundas kabajaa qaba – akka 'isin' unka kabajaa addaa hin qabu. Ingiliffi wantootaa fi bineeldotaaf 'it' qaba; Afaan Oromoo garuu inni yookiin isheen fayyadama. 'They' namootaafis wantootaafis, dhiiraafis dubartiifis ni tajaajila.","table":{"head":["English","Afaan Oromoo"],"rows":[["I","ani"],["you (one person)","ati (respect: isin)"],["he","inni"],["she","isheen"],["it","(inni / isheen – for things)"],["we","nuti"],["you (many)","isin"],["they","isaan"]]}},{"h_en":"Object pronouns","h_om":"Bamaqaa raawwatamaa","p_en":"When the person receives the action, use the object form, after the verb or after a preposition: 'She helped me.' (Isheen na gargaarte.) 'Come with us.' (Nu wajjin kottu.) 'This is for him.' (Kun isaafi.) A common mistake is to use the subject form after 'and' or a preposition: say 'between you and me', 'My friend and I went' (subject), but 'They invited my friend and me' (object).","p_om":"Namni gochima sana yeroo fudhatu, unka raawwatamaa gochima yookiin durduubee booda fayyadami: 'She helped me.' (Isheen na gargaarte.) 'Come with us.' (Nu wajjin kottu.) 'This is for him.' (Kun isaafi.) Dogoggorri baramaan 'and' yookiin durduubee booda unka raawwataa fayyadamuudha: 'between you and me', 'My friend and I went' (raawwataa) jedhi; garuu 'They invited my friend and me' (raawwatamaa).","table":{"head":["Subject","Object","Afaan Oromoo (object)"],"rows":[["I","me","na / ana"],["you","you","si / isin"],["he","him","isa"],["she","her","ishee"],["it","it","isa / ishee"],["we","us","nu"],["they","them","isaan"]]}},{"h_en":"This, that, these, those","h_om":"This, that, these, those","p_en":"Use 'this' (one) and 'these' (many) for things near you; 'that' (one) and 'those' (many) for things far away. They can stand before a noun – 'this book' (kitaaba kana), 'those people' (namoota sana) – or alone as pronouns: 'This is my book.' (Kun kitaaba kooti.) Remember: English puts them before the noun, Afaan Oromoo after it. On the phone, English says 'This is Tola' to give your name.","p_om":"'This' (tokko) fi 'these' (baay'ee) wantoota sitti dhiyoo jiraniif; 'that' (tokko) fi 'those' (baay'ee) wantoota fagoo jiraniif fayyadami. Maqaa dura dhufuu danda'u – 'this book' (kitaaba kana), 'those people' (namoota sana) – yookiin kophaa isaanii bamaqaa ta'u: 'This is my book.' (Kun kitaaba kooti.) Yaadadhu: Ingiliffi isaan maqaa dura kaa'a, Afaan Oromoo immoo booda. Bilbila irratti Ingiliffi maqaa ofii himuuf 'This is Tola' jedha.","table":{"head":["","Near / Dhiyoo","Far / Fagoo"],"rows":[["One / Tokko","this – kun / kana","that – sun / sana"],["Many / Baay'ee","these – kunneen / kanneen","those – sunneen / sanneen"]]},"ex":[["She helped me with my homework.","Isheen hojii manaa koo irratti na gargaarte.","","",0],["We love them very much.","Nuti isaan baay'ee jaallanna.","","",0],["Can you come with us?","Nu wajjin dhufuu dandeessaa?","","",0],["Is this your phone?","Bilbilli kun kan keetii?","","",0],["These shoes are new, but those are old.","Kopheen kun haaraadha, kan sun garuu moofaadha.","","",0],["My friend and I went to the market.","Ani fi hiriyaan koo gabaa deemne.","Polite English puts the other person first: 'my friend and I'.","Ingiliffi kabajaa nama biraa dursa: 'my friend and I'.",0],["Hello, this is Tola. Can I speak to Lensa?","Haloo, ani Tolaadha. Lensaa wajjin dubbachuu nan danda'aa?","","",0]]}]},{"id":"possessives","en":"Possessives: my, mine, 's","om":"Abbummaa: my, mine, 's","icon":"🔑","level":1,"summary_en":"Possessive adjectives, possessive pronouns, 's and whose.","summary_om":"Ibsa abbummaa, bamaqaa abbummaa, 's fi whose.","sections":[{"h_en":"My, your, his, her…","h_om":"Koo, kee, isaa, ishee…","p_en":"Possessive adjectives come before the noun in English and after it in Afaan Oromoo: 'my house' – 'mana koo'. His/her depends on the owner, not on the thing: Tola's sister = his sister; Lensa's brother = her brother. 'Its' is for things and animals (The tree lost its leaves) – no apostrophe.","p_om":"Ibsi abbummaa Ingiliffa keessatti maqaa dura, Afaan Oromoo keessatti immoo maqaa booda dhufa: 'my house' – 'mana koo'. His/her abbaa wantichaa irratti hundaa'a, wanticha irratti miti: obboleettii Tolaa = his sister; obboleessa Lensaa = her brother. 'Its' wantootaa fi bineeldotaaf (The tree lost its leaves) – hudhaa malee.","table":{"head":["Subject","Possessive adjective","Afaan Oromoo"],"rows":[["I","my","koo / kiyya"],["you","your","kee"],["he","his","isaa"],["she","her","ishee"],["it","its","isaa / ishee"],["we","our","keenya"],["you (pl.)","your","keessan"],["they","their","isaanii"]]}},{"h_en":"Mine, yours, his, hers…","h_om":"Kan koo, kan kee, kan isaa…","p_en":"Possessive pronouns stand alone, without a noun after them – like Oromo 'kan koo': 'This pen is mine.' (Qalamni kun kan kooti.) 'Is this yours?' (Kun kan keetii?) Never add 's' with an apostrophe: 'yours', 'hers', 'ours', 'theirs'.","p_om":"Bamaqaan abbummaa kophaa isaa dhaabata, maqaan isa booda hin dhufu – akkuma 'kan koo' Afaan Oromoo: 'This pen is mine.' (Qalamni kun kan kooti.) 'Is this yours?' (Kun kan keetii?) Hudhaa (') wajjin 's' hin dabalin: 'yours', 'hers', 'ours', 'theirs'.","table":{"head":["Possessive pronoun","Afaan Oromoo"],"rows":[["mine","kan koo"],["yours","kan kee / kan keessan"],["his","kan isaa"],["hers","kan ishee"],["ours","kan keenya"],["theirs","kan isaanii"]]}},{"h_en":"'s and s'","h_om":"'s fi s'","p_en":"To say who owns something, add 's to a person or animal: Tola's book (kitaaba Tolaa), the teacher's car (konkolaataa barsiisaa). For a plural ending in s, add only the apostrophe: the students' books. Irregular plurals take 's: the children's room. For things, English often uses 'of' or a compound noun: the door of the house / the house door. Note: in Qubee the apostrophe is a sound (the glottal stop in ta'uu); in English it is silent.","p_om":"Abbaa wanta tokkoo agarsiisuuf, nama yookiin bineensa irratti 's dabali: Tola's book (kitaaba Tolaa), the teacher's car (konkolaataa barsiisaa). Maqaa baay'inaa s'n xumurame irratti hudhaa qofa dabali: the students' books. Baay'inni seera hin eegne 's fudhata: the children's room. Wantootaaf Ingiliffi yeroo baay'ee 'of' yookiin maqaa walitti makame fayyadama: the door of the house / the house door. Hubachiisa: Qubee keessatti hudhaan sagalee (ta'uu keessatti); Ingiliffa keessatti garuu hin dubbifamu."},{"h_en":"Whose?","h_om":"Kan eenyuu?","p_en":"Ask about the owner with 'whose': 'Whose bag is this?' (Boorsaan kun kan eenyuuti?) – 'It's Abdi's.' (Kan Abdiiti.) Don't confuse 'whose' with 'who's' (= who is).","p_om":"Abbaa wantaa gaafachuuf 'whose' fayyadami: 'Whose bag is this?' (Boorsaan kun kan eenyuuti?) – 'It's Abdi's.' (Kan Abdiiti.) 'Whose' fi 'who's' (= who is) walitti hin makin.","ex":[["This is my house, and that is my brother's house.","Kun mana kooti; sun immoo mana obboleessa kooti.","","",0],["Lensa lives with her parents.","Lensaan maatii ishee wajjin jiraatti.","","",0],["Is this pen yours or mine?","Qalamni kun kan keeti moo kan kooti?","","",0],["Our teacher's name is Gemechu.","Maqaan barsiisaa keenyaa Gammachuu jedhama.","","",0],["Whose phone is ringing?","Bilbilli eenyuu bilbilaa jira?","","",0],["The students' books are on the desk.","Kitaabonni barattootaa minjaala irra jiru.","","",0],["The cat is eating its food.","Adurreen nyaata ishee nyaachaa jirti.","'its' has no apostrophe.","'its' hudhaa hin qabu.",0]]}]},{"id":"to_be","en":"To be: am, is, are, was, were; there is / there are","om":"Gochima 'be': am, is, are, was, were; there is / are","icon":"🧩","level":1,"summary_en":"The verb 'be' in the present and past, with adjectives, places and ages, and 'there is / there are'.","summary_om":"Gochima 'be' yeroo ammaa fi darbe keessatti, ibsa, bakka fi umurii wajjin, akkasumas 'there is / there are'.","sections":[{"h_en":"Am, is, are","h_om":"Am, is, are","p_en":"Afaan Oromoo attaches -dha to the word (Ani barataadha) or uses nothing after a short -a (Kun mana). English always needs a separate verb 'be', and it changes with the subject: I am, you/we/they are, he/she/it is. In speech we use short forms: I'm, you're, he's, she's, it's, we're, they're.","p_om":"Afaan Oromoo jecha irratti -dha maxxansa (Ani barataadha) yookiin -a gabaabaa booda homaa hin dabalu (Kun mana). Ingiliffi garuu yeroo hunda gochima 'be' addaa barbaada; innis raawwataa wajjin jijjiirama: I am, you/we/they are, he/she/it is. Dubbii keessatti unka gabaabaa fayyadamna: I'm, you're, he's, she's, it's, we're, they're.","table":{"head":["English","Short form","Afaan Oromoo"],"rows":[["I am a student.","I'm a student.","Ani barataadha."],["You are tall.","You're tall.","Ati dheeraadha."],["He is a doctor.","He's a doctor.","Inni doktora."],["She is happy.","She's happy.","Isheen gammadduudha."],["It is a house.","It's a house.","Kun mana."],["We are friends.","We're friends.","Nuti hiriyoota."],["They are at home.","They're at home.","Isaan mana jiru."]]}},{"h_en":"Negatives and questions","h_om":"Dhabamsaa fi gaaffii","p_en":"Make the negative with 'not' after be: I'm not, he isn't (is not), they aren't (are not). Oromo uses 'miti': 'Ani barsiisaa miti' = 'I'm not a teacher.' For a question, put the verb first: 'Is he a doctor?' 'Are you ready?' Short answers: 'Yes, he is.' 'No, I'm not.'","p_om":"Dhabamsa 'be' booda 'not' dabaluun uumi: I'm not, he isn't (is not), they aren't (are not). Afaan Oromoo 'miti' fayyadama: 'Ani barsiisaa miti' = 'I'm not a teacher.' Gaaffiif gochima jalqabatti fidi: 'Is he a doctor?' 'Are you ready?' Deebii gabaabaa: 'Yes, he is.' 'No, I'm not.'"},{"h_en":"Be for places and ages","h_om":"'Be' bakkaa fi umuriif","p_en":"Afaan Oromoo uses 'jira' for location (Inni waajjira keessa jira). English uses be: 'He is in the office.' 'Where is the bank? – It's next to the post office.' English also uses be for age: 'I am 20 (years old).' Don't say 'I have 20 years'.","p_om":"Afaan Oromoo bakkaaf 'jira' fayyadama (Inni waajjira keessa jira). Ingiliffi 'be' fayyadama: 'He is in the office.' 'Where is the bank? – It's next to the post office.' Ingiliffi umuriifis 'be' fayyadama: 'I am 20 (years old).' 'I have 20 years' hin jedhin."},{"h_en":"Be + adjective where Oromo uses a verb","h_om":"Be + ibsa maqaa bakka Afaan Oromoo gochima fayyadamu","p_en":"Many feelings and states are verbs in Afaan Oromoo: beela'eera (I'm hungry), dheebodheera (I'm thirsty), dadhabeera (I'm tired), gammadeera (I'm happy). In English they are adjectives with 'be': I'm hungry, I'm thirsty, I'm tired, I'm happy, I'm late, I'm afraid. Don't translate the Oromo verb directly ('I hungered').","p_om":"Miirri fi haalli baay'een Afaan Oromoo keessatti gochima: beela'eera, dheebodheera, dadhabeera, gammadeera. Ingiliffa keessatti immoo ibsa maqaa 'be' wajjin dhufaniidha: I'm hungry, I'm thirsty, I'm tired, I'm happy, I'm late, I'm afraid. Gochima Oromoo kallattiin hin hiikin ('I hungered' miti)."},{"h_en":"Was and were","h_om":"Was fi were","p_en":"In the past, be has two forms: I/he/she/it was, you/we/they were. Oromo uses ture/turte/turre/turan: 'Ani barataa ture' = 'I was a student.' Negative: wasn't, weren't. Questions: 'Were you at home yesterday?' 'Was it expensive?'","p_om":"Yeroo darbe keessatti 'be' unka lama qaba: I/he/she/it was, you/we/they were. Afaan Oromoo ture/turte/turre/turan fayyadama: 'Ani barataa ture' = 'I was a student.' Dhabamsa: wasn't, weren't. Gaaffii: 'Were you at home yesterday?' 'Was it expensive?'"},{"h_en":"There is / there are","h_om":"There is / there are","p_en":"To say that something exists, Oromo uses 'jira/jiru': 'Mana barumsaa bira kiliinikiin tokko jira.' English uses 'there is' (one, or uncountable) and 'there are' (plural): 'There is a clinic near the school.' 'There are 30 students in the class.' Don't use 'it has' for this. Negative: there isn't / there aren't / there's no…; question: Is there…? Are there…?; past: there was / there were.","p_om":"Wanti tokko akka jiru himuuf Afaan Oromoo 'jira/jiru' fayyadama: 'Mana barumsaa bira kiliinikiin tokko jira.' Ingiliffi 'there is' (tokkichaa yookiin wanta hin lakkaa'amne) fi 'there are' (baay'ina) fayyadama: 'There is a clinic near the school.' 'There are 30 students in the class.' Kanaaf 'it has' hin fayyadamin. Dhabamsa: there isn't / there aren't / there's no…; gaaffii: Is there…? Are there…?; yeroo darbe: there was / there were.","ex":[["I'm not a teacher; I'm a student.","Ani barsiisaa miti; barataadha.","","",0],["Are you tired? – Yes, I am.","Dadhabdeettaa? – Eeyyee, dadhabeera.","","",0],["Where is the bank? – It's next to the post office.","Baankiin eessa jira? – Poostaa cinaa jira.","","",0],["I'm hungry. Is there any food?","Beela'eera. Nyaanni jiraa?","","",0],["We were at the wedding yesterday.","Nuti kaleessa cidha irra turre.","","",0],["There are thirty students in our class.","Daree keenya keessa barattoonni soddoma jiru.","","",0],["There was no water in the village.","Ganda sana keessa bishaan hin turre.","","",0],["My son is seven years old.","Ilmi koo waggaa torba.","","",0]]}]},{"id":"have_got","en":"Have, has and have got","om":"Have, has fi have got","icon":"🎒","level":1,"summary_en":"Talking about possession, family and illnesses with have/has (got), and 'have' for actions.","summary_om":"Qabeenya, maatii fi dhukkuba have/has (got)'n ibsuu, akkasumas 'have' gocha agarsiisu.","sections":[{"h_en":"Have and has","h_om":"Have fi has","p_en":"'Have' is like Oromo 'qabaachuu' (nan qaba, ni qabda…). Use 'has' with he, she and it; 'have' with all the others. It is used for things you own, family, body features and illnesses: 'I have two brothers.' 'She has long hair.' 'He has a headache.'","p_om":"'Have' akka 'qabaachuu' Afaan Oromooti (nan qaba, ni qabda…). He, she fi it wajjin 'has', kan hafan wajjin 'have' fayyadami. Wantoota qabdu, maatii, bifa qaamaa fi dhukkubaaf fayyada: 'I have two brothers.' 'She has long hair.' 'He has a headache.'","table":{"head":["English","Afaan Oromoo"],"rows":[["I have","nan qaba"],["you have","ni qabda"],["he has","ni qaba"],["she has","ni qabdi"],["we have","ni qabna"],["you (pl.) have","ni qabdu"],["they have","ni qabu"]]}},{"h_en":"Negatives and questions","h_om":"Dhabamsaa fi gaaffii","p_en":"With the normal verb 'have', use do/does: 'I don't have a car.' 'Does she have a phone?' – 'Yes, she does.' After 'doesn't' and 'does' use 'have', not 'has': 'He doesn't have time.' Oromo uses 'hin qabu' for all of these.","p_om":"Gochima idilee 'have' wajjin do/does fayyadami: 'I don't have a car.' 'Does she have a phone?' – 'Yes, she does.' 'Doesn't' fi 'does' booda 'have' fayyadami, 'has' miti: 'He doesn't have time.' Afaan Oromoo hunda isaaniif 'hin qabu' fayyadama."},{"h_en":"Have got (British English)","h_om":"Have got (Ingiliffa Biriteenii)","p_en":"In British English, 'have got' means the same as 'have' for possession: 'I've got a car.' 'Have you got a pen?' 'She hasn't got any brothers.' Here the question and negative use have/has, not do. Americans mostly say 'have' ('Do you have a pen?'), but both are correct and you will hear both.","p_om":"Ingiliffa Biriteenii keessatti 'have got' qabeenyaaf hiika 'have' wajjin tokko qaba: 'I've got a car.' 'Have you got a pen?' 'She hasn't got any brothers.' Asitti gaaffii fi dhabamsi have/has fayyadamu, do miti. Ameerikaanonni yeroo baay'ee 'have' jedhu ('Do you have a pen?'); lamaan isaaniiyyuu sirriidha, lachuu ni dhageessa."},{"h_en":"Have for actions","h_om":"'Have' gocha agarsiisu","p_en":"'Have' is also used for many everyday actions, where Oromo uses a different verb: have breakfast / lunch / dinner (ciree / laaqana / irbaata nyaachuu), have a shower (dhiqachuu), have a rest (boqochuu), have a meeting (walgahii qabaachuu), have a good time (yeroo gaarii dabarsuu), have a baby (da'uu). With these meanings, continuous forms are fine: 'I'm having lunch now.' (But never 'I'm having a car'.) Past: had – 'We had a great time.'","p_om":"'Have' gochaawwan guyyaa guyyaa baay'eef ni fayyada; Afaan Oromoo garuu gochima biraa fayyadama: have breakfast / lunch / dinner (ciree / laaqana / irbaata nyaachuu), have a shower (dhiqachuu), have a rest (boqochuu), have a meeting (walgahii qabaachuu), have a good time (yeroo gaarii dabarsuu), have a baby (da'uu). Hiika kanaan unkaan -ing ni danda'ama: 'I'm having lunch now.' ('I'm having a car' garuu gonkumaa miti.) Yeroo darbe: had – 'We had a great time.'","ex":[["I have two brothers and one sister.","Ani obboleessa lama fi obboleettii tokko qaba.","","",0],["Does your father have a car? – No, he doesn't.","Abbaan kee konkolaataa qabaa? – Lakki, hin qabu.","","",0],["He has a headache.","Mataan isa dhukkuba.","","",0],["Have you got a pen? – Yes, I have.","Qalama qabdaa? – Eeyyee, nan qaba.","","",0],["We have breakfast at seven o'clock.","Nuti sa'aatii tokko ganamaa ciree nyaanna.","7:00 a.m. is sa'aatii 1 in Ethiopian time.","Sa'aatii 7 ganamaa = sa'aatii 1 lakkoofsa Itoophiyaatiin.",0],["They had a meeting yesterday afternoon.","Isaan kaleessa waaree booda walgahii taa'an.","","",0]]}]},{"id":"present_simple","en":"Present simple","om":"Yeroo ammaa salphaa","icon":"🔁","level":1,"summary_en":"Habits, facts and timetables; -s for he/she/it; do/does in questions and negatives; adverbs of frequency.","summary_om":"Amala, dhugaa fi sagantaa; -s he/she/it'f; do/does gaaffii fi dhabamsa keessatti; jechoota 'meeqa yeroo' agarsiisan.","sections":[{"h_en":"When we use it","h_om":"Yoom fayyadamna","p_en":"Use the present simple for habits and routines (I get up at six), facts and general truths (Water boils at 100 °C; The sun rises in the east), permanent situations (She works in a bank), and timetables (The bus leaves at 8:30). It is also used in short exclamations with 'here' and 'there': 'Here comes the bus!' Afaan Oromoo uses the ni-form for all of these – and also for the future, which English does not do (see the Future lesson).","p_om":"Yeroo ammaa salphaa amalaa fi sirna guyyaa guyyaaf (I get up at six), dhugaa fi dhugaa waliigalaatiif (Bishaan digrii 100tti ni danfa; Aduun baha irraa baati), haala dhaabbataaf (She works in a bank), akkasumas sagantaa yeroof (The bus leaves at 8:30) fayyadami. Himoota gabaabaa 'here' fi 'there' wajjin dhufan keessattis ni fayyada: 'Here comes the bus!' Afaan Oromoo hunda isaaniif unka 'ni' fayyadama – yeroo dhufuufis; Ingiliffi garuu akkas hin godhu (barnoota Yeroo Dhufu ilaali)."},{"h_en":"Form: add -s for he, she, it","h_om":"Unka: he, she, it'f -s dabali","p_en":"The verb is the same for all persons except he/she/it, which add -s or -es. Afaan Oromoo changes the verb for almost every person; English changes it only once – but learners often forget that one -s! Spelling: go → goes, watch → watches, study → studies, have → has.","p_om":"Gochimni he/she/it malee raawwataa hundaaf tokkuma; he/she/it immoo -s yookiin -es dabalu. Afaan Oromoo gochima raawwataa hundaaf jechuun ni jijjiira; Ingiliffi al tokko qofa jijjiira – garuu barattoonni -s tokko kana yeroo baay'ee ni dagatu! Barreeffama: go → goes, watch → watches, study → studies, have → has.","table":{"head":["English","Afaan Oromoo (hojjechuu)"],"rows":[["I work","nan hojjedha"],["you work","ni hojjetta"],["he works","ni hojjeta"],["she works","ni hojjetti"],["it works","ni hojjeta / ni hojjetti"],["we work","ni hojjenna"],["you (pl.) work","ni hojjettu"],["they work","ni hojjetu"]]}},{"h_en":"Negatives: don't / doesn't","h_om":"Dhabamsa: don't / doesn't","p_en":"Afaan Oromoo puts 'hin' before the verb (hin hojjedhu). English puts don't (do not) or doesn't (does not) before the base verb. After doesn't the verb has no -s: 'She doesn't work here' – not 'doesn't works'.","p_om":"Afaan Oromoo gochima dura 'hin' kaa'a (hin hojjedhu). Ingiliffi gochima bu'uuraa dura don't (do not) yookiin doesn't (does not) kaa'a. Doesn't booda gochimni -s hin qabu: 'She doesn't work here' – 'doesn't works' miti.","table":{"head":["Positive","Negative","Afaan Oromoo"],"rows":[["I eat meat.","I don't eat meat.","Ani foon hin nyaadhu."],["He drinks coffee.","He doesn't drink coffee.","Inni buna hin dhugu."],["They live here.","They don't live here.","Isaan asitti hin jiraatan."]]}},{"h_en":"Questions: do / does","h_om":"Gaaffii: do / does","p_en":"Afaan Oromoo makes a question with the voice: 'Ni hojjettaa?' English puts Do/Does before the subject and uses the base verb: 'Do you work here?' 'Does he speak English?' Short answers: 'Yes, I do.' 'No, he doesn't.' With question words: 'Where do you live?' 'What time does the shop open?'","p_om":"Afaan Oromoo gaaffii sagaleedhaan uuma: 'Ni hojjettaa?' Ingiliffi raawwataa dura Do/Does kaa'ee gochima bu'uuraa fayyadama: 'Do you work here?' 'Does he speak English?' Deebii gabaabaa: 'Yes, I do.' 'No, he doesn't.' Jechoota gaaffii wajjin: 'Where do you live?' 'What time does the shop open?'"},{"h_en":"How often? Adverbs of frequency","h_om":"Meeqa yeroo? Jechoota irra deddeebii agarsiisan","p_en":"Adverbs of frequency say how often something happens. They go before the main verb but after 'be': 'I always walk to work.' 'She is never late.' Careful with 'never': English uses a positive verb (I never drink coffee), while Afaan Oromoo uses gonkumaa with a negative verb (Ani gonkumaa buna hin dhugu). Longer expressions go at the end: every day, once a week, twice a month, three times a year.","p_om":"Jechoonni kun wanti tokko meeqa yeroo akka raawwatamu himu. Gochima ijoo dura, garuu 'be' booda dhufu: 'I always walk to work.' 'She is never late.' 'Never' irratti of eeggadhu: Ingiliffi gochima mirkaneessaa fayyadama (I never drink coffee), Afaan Oromoo garuu gonkumaa gochima dhabamsaa wajjin fayyadama (Ani gonkumaa buna hin dhugu). Jechamoonni dhedheeroon dhumatti dhufu: every day, once a week, twice a month, three times a year.","table":{"head":["English","%","Afaan Oromoo"],"rows":[["always","100%","yeroo hunda"],["usually","~90%","yeroo baay'ee (akka amalaatti)"],["often","~70%","yeroo baay'ee, irra deddeebi'ee"],["sometimes","~50%","yeroo tokko tokko, darbee darbee"],["rarely / seldom","~10%","yeroo muraasa"],["never","0%","gonkumaa … hin"],["every day","","guyyaa guyyaan"],["once a week","","torbanitti al tokko"],["twice a month","","ji'atti al lama"]]},"ex":[["My father works in a hospital.","Abbaan koo hospitaala keessatti hojjeta.","","",0],["Water boils at 100 degrees.","Bishaan digrii 100tti ni danfa.","","",0],["She doesn't eat meat on Wednesdays.","Isheen Roobii foon hin nyaattu.","","",0],["Do you speak Afaan Oromoo? – Yes, I do.","Afaan Oromoo ni dubbattaa? – Eeyyee, nan dubbadha.","","",0],["What time does the bus leave?","Awtobisiin sa'aatii meeqatti ka'a?","","",0],["I usually walk to work, but sometimes I take a taxi.","Yeroo baay'ee miilaan hojii nan deema, yeroo tokko tokko garuu taaksii nan fudhadha.","","",0],["He never drinks alcohol.","Inni gonkumaa dhugaatii alkoolii hin dhugu.","English: never + positive verb.","Ingiliffa: never + gochima mirkaneessaa.",0],["Here comes the bus!","Awtobisiin kunoo dhufaa jira!","","",0]]}]},{"id":"present_continuous","en":"Present continuous","om":"Yeroo ammaa itti fufaa","icon":"⏳","level":1,"summary_en":"am/is/are + -ing for actions happening now or around now, and verbs that are not used in the -ing form.","summary_om":"am/is/are + -ing gocha amma yookiin yeroo kana raawwatamaa jiruuf, akkasumas gochimoota unka -ing hin fudhanne.","sections":[{"h_en":"Form: am / is / are + verb-ing","h_om":"Unka: am / is / are + gochima-ing","p_en":"Afaan Oromoo uses the verb + -aa and 'jira': 'Ani barreessaa jira.' English uses am/is/are + the -ing form: 'I am writing.' Negative: 'I'm not writing.' 'She isn't sleeping.' Question: 'Are you listening?' 'What is he doing?'","p_om":"Afaan Oromoo gochima + -aa fi 'jira' fayyadama: 'Ani barreessaa jira.' Ingiliffi am/is/are + unka -ing fayyadama: 'I am writing.' Dhabamsa: 'I'm not writing.' 'She isn't sleeping.' Gaaffii: 'Are you listening?' 'What is he doing?'","table":{"head":["English","Afaan Oromoo"],"rows":[["I am eating.","Ani nyaachaa jira."],["You are eating.","Ati nyaachaa jirta."],["He is eating.","Inni nyaachaa jira."],["She is eating.","Isheen nyaachaa jirti."],["We are eating.","Nuti nyaachaa jirra."],["They are eating.","Isaan nyaachaa jiru."]]}},{"h_en":"When we use it","h_om":"Yoom fayyadamna","p_en":"Use it for actions happening now (Rosa is cooking), for temporary situations around now (I'm learning English this year; He's staying with his uncle this month), for changing situations (Prices are going up), and for fixed future plans (We're visiting Harar next week). With 'always' it can show an annoying habit: 'He's always losing his keys!'","p_om":"Gocha amma raawwatamaa jiruuf (Rosa is cooking), haala yeroo murtaa'eef (I'm learning English this year; He's staying with his uncle this month), haala jijjiiramaa jiruuf (Prices are going up), akkasumas karoora yeroo dhufuu murtaa'eef (We're visiting Harar next week) fayyadami. 'Always' wajjin amala nama aarsu agarsiisuu danda'a: 'He's always losing his keys!'"},{"h_en":"Spelling of -ing","h_om":"Barreeffama -ing","p_en":"Most verbs just add -ing (read → reading). Drop a final silent e (make → making, write → writing). Double the last consonant after one short stressed vowel (sit → sitting, run → running, begin → beginning). Change ie to y (lie → lying, die → dying). Keep y (study → studying).","p_om":"Gochimoonni baay'een -ing qofa dabalu (read → reading). E callistuu dhumaa haqi (make → making, write → writing). Dubbachiiftuu gabaabaa fi cimaa tokko booda dubbifamaa dhumaa dachaa godhi (sit → sitting, run → running, begin → beginning). ie gara y jijjiiri (lie → lying, die → dying). y akkuma jirutti dhiisi (study → studying)."},{"h_en":"Verbs not usually used with -ing","h_om":"Gochimoota yeroo baay'ee -ing hin fudhanne","p_en":"Some verbs describe states, not actions, and are normally used in the simple form: know, understand, believe, remember, like, love, hate, want, need, prefer, own, belong, seem, mean. Say 'I know' (Nan beeka), not 'I am knowing'; 'I understand', not 'I am understanding'. Some verbs change meaning: 'I think it's good' (opinion) vs 'I'm thinking about it' (process); 'She has a car' vs 'She's having lunch'.","p_om":"Gochimoonni tokko tokko haala ibsu malee gocha hin ibsan; kanaaf yeroo baay'ee unka salphaan dhufu: know, understand, believe, remember, like, love, hate, want, need, prefer, own, belong, seem, mean. 'I know' (Nan beeka) jedhi, 'I am knowing' miti; 'I understand' jedhi, 'I am understanding' miti. Gochimoonni tokko tokko hiika jijjiiru: 'I think it's good' (yaada) fi 'I'm thinking about it' (yaadaa jira); 'She has a car' fi 'She's having lunch'."},{"h_en":"Present simple or continuous?","h_om":"Ammaa salphaa moo itti fufaa?","p_en":"Present simple = always, usually, in general. Present continuous = now, these days, temporary. 'I work in a bank, but this week I'm working from home.' 'She speaks four languages, and right now she's speaking French.'","p_om":"Ammaa salphaa = yeroo hunda, yeroo baay'ee, waliigalaan. Ammaa itti fufaa = amma, guyyoota kana, yeroof. 'I work in a bank, but this week I'm working from home.' 'She speaks four languages, and right now she's speaking French.'","ex":[["Be quiet – the baby is sleeping.","Callisaa – daa'imni rafaa jira.","","",0],["What are you doing? – I'm writing a letter.","Maal gochaa jirta? – Xalayaa barreessaa jira.","","",0],["We're learning English this year.","Bara kana Ingiliffa barachaa jirra.","","",0],["It isn't raining now.","Amma roobaa hin jiru.","","",0],["I understand you now.","Amma si hubadheera.","Not 'I am understanding'.","'I am understanding' miti.",0],["My brother usually drives, but today he is walking.","Obboleessi koo yeroo baay'ee konkolaataa oofa, har'a garuu miilaan deemaa jira.","","",0]]}]},{"id":"imperatives","en":"Imperatives and let's","om":"Ajaja fi 'let's'","icon":"📣","level":1,"summary_en":"Giving instructions, warnings and invitations; don't…; let's… and polite alternatives.","summary_om":"Qajeelfama, akeekkachiisa fi affeerraa kennuu; don't…; let's… fi karaalee kabajaa qaban.","sections":[{"h_en":"The imperative: just the base verb","h_om":"Ajaja: gochima bu'uuraa qofa","p_en":"To tell someone to do something, use the base verb with no subject: 'Sit down.' 'Open your books.' 'Turn left at the bank.' Afaan Oromoo has different forms for one person and for many (Taa'i / Taa'aa); English uses the same form for everyone.","p_om":"Nama tokko akka waa godhu ajajuuf, raawwataa malee gochima bu'uuraa fayyadami: 'Sit down.' 'Open your books.' 'Turn left at the bank.' Afaan Oromoo nama tokkoof fi namoota baay'eef unka adda qaba (Taa'i / Taa'aa); Ingiliffi nama hundaaf unkuma tokko fayyadama.","table":{"head":["English","One person","Many / respect"],"rows":[["Come.","Kottu.","Kottaa."],["Go.","Deemi.","Deemaa."],["Sit down.","Taa'i.","Taa'aa."],["Stand up.","Ka'i.","Ka'aa."],["Listen.","Dhaggeeffadhu.","Dhaggeeffadhaa."],["Look.","Ilaali.","Ilaalaa."],["Write.","Barreessi.","Barreessaa."],["Wait.","Eegi.","Eegaa."],["Eat.","Nyaadhu.","Nyaadhaa."],["Read.","Dubbisi.","Dubbisaa."]]}},{"h_en":"Don't…","h_om":"Don't… (hin…in)","p_en":"For a negative command, put 'Don't' before the verb: 'Don't run.' 'Don't touch that.' Oromo uses hin … -in: 'Hin fiigin.' (plural: 'Hin fiiginaa.') For strong rules and signs English also uses 'No + -ing': 'No smoking.' 'No parking.'","p_om":"Ajaja dhabamsaatiif gochima dura 'Don't' kaa'i: 'Don't run.' 'Don't touch that.' Afaan Oromoo hin … -in fayyadama: 'Hin fiigin.' (baay'ina: 'Hin fiiginaa.') Seera cimaa fi mallattoo irratti Ingiliffi 'No + -ing' fayyadama: 'No smoking.' 'No parking.'"},{"h_en":"Being polite","h_om":"Kabaja agarsiisuu","p_en":"In English a bare imperative to an adult you don't know can sound rude. Add 'please', or better, use a question: 'Could you close the door, please?' 'Can you help me?' Imperatives are normal for instructions, directions, recipes and warnings ('Mix the flour and water.' 'Be careful!'), and for friendly invitations ('Come in!' 'Have a seat.' 'Help yourself.').","p_om":"Ingiliffa keessatti nama guddaa hin beekne gochima bu'uuraa qofaan ajajuun safuu dhabummaa fakkaachuu danda'a. 'Please' (maaloo) dabali, yookiin caalaatti gaaffiin dubbadhu: 'Could you close the door, please?' 'Can you help me?' Ajajni qajeelfamaaf, kallattii agarsiisuuf, akkaataa nyaata qopheessuu fi akeekkachiisaaf idileedha ('Mix the flour and water.' 'Be careful!'), akkasumas affeerraa jaalalaatiif ('Come in!' 'Have a seat.' 'Help yourself.')."},{"h_en":"Let's…","h_om":"Let's… (Haa …nu)","p_en":"Use 'Let's' (= let us) + base verb to suggest something you and others do together: 'Let's go.' (Haa deemnu.) 'Let's have some coffee.' Negative: 'Let's not wait.' Other ways to suggest: 'Shall we go?' 'Why don't we take a taxi?' 'How about a walk?' 'Let him/them…' allows someone else: 'Let him speak.' (Haa dubbatu.)","p_om":"Wanta ati fi namoonni biroo waliin gootan yaada kennuuf 'Let's' (= let us) + gochima bu'uuraa fayyadami: 'Let's go.' (Haa deemnu.) 'Let's have some coffee.' Dhabamsa: 'Let's not wait.' Karaalee yaada kennuu biroo: 'Shall we go?' 'Why don't we take a taxi?' 'How about a walk?' 'Let him/them…' nama biraatiif eeyyama kenna: 'Let him speak.' (Haa dubbatu.)","ex":[["Please sit down.","Maaloo taa'i.","","",0],["Open your books to page ten.","Kitaabota keessan fuula kurnaffaatti banaa.","","",0],["Don't forget your umbrella.","Dibaabee kee hin irraanfatin.","","",0],["Turn left at the bank, then go straight.","Baankii bira gara bitaatti gori, sana booda qajeelaatti deemi.","","",0],["Let's go home; it's late.","Haa gallu; galgala ta'eera.","","",0],["Let's not wait; let's start now.","Hin eegnu; amma haa jalqabnu.","","",1],["Could you open the window, please?","Maaloo foddaa banuu dandeessaa?","","",0]]}]},{"id":"questions","en":"Questions","om":"Gaaffii","icon":"❓","level":1,"summary_en":"Yes/no questions, question words, subject questions, How + adjective, question tags and polite indirect questions.","summary_om":"Gaaffii eeyyee/lakki, jechoota gaaffii, gaaffii raawwataa, How + ibsa, gaaffii xiqqaa dhuma himaa fi gaaffii kabajaa.","sections":[{"h_en":"Yes/no questions","h_om":"Gaaffii eeyyee/lakki","p_en":"Afaan Oromoo keeps the word order and changes only the voice: 'Ni dhufta.' → 'Ni dhuftaa?' English changes the word order. With be, can, will, have (perfect) etc., move that verb before the subject: 'You are ready.' → 'Are you ready?' 'She can swim.' → 'Can she swim?' With all other verbs, add do/does/did: 'Do you like tea?' 'Did they come?' Answer with a short answer: 'Yes, I do.' 'No, they didn't.'","p_om":"Afaan Oromoo tartiiba jechootaa hin jijjiiru; sagalee qofa jijjiira: 'Ni dhufta.' → 'Ni dhuftaa?' Ingiliffi tartiiba jechootaa jijjiira. Be, can, will, have (yeroo raawwatame) fi kkf. wajjin, gochima sana raawwataa dura fidi: 'You are ready.' → 'Are you ready?' 'She can swim.' → 'Can she swim?' Gochimoota biroo hunda wajjin do/does/did dabali: 'Do you like tea?' 'Did they come?' Deebii gabaabaan deebisi: 'Yes, I do.' 'No, they didn't.'"},{"h_en":"Question words","h_om":"Jechoota gaaffii","p_en":"In English the question word comes first: Question word + helping verb + subject + verb. 'Where do you live?' In Afaan Oromoo it usually comes just before the verb: 'Eessa jiraatta?' Note: English asks 'What is your name?', not 'Who is your name?' (Oromo: Maqaan kee eenyu?).","p_om":"Ingiliffa keessatti jechi gaaffii jalqaba dhufa: Jecha gaaffii + gochima gargaaraa + raawwataa + gochima. 'Where do you live?' Afaan Oromoo keessatti yeroo baay'ee gochima dura dhufa: 'Eessa jiraatta?' Hubachiisa: Ingiliffi 'What is your name?' jedha, 'Who is your name?' miti (Afaan Oromoo: Maqaan kee eenyu?).","table":{"head":["English","Afaan Oromoo","Example"],"rows":[["what","maal","What do you want?"],["who","eenyu","Who is that man?"],["whom (formal)","eenyuun","Whom did you see?"],["whose","kan eenyuu","Whose car is this?"],["which","kam","Which bus goes to Jimma?"],["where","eessa","Where do you live?"],["when","yoom","When is your birthday?"],["why","maaliif","Why are you late?"],["how","akkamitti / akkam","How do you go to work?"],["how much","meeqa / hammam","How much is this shirt?"],["how many","meeqa","How many students are there?"],["how often","yeroo meeqa","How often do you play?"],["how long","yeroo hammamii","How long will you stay?"],["what kind of","gosa akkamii","What kind of music do you like?"]]}},{"h_en":"Subject questions","h_om":"Gaaffii raawwataa","p_en":"When the question word is the subject (who or what did the action), English does not use do/does/did: 'Who called you?' 'What happened?' Compare: 'Who did you call?' (who is the object). Afaan Oromoo shows the same difference with endings: 'Eenyutu si bilbile?' (subject, -tu) vs 'Eenyuun bilbilte?' (object).","p_om":"Jechi gaaffii yeroo raawwataa ta'u (eenyu yookiin maal gocha sana raawwate), Ingiliffi do/does/did hin fayyadamu: 'Who called you?' 'What happened?' Wal bira qabi: 'Who did you call?' (asitti who raawwatamaadha). Afaan Oromoo garaagarummaa kana dhuma jechaatiin agarsiisa: 'Eenyutu si bilbile?' (raawwataa, -tu) fi 'Eenyuun bilbilte?' (raawwatamaa)."},{"h_en":"How + adjective; What + noun","h_om":"How + ibsa; What + maqaa","p_en":"Ask about size, age and amount with How + adjective: How old…? (umurii), How tall…?, How far…?, How long…?, How big…?, How deep…?, How fast…?, How well…? Or use What + noun: What color…?, What size…?, What time…?, What kind of…? 'How far is the airport? – About 10 kilometers.'","p_om":"Hamma, umurii fi baay'ina gaafachuuf How + ibsa maqaa fayyadami: How old…? (umurii), How tall…?, How far…?, How long…?, How big…?, How deep…?, How fast…?, How well…? Yookiin What + maqaa fayyadami: What color…?, What size…?, What time…?, What kind of…? 'How far is the airport? – About 10 kilometers.'"},{"h_en":"Question tags","h_om":"Gaaffii xiqqaa dhuma himaa (question tags)","p_en":"Oromo adds 'mitii?' to any sentence. English builds the tag from the helping verb: a positive sentence takes a negative tag, and a negative sentence takes a positive tag. 'You're Oromo, aren't you?' 'She lives here, doesn't she?' 'They didn't come, did they?' Special: 'I'm late, aren't I?' 'Let's go, shall we?' Careful when answering negative questions: in Oromo 'Eeyyee' can confirm the negative ('Hin deemne? – Eeyyee, hin deemne'), but in English the answer follows the fact: 'Didn't you go? – No, I didn't.'","p_om":"Afaan Oromoo hima kamiifuu 'mitii?' dabala. Ingiliffi gaaffii xiqqaa kana gochima gargaaraa irraa ijaara: hima mirkaneessaa booda gaaffii dhabamsaa, hima dhabamsaa booda gaaffii mirkaneessaa: 'You're Oromo, aren't you?' 'She lives here, doesn't she?' 'They didn't come, did they?' Adda: 'I'm late, aren't I?' 'Let's go, shall we?' Gaaffii dhabamsaa yeroo deebistu of eeggadhu: Afaan Oromoo keessatti 'Eeyyee' dhabamsa mirkaneessuu danda'a ('Hin deemne? – Eeyyee, hin deemne'), Ingiliffa keessatti garuu deebiin dhugaa hordofa: 'Didn't you go? – No, I didn't.'"},{"h_en":"Polite indirect questions","h_om":"Gaaffii kabajaa (kallattii hin taane)","p_en":"To be more polite, start with 'Can you tell me…', 'Do you know…' or 'I'd like to know…'. After these, use normal statement word order and no do/does/did: 'Where is the station?' → 'Can you tell me where the station is?' 'What time does it open?' → 'Do you know what time it opens?' For yes/no questions use if/whether: 'Do you know if the bank is open?'","p_om":"Caalaatti kabajaan gaafachuuf 'Can you tell me…', 'Do you know…' yookiin 'I'd like to know…' jedhii jalqabi. Kana booda tartiiba hima idilee fayyadami, do/does/did hin dabalin: 'Where is the station?' → 'Can you tell me where the station is?' 'What time does it open?' → 'Do you know what time it opens?' Gaaffii eeyyee/lakkiif if/whether fayyadami: 'Do you know if the bank is open?'","ex":[["Are you a student? – Yes, I am.","Ati barataadhaa? – Eeyyee, barataadha.","","",0],["Does your sister live in Jimma?","Obboleettiin kee Jimmaa jiraattii?","","",0],["Where did you buy that dress?","Uffata sana eessaa bitatte?","","",0],["Who told you that?","Eenyutu sitti hime?","Subject question: no 'did'.","Gaaffii raawwataa: 'did' hin jiru.",0],["What is your name? – My name is Lensa.","Maqaan kee eenyu? – Maqaan koo Lensaa.","","",0],["How old is your father?","Umuriin abbaa keetii meeqa?","","",0],["You're coming tomorrow, aren't you?","Boru ni dhufta, mitii?","","",0],["Can you tell me where the bus station is?","Buufanni awtobisii eessa akka jiru natti himuu dandeessaa?","","",0]]}]},{"id":"negatives","en":"Negative sentences","om":"Hima dhabamsaa","icon":"🚫","level":1,"summary_en":"not, don't/doesn't/didn't, and why English allows only one negative word.","summary_om":"not, don't/doesn't/didn't, akkasumas maaliif Ingiliffi jecha dhabamsaa tokko qofa hayyamu.","sections":[{"h_en":"Not after be, modals and have (perfect)","h_om":"'Not' be, gochima gargaaraa fi have booda","p_en":"If the sentence already has be or a helping verb (can, will, should, have in the perfect…), put 'not' after it: 'I'm not ready.' 'She isn't here.' 'We can't come.' 'They won't (will not) wait.' 'He hasn't arrived.' In speech, use the short forms: isn't, aren't, wasn't, weren't, can't, won't, shouldn't, haven't, hasn't.","p_om":"Himni sun duraanuu 'be' yookiin gochima gargaaraa (can, will, should, have yeroo raawwatamee keessatti…) yoo qabaate, 'not' isa booda kaa'i: 'I'm not ready.' 'She isn't here.' 'We can't come.' 'They won't (will not) wait.' 'He hasn't arrived.' Dubbii keessatti unka gabaabaa fayyadami: isn't, aren't, wasn't, weren't, can't, won't, shouldn't, haven't, hasn't."},{"h_en":"Don't, doesn't, didn't","h_om":"Don't, doesn't, didn't","p_en":"With other verbs, use do/does/did + not + base verb. Afaan Oromoo uses 'hin' with a special negative ending in the present (hin deemu, hin deemtu…) and one form, hin …ne, for all persons in the past (hin deemne). English is similar in the past: didn't + base verb for everyone. Never use the past form after didn't: 'I didn't go', not 'I didn't went'.","p_om":"Gochimoota biroo wajjin do/does/did + not + gochima bu'uuraa fayyadami. Afaan Oromoo yeroo ammaa 'hin' dhuma dhabamsaa addaa wajjin fayyadama (hin deemu, hin deemtu…), yeroo darbe keessatti immoo raawwataa hundaaf unka tokko, hin …ne, fayyadama (hin deemne). Ingiliffis yeroo darbe keessatti walfakkaata: raawwataa hundaaf didn't + gochima bu'uuraa. Didn't booda unka yeroo darbe gonkumaa hin fayyadamin: 'I didn't go', 'I didn't went' miti.","table":{"head":["English","Afaan Oromoo"],"rows":[["I don't go.","Ani hin deemu."],["You don't go.","Ati hin deemtu."],["He doesn't go.","Inni hin deemu."],["She doesn't go.","Isheen hin deemtu."],["We don't go.","Nuti hin deemnu."],["They don't go.","Isaan hin deeman."],["I / he / we / they didn't go.","hin deemne (for everyone)"]]}},{"h_en":"Only one negative","h_om":"Dhabamsa tokko qofa","p_en":"In Afaan Oromoo two negative words together are normal: 'Ani homaa hin qabu' (nothing + not), 'Namni tokkollee hin dhufne'. In standard English only ONE negative word is allowed in a clause. Say 'I don't have anything' or 'I have nothing' – not 'I don't have nothing'. The same with nobody, never, nowhere: 'Nobody came' / 'I didn't see anybody'.","p_om":"Afaan Oromoo keessatti jechoonni dhabamsaa lama walitti dhufuun idileedha: 'Ani homaa hin qabu', 'Namni tokkollee hin dhufne'. Ingiliffa sirrii keessatti garuu hima tokko keessatti jecha dhabamsaa TOKKO qofatu hayyamama. 'I don't have anything' yookiin 'I have nothing' jedhi – 'I don't have nothing' miti. Akkasuma nobody, never, nowhere wajjin: 'Nobody came' / 'I didn't see anybody'.","table":{"head":["Afaan Oromoo","Wrong English","Right English"],"rows":[["Ani homaa hin qabu.","I don't have nothing.","I don't have anything. / I have nothing."],["Namni tokkollee hin dhufne.","Nobody didn't come.","Nobody came."],["Gonkumaa achi hin deemu.","I never don't go there.","I never go there."],["Eessayyuu hin deemne.","We didn't go nowhere.","We didn't go anywhere."]]}},{"h_en":"No, none, nothing, neither…","h_om":"No, none, nothing, neither…","p_en":"Other negative words: no + noun (There's no milk = Aannan hin jiru), none (None of them came), nothing, nobody/no one, nowhere, never, neither…nor (Neither Tola nor Abdi came). To make an infinitive or -ing negative, put 'not' before it: 'I decided not to go.' 'Try not to be late.'","p_om":"Jechoota dhabamsaa biroo: no + maqaa (There's no milk = Aannan hin jiru), none (None of them came), nothing, nobody/no one, nowhere, never, neither…nor (Neither Tola nor Abdi came). Unka 'to + gochima' yookiin '-ing' dhabamsa gochuuf 'not' isa dura kaa'i: 'I decided not to go.' 'Try not to be late.'","ex":[["I'm not a doctor; I'm a nurse.","Ani doktora miti; narsiidha.","","",0],["She doesn't speak French.","Isheen Afaan Faransaayii hin dubbattu.","","",0],["We didn't see the accident.","Nuti balaa sana hin argine.","","",0],["I don't know anything about it.","Waa'ee isaa homaa hin beeku.","","",0],["There is no water in the tap.","Ujummoo keessa bishaan hin jiru.","","",0],["Nobody answered the phone.","Namni tokkollee bilbila hin kaafne.","","",0],["He decided not to buy the car.","Inni konkolaataa sana bituu dhiisuuf murteesse.","","",0]]}]},{"id":"past_simple","en":"Past simple (regular & irregular verbs)","om":"Yeroo darbe salphaa","icon":"⏮️","level":1,"summary_en":"Finished actions in the past: -ed verbs, the most common irregular verbs, did/didn't, and 'used to'.","summary_om":"Gocha yeroo darbe keessatti xumurame: gochimoota -ed, gochimoota seera hin eegne baramoo, did/didn't, akkasumas 'used to'.","sections":[{"h_en":"When we use it","h_om":"Yoom fayyadamna","p_en":"Use the past simple for actions that finished at a definite time in the past: yesterday (kaleessa), last week (torbee darbe), two days ago (guyyaa lama dura), in 2015 (bara 2015), when I was a child (yeroo ani mucaa ture). It is also used for one action after another ('First she paid the driver, then she got out of the taxi'), and for past habits and states that are finished now. Good news: Afaan Oromoo changes the past verb for each person (deeme, deemte, deemne, deeman), but English uses ONE past form for everyone: I/you/he/she/we/they went.","p_om":"Yeroo darbe salphaa gocha yeroo darbe murtaa'aa keessatti xumurameef fayyadami: yesterday (kaleessa), last week (torbee darbe), two days ago (guyyaa lama dura), in 2015 (bara 2015), when I was a child (yeroo ani mucaa ture). Gocha walitti aananii raawwatamaniifis ni fayyada ('First she paid the driver, then she got out of the taxi'), akkasumas amalaa fi haala yeroo darbe kan amma dhaabbateef. Oduu gammachiisaa: Afaan Oromoo gochima yeroo darbee raawwataa hundaaf ni jijjiira (deeme, deemte, deemne, deeman), Ingiliffi garuu nama hundaaf unka yeroo darbe TOKKO fayyadama: I/you/he/she/we/they went."},{"h_en":"Regular verbs: -ed","h_om":"Gochimoota seera eegan: -ed","p_en":"Most verbs add -ed: work → worked, play → played, visit → visited. Spelling: verbs ending in e add only -d (live → lived); consonant + y → -ied (study → studied, cry → cried), but vowel + y keeps y (play → played); one short stressed vowel + one consonant → double it (stop → stopped, plan → planned, prefer → preferred). For the three pronunciations /t/, /d/, /ɪd/ see the lesson 'Consonant clusters & word endings'.","p_om":"Gochimoonni baay'een -ed dabalu: work → worked, play → played, visit → visited. Barreeffama: gochimoonni e'n xumuraman -d qofa dabalu (live → lived); dubbifamaa + y → -ied (study → studied, cry → cried), dubbachiiftuu + y garuu y eega (play → played); dubbachiiftuu gabaabaa cimaa tokko + dubbifamaa tokko → dachaa godhi (stop → stopped, plan → planned, prefer → preferred). Sagalee sadan /t/, /d/, /ɪd/ barnoota 'Dubbifamaa walitti aanan fi dhuma jechaa' keessatti ilaali."},{"h_en":"The most common irregular verbs","h_om":"Gochimoota seera hin eegne baay'ee beekaman","p_en":"Many of the most frequent verbs are irregular. Learn three forms: the base (V1), the past (V2, used in the past simple) and the past participle (V3, used in perfect tenses and the passive). Learning them in sound groups helps: sing–sang–sung, drink–drank–drunk, swim–swam–swum; buy–bought, bring–brought, think–thought, teach–taught, catch–caught; know–knew–known, grow–grew–grown, throw–threw–thrown, fly–flew–flown. Some never change: cut, put, let, hit, cost, hurt.","p_om":"Gochimoonni baay'ee fayyadamaman hedduun seera hin eegan. Unka sadii baradhu: unka bu'uuraa (V1), unka yeroo darbe (V2, yeroo darbe salphaa keessatti) fi unka raawwatame (V3, yeroo raawwatamee fi hima raawwatamaa keessatti). Garee sagaleetiin baruun ni gargaara: sing–sang–sung, drink–drank–drunk, swim–swam–swum; buy–bought, bring–brought, think–thought, teach–taught, catch–caught; know–knew–known, grow–grew–grown, throw–threw–thrown, fly–flew–flown. Tokko tokko gonkumaa hin jijjiiraman: cut, put, let, hit, cost, hurt.","table":{"head":["Base (V1)","Past (V2)","Past participle (V3)","Afaan Oromoo"],"rows":[["be","was / were","been","ta'uu, jiraachuu"],["become","became","become","ta'uu"],["begin","began","begun","jalqabuu"],["bend","bent","bent","goobuu"],["break","broke","broken","cabsuu"],["bring","brought","brought","fiduu"],["build","built","built","ijaaruu"],["buy","bought","bought","bituu"],["catch","caught","caught","qabuu"],["choose","chose","chosen","filachuu"],["come","came","come","dhufuu"],["cost","cost","cost","gatii baasuu"],["cut","cut","cut","muruu"],["do","did","done","gochuu, hojjechuu"],["drink","drank","drunk","dhuguu"],["drive","drove","driven","oofuu"],["eat","ate","eaten","nyaachuu"],["fall","fell","fallen","kufuu"],["feel","felt","felt","dhaga'amuu (miira)"],["fight","fought","fought","loluu"],["find","found","found","argachuu"],["fly","flew","flown","balali'uu"],["forget","forgot","forgotten","irraanfachuu"],["get","got","gotten (US) / got (UK)","argachuu"],["give","gave","given","kennuu"],["go","went","gone","deemuu"],["grow","grew","grown","guddachuu"],["have","had","had","qabaachuu"],["hear","heard","heard","dhaga'uu"],["hold","held","held","qabachuu"],["hurt","hurt","hurt","miidhuu"],["keep","kept","kept","kuusuu, eeguu"],["know","knew","known","beekuu"],["leave","left","left","ka'uu, dhiisuu"],["lend","lent","lent","liqeessuu"],["let","let","let","hayyamuu"],["lose","lost","lost","dhabuu"],["make","made","made","tolchuu"],["meet","met","met","wal arguu"],["pay","paid","paid","kaffaluu"],["put","put","put","kaa'uu"],["read","read /rɛd/","read /rɛd/","dubbisuu"],["ride","rode","ridden","yaabbachuu (farda, biskileetii)"],["ring","rang","rung","bilbiluu"],["run","ran","run","fiiguu"],["say","said","said","jechuu"],["see","saw","seen","arguu"],["sell","sold","sold","gurguruu"],["send","sent","sent","erguu"],["show","showed","shown","agarsiisuu"],["sing","sang","sung","faarfachuu, sirbuu"],["sit","sat","sat","taa'uu"],["sleep","slept","slept","rafuu"],["speak","spoke","spoken","dubbachuu"],["spend","spent","spent","baasuu (qarshii), dabarsuu (yeroo)"],["stand","stood","stood","dhaabbachuu"],["steal","stole","stolen","hatuu"],["swim","swam","swum","daakuu"],["take","took","taken","fudhachuu"],["teach","taught","taught","barsiisuu"],["tell","told","told","himuu"],["think","thought","thought","yaaduu"],["throw","threw","thrown","darbachuu"],["understand","understood","understood","hubachuu"],["wake (up)","woke","woken","dammaquu"],["wear","wore","worn","uffachuu"],["win","won","won","mo'uu"],["write","wrote","written","barreessuu"]]}},{"h_en":"Negatives and questions: did","h_om":"Dhabamsaa fi gaaffii: did","p_en":"Use did / didn't + the BASE verb for everyone. 'I didn't go.' (Hin deemne.) 'Did you see the match?' – 'Yes, I did. / No, I didn't.' Because 'did' already shows the past, the main verb goes back to the base form: never 'Did you went?' or 'I didn't saw'. With 'be' use was/were: 'Were you there?' 'It wasn't easy.'","p_om":"Nama hundaaf did / didn't + gochima BU'UURAA fayyadami. 'I didn't go.' (Hin deemne.) 'Did you see the match?' – 'Yes, I did. / No, I didn't.' 'Did' duraanuu yeroo darbe waan agarsiisuuf, gochimni ijoon gara unka bu'uuraatti deebi'a: 'Did you went?' yookiin 'I didn't saw' gonkumaa hin jedhin. 'Be' wajjin was/were fayyadami: 'Were you there?' 'It wasn't easy.'"},{"h_en":"Used to","h_om":"Used to (duraan … ture)","p_en":"Use 'used to' + base verb for habits or states that were true in the past but are not true now: 'I used to live in Jimma.' (Ani duraan Jimmaa jiraachaa ture.) Negative: 'I didn't use to like coffee.' Question: 'Did you use to play football?' Don't confuse it with 'be used to + -ing' (= be familiar with): 'I'm used to getting up early.'","p_om":"Amala yookiin haala yeroo darbe dhugaa ture garuu amma dhugaa hin taaneef 'used to' + gochima bu'uuraa fayyadami: 'I used to live in Jimma.' (Ani duraan Jimmaa jiraachaa ture.) Dhabamsa: 'I didn't use to like coffee.' Gaaffii: 'Did you use to play football?' 'Be used to + -ing' (= waan tokkotti baramuu) wajjin walitti hin makin: 'I'm used to getting up early.' (Ganama ka'uutti baramaadha.)","ex":[["I visited my grandmother last week.","Torbee darbe akkoo koo daawwadhe.","","",0],["She went to Gondar in 2019.","Isheen bara 2019 Gondar deemte.","","",0],["First he paid the driver, then he got out of the taxi.","Jalqaba konkolaachisaa kaffale, sana booda taaksii keessaa bu'e.","","",0],["Did you see the match? – No, I didn't.","Taphicha argitee? – Lakki, hin argine.","","",0],["We didn't go to work yesterday.","Kaleessa hojii hin deemne.","didn't + base verb: go, not went.","didn't + gochima bu'uuraa: go, went miti.",0],["Who wrote this letter?","Xalayaa kana eenyutu barreesse?","","",0],["I used to live in Jimma, but now I live in Adama.","Ani duraan Jimmaa jiraachaa ture, amma garuu Adaamaa jiraadha.","","",0]]}]},{"id":"future","en":"Talking about the future","om":"Waa'ee yeroo dhufuu dubbachuu","icon":"🔮","level":1,"summary_en":"will, be going to, the present continuous and present simple for future meaning, and time clauses.","summary_om":"will, be going to, yeroo ammaa itti fufaa fi salphaa hiika yeroo dhufuutiin, akkasumas hima yeroo.","sections":[{"h_en":"Afaan Oromoo vs English","h_om":"Afaan Oromoo fi Ingiliffa","p_en":"Afaan Oromoo usually talks about the future with the normal present form and a time word: 'Boru nan dhufa.' It can also use -uuf jira / -uuf jedha for plans or things about to happen. English must show the future in the verb. 'Tomorrow I come' is wrong; say 'I'll come tomorrow' or 'I'm coming tomorrow'. There are several future forms, and each has its own job.","p_om":"Afaan Oromoo waa'ee yeroo dhufuu yeroo baay'ee unka yeroo ammaa idileetii fi jecha yeroo fayyadamee dubbata: 'Boru nan dhufa.' Karooraaf yookiin wanta raawwatamuuf dhiyaateef -uuf jira / -uuf jedha fayyadamuu danda'a. Ingiliffi garuu yeroo dhufu gochima keessatti agarsiisuu qaba. 'Tomorrow I come' dogoggora; 'I'll come tomorrow' yookiin 'I'm coming tomorrow' jedhi. Unkaaleen yeroo dhufuu hedduu jiru; tokkoon tokkoon isaanii hojii mataa isaa qaba."},{"h_en":"Will","h_om":"Will","p_en":"Use will (short: 'll; negative: won't) + base verb for: decisions made at the moment of speaking ('The phone's ringing – I'll get it'), offers and promises ('I'll help you'; 'I won't tell anyone'), predictions based on opinion ('I think it will rain'), and facts about the future ('I'll be 30 next year'). 'Shall' is used with I/we in offers and suggestions: 'Shall I open the window?' 'Shall we go?' (Older texts also use 'I shall' for the future; today 'will' is normal.)","p_om":"Will (gabaabaa: 'll; dhabamsa: won't) + gochima bu'uuraa fayyadami: murtoo yeroo dubbii sanatti murteessiteef ('The phone's ringing – I'll get it'), gargaarsa dhiyeessuu fi waadaaf ('I'll help you'; 'I won't tell anyone'), tilmaama yaada irratti hundaa'eef ('I think it will rain'), akkasumas dhugaa yeroo dhufuuf ('I'll be 30 next year'). 'Shall' I/we wajjin gargaarsa dhiyeessuu fi yaada kennuuf fayyada: 'Shall I open the window?' 'Shall we go?' (Barreeffamoonni durii yeroo dhufuuf 'I shall' fayyadamu; har'a 'will' idileedha.)"},{"h_en":"Be going to","h_om":"Be going to","p_en":"Use am/is/are going to + base verb for plans you have already decided ('I'm going to study medicine'), and for predictions when you can see the evidence now ('Look at those clouds – it's going to rain'). Afaan Oromoo often says this with -uuf jedha: 'Roobuuf jedha.'","p_om":"Karoora duraan murteessiteef am/is/are going to + gochima bu'uuraa fayyadami ('I'm going to study medicine'), akkasumas tilmaama ragaan isaa amma mul'atuuf ('Look at those clouds – it's going to rain'). Afaan Oromoo kana yeroo baay'ee -uuf jedhaan ibsa: 'Roobuuf jedha.'"},{"h_en":"Present continuous and present simple for the future","h_om":"Ammaa itti fufaa fi ammaa salphaa yeroo dhufuuf","p_en":"Use the present continuous for arrangements with a fixed time and other people: 'I'm meeting the doctor at three.' 'We're flying to Nairobi on Friday.' Use the present simple for timetables and schedules: 'The bus leaves at 6:30.' 'The film starts at eight.'","p_om":"Qindaa'ina yeroo murtaa'e fi namoota biroo wajjin qabameef ammaa itti fufaa fayyadami: 'I'm meeting the doctor at three.' 'We're flying to Nairobi on Friday.' Sagantaa yeroo fi tartiiba hojiitiif ammaa salphaa fayyadami: 'The bus leaves at 6:30.' 'The film starts at eight.'"},{"h_en":"Time clauses: when, after, as soon as + present","h_om":"Hima yeroo: when, after, as soon as + yeroo ammaa","p_en":"After when, before, after, as soon as, until and if, English uses a PRESENT verb even for the future: 'I'll call you when I arrive' – not 'when I will arrive'. This is like Afaan Oromoo: 'Yeroon ga'u siif nan bilbila.'","p_om":"When, before, after, as soon as, until fi if booda Ingiliffi yeroo dhufuuf illee gochima yeroo AMMAA fayyadama: 'I'll call you when I arrive' – 'when I will arrive' miti. Kun Afaan Oromoo wajjin walfakkaata: 'Yeroon ga'u siif nan bilbila.'"},{"h_en":"Which future?","h_om":"Kam fayyadamna?","p_en":"A quick guide to choosing the form.","p_om":"Unka sirrii filachuuf qajeelfama gabaabaa.","table":{"head":["Situation / Haala","Form","Example","Afaan Oromoo"],"rows":[["decision now, offer, promise","will","I'll carry your bag.","Boorsaa kee siif nan baadha."],["opinion prediction","will","I think she'll win.","Isheen akka injifattu natti fakkaata."],["plan already decided","going to","We're going to buy a house.","Mana bituuf karoorfanneerra."],["prediction with evidence","going to","It's going to rain.","Roobuuf jedha."],["arrangement","present continuous","I'm meeting Lensa at six.","Sa'aatii 12tti Lensaa wajjin wal agarra."],["timetable","present simple","The train leaves at 7:30.","Baaburri sa'aatii 1:30tti ka'a."]]},"ex":[["I'll call you tomorrow.","Boru siif nan bilbila.","","",0],["I think it will be sunny tomorrow.","Boru akka aduun baatu natti fakkaata.","","",0],["Look at those clouds – it's going to rain.","Duumessa sana ilaali – roobuuf jedha.","","",0],["I'm going to study medicine next year.","Bara dhufu barnoota fayyaa barachuuf karoorfadheera.","","",0],["We're having a party on Saturday.","Sanbata cidha xiqqaa qabna.","","",0],["I'll tell her as soon as I see her.","Akkuman ishee argeen isheetti nan hima.","","",1],["I won't tell anyone, I promise.","Nama tokkottillee hin himu, waadaa nan gala.","","",0],["Shall I open the window?","Foddaa haa banu?","","",1]]}]},{"id":"countable_quantifiers","en":"Countable nouns & quantifiers","om":"Maqaa lakkaa'amu fi jechoota baay'ina agarsiisan","icon":"⚖️","level":1,"summary_en":"Countable and uncountable nouns, and some, any, much, many, a lot of, a few, a little, all, every, both, enough.","summary_om":"Maqaa lakkaa'amu fi hin lakkaa'amne, akkasumas some, any, much, many, a lot of, a few, a little, all, every, both, enough.","sections":[{"h_en":"Countable and uncountable","h_om":"Kan lakkaa'amu fi kan hin lakkaa'amne","p_en":"Countable nouns can be counted and have a plural (a book, two books). Uncountable nouns are seen as a mass: no a/an, no plural, singular verb (water, milk, coffee, sugar, bread, rice, money, information, advice, news, furniture, homework, luggage, traffic, weather, work, music). Some are countable in Afaan Oromoo but not in English: don't say 'informations', 'advices', 'furnitures' or 'a bread'. To count them, use a unit: a piece of advice, a glass of water, a loaf of bread.","p_om":"Maqaan lakkaa'amu lakkaa'amuu ni danda'a, baay'inas qaba (a book, two books). Maqaan hin lakkaa'amne akka waan walitti makameetti ilaalama: a/an hin fudhatu, baay'ina hin qabu, gochima tokkichaa fudhata (water, milk, coffee, sugar, bread, rice, money, information, advice, news, furniture, homework, luggage, traffic, weather, work, music). Tokko tokko Afaan Oromoo keessatti ni lakkaa'amu, Ingiliffa keessatti garuu hin lakkaa'aman: 'informations', 'advices', 'furnitures' yookiin 'a bread' hin jedhin. Lakkaa'uuf safartuu fayyadami: a piece of advice, a glass of water, a loaf of bread.","table":{"head":["Unit + uncountable noun","Afaan Oromoo"],"rows":[["a glass of water","bishaan burcuqqoo tokko"],["a cup of coffee","buna sinii tokko"],["a kilo of sugar","sukkaara kiiloo tokko"],["a loaf of bread","daabboo tokko"],["a piece of advice","gorsa tokko"],["a bottle of oil","zayita qaruuraa tokko"],["a piece of information","odeeffannoo tokko"]]}},{"h_en":"Some, any, no","h_om":"Some, any, no","p_en":"Use 'some' in positive sentences and in offers and requests ('There is some bread.' 'Would you like some tea?' 'Can I have some water?'). Use 'any' in negatives and most questions ('We don't have any sugar.' 'Do you have any brothers?'). 'No' = not any: 'There's no milk.' Oromo often uses xiqqoo, muraasa or homaa for these.","p_om":"'Some' hima mirkaneessaa keessatti, akkasumas yeroo waa dhiyeessinu yookiin gaafannu fayyadami ('There is some bread.' 'Would you like some tea?' 'Can I have some water?'). 'Any' hima dhabamsaa fi gaaffii baay'ee keessatti fayyadami ('We don't have any sugar.' 'Do you have any brothers?'). 'No' = not any: 'There's no milk.' Afaan Oromoo kanaaf yeroo baay'ee xiqqoo, muraasa yookiin homaa fayyadama."},{"h_en":"Much, many, a lot of","h_om":"Much, many, a lot of","p_en":"Afaan Oromoo uses 'baay'ee' for everything. English uses 'many' with plural countable nouns (many books, many people) and 'much' with uncountable nouns (much money, much time) – 'much' mostly in negatives and questions. In positive sentences 'a lot of / lots of' is more natural for both: 'She has a lot of friends.' 'We have a lot of work.' Ask: How many…? (countable) / How much…? (uncountable).","p_om":"Afaan Oromoo hunda isaaniif 'baay'ee' fayyadama. Ingiliffi maqaa lakkaa'amu baay'inaa wajjin 'many' (many books, many people), maqaa hin lakkaa'amne wajjin immoo 'much' (much money, much time) fayyadama – 'much' caalaatti hima dhabamsaa fi gaaffii keessatti. Hima mirkaneessaa keessatti 'a lot of / lots of' lamaanuufuu uumamaa caala: 'She has a lot of friends.' 'We have a lot of work.' Gaafadhu: How many…? (kan lakkaa'amu) / How much…? (kan hin lakkaa'amne)."},{"h_en":"A few, a little, few, little","h_om":"A few, a little, few, little","p_en":"'A few' (countable) and 'a little' (uncountable) mean 'some, a small amount' – a positive idea: 'I have a few friends here.' 'Add a little salt.' Without 'a', 'few' and 'little' mean 'not enough' – a negative idea: 'Few people came.' 'There is little hope.'","p_om":"'A few' (kan lakkaa'amu) fi 'a little' (kan hin lakkaa'amne) 'muraasa, xiqqoo' jechuudha – yaada gaarii: 'I have a few friends here.' (Asitti hiriyoota muraasa qaba.) 'Add a little salt.' (Soogidda xiqqoo itti dabali.) 'A' malee, 'few' fi 'little' 'ga'aa miti' jechuudha – yaada hamaa: 'Few people came.' 'There is little hope.'"},{"h_en":"All, every, each, both, either, neither","h_om":"All, every, each, both, either, neither","p_en":"'All' + plural (All students must come). 'Every' and 'each' + SINGULAR noun and singular verb (Every student has a book – Barataan hundi kitaaba qaba). 'Both' = the two (Both my parents are teachers). 'Either' = one or the other; 'neither' = not one and not the other (Neither answer is correct). 'None of' = not any of a group.","p_om":"'All' + maqaa baay'inaa (All students must come). 'Every' fi 'each' + maqaa TOKKICHAA fi gochima tokkichaa (Every student has a book – Barataan hundi kitaaba qaba). 'Both' = lamaanuu (Both my parents are teachers). 'Either' = tokko yookiin isa kaan; 'neither' = tokkollee (Neither answer is correct). 'None of' = garee tokko keessaa tokkollee."},{"h_en":"Enough, too much, too many","h_om":"Enough, too much, too many","p_en":"'Enough' (ga'aa) comes before a noun and after an adjective: 'enough chairs', 'old enough'. 'Too much' (uncountable) and 'too many' (countable) mean more than is good: 'There's too much noise.' 'There are too many cars.'","p_om":"'Enough' (ga'aa) maqaa dura, ibsa maqaa booda dhufa: 'enough chairs', 'old enough'. 'Too much' (kan hin lakkaa'amne) fi 'too many' (kan lakkaa'amu) hamma barbaachisu ol jechuudha: 'There's too much noise.' 'There are too many cars.'","ex":[["Can I have some water, please?","Maaloo bishaan xiqqoo naaf kenni.","","",0],["We don't have any sugar.","Sukkaara homaa hin qabnu.","","",0],["How many children do you have?","Ijoollee meeqa qabda?","","",0],["How much money do you need?","Qarshii meeqa barbaadda?","","",0],["We have a few eggs and a little milk.","Hanqaaquu muraasa fi aannan xiqqoo qabna.","","",0],["Every student has a book.","Barataan hundi kitaaba qaba.","","",0],["Can you give me some advice?","Gorsa naaf kennuu dandeessaa?","'advice' is uncountable: not 'an advice' or 'advices'.","'advice' hin lakkaa'amu: 'an advice' yookiin 'advices' miti.",0],["There are too many cars on this road.","Daandii kana irra konkolaataan baay'eedha.","","",0]]}]},{"id":"prepositions_place","en":"Prepositions of place & movement","om":"Durduubee bakkaa fi sochii","icon":"📍","level":1,"summary_en":"in, on, at, under, next to, between… and to, from, into, across, through – before the noun, not after.","summary_om":"in, on, at, under, next to, between… akkasumas to, from, into, across, through – maqaa dura, booda miti.","sections":[{"h_en":"Before the noun, not after","h_om":"Maqaa dura, booda miti","p_en":"Afaan Oromoo puts place words after the noun (postpositions): saanduqa keessa, minjaala irra, siree jala. English puts them before the noun (prepositions): in the box, on the table, under the bed.","p_om":"Afaan Oromoo jechoota bakkaa maqaa booda kaa'a: saanduqa keessa, minjaala irra, siree jala. Ingiliffi immoo maqaa dura kaa'a: in the box, on the table, under the bed.","table":{"head":["English","Afaan Oromoo","Example"],"rows":[["in / inside","keessa","in the box – saanduqa keessa"],["on","irra","on the table – minjaala irra"],["under / below","jala","under the bed – siree jala"],["above / over","ol, gubbaa","above the door – balbala gubbaa"],["next to / beside","cinaa","next to the bank – baankii cinaa"],["near","bira, dhiyoo","near the school – mana barumsaa bira"],["between","gidduu","between A and B – A fi B gidduu"],["behind","duuba","behind the house – mana duuba"],["in front of","fuuldura","in front of the shop – suuqii fuuldura"],["opposite","fuullee, gama","opposite the church – mana sagadaa fuullee"],["outside","ala","outside the room – kutaa ala"],["around","naannoo","around the town – magaalaa naannoo"]]}},{"h_en":"In, on, at for places","h_om":"In, on, at bakkaaf","p_en":"Use 'in' for a space or area: in the room, in the car, in Adama, in Ethiopia. Use 'on' for a surface or a line: on the wall, on the floor, on the second floor, on Bole Road, on the bus/train/plane. Use 'at' for a point or a place where an activity happens: at the door, at the bus stop, at home, at work, at school, at the airport, at 15 Main Street. Afaan Oromoo uses keessa(tti), irra(tti) or simply -tti for all of these.","p_om":"'In' bakka keessa yookiin naannoo tokkoof fayyadami: in the room, in the car, in Adama, in Ethiopia. 'On' gubbaa yookiin sararaaf: on the wall, on the floor, on the second floor, on Bole Road, on the bus/train/plane. 'At' qabxii tokkoof yookiin bakka hojiin tokko itti raawwatamuuf: at the door, at the bus stop, at home, at work, at school, at the airport, at 15 Main Street. Afaan Oromoo hunda isaaniif keessa(tti), irra(tti) yookiin -tti qofa fayyadama."},{"h_en":"Movement","h_om":"Sochii","p_en":"to (gara …tti): go to the market. from (… irraa/…dhaa): come from Jimma. into (… keessa seenuu): walk into the room. out of (… keessaa ba'uu): get out of the car. onto: jump onto the bed. up / down: climb up the hill, go down the stairs. across (ce'uu): walk across the road. through (keessa darbuu): drive through the forest. along: walk along the river. past (bira darbuu): go past the bank. towards (gara): run towards the gate.","p_om":"to (gara …tti): go to the market. from (… irraa/…dhaa): come from Jimma. into (… keessa seenuu): walk into the room. out of (… keessaa ba'uu): get out of the car. onto (… irratti): jump onto the bed. up / down (ol / gad): climb up the hill, go down the stairs. across (ce'uu): walk across the road. through (keessa darbuu): drive through the forest. along (… qarqara): walk along the river. past (bira darbuu): go past the bank. towards (gara): run towards the gate."},{"h_en":"Special verbs and phrases","h_om":"Gochimoota fi jechama addaa","p_en":"No 'to' with home, here, there: go home, come here, go there. Arrive IN a city or country, AT a building – never 'arrive to'. Get on / get off a bus, train or plane; get in / get out of a car or taxi. Enter a room (no 'in'). Married TO someone, not 'with'.","p_om":"Home, here, there wajjin 'to' hin fayyadamin: go home, come here, go there. Magaalaa yookiin biyya keessa ga'uuf 'arrive in', gamoo tokkotti ga'uuf 'arrive at' – 'arrive to' gonkumaa miti. Awtobisii, baabura yookiin xiyyaaraaf get on / get off; konkolaataa yookiin taaksiif get in / get out of. 'Enter a room' ('in' hin barbaachisu). 'Married to someone' – 'with' miti.","table":{"head":["Wrong / Dogoggora","Right / Sirrii"],"rows":[["I'm in home.","I'm at home."],["We arrived to Adama.","We arrived in Adama."],["He entered in the room.","He entered the room."],["She is married with a doctor.","She is married to a doctor."],["Let's go to home.","Let's go home."],["Get down from the bus.","Get off the bus."]]},"ex":[["The keys are on the table, next to the phone.","Furtuuwwan minjaala irra, bilbila cinaa jiru.","","",0],["My house is between the school and the clinic.","Manni koo mana barumsaa fi kiliinikii gidduu jira.","","",0],["The cat is under the bed.","Adurreen siree jala jirti.","","",0],["She walked into the room and sat down.","Isheen kutaa keessa seentee teessoo irra teesse.","","",0],["We drove from Adama to Finfinnee.","Adaamaa irraa hanga Finfinneetti konkolaataan deemne.","","",0],["Get off the bus at the next stop.","Buufata itti aanu irratti awtobisii irraa bu'i.","","",0],["Walk across the bridge and turn right.","Riqicha ce'iitii gara mirgaatti gori.","","",0],["I'm at home now.","Amma mana jira.","","",0]]}]},{"id":"prepositions_time","en":"Prepositions of time","om":"Durduubee yeroo","icon":"🕘","level":1,"summary_en":"at, on, in for times and dates; for, since, during, by, until, ago; and English vs Ethiopian time.","summary_om":"at, on, in yeroo fi guyyaaf; for, since, during, by, until, ago; akkasumas yeroo Ingiliffaa fi yeroo Itoophiyaa.","sections":[{"h_en":"At, on, in","h_om":"At, on, in","p_en":"AT for clock times and short points: at 6 o'clock, at noon, at night, at the weekend (UK). ON for days and dates: on Monday, on 5 May, on my birthday, on Monday morning, on the weekend (US). IN for longer periods: in July, in 2024, in summer, in the morning / afternoon / evening, in the 1990s. Afaan Oromoo often uses -tti or keessa, or nothing at all (Wiixata dhufa = He comes on Monday).","p_om":"AT sa'aatii fi yeroo gabaabaaf: at 6 o'clock, at noon, at night, at the weekend (UK). ON guyyaa fi guyyaa ji'aaf: on Monday, on 5 May, on my birthday, on Monday morning, on the weekend (US). IN yeroo dheeraaf: in July, in 2024, in summer, in the morning / afternoon / evening, in the 1990s. Afaan Oromoo yeroo baay'ee -tti yookiin keessa fayyadama, yookiin homaa hin fayyadamu (Wiixata dhufa = He comes on Monday).","table":{"head":["Preposition","English","Afaan Oromoo"],"rows":[["at","at 8 o'clock","sa'aatii 2tti (ganama)"],["at","at night","halkan"],["on","on Monday","Wiixata"],["on","on 1 September","Fulbaana 1"],["in","in the morning","ganama"],["in","in the evening","galgala"],["in","in March","ji'a Bitootessaa keessa"],["in","in 2010","bara 2010"]]}},{"h_en":"No preposition","h_om":"Durduubee malee","p_en":"Don't use at/on/in before today, tonight, yesterday, tomorrow, or before this, next, last, every: 'I'll see you next week' (not 'in next week'); 'We met last Friday'; 'She works every day'.","p_om":"Today, tonight, yesterday, tomorrow dura, akkasumas this, next, last, every dura at/on/in hin fayyadamin: 'I'll see you next week' ('in next week' miti); 'We met last Friday'; 'She works every day'."},{"h_en":"For, since, during, until, by, ago","h_om":"For, since, during, until, by, ago","p_en":"for + a length of time: for three hours, for two years. since + the starting point: since Monday, since 2015 (see Present perfect). during + an event: during the meeting. from … to / until: from 8 to 5; wait until six (hanga). by = not later than: finish it by Friday. before / after: before lunch, after class. ago comes AFTER the time: two days ago (guyyaa lama dura). in + time = after that time from now: I'll be back in ten minutes.","p_om":"for + dheerina yeroo: for three hours, for two years. since + yeroo jalqabaa: since Monday, since 2015 (barnoota Present perfect ilaali). during + taatee: during the meeting. from … to / until: from 8 to 5; wait until six (hanga). by = sana caalaa hin turin: finish it by Friday. before / after: before lunch, after class. ago yeroo BOODA dhufa: two days ago (guyyaa lama dura). in + yeroo = amma irraa jalqabee yeroo sana booda: I'll be back in ten minutes (daqiiqaa kudhan booda nan deebi'a)."},{"h_en":"English time and Ethiopian time","h_om":"Yeroo Ingiliffaa fi yeroo Itoophiyaa","p_en":"English always uses the international clock, which counts from midnight: 7:00 a.m. is 'sa'aatii 1 ganama' in Ethiopian time. a.m. = before noon, p.m. = after noon. When you speak English, convert the time, or say clearly 'Ethiopian time'. The same with dates: the Ethiopian calendar is about 7–8 years behind the international one, and its year starts in September.","p_om":"Ingiliffi yeroo hunda sa'aatii addunyaa fayyadama; innis walakkaa halkanii irraa lakkaa'a: 7:00 a.m. yeroo Itoophiyaatiin 'sa'aatii 1 ganama' jedhama. a.m. = waaree dura, p.m. = waaree booda. Yeroo Ingiliffa dubbattu, sa'aatii jijjiiri, yookiin ifatti 'Ethiopian time' jedhi. Guyyaa ji'aas akkasuma: dhaha (kaaleendarii) Itoophiyaa kan addunyaa irra waggaa 7–8 duuba jira, barri isaas Fulbaana keessa jalqaba.","table":{"head":["International (English)","Ethiopian time"],"rows":[["6:00 a.m.","sa'aatii 12 halkan / barii"],["7:00 a.m.","sa'aatii 1 ganama"],["9:00 a.m.","sa'aatii 3 ganama"],["12:00 noon","sa'aatii 6 (waaree)"],["3:00 p.m.","sa'aatii 9 waaree booda"],["6:00 p.m.","sa'aatii 12 galgala"],["9:00 p.m.","sa'aatii 3 halkan"],["12:00 midnight","sa'aatii 6 halkan"]]},"ex":[["The meeting starts at 9 a.m. on Monday.","Walgahiin Wiixata sa'aatii 3 ganamaa jalqaba.","","",0],["I was born in 1998.","Ani bara 1998 dhaladhe.","International calendar year.","Bara dhaha addunyaatiin.",0],["We'll finish the work by Friday.","Hojicha Jimaata dura ni xumurra.","","",0],["He has lived here since 2015.","Inni erga bara 2015 as asitti jiraata.","","",0],["I studied for three hours.","Sa'aatii sadiif qo'adhe.","","",0],["They came two days ago.","Isaan guyyaa lama dura dhufan.","","",0],["Don't use your phone during the exam.","Yeroo qormaataa bilbila kee hin fayyadamin.","","",0],["See you next week
