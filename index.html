gabaasuu barbaada.","","",0],["My house was broken into.","Manni koo saamameera.","","",0],["My phone was stolen.","Bilbilli koo hatameera.","","",0],["When did it happen?","Yoom ta'e?","","",0],["About an hour ago, when I got home.","Gara sa'aatii tokko dura, yeroon mana gale.","","",0],["What was taken?","Maaltu hatame?","","",0],["How did they get in?","Akkamitti seenan?","","",0],["They broke the back door.","Balbala duubaa cabsanii seenan.","","",0],["Did you see the thief?","Hattuu argitee?","","",0],["He was tall and wore a black jacket.","Dheeraa ture, jaakeetii gurraacha uffatee ture.","","",0],["Please don't touch anything.","Maaloo homaa hin tuqin.","","",0],["An officer will be there soon.","Poolisiin dafee achi gaha.","","",0],["Can I see your ID, please?","Maaloo waraqaa eenyummaa kee agarsiisi.","","",0],["Where were you on the night of the 5th?","Halkan guyyaa 5ffaa eessa turte?","","",0],["Who were you with?","Eenyu waliin turte?","","",0],["I was at home all night.","Halkan guutuu mana ture.","","",0],["Can anyone confirm that?","Kana kan mirkaneessu nama jiraa?","","",0],["I didn't do anything wrong.","Ani waan badaa tokkollee hin hojjanne.","","",0],["Am I under arrest?","Ani hidhameeraa?","","",0],["I want to speak to a lawyer.","Abukaatoo waliin haasa'uu barbaada.","","",0]]},{"id":"market","en":"At the market","om":"Gabaa irratti","icon":"🧺","group":"services","intros":{"rwb":{"en":"Open-air markets (gabaa) are held on fixed days, and bargaining is expected: start lower, stay friendly, and walk away politely if the price is too high. Prices are often given per kilo or per pile. In English-speaking shops prices are usually fixed, so bargaining is mainly for markets and second-hand goods.","om":"Gabaan guyyaa murtaa'eetti walitti qabama; gatii irratti waliin dubbachuun eegama — gatii gadi aanaa jalqabi, nagaan dubbadhu, yoo qaaliidha ta'e safuun dhiisii deemi. Gatiin yeroo baay'ee kiiloon ykn tuulaan himama. Suuqiiwwan Ingiliffaa keessatti gatiin murtaa'aadha; gatii hir'isuun gabaa fi meeshaa itti fayyadamameef qofa."}},"items":[["Where is the market?","Gabaan eessa jira?","","",0],["What day is market day?","Guyyaan gabaa yoom?","Many towns hold a big market on one fixed day each week.","Magaalonni hedduun guyyaa murtaa'aa torbanitti gabaa guddaa qabu.",0],["How much is this?","Kun meeqa?","","",0],["How much is a kilo of tomatoes?","Timaatimni kiiloon meeqa?","","",0],["It's too expensive.","Baay'ee qaaliidha.","","",0],["It's cheap.","Rakasaadha.","","",0],["Can you lower the price?","Gatii hir'isuu dandeessaa?","","",0],["What's your last price?","Gatiin dhumaa meeqa?","","",0],["Give me a discount, please.","Maaloo, naaf hir'isi.","","",0],["I'll give you fifty birr.","Qarshii shantama siif nan kenna.","","",0],["I won't pay more than that.","Kana caalaa hin kaffalu.","","",0],["OK, it's a deal.","Tole, walii galle.","","",0],["Do you have onions?","Shunkurtaa qabdaa?","","",0],["Is it fresh?","Haaraadhaa?","","",0],["I'll take two kilos.","Kiiloo lama nan fudhadha.","","",0],["Put it in a bag for me.","Kiisii keessa naaf kaa'i.","","",1]]},{"id":"business","en":"Business talk","om":"Haasaa daldalaa","icon":"📈","group":"services","intros":{"rwb":{"en":"Trade (daldala) is central to Oromo towns and markets. Questions about income and profit are common between traders, and loans between friends are taken seriously. Use liqii for a loan you repay in money and ergifachuu for borrowing an item.","om":"Daldalli magaalotaa fi gabaawwan Oromiyaa keessatti iddoo guddaa qaba. Daldaltoota gidduutti gaaffiin galii fi bu'aa baramaadha; liqiin hiriyoota gidduu jirus ulfaatina qaba. Liqii maallaqaan deebi'uuf 'liqii', meeshaa deebi'uuf immoo 'ergifachuu' fayyadami."}},"items":[["How's business?","Daldalli akkam?","","",0],["Who lent you the money for your business?","Daldalaaf maallaqa eenyutu siif liqeesse?","","",0],["I took a loan from the bank.","Baankii irraa liqii fudhadhe.","","",0],["How much do you earn a month?","Galiin kee ji'aan meeqa?","","",0],["About fifty thousand birr.","Gara qarshii kuma shantamaa.","","",0],["What are your daily expenses?","Baasiin kee guyyaatti hammam?","","",0],["Do you make a profit?","Bu'aa ni argattaa?","","",0],["We had a loss this year.","Bara kana kasaaraan nu mudate.","","",0],["Prices are going up.","Gatiin ol ka'aa jira.","","",0],["The economy isn't growing as expected.","Diinagdeen akka eegametti guddachaa hin jiru.","","",0],["Are there job opportunities?","Carraan hojii ni jiraa?","","",0],["Let's discuss the price.","Waa'ee gatii haa mari'annu.","","",0],["I need a receipt.","Nagahee na barbaachisa.","","",0]]},{"id":"travel","en":"Travel & transport","om":"Imala fi geejjiba","icon":"🚌","group":"services","intros":{"rwb":{"en":"Long-distance buses (atoobisii) and minibuses leave from a bus station (buufata) and often wait until they are full. Tell the driver Maaloo, as na buusi to get off. Departure times are usually given on the Ethiopian clock.","om":"Atoobisiin fi mini-baasiin buufata irraa ka'u; yeroo baay'ee hanga guutamanitti eegu. Bakka buufamuu barbaaddutti 'Maaloo, as na buusi' jedhi. Sa'aan ka'umsaa yeroo baay'ee sa'aa Itoophiyaatiin himama."}},"items":[["Where is the bus station?","Buufanni atoobisii eessa jira?","","",0],["Does this bus go to Adama?","Atoobisiin kun gara Adaamaa ni deemaa?","","",0],["Is there a free seat?","Iddoon jiraa?","","",0],["What time does it leave?","Sa'aa meeqatti ka'a?","","",0],["What time does it arrive?","Sa'aa meeqatti ga'a?","","",0],["How much is the fare?","Kaffaltiin imalaa meeqa?","","",0],["Let me off here, please.","Maaloo, as na buusi.","","",0],["Please drive slowly.","Maaloo, suuta oofi.","","",0],["I came by bus.","Atoobisiin dhufe.","","",0],["I want to go to Jimma.","Jimmaa deemuun barbaada.","","",0],["Where are you traveling to?","Gara eessaatti imalta?","","",0],["I'm going to the airport.","Buufata xiyyaaraa deemaa jira.","","",0],["Have a good trip!","Imala gaarii!","","",0],["The car broke down.","Konkolaataan hojii dhaabeera.","","",0],["Do you have a driver's license?","Hayyama konkolaachisummaa qabdaa?","","",0],["Is there a hotel here?","Hoteelli as jiraa?","","",0],["I'd like a room for two nights.","Halkan lamaaf kutaa barbaada.","","",0],["Can you take our photo?","Suuraa nu kaasuu dandeessaa?","","",0]]},{"id":"work","en":"Talking about work","om":"Waa'ee hojii haasa'uu","icon":"💼","group":"work","intros":{"pse":{"en":"'What do you do?' is one of the first questions Americans ask; answer with your job and workplace ('I'm a nurse at a clinic'). Coworkers usually use first names, even with the boss. In Oromo, the person doing a job often ends in -aa (male) / -tuu (female): barsiisaa / barsiistuu (teacher).","om":"Ameerikaanonni yeroo jalqabaa 'What do you do?' jedhanii gaafatu; hojii kee fi bakka itti hojjattu himi ('I'm a nurse at a clinic'). Hiriyoonni hojii, hoogganaa dabalatee, maqaa duraatiin wal waamu. Afaan Oromootiin maqaan ogeessaa -aa (dhiira) / -tuu (dubartii)n xumurama: barsiisaa / barsiistuu."},"rwb":{"en":"People introduce themselves by their job: Ani barsiisaadha (I'm a teacher). Many job words have a male form in -aa and a female form in -tuu (barsiisaa / barsiistuu). Remember that working hours are often given on the Ethiopian clock.","om":"Namni hojii isaatiin of beeksisa: Ani barsiisaadha. Jechoonni hojii hedduun unka dhiiraa -aa fi unka dubartii -tuu qabu (barsiisaa / barsiistuu). Sa'aan hojii yeroo baay'ee sa'aa Itoophiyaatiin akka himamu yaadadhu. Afaan Ingiliffaa keessatti hojii dura 'a/an' dhufa: I'm a teacher."}},"items":[["What do you do for a living?","Hojiin kee maali?","","",0],["I'm a teacher.","Ani barsiisaadha.","Female speaker: Ani barsiistuudha.","",0],["I work at a bank.","Ani baankii keessa hojjadha.","","",0],["I'm self-employed.","Hojii dhuunfaa koo hojjadha.","","",0],["I'm between jobs right now.","Yeroo ammaa hojii hin qabu.","A positive way of saying you are unemployed.","",0],["How long have you worked there?","Achitti erga hojjachuu jalqabdee hangam ta'e?","","",0],["Do you enjoy your job?","Hojii keetiin gammaddaa?","","",0],["It's hard work, but I like it.","Hojii cimaadha, garuu nan jaalladha.","","",0],["I work nine to five.","Sa'aatii 3 hanga 11tti hojjadha.","Ethiopian time (3 = 9 a.m., 11 = 5 p.m.).","",0],["I'm swamped with work.","Hojiin natti baay'ateera.","","",0],["I have a meeting at ten.","Sa'aatii 4tti walgahii qaba.","Ethiopian time (4 = 10 a.m.).","",0],["My boss is very strict.","Hoogganaan koo baay'ee cimaadha.","","",0],["This is my colleague, Hana.","Kun hiriyaa hojii koo, Haannaadha.","","",0],["We get along well.","Sirriitti walii galla.","","",0],["Let's work as a team.","Akka gareetti haa hojjannu.","","",0],["I'm on vacation next week.","Torbee dhufu boqonnaa irran jira.","","",0],["I got a promotion!","Guddina sadarkaa argadheera!","","",0],["I'm going to quit my job.","Hojii koo dhiisuuf jira.","","",0],["He was fired.","Hojii irraa ari'ame.","","",0],["What do you do?","Maal hojjetta?","Respect/plural: Maal hojjettu? Also: Hojiin kee maali?","Kabajaaf/baay'inaaf: Maal hojjettu? Akkasumas: Hojiin kee maali?",0],["I'm a student.","Ani barataadha.","A woman: Ani barattuudha.","Dubartiin: Ani barattuudha.",0],["I'm a trader.","Ani daldalaadha.","A woman: daldaltuudha. Also: nagaadee.","Dubartiin: daldaltuudha. Akkasumas: nagaadee.",0],["I'm a farmer.","Ani qonnaan bulaadha.","A woman: qonnaan bultuudha.","Dubartiin: qonnaan bultuudha.",0],["Where do you work?","Eessa hojjetta?","Respect/plural: Eessa hojjettu?","Kabajaaf/baay'inaaf: Eessa hojjettu?",0],["I work at the hospital.","Ani hospitaalatti hojjedha.","Also: mana yaalaatti.","Akkasumas: mana yaalaatti.",0],["She doesn't work; she's a student.","Isheen hin hojjettu; barattuudha.","","",0],["How many hours do you work?","Sa'aa meeqa hojjetta?","","",0],["I work five days a week.","Torbaanitti guyyaa shan hojjedha.","","",0],["I work from 8 to 5.","Sa'aa lama irraa hanga sa'aa kudha tokkootti hojjedha.","Ethiopian clock: 8 a.m. = sa'aa lama, 5 p.m. = sa'aa kudha tokko.","Sa'aa Itoophiyaa: 8 ganama = sa'aa lama, 5 galgala = sa'aa kudha tokko.",0],["I'm looking for a job.","Hojii barbaadaa jira.","","",0],["I have to go to work.","Hojiitti deemuu qaba.","","",0],["Did you finish?","Xumurtee?","","",0],["I haven't finished yet.","Ammallee hin xumurre.","","",0]]},{"id":"jobsearch","en":"Looking for a job","om":"Hojii barbaaduu","icon":"🔎","group":"work","intros":{"pse":{"en":"In the US you apply with a résumé and a short cover letter, often online. At an interview, make eye contact, shake hands firmly and talk confidently about what you have achieved—modesty is valued in Oromo culture, but American interviewers expect you to 'sell yourself'. Send a short thank-you email afterward.","om":"Ameerikaatti hojiif CV fi xalayaa gabaabaa (cover letter) waliin, yeroo baay'ee interneetiin iyyatta. Af-gaaffii irratti ija nama ilaali, harka cimsii fuudhi, waan galmeessite ofitti amanamummaan himi. Aadaa Oromoo keessatti of tuuluu dhiisuun ni jaallatama; af-gaaffii Ameerikaa irratti garuu dandeettii kee ifatti himuu qabda. Booda ergaa galataa gabaabaa ergi."}},"items":[["I'm looking for a job.","Hojii barbaadaa jira.","","",0],["Are you hiring?","Hojjattoota ni qacartuu?","","",0],["I saw your job ad online.","Beeksisa hojii keessanii interneetii irratti arge.","","",0],["I'd like to apply for the position.","Iddoo hojii kanaaf iyyachuu barbaada.","","",0],["Here is my résumé.","Kunoo CV koo.","","",0],["What are the requirements?","Ulaagaaleen isaa maal fa'i?","","",0],["Tell me about yourself.","Mee waa'ee kee natti himi.","","",0],["Why do you want this job?","Hojii kana maaliif barbaadde?","","",0],["What are your strengths?","Ciminni kee maali?","","",0],["I have three years of experience.","Muuxannoo waggaa sadii qaba.","","",0],["I'm a fast learner.","Dafee nan baradha.","","",0],["Is it full-time or part-time?","Yeroo guutuu moo yeroo muraasa?","","",0],["What's the salary?","Mindaan isaa meeqa?","","",0],["When can you start?","Yoom jalqabuu dandeessa?","","",0],["We'll get back to you next week.","Torbee dhufu deebii siif kennina.","","",0],["Thank you for the interview.","Af-gaaffii kanaaf galatoomaa.","","",0],["Congratulations, you got the job!","Baga gammadde, hojicha argatteetta!","","",0]]},{"id":"study","en":"Studies and graduation","om":"Barnoota fi eebba","icon":"🎓","group":"work","intros":{"pse":{"en":"Graduation (eebba) is a big family celebration in Ethiopia, with flowers, photos and gifts; in the US there is a ceremony in caps and gowns, often followed by a party. In English you congratulate the graduate ('Congratulations! You did it!') and ask about their degree and future plans.","om":"Eebbi Itoophiyaatti ayyaana maatii guddaadha: abaaboo, suuraa fi kennaa qaba. Ameerikaattis sirna uffata eebbaa fi qoobii wajjin, achiis cidha xiqqaa qabu. Ingiliffaan nama eebbifame 'Congratulations! You did it!' jettee, waa'ee digirii fi karoora isaa ni gaafatta."},"rwb":{"en":"Afaan Oromoo is the language of instruction in Oromia's primary schools and is written in Qubee, a Latin-based alphabet. Teachers speak to the class with plural commands (Kitaabota keessan banaa — 'Open your books'). Graduation (eebba) is a big family celebration.","om":"Afaan Oromoo mana barumsaa sadarkaa duraa Oromiyaa keessatti afaan barsiisaati; qubee Laatiniitiin barreeffama. Barsiisaan kutaa guutuuf ajaja baay'inaa fayyadama (Kitaabota keessan banaa). Eebbi ayyaana guddaa maatiiti."}},"items":[["What are you studying?","Maal barachaa jirta?","","",0],["I'm studying medicine.","Ogummaa fayyaa barachaa jira.","","",0],["What year are you in?","Waggaa meeqaffaa irra jirta?","","",0],["I'm in my final year.","Waggaa xumuraa irran jira.","","",0],["I have an exam tomorrow.","Boru qormaata qaba.","","",0],["I passed!","Darbeera!","","",0],["I failed the test.","Qormaata kufeera.","","",0],["When do you graduate?","Yoom eebbifamta?","","",0],["The graduation ceremony is on Saturday.","Sirni eebbaa Sanbata ta'a.","","",0],["I graduated from Jimma University.","Yuunivarsiitii Jimmaa irraa eebbifame.","","",0],["I have a bachelor's degree in economics.","Diinagdeedhaan digirii jalqabaa qaba.","","",0],["I'm doing a master's degree.","Digirii lammaffaa barachaa jira.","","",0],["Congratulations on your graduation!","Baga eebbifamte!","Respect/plural: Baga eebbifamtan!","",0],["We're so proud of you.","Baay'ee siin boonna.","","",0],["You worked so hard for this.","Kanaaf baay'ee dadhabde.","","",0],["What are your plans after graduation?","Eebba booda maal karoorfatte?","","",0],["I want to continue my studies abroad.","Barnoota koo biyya alaatti itti fufuu barbaada.","","",0],["I'm learning Afaan Oromoo.","Afaan Oromoo barachaa jira.","","",0],["I teach English.","Afaan Ingiliffaa nan barsiisa.","","",0],["I study at the university.","Yuunivarsiitii keessatti barachaa jira.","","",0],["Which grade are you in?","Kutaa meeqa barachaa jirta?","","",0],["I'm in eighth grade.","Kutaa saddeet barachaa jira.","","",0],["I have a question.","Gaaffii qaba.","","",0],["What's your question?","Gaaffiin kee maali?","","",0],["Open your books. (to a class)","Kitaabota keessan banaa.","","",0],["Repeat after me.","Ana booda irra deebi'aa.","","",0],["Raise your hand.","Harka kee ol kaasi.","","",0],["Do your homework.","Hojii manaa kee hojjedhu.","","",0],["I passed the exam.","Qormaata darbeera.","","",0],["My favorite subject is math.","Barnoonni ani jaalladhu herrega.","","",0]]},{"id":"discuss","en":"Discussions and meetings","om":"Marii fi walgahii","icon":"🗣️","group":"work","intros":{"pse":{"en":"In American meetings people are expected to speak up, ask questions and disagree politely; staying silent can look like you have nothing to add. Use signpost phrases (first, for example, on the other hand, to sum up) to organize your points. Traditional Oromo assemblies are slower—speakers wait their turn and elders use proverbs—while English business meetings are more direct.","om":"Walgahii Ameerikaa irratti yaada kennuu, gaaffii gaafachuu fi kabajaan yaada mormuu eegama; callisuun 'waan dabaltu hin qabu' fakkaata. Yaada kee qindeessuuf jechoota akka 'first', 'for example', 'on the other hand', 'to sum up' fayyadami. Marii aadaa Oromoo keessatti namni dabareedhaan dubbata, maanguddoonnis mammaaksa fayyadamu; walgahiin hojii Ingiliffaa garuu kallattii fi saffisaadha."},"rwb":{"en":"Oromo has a long tradition of discussion and consensus — think of the Gadaa assemblies — and elders often speak first. To disagree politely, offer your view gently with Akka yaada kootti ('In my opinion'). Dhugaa qabda ('you have truth') means 'You're right'.","om":"Oromoon aadaa mari'achuu fi walii galuu dheeraa qaba (fakkeenyaaf, walgahii Gadaa); maanguddoonni yeroo baay'ee dursanii dubbatu. Yaada garaagaraa kabajaan dhiyeessuuf 'Akka yaada kootti...' jedhi. 'Dhugaa qabda' jechuun 'You're right' jechuudha."}},"items":[["Let's get started.","Haa jalqabnu.","","",0],["The purpose of this meeting is to plan the event.","Kaayyoon walgahii kanaa sagantaa qopheessuudha.","","",0],["What do you think?","Ati maal yaadda?","Respect/plural: Isin maal yaaddu? Also: Maal yaadda?","",0],["Does anyone have any ideas?","Namni yaada qabu jiraa?","","",0],["Could I add something?","Waan tokko dabaluu danda'aa?","","",0],["Sorry to interrupt, but...","Dubbii kee kutuu kootti dhiifama, garuu...","","",0],["Please let her finish.","Maaloo akka xumurtu dhiisaa.","","",0],["For example, ...","Fakkeenyaaf, ...","","",0],["In other words, ...","Jecha biraatiin, ...","","",0],["Let me put it another way.","Mee karaa biraatiin haa ibsu.","","",0],["Are you following me?","Na hordofaa jirtaa?","","",0],["Do you see what I mean?","Waanan jechuu barbaadu hubattee?","","",0],["I see your point.","Yaada kee hubadheera.","","",0],["That's a good point.","Kun yaada gaariidha.","","",0],["On the other hand, ...","Gama biraatiin, ...","","",0],["I think the main problem is money.","Rakkoon guddaan qarshiidha jedheen yaada.","","",0],["Firstly... Secondly... Finally...","Tokkoffaa... Lammaffaa... Dhumarratti...","","",0],["Let's get back to the topic.","Gara mata dureetti haa deebinu.","","",0],["Where were we?","Eessa geenye turre?","","",0],["We're running out of time.","Yeroon nu dhumaa jira.","","",0],["To sum up, ...","Walumaagalatti, ...","","",0],["In conclusion, ...","Xumura irratti, ...","","",0],["Let's wrap up.","Haa xumurru.","","",0],["What do you think about this?","Waa'ee kanaa maal yaadda?","","",0],["In my opinion, it's a good idea.","Akka yaada kootti, yaada gaariidha.","","",0],["Good idea!","Yaada gaarii!","","",0],["I agree with you.","Si wajjin walii gala.","","",0],["I don't agree with you on this.","Kana irratti si wajjin walii hin galu.","","",1],["You're right.","Dhugaa qabda.","Respect/plural: Dhugaa qabdu.","Kabajaaf/baay'inaaf: Dhugaa qabdu.",0],["You're wrong.","Dogoggorte.","","",0],["That's true.","Dhugaadha.","","",0],["Let me think about it.","Mee itti haa yaadu.","","",0],["It seems to me he's right.","Inni sirrii akka ta'e natti fakkaata.","","",0],["Let's discuss it.","Waa'ee isaa haa mari'annu.","","",0],["Let me explain.","Mee siif haa ibsu.","","",0],["What do you mean?","Maal jechuu kee?","","",0]]},{"id":"directions","en":"Asking for directions","om":"Kallattii gaafachuu","icon":"🧭","group":"travel","intros":{"pse":{"en":"Start with 'Excuse me' and finish with 'Thanks!'. Americans give directions with blocks, street names and left/right, while in Ethiopia people mostly use landmarks—a church, a hotel, a big tree—so it helps to ask about one. In Oromo, place is shown with endings: gara bitaatti (to the left), baankii cinaa (next to the bank).","om":"Kallattii gaafachuuf 'Excuse me' jedhii jalqabi, 'Thanks!' jedhiis xumuri. Ameerikaanonni 'block', maqaa daandii fi bitaa/mirga fayyadamu; Itoophiyaatti garuu mallattoo beekamoo (mana sagadaa, hoteela, muka guddaa) fayyadamu. Afaan Oromootiin bakki dhaamsota maxxantuutiin ibsama: gara bitaatti, baankii cinaa."},"rwb":{"en":"Location words come after the noun: mana barumsaa fuuldura (in front of the school), baankii cinaa (next to the bank). Gara means 'toward': gara bitaatti (to the left), gara mirgaatti (to the right). Many people give directions by landmarks rather than street names; in English, 'in front of' and 'next to' come before the noun.","om":"Jechoonni bakkaa maqaa booda dhufu: mana barumsaa fuuldura, baankii cinaa. 'Gara' jechuun 'toward' jechuudha: gara bitaatti, gara mirgaatti. Namoonni hedduun maqaa daandii irra mallattoo beekamaatiin kallattii agarsiisu; Afaan Ingiliffaa keessatti 'in front of', 'next to' maqaa dura dhufu."}},"items":[["Excuse me, where is the bus station?","Dhiifama, buufanni awtobusii eessa?","","",0],["How do I get to the hospital?","Gara hospitaalaa akkamitti deema?","","",0],["Is it far from here?","Asii fagaataa?","","",0],["It's about ten minutes on foot.","Miillaan daqiiqaa kudhan qofa.","","",0],["Go straight ahead.","Kallattiin qajeelaa deemi.","Respect/plural: Kallattiin qajeelaa deemaa. Also: Qajeelaan deemi.","",0],["Turn left at the corner.","Golee irratti gara bitaatti gori.","","",0],["Turn right at the traffic light.","Ibsaa tiraafikaa irratti gara mirgaatti gori.","","",0],["Take the second street on the right.","Daandii lammaffaa gara mirgaatti jiru qabadhu.","","",0],["Go past the market.","Gabaa darbii deemi.","","",0],["It's next to the bank.","Baankii cinaa jira.","","",0],["It's across from the church.","Mana sagadaa fuullee jira.","","",0],["It's on your left.","Gara bitaa keetiin jira.","","",0],["You can't miss it.","Salphaatti argatta.","","",0],["Is there a landmark near it?","Mallattoon beekamaan itti dhiyoo jiraa?","","",0],["I'm lost.","Karaan natti badeera.","","",0],["Can you show me on the map?","Kaartaa irratti na agarsiisuu dandeessaa?","Also: Kaartaa irratti natti agarsiisuu dandeessaa?","",0],["Which bus goes to Piassa?","Awtobusiin kam gara Piyaassaa deema?","","",0],["How far is Ambo from here?","Amboon asii hangam fagaata?","","",0],["Sorry, I'm not from around here.","Dhiifama, ani nama naannoo kanaa miti.","","",0],["Where is the hospital?","Hospitaalli eessa jira?","","",0],["How do I get to the market?","Gara gabaa akkamitti deema?","","",0],["Is it far?","Fagoodhaa?","","",0],["No, it's close.","Lakki, dhihoodha.","","",0],["Turn left.","Gara bitaatti gori.","","",0],["Turn right.","Gara mirgaatti gori.","","",0],["Cross the road.","Karaa ce'i.","","",0],["Come this way.","Garana koottu.","","",0],["It's over there.","Achi jira.","","",0],["It's in front of the school.","Mana barumsaa fuuldura jira.","","",0],["It's between the two shops.","Suuqiiwwan lamaan gidduu jira.","","",0],["Which way is it?","Karaa kamiin?","","",0],["How far is it from here to Finfinnee?","Asii hanga Finfinneetti hammam fagaata?","","",0],["About a hundred kilometers.","Gara kiiloomeetira dhibba tokko.","","",0],["Ambo is west of Finfinnee.","Amboon Finfinnee irraa gara dhihaatti argama.","","",0]]},{"id":"airport","en":"At the airport","om":"Buufata xiyyaaraatti","icon":"🛂","group":"travel","intros":{"pse":{"en":"At passport control, answer simply and truthfully: the purpose of your visit, how long you'll stay and where. At the check-in desk you show your ticket and passport, check your bags and choose a seat (window or aisle). On most international flights, liquids over 100 ml are not allowed in hand luggage.","om":"Too'annoo paaspoortii irratti salphaa fi dhugaadhaan deebisi: kaayyoo daawwannaa, yeroo turtuu fi bakka bultu. Iddoo galmee (check-in) irratti tikeetii fi paaspoortii agarsiifta, shaanxaa galchita, teessoo (foddaa cinaa ykn karaa cinaa) filatta. Balalii idil-addunyaa baay'ee irratti dhangala'aan ml 100 ol meeshaa harkaa keessatti hin hayyamamu."}},"items":[["May I see your passport, please?","Maaloo paaspoortii kee ilaaluu danda'aa?","","",0],["What's the purpose of your visit?","Kaayyoon daawwannaa keetii maali?","","",0],["I'm here on vacation.","Boqonnaaf dhufe.","","",0],["I'm here on business.","Hojii daldalaatiif dhufe.","","",0],["How long will you be staying?","Yeroo hangamiif turta?","","",0],["Where will you be staying?","Eessa bulta?","","",0],["Do you have anything to declare?","Waan beeksifamuu qabu qabdaa?","Customs question about goods you must report.","",0],["Can I see your ticket?","Tikeetii kee ilaaluu danda'aa?","","",0],["How many bags are you checking?","Shaanxaa meeqa galchita?","","",0],["Can I take this as hand luggage?","Kana akka meeshaa harkaatti qabachuu danda'aa?","","",0],["Window or aisle?","Foddaa cinaa moo karaa cinaa?","","",0],["Here's your boarding pass.","Kunoo kaardii seensa xiyyaaraa.","","",0],["Your flight is delayed.","Balaliin kee tureera.","","",0],["Which gate?","Balbala kamiin?","","",0],["Boarding starts at 10:30.","Seensi sa'aatii 4:30tti jalqaba.","Ethiopian time (4:30 = 10:30 a.m.).","",0]]},{"id":"flight","en":"Booking a flight","om":"Tikeetii balalii kutachuu","icon":"✈️","group":"travel","intros":{"pse":{"en":"When booking a flight, compare the price, total travel time and number of stops; a 'direct' or 'nonstop' flight means no change of plane. Check the baggage allowance and whether the ticket can be changed or refunded.","om":"Tikeetii yoo kutattu, gatii, yeroo imalaa guutuu fi buufata meeqa akka dhaabbatu wal bira qabi; balaliin 'direct' ykn 'nonstop' xiyyaara hin jijjiiru. Meeshaa hangamii fudhachuu akka dandeessu fi tikeetiin jijjiiramuu ykn qarshiin deebi'uu danda'uu isaa mirkaneeffadhu."}},"items":[["I'd like to book a flight to Nairobi.","Gara Naayroobiitti balaliif iddoo qabachuu barbaada.","","",0],["One way or round trip?","Deemsa qofa moo deemsaa fi deebii?","","",0],["Round trip, please.","Maaloo, deemsaa fi deebii.","","",0],["When would you like to leave?","Yoom ka'uu barbaadda?","","",0],["Which airline is the cheapest?","Dhaabbanni xiyyaaraa gatii hunda caalaa salphaa qabu kami?","","",0],["Is it a direct flight?","Balalii kallattiidhaa?","","",0],["No, you change planes in Dubai.","Lakki, Dubaayitti xiyyaara jijjiirta.","","",0],["How long is the flight?","Balaliin sa'aatii meeqa fudhata?","","",0],["How much is the ticket?","Tikeetiin meeqa?","","",0],["How much baggage can I take?","Meeshaa hangamii fudhachuu danda'a?","","",0],["Is the ticket refundable?","Tikeetiin yoo haqame qarshiin ni deebi'aa?","","",0],["I'd like to change my flight.","Guyyaa balalii koo jijjiiruu barbaada.","","",0],["Have a nice flight!","Balaliin gaarii siif haa ta'u!","","",0]]},{"id":"hotel","en":"At the hotel","om":"Hoteela keessatti","icon":"🏨","group":"travel","intros":{"pse":{"en":"At hotel reception you give your name and booking details and show ID; ask about breakfast, Wi-Fi and checkout time. In the US it is customary to tip porters and housekeeping a few dollars. Report problems with the room right away so they can move you or fix them.","om":"Hoteela keessatti maqaa kee fi odeeffannoo kutaa qabatte himtee waraqaa eenyummaa agarsiifta; waa'ee ciree, Wi-Fi fi sa'aatii itti baatu gaafadhu. Ameerikaatti baattuu meeshaa fi qulqulleessitootaaf doolaara muraasa tiippii kennuun baratamaadha. Kutaan rakkoo yoo qabaate, battalumatti himi."}},"items":[["I have a reservation under the name Tola.","Maqaa Tolaatiin kutaa qabadheera.","","",0],["Do you have any rooms available?","Kutaa duwwaa qabduu?","","",0],["A single room for two nights, please.","Maaloo, kutaa nama tokkoo halkan lamaaf.","","",0],["How much is it per night?","Halkan tokkoof meeqa?","","",0],["Is breakfast included?","Ciireen itti dabalameeraa?","","",0],["Here's your key card.","Kunoo kaardii furtuu kee.","","",0],["Your room is on the third floor.","Kutaan kee darbii sadaffaa irra jira.","","",0],["What's the Wi-Fi password?","Jechi icciitii Wi-Fi maali?","","",0],["The air conditioner doesn't work.","Qabbaneessaan qilleensaa hin hojjatu.","","",0],["Could I have an extra towel?","Foxaa dabalataa argachuu danda'aa?","","",1],["What time is checkout?","Sa'aatii meeqatti kutaa gad dhiisuu qaba?","","",0],["I'd like to check out, please.","Maaloo, ba'uu barbaada; herrega koo naaf qopheessi.","","",0]]},{"id":"feelings","en":"Feelings, problems and sympathy","om":"Miira, rakkoo fi gadda qooddachuu","icon":"💭","group":"feelings","intros":{"pse":{"en":"Americans often ask 'Are you okay?' or 'What's wrong?' when someone looks upset, and expect an honest but short answer. To show sympathy, say 'That's too bad' or 'I'm sorry to hear that'. In Oromo many feelings are described as something that seizes you: Sodaan na qabe ('Fear seized me'), Dheebuun na qabe ('Thirst seized me').","om":"Ameerikaanonni nama dhiphate yoo argan 'Are you okay?' ykn 'What's wrong?' jedhanii gaafatu; deebii dhugaa fi gabaabaa eegu. Gadda qooddachuuf 'That's too bad' ykn 'I'm sorry to hear that' jedhi. Afaan Oromootiin miirri baay'een akka waan nama qabuutti ibsama: 'Sodaan na qabe', 'Dheebuun na qabe'."},"rwb":{"en":"Many feelings are expressed with a perfect verb for a present state: Gammadeera (I'm happy, lit. 'I have become happy'), Dadhabeera (I'm tired). Others use 'X has seized me': Hirribni na qabeera (I'm sleepy). In English these are simply 'I am + adjective'.","om":"Miirri hedduun gochima yeroo darbeetiin ibsama: Gammadeera, Dadhabeera. Kaan immoo 'X na qabe' jedhamee ibsama: Hirribni na qabeera. Afaan Ingiliffaa keessatti 'I am + ibsa maqaa' (I am happy, I am tired) jedhama."}},"items":[["Are you okay?","Nagaadhaa?","","",0],["What's wrong?","Maaltu si mudate?","","",0],["You look upset.","Dhiphatte fakkaatta.","","",0],["You look tired.","Dadhabde fakkaatta.","","",0],["I'm worried about my exam.","Waa'ee qormaata kootii yaaddoo qaba.","","",0],["I'm stressed out.","Baay'ee dhiphadheera.","","",0],["I'm having a hard time.","Yeroo cimaa keessa jira.","","",0],["I have a lot of problems right now.","Yeroo ammaa rakkoo baay'een qaba.","","",0],["I feel lonely.","Kophummaan natti dhaga'ama.","","",0],["I'm homesick.","Biyya koo baay'een yaade.","","",1],["I'm so happy!","Baay'ee gammadeera!","","",0],["I'm excited about the trip.","Imalichaaf baay'een hawwa.","","",0],["I'm scared.","Sodaadheera.","","",0],["I'm bored.","Nuffeera.","","",0],["I'm disappointed.","Abdiin na kute.","","",0],["I'm feeling under the weather.","Xiqqoo dhukkubsadheera.","Means: I feel a little sick.","",0],["That's too bad.","Kun gaddisiisaadha.","","",0],["I'm sorry to hear that.","Kana dhaga'uu kootti nan gadda.","","",0],["Don't worry, it'll be fine.","Hin yaadda'in, ni fooyya'a.","","",0],["Is there anything I can do?","Waan ani gochuu danda'u jiraa?","","",0],["I'm here for you.","Ani siif jira.","","",0],["Cheer up!","Gammadi!","Said to someone who is sad.","",0],["I'm happy.","Gammadeera.","","",0],["I'm sad.","Gaddeera.","","",0],["Why are you sad?","Maaliif gaddaa jirta?","","",0],["I'm angry.","Aareera.","","",0],["Don't be angry with me.","Natti hin aarin.","Respect/plural: Natti hin aarinaa.","Kabajaaf/baay'inaaf: Natti hin aarinaa.",0],["Don't be afraid.","Hin sodaatin.","Respect/plural: Hin sodaatinaa.","Kabajaaf/baay'inaaf: Hin sodaatinaa.",0],["I'm tired.","Dadhabeera.","","",0],["I'm worried.","Yaadda'eera.","","",0],["I feel embarrassed.","Qaana'eera.","","",0],["Don't cry.","Hin boo'in.","Respect/plural: Hin boo'inaa.","Kabajaaf/baay'inaaf: Hin boo'inaa.",0],["Be happy!","Gammadi!","Respect/plural: Gammadaa!","Kabajaaf/baay'inaaf: Gammadaa!",0],["You look happy today.","Har'a gammadaa fakkaatta.","","",0],["I'm proud of you.","Sitti boona.","","",0],["That's funny!","Sun nama kofalchiisa!","","",0],["That's interesting!","Sun nama hawwata!","","",0]]},{"id":"annoyance","en":"Annoyance and strong reactions","om":"Aarii fi miira cimaa","icon":"😠","group":"feelings","intros":{"pse":{"en":"These phrases express strong negative feelings. Some ('Get out!', 'Mind your own business!') are rude—useful to understand, but avoid them with elders, customers and colleagues. Calming phrases ('Take it easy') are safer, though telling an angry person to 'calm down' can sometimes make things worse.","om":"Jechoonni kun miira badaa cimaa ibsu. Gariin isaanii ('Get out!', 'Mind your own business!') safuu dhabummaadha — hubachuun gaariidha, garuu maanguddootaa, maamiltootaa fi hiriyoota hojii irratti hin fayyadamin. Jechoonni nama tasgabbeessan ('Take it easy') caalaa nagaa qabu; garuu nama aaree 'calm down' jechuun yeroo tokko tokko caalaatti aarsa."}},"items":[["That's so annoying!","Kun baay'ee nama aarsa!","","",0],["I'm fed up with this.","Kana baay'een nuffeera.","","",0],["Enough is enough!","Gahe! Kana caalaa hin obsu!","","",0],["It's not fair!","Kun haqa miti!","","",0],["That's disgusting!","Kun nama jibbisiisa!","","",0],["Stop it!","Dhiisi!","Respect/plural: Dhiisaa!","",0],["Leave me alone!","Na dhiisi!","","",0],["Don't talk to me like that!","Akkanaan na hin dubbisin!","","",0],["How dare you!","Akkamitti kana gochuu dandeesse!","","",0],["What's wrong with you?","Maal taate?","Said angrily, it is a criticism, not real concern.","",0],["Are you crazy?","Maraattee jirtaa?","Rude; only with close friends, half-joking.","",0],["Mind your own business!","Dhimma kee qofa ilaali!","Rude.","Safuu dhabummaadha.",0],["Who asked you?","Eenyutu si gaafate?","Rude.","",0],["Get out!","Asii ba'i!","Very rude.","Baay'ee safuu dhabummaadha.",0],["Take it easy.","Suuta jedhi.","","",0],["Don't get so upset.","Akkas hin aarin.","","",0],["There's no need to fight about this.","Kanaaf wal lolu hin barbaachisu.","","",0]]},{"id":"encourage","en":"Praise and encouragement","om":"Jajjabeessuu fi galateeffachuu","icon":"💪","group":"feelings","intros":{"pse":{"en":"English speakers praise effort generously: 'Good job!', 'Way to go!', 'Keep it up!'. In Oromo, Jabaadhu! ('Be strong!') and Itti fufi! ('Keep going!') do much of the same work. Encouraging words also comfort someone who has failed: 'Don't give up', 'You'll do better next time'.","om":"Ingiliffaan dadhabbii namaa baay'ee galateeffatu: 'Good job!', 'Way to go!', 'Keep it up!'. Afaan Oromootiin 'Jabaadhu!' fi 'Itti fufi!' hojii walfakkaataa hojjatu. Jechoonni jajjabeessaa nama kufes ni jajjabeessu: 'Don't give up', 'You'll do better next time'."}},"items":[["Good job!","Baay'ee gaarii hojjatte!","","",0],["Well done!","Baay'ee gaariidha!","","",0],["Way to go!","Baga milkoofte!","","",0],["Keep it up!","Itti fufi!","Respect/plural: Itti fufaa!","",0],["You can do it!","Ni dandeessa!","","",0],["Give it a try.","Mee yaali.","","",0],["Give it your best shot.","Hamma dandeessu yaali.","","",0],["Don't give up!","Abdii hin kutatin!","","",0],["Hang in there.","Jabaadhu, obsi.","","",0],["You're almost there!","Xumuruuf dhiyaatteetta!","","",0],["You're getting better every day.","Guyyaa guyyaan fooyya'aa jirta.","","",0],["I'm proud of you.","Siin boona.","","",0],["Everyone makes mistakes.","Namni hundi ni dogoggora.","","",0],["You'll do better next time.","Yeroo itti aanu caalaatti ni hojjatta.","","",0],["Don't be so hard on yourself.","Ofitti hin cimin.","","",0],["Believe in yourself.","Ofitti amanamummaa qabaadhu.","","",0]]},{"id":"idioms","en":"Everyday English idioms","om":"Jechamoota Ingiliffaa guyyaa guyyaa","icon":"🗝️","group":"idioms","intros":{"pse":{"en":"Idioms are fixed expressions whose meaning is not the sum of their words, so translating them word for word into Oromo makes no sense. Here the Oromo column explains what the idiom means. Learn them in context and use them in informal speech; in formal writing a plain expression is usually better. This unit focuses on idioms you will hear at work, in meetings and in daily conversation.","om":"Jechamni (idiom) hiika jechoota isaa keessa jiran irraa adda ta'e qaba; kanaafuu jecha jechaan Afaan Oromootti hiikuun hiika hin qabu. Asitti kutaan Afaan Oromoo hiika jechamichaa ibsa. Haala itti fayyadaman waliin bari, haasaa salphaa keessatti fayyadami; barreeffama idilee keessatti jecha salphaa filachuu wayya. Kutaan kun jechamoota hojii, walgahii fi haasaa guyyaa guyyaa keessatti dhageessu irratti xiyyeeffata."}},"items":[["break the ice","Namoota wal hin beekne gidduutti haasaa jalqabsiisuun akka walitti tolan gochuu.","To start a conversation so people feel relaxed.","",0],["get to the point","Naannessuu dhiisanii kallattiin gara dhimma ijootti seenuu.","To say the important thing directly.","",0],["beat around the bush","Dhimma ijoo kallattiin dubbachuu dhiisanii naannessanii haasa'uu.","To avoid saying something directly.","",0],["hit the nail on the head","Waan sirrii ta'e sirriitti dubbachuu ykn rakkoo dhugaa argachuu.","To describe something exactly right.","",0],["speak your mind","Waan yaaddu sodaa malee ifatti dubbachuu.","To say honestly what you think.","",0],["in a nutshell","Gabaabumatti; jecha muraasaan.","In short; in a few words.","",0],["the ball is in your court","Amma dabareen murteessuu ykn tarkaanfii fudhachuu kan keeti.","It's your turn to decide or act.","",0],["on the same page","Waa'ee dhimma tokkoo hubannaa walfakkaataa qabaachuu.","Agreeing; understanding something the same way.","",0],["call it a day","Hojii guyyaa sanaa dhaabuu fi xumuruu.","To stop working for today.","",0],["at the last minute","Yeroo dhumaa irratti, yeroon baay'ee dhiyaatee booda.","At the latest possible moment.","",0],["once in a blue moon","Baay'ee darbee darbee; yeroo baay'ee muraasa qofa.","Very rarely.","",0],["cost an arm and a leg","Baay'ee qaalii ta'uu.","To be very expensive.","",0],["on cloud nine","Baay'ee baay'ee gammaduu.","Extremely happy.","",0],["a blessing in disguise","Waan jalqaba badaa fakkaatee booda garuu gaarii ta'e.","Something that seems bad but turns out to be good.","",0],["get cold feet","Yeroo dhumaa irratti sodaachuun yaada jijjiirachuu.","To become nervous and back out of a plan.","",0]]},{"id":"idioms_us","en":"American idioms and slang","om":"Jechamoota fi afaan salphaa Ameerikaa","icon":"🇺🇸","group":"idioms","intros":{"pse":{"en":"American English is full of casual idioms and slang that you will hear in movies, at work and among friends. Most are informal: fine with friends and coworkers, but avoid them in formal letters or with officials. The Oromo column explains the meaning.","om":"Ingiliffaan Ameerikaa jechamootaa fi afaan salphaa fiilmii, bakka hojii fi hiriyoota gidduutti dhaga'amu baay'ee qaba. Baay'een isaanii idilee miti: hiriyootaa fi hiriyoota hojiif ni ta'u, garuu xalayaa idilee ykn qondaaltota biratti hin fayyadamin. Kutaan Afaan Oromoo hiika isaanii ibsa."}},"items":[["hang out","Hiriyoota waliin akkasumaan yeroo dabarsuu.","To spend time together casually.","",0],["cool / awesome","Gaarii; baay'ee gaarii (afaan salphaa).","Good; great.","",0],["bucks","Doolaara (afaan salphaa): 'twenty bucks' = doolaara digdama.","Dollars.","",0],["I'm beat.","Baay'ee dadhabeera.","I'm very tired.","",0],["hit the sack","Rafuuf ciisuu.","To go to bed.","",0],["My bad.","Dogoggora kooti (afaan salphaa).","Informal: my mistake.","",0],["24/7","Yeroo hunda; guyyaa fi halkan, torbee guutuu.","All the time.","",0],["a couch potato","Nama sochii hin jaallanne, teessoo irra taa'ee yeroo hunda televizhinii ilaalu.","A lazy person who watches a lot of TV.","",0],["a pain in the neck","Nama ykn waan baay'ee nama dhiphisu ykn nama nuffisiisu.","Someone or something very annoying.","",0],["a no-brainer","Murtii baay'ee salphaa, yaaduu hin barbaachisne.","A very easy decision.","",0],["go Dutch","Nyaata ykn bashannana irratti namni hundi kan mataa isaa kaffaluu.","Each person pays for themselves.","",0],["take a rain check","Affeerraa amma fudhachuu dhabuu, garuu yeroo biraa fudhachuu akka barbaaddu himuu.","Decline now but accept another time.","",0],["a ballpark figure","Tilmaama lakkoofsaa ykn gatii kan sirrii hin taane, garuu itti dhiyaatu.","A rough estimate.","",0]]},{"id":"idioms_animals","en":"Animal idioms","om":"Jechamoota bineensota irratti hundaa'an","icon":"🐘","group":"idioms","intros":{"pse":{"en":"Many English idioms use animals, and their meanings are often surprising: 'raining cats and dogs' has nothing to do with pets. Oromo also uses animals in sayings (the clever fox, the patient donkey), but the images are different, so learn each English idiom with its meaning.","om":"Jechamoonni Ingiliffaa baay'een bineensota fayyadamu, hiikni isaanii garuu yeroo baay'ee nama dinqisiisa: 'raining cats and dogs' adurree fi saree waliin walitti dhufeenya hin qabu. Afaan Oromoos mammaaksa keessatti bineensota ni fayyadama, garuu fakkiin isaanii adda; kanaafuu tokkoon tokkoon jechamaa hiika isaa waliin bari."}},"items":[["let the cat out of the bag","Iccitii tasa ifa baasuu.","To reveal a secret by accident.","",0],["raining cats and dogs","Roobni baay'ee cimaan roobaa jira.","Raining very heavily.","",0],["the elephant in the room","Rakkoo guddaa namni hundi beeku garuu kan hin dubbatamne.","An obvious problem nobody wants to talk about.","",0],["a wolf in sheep's clothing","Nama hamaa kan nama gaarii fakkaatu.","A dangerous person who seems harmless.","",0],["the black sheep of the family","Nama maatii keessaa amala adda ta'een badaa jedhamee ilaalamu.","A family member seen as a disgrace.","",0],["crocodile tears","Imimmaan sobaa; gadda sobaa agarsiisuu.","Fake tears; pretend sadness.","",0],["a little bird told me","Eenyu akka natti hime himuu hin barbaadu.","I won't say who told me.","",0],["a fish out of water","Bakka haaraa ykn hin baratin keessatti ofitti tolachuu dhabuu.","Uncomfortable in an unfamiliar situation.","",0],["as busy as a bee","Baay'ee hojiidhaan qabamuu.","Very busy.","",0],["as stubborn as a mule","Baay'ee mataa jabeessa; yaada isaa hin jijjiiru.","Very stubborn.","",0],["hold your horses","Obsi, hin ariifatin.","Wait; be patient.","",0],["when pigs fly","Gonkumaa hin ta'u.","Never.","",0],["smell a rat","Waan sirrii hin taane ykn gowwoomsaa jiraachuu shakkuu.","To suspect a trick.","",0]]},{"id":"proverbs","en":"English proverbs","om":"Mammaaksa Ingiliffaa","icon":"📜","group":"idioms","intros":{"pse":{"en":"Proverbs (mammaaksa) are central to Oromo speech—elders use them to settle disputes and make a point politely. English proverbs are used less often but are still common, especially to give advice. The Oromo column explains the meaning; where a well-known Oromo proverb has a similar message, it is given in the note.","om":"Mammaaksi haasaa Oromoo keessatti iddoo guddaa qaba — maanguddoonni ittiin falmii furu, yaada isaanii kabajaan dabarsu. Mammaaksi Ingiliffaa akkas baay'ee hin fayyadamne, garuu gorsa kennuuf ni dhaga'ama. Kutaan Afaan Oromoo hiika ibsa; mammaaksi Oromoo hiika walfakkaataa qabu yoo jiraate yaadannoo keessatti kenname."}},"items":[["Actions speak louder than words.","Waan namni hojjatu waan inni dubbatu caalaa isa agarsiisa.","What you do matters more than what you say.","",0],["Better late than never.","Turtee raawwachuun gonkumaa raawwachuu dhabuu caala.","Doing something late is better than not doing it.","",0],["Practice makes perfect.","Irra deddeebiin shaakaluun nama ogeessa godha.","You get better by practicing.","",0],["The early bird catches the worm.","Namni dursee ka'u carraa gaarii argata.","Those who start early succeed.","",0],["Where there's a will, there's a way.","Fedhiin cimaan yoo jiraate, karaan ni argama.","Determination finds a solution.","",0],["Don't judge a book by its cover.","Bifa alaatiin qofa nama ykn waan tokko hin murteessin.","Don't judge by appearance.","",0],["Two heads are better than one.","Yaadni nama lamaa yaada nama tokkoo caala.","Working together gives better ideas.","",0],["A friend in need is a friend indeed.","Hiriyaan dhugaa yeroo rakkoo si bira dhaabata.","A true friend helps you in hard times.","",0],["Don't count your chickens before they hatch.","Waan ammallee hin argatin akka waan argatteetti hin herregin.","Don't rely on something before it happens.","",0],["Look before you leap.","Osoo hin raawwatin dura sirriitti yaadi.","Think carefully before acting.","",0],["Rome wasn't built in a day.","Wanti gurguddaan yeroo fudhata; obsi barbaachisa.","Big things take time. Similar Oromo proverb: Suuta suutaan hanqaaquun miilaan deemti ('Slowly, slowly the egg walks on legs').","",1],["Don't cry over spilled milk.","Waan darbee fi sirreeffamuu hin dandeenyeef hin gaddin.","Don't worry about what can't be changed. Similar Oromo saying: Bishaan dhangala'e hin waraabamu ('Spilled water can't be scooped up').","",1],["One hand washes the other.","Namoonni wal gargaaruun lachuu fayyadamu.","People benefit by helping each other. Oromo equivalent: Harki harka dhiqa.","",0],["No pain, no gain.","Dadhabbii malee bu'aan hin argamu.","Success requires hard work.","",0],["Every cloud has a silver lining.","Rakkoo hunda keessa waan gaariin tokko ni jira.","Something good comes from every bad situation.","",0],["When in Rome, do as the Romans do.","Biyya ormaa yoo jiraatte, aadaa namoota achii hordofi.","Follow local customs.","",0]]}];
const LES_EN=[{"id":"alphabet","en":"The English alphabet","om":"Qubee Ingiliffaa","icon":"🔤","level":1,"summary_en":"The 26 English letters, their names, and the letters that sound different from Qubee.","summary_om":"Qubeewwan Ingiliffaa 26, maqaa isaanii fi qubeewwan sagalee Qubee irraa adda qaban.","sections":[{"h_en":"Same letters, different names","h_om":"Qubee walfakkaataa, maqaa adda","p_en":"English is written with the same 26 Latin letters as Qubee. But in English every letter also has a name, and the name is often different from the sound. We use these names to spell a word aloud – on the phone, at a hotel desk, or when we give an email address. The name 'Tola' is spelled: tii – oow – el – eey. The spellings in the table are written so that a Qubee reader can say them.","p_om":"Ingiliffi qubee Laatinii 26 kanuma Qubee Afaan Oromoo keessatti argamuun barreeffama. Garuu Ingiliffa keessatti qubeen hundi maqaa mataa isaa qaba; maqaan kunis yeroo baay'ee sagalee qubichaa irraa adda. Maqaa qubeewwanii kanatti fayyadamnee jecha tokko sagaleedhaan qubeessina – bilbila irratti, hoteela keessatti yookiin teessoo imeelii yeroo himnu. Maqaan 'Tola' akkana qubeeffama: tii – oow – el – eey. Maqaaleen gabatee keessa jiran akka dubbisaan Qubee salphaatti dubbisuu danda'uutti barreeffamaniiru.","table":{"head":["Qubee / Letter","Maqaa / Name (say it like)","Fakkeenya / Example"],"rows":[["A a","eey","apple, name"],["B b","bii","book"],["C c","sii","cat, city"],["D d","dii","dog"],["E e","ii","egg, he"],["F f","ef","fish"],["G g","jii","go, giant"],["H h","eech","house"],["I i","aay","in, ice"],["J j","jeey","job"],["K k","keey","key"],["L l","el","lion"],["M m","em","milk"],["N n","en","name"],["O o","oow","orange, go"],["P p","pii","pen"],["Q q","kiyuu","queen"],["R r","aar","red"],["S s","es","sun"],["T t","tii","tea"],["U u","yuu","up, use"],["V v","vii","van"],["W w","dabil-yuu","water"],["X x","eks","box"],["Y y","waay","yes"],["Z z","zii (UK: zed)","zoo"]]}},{"h_en":"Letters that sound different from Qubee","h_om":"Qubeewwan sagalee Qubee irraa adda qaban","p_en":"Some letters look the same in both languages but stand for different sounds. In Qubee, C, Q, X and PH are ejective sounds (cabbii, qalama, xalayaa, kophee). English has no ejective sounds at all. In English, C sounds like k or s, Q is almost always written QU and sounds like kw, X usually sounds like ks, and PH sounds like f. G in Qubee is always g, but in English G before e, i or y is often j (giant, page). Y is a consonant at the start of a word (yes) but a vowel at the end (my, happy).","p_om":"Qubeewwan tokko tokko afaan lamaan keessatti bifa tokko qabu, garuu sagalee adda bakka bu'u. Qubee keessatti C, Q, X fi PH sagalee cimaa (ejective) bakka bu'u: cabbii, qalama, xalayaa, kophee. Ingiliffi sagalee cimaa akkasii gonkumaa hin qabu. Ingiliffa keessatti C sagalee k yookiin s qaba; Q yeroo baay'ee QU jedhamee barreeffamee 'kw' jedhamee dubbifama; X yeroo baay'ee 'ks' jedhama; PH immoo 'f' jedhama. G Qubee keessatti yeroo hunda sagalee g qaba; Ingiliffa keessatti garuu e, i yookiin y dura yeroo baay'ee 'j' jedhama (giant, page). Y jalqaba jechaa irratti dubbifamaa (yes), dhuma jechaa irratti garuu dubbachiiftuu ta'a (my, happy).","table":{"head":["Qubee / Letter","Qubee keessatti / In Qubee","Ingiliffa keessatti / In English","Fakkeenya / Examples"],"rows":[["C","c cimaa: cabbii","k / s","cat, cup / city, ice"],["Q","q cimaa: qalama","kw (QU)","queen, quick, question"],["X","x cimaa: xalayaa","ks / gz","box, six / exam"],["PH","ph cimaa: kophee","f","phone, photo"],["G","g: gaangee","g / j","go, big / giant, page"],["CH","ch","ch / k / sh","chair / school / machine"],["Y","y: yaada","y / aay / ii","yes / my / happy"]]}},{"h_en":"Five vowel letters, many vowel sounds","h_om":"Qubee dubbachiiftuu shan, sagalee baay'ee","p_en":"In Qubee each vowel letter has one sound, and writing it twice makes it long (a / aa). English has only five vowel letters – a, e, i, o, u – but about twenty vowel sounds. The letter A sounds different in 'cat', 'cake', 'car', 'call' and 'about'. So never read an English word letter by letter as you would read Qubee. Learn every new word together with its pronunciation (listen to it, or check a dictionary).","p_om":"Qubee keessatti qubeen dubbachiiftuu tokko sagalee tokko qofa qaba; dachaan barreessuun immoo sagalee dheeressa (a / aa). Ingiliffi qubee dubbachiiftuu shan qofa qaba – a, e, i, o, u – garuu sagalee dubbachiiftuu gara digdamaa qaba. Qubeen A jechoota 'cat', 'cake', 'car', 'call' fi 'about' keessatti sagalee adda qaba. Kanaaf jecha Ingiliffaa akka Qubee qubee qubeedhaan hin dubbisin. Jecha haaraa hunda akkaataa itti dubbifamu wajjin baradhu (dhaggeeffadhu, yookiin galmee jechootaa ilaali).","ex":[["How do you spell your name?","Maqaa kee akkamitti qubeessita?","","",0],["T-O-L-A: tii, oow, el, eey.","T-O-L-A: tii, oow, el, eey.","Spell names with the English letter names, not with Qubee sounds.","Maqaa yeroo qubeessitu maqaa qubee Ingiliffaatti fayyadami, sagalee Qubee miti.",0],["Could you spell that, please?","Maaloo, sana naaf qubeessi.","","",0],["Is that C as in 'cat' or K as in 'king'?","Sun C kan 'cat' keessaa moo K kan 'king' keessaa?","","",0],["The word 'phone' starts with an f sound.","Jechi 'phone' (bilbila) jalqaba isaatti sagalee f qaba.","","",0],["My email is lensa at gmail dot com.","Imeeliin koo lensa at gmail dot com.","'@' is read 'at' and '.' is read 'dot'.","'@' 'at' jedhamee, '.' immoo 'dot' jedhamee dubbifama.",0]]}]},{"id":"vowels","en":"English vowel sounds","om":"Sagalee dubbachiiftuu Ingiliffaa","icon":"🗣️","level":1,"summary_en":"Short and long vowels, sounds Oromo doesn't have, the weak vowel schwa, and why spelling is not sound.","summary_om":"Dubbachiiftuu gabaabaa fi dheeraa, sagalee Afaan Oromoo keessa hin jirre, schwa, akkasumas maaliif barreeffamni sagalee wajjin hin walsimne.","sections":[{"h_en":"Short and long vowels","h_om":"Dubbachiiftuu gabaabaa fi dheeraa","p_en":"Afaan Oromoo has five vowels, each short or long: a/aa, e/ee, i/ii, o/oo, u/uu. English also has short and long vowels, but the difference is not only length – the shape of the mouth changes too. 'Sheep' has a long, tight ee sound (like Oromo ii, with the lips spread as in a smile). 'Ship' has a short, relaxed i, a little closer to e. 'Fool' has a long, round uu; 'full' has a short, relaxed u. If you mix them, the meaning changes: 'I want to leave' (go away) is not 'I want to live'.","p_om":"Afaan Oromoo dubbachiiftuu shan qaba; tokkoon tokkoon isaanii gabaabaa yookiin dheeraa ta'u: a/aa, e/ee, i/ii, o/oo, u/uu. Ingiliffis dubbachiiftuu gabaabaa fi dheeraa qaba, garuu garaagarummaan isaanii dheerina qofa miti; bifti afaanii illee ni jijjiirama. 'Sheep' (hoolaa) ii dheeraa fi cimaa qaba (akka ii Afaan Oromoo, hidhii kee gara cinaatti diriirsi). 'Ship' (doonii) i gabaabaa fi laafaa qaba, xiqqoo gara e tti dhiyaata. 'Fool' (gowwaa) uu dheeraa fi marsaa qaba; 'full' (guutuu) u gabaabaa fi laafaa qaba. Yoo walitti makte hiikni ni jijjiirama: 'I want to leave' (deemuun barbaada) fi 'I want to live' (jiraachuun barbaada) tokko miti.","table":{"head":["Short / Gabaabaa","Long / Dheeraa","Hiika / Meanings"],"rows":[["ship","sheep","doonii / hoolaa"],["live","leave","jiraachuu / deemuu, ka'uu"],["sit","seat","taa'uu / teessoo"],["fill","feel","guutuu / dhaga'amuu (miira)"],["full","fool","guutuu / gowwaa"],["pull","pool","harkisuu / iddoo daakaa"]]}},{"h_en":"Vowel sounds that Oromo doesn't have","h_om":"Sagalee dubbachiiftuu Afaan Oromoo keessa hin jirre","p_en":"Some English vowels have no Oromo partner. /æ/ in 'cat, man, bag': open your mouth wide; the sound is between Oromo e and a. /ʌ/ in 'cup, bus, love': a short, quick a. /ɜr/ in 'bird, work, girl': keep the tongue in the middle of the mouth and add a soft r. English also has gliding vowels (diphthongs) that move from one sound to another: 'day' (eey), 'my' (aay), 'go' (oow), 'now' (aaw), 'boy' (ooy). Don't say 'go' or 'name' with a flat Oromo o or e – let the sound glide.","p_om":"Sagaleewwan dubbachiiftuu Ingiliffaa tokko tokko Afaan Oromoo keessa hin jiran. /æ/ jechoota 'cat, man, bag' keessatti: afaan kee bal'inaan bani; sagaleen kun e fi a Oromoo gidduutti argama. /ʌ/ 'cup, bus, love' keessatti: a gabaabaa fi ariifataa. /ɜr/ 'bird, work, girl' keessatti: arraba kee gidduu afaanii irra qabadhuu r laafaa itti dabali. Ingiliffi dubbachiiftuu sagalee tokko irraa gara biraatti darban (diphthong) ni qaba: 'day' (eey), 'my' (aay), 'go' (oow), 'now' (aaw), 'boy' (ooy). 'Go' fi 'name' o yookiin e Oromoo qixa tokkoon hin dubbatin – sagaleen akka darbu godhi.","table":{"head":["Sagalee / Sound","Fakkeenya / Examples","Akkamitti / How to say it"],"rows":[["/æ/","cat, bag, man","e fi a gidduu; afaan bal'aa (between e and a, mouth wide)"],["/ʌ/","cup, bus, mother","a gabaabaa (short quick a)"],["/ɑ/","car, father, hot (US)","akka aa Oromoo (like Oromo aa)"],["/ɔ/","law, call, water","oo dheeraa fi marsaa (long round oo)"],["/ɜr/","bird, work, learn","Afaan Oromoo keessa hin jiru (no Oromo match)"],["/eɪ/","day, name, rain","eey"],["/aɪ/","my, time, light","aay"],["/oʊ/","go, home, road","oow"],["/aʊ/","now, house, town","aaw"],["/ɔɪ/","boy, oil, voice","ooy"]]}},{"h_en":"The weak vowel: schwa /ə/","h_om":"Dubbachiiftuu laafaa: schwa /ə/","p_en":"The most common sound in English is a short, lazy 'uh' called schwa /ə/. It appears only in unstressed syllables, and it can be written with any vowel letter: the a in 'about', the e in 'teacher', the o in 'doctor', the u in 'support'. In Afaan Oromoo every vowel is said clearly, so Oromo speakers often say 'DOK-TOR' with two full o sounds. English speakers say 'DOK-tər'. Using schwa makes your English sound natural, and knowing it helps you understand fast speech.","p_om":"Sagaleen Ingiliffa keessatti caalaa mul'atu 'ə' gabaabaa fi laafaa kan 'schwa' jedhamuudha. Inni birsaga dhiibbaa hin qabne keessatti qofa dhufa, qubee dubbachiiftuu kamiinuu barreeffamuu danda'a: a 'about' keessaa, e 'teacher' keessaa, o 'doctor' keessaa, u 'support' keessaa. Afaan Oromoo keessatti dubbachiiftuun hundi ifatti dubbatama; kanaaf Oromoonni 'DOK-TOR' jedhanii o lamaan guutummaatti dubbatu. Namoonni afaan isaanii Ingiliffa ta'e garuu 'DOK-tər' jedhu. Schwa fayyadamuun Ingiliffa kee uumamaa taasisa; isa beekuun immoo dubbii ariifataa hubachuuf si gargaara.","table":{"head":["Word / Jecha","Say / Akkas jedhi","Not / Akkas miti"],"rows":[["about","ə-BAWT","A-BOWT"],["teacher","TII-chər","TII-CHER"],["doctor","DOK-tər","DOK-TOR"],["banana","bə-NA-nə","BA-NA-NA"],["today","tə-DEEY","TO-DEY"]]}},{"h_en":"Spelling is not sound","h_om":"Barreeffamni sagalee miti","p_en":"Qubee is written as it is spoken: one letter, one sound. English spelling is old and irregular. One sound can be written in many ways – see, sea, piece, these and key all have the same /iː/ – and one spelling can have many sounds: 'ough' in though, through, tough and cough. A helpful pattern is the 'magic e': a silent e at the end of a word makes the vowel before it say its letter name: cap → cape, kit → kite, hop → hope, cut → cute.","p_om":"Qubeen akkuma dubbatamutti barreeffama: qubee tokko, sagalee tokko. Barreeffamni Ingiliffaa garuu durii fi seera hin eegne. Sagalee tokko karaa baay'eedhaan barreessuun ni danda'ama – see, sea, piece, these fi key hundi sagalee /iː/ tokko qabu – barreeffamni tokko immoo sagalee baay'ee qabaachuu danda'a: 'ough' jechoota though, through, tough fi cough keessatti. Seerri gargaaru tokko 'e callistuu' (magic e) jedhama: e dhuma jechaa irratti hin dubbifamne dubbachiiftuu isa duraa maqaa qubee isaatiin akka dubbifamu taasisa: cap → cape, kit → kite, hop → hope, cut → cute.","ex":[["I can see the sea from my window.","Foddaa koo irraa galaana nan arga.","'see' and 'sea' sound exactly the same.","'see' fi 'sea' sagalee tokko qabu.",0],["Please sit in this seat.","Maaloo teessoo kana irra taa'i.","","",0],["This cup is full.","Kubbaayyaan kun guutuudha.","","",0],["The doctor is in his office.","Doktorri waajjira isaa keessa jira.","Say DOK-tər, not DOK-TOR.","DOK-tər jedhi, DOK-TOR miti.",0],["I live in Adama, but I want to leave.","Ani Adaamaa keessa jiraadha, garuu deemuun barbaada.","","",0],["My bag is in the bus.","Boorsaan koo awtobisii keessa jira.","bag /æ/ and bus /ʌ/ are different vowels.","bag /æ/ fi bus /ʌ/ dubbachiiftuu adda adda qabu.",0]]}]},{"id":"consonants","en":"Difficult consonant sounds","om":"Sagalee dubbifamaa rakkisoo","icon":"👄","level":1,"summary_en":"TH, V, P/B, PH, R and NG – the consonants Oromo speakers find hardest, and how to make them.","summary_om":"TH, V, P/B, PH, R fi NG – sagaleewwan dubbifamaa Oromoota rakkisan fi akkaataa itti dubbataman.","sections":[{"h_en":"TH: two sounds Oromo doesn't have","h_om":"TH: sagalee lama Afaan Oromoo keessa hin jirre","p_en":"TH has two sounds. Voiceless /θ/ is only air, no voice: think, three, thank, bath, month. Voiced /ð/ has voice: this, that, the, mother, with. Afaan Oromoo has neither, so learners often replace them with t or s ('tank you', 'sink') or with d or z ('dis', 'moder'). Put the tip of your tongue lightly between your teeth and blow air: that is /θ/. Do the same and add your voice: that is /ð/. Note: Qubee 'dh' (as in dhugaa) is a completely different sound – never read English 'th' as Oromo 'dh'.","p_om":"TH sagalee lama qaba. /θ/ sagalee qoonqoo malee, qilleensa qofaan dubbatama: think, three, thank, bath, month. /ð/ immoo sagalee qoonqoo wajjin dubbatama: this, that, the, mother, with. Afaan Oromoo sagalee lamaan kana hin qabu; kanaaf barattoonni bakka isaanii t yookiin s ('tank you', 'sink'), d yookiin z ('dis', 'moder') galchu. Fiixee arraba keetii ilkaan kee gidduu suuta kaa'iitii qilleensa baasi: sagaleen kun /θ/ jedhama. Haaluma kanaan sagalee qoonqoo itti dabali: kun /ð/ jedhama. Hubachiisa: 'dh' Qubee (fakkeenyaaf dhugaa) sagalee guutummaatti adda ta'eedha – 'th' Ingiliffaa akka 'dh' Oromootti gonkumaa hin dubbisin.","table":{"head":["TH word","Not this word","Hiika / Meanings"],"rows":[["three","tree","sadii / muka"],["think","sink","yaaduu / liqimfamuu"],["thank","tank","galateeffachuu / taankii"],["they","day","isaan / guyyaa"],["breathe","breed","hafuura baafachuu / horsiisuu"]]}},{"h_en":"V is not B or F","h_om":"V'n B yookiin F miti","p_en":"Afaan Oromoo has no native /v/ sound, so English v often turns into b or f: 'bery' or 'fery' instead of 'very'. To make /v/, touch your upper teeth to your lower lip (as for f) and add your voice – you should feel the lip buzz. Practice these pairs: very – berry, vote – boat, van – ban, fan – van. Say a clear v at the end of words too: have, live, five, give, love.","p_om":"Afaan Oromoo keessatti sagaleen /v/ uumamaan hin jiru; kanaaf v Ingiliffaa yeroo baay'ee b yookiin f ta'a: 'very' bakka jedhamuu 'bery' yookiin 'fery' jedhama. /v/ dubbachuuf ilkaan kee kan olii hidhii kee isa gadii tuqsiisi (akkuma f), sana booda sagalee qoonqoo itti dabali – hidhiin kee akka raafamu sitti dhaga'amuu qaba. Jechoota kana shaakali: very – berry, vote – boat, van – ban, fan – van. Dhuma jechaa irrattis v ifatti dubbadhu: have, live, five, give, love."},{"h_en":"P, B and the spelling PH","h_om":"P, B fi barreeffama PH","p_en":"In Afaan Oromoo, p appears mainly in borrowed words, and Qubee ph is an ejective sound. English p is not ejective: it is a soft sound with a small puff of air at the start of a word (pen, park, pay). Hold a piece of paper in front of your mouth – it should move when you say 'pen' but not when you say 'Ben'. Don't mix p and b: pig – big, pear – bear, cap – cab. And remember: the English spelling 'ph' is simply /f/: phone, photo, elephant.","p_om":"Afaan Oromoo keessatti p jechoota afaan biraa irraa liqeeffataman keessa qofatti mul'ata; ph Qubee immoo sagalee cimaadha (ejective). P Ingiliffaa sagalee cimaa miti: jalqaba jechaa irratti qilleensa xiqqoo wajjin laafinaan dubbatama (pen, park, pay). Waraqaa tokko afaan kee dura qabadhu – 'pen' yoo jette waraqaan ni sochoo'a, 'Ben' yoo jette garuu hin sochoo'u. P fi b walitti hin makin: pig – big, pear – bear, cap – cab. Yaadadhu: barreeffamni Ingiliffaa 'ph' sagalee /f/ qofa bakka bu'a: phone, photo, elephant."},{"h_en":"R, NG and W","h_om":"R, NG fi W","p_en":"Oromo r is made by tapping or trilling the tongue. American English r is different: the tongue curls back and does not touch the top of the mouth (red, car, very). In British English an r after a vowel is usually silent (car sounds like 'kaa'). English also has the sound ng /ŋ/ at the end of words: sing, long, morning. Make it at the back of the mouth and stop – don't add a hard g or a vowel ('sing-ga'). Finally, w at the start of a word is a consonant: round your lips for water, word, woman, and don't drop it.","p_om":"R Afaan Oromoo arraba tuqsiisuu yookiin raasuun dubbatama. R Ingiliffaa Ameerikaa garuu adda: arrabni duubatti goobama, gubbaa afaanii hin tuqu (red, car, very). Ingiliffa Biriteenii keessatti r dubbachiiftuu booda dhufu yeroo baay'ee hin dubbifamu ('car' akka 'kaa' dhaga'ama). Ingiliffi dhuma jechaa irratti sagalee ng /ŋ/ qaba: sing, long, morning. Duuba afaaniitiin dubbadhuu dhaabi – g cimaa yookiin dubbachiiftuu itti hin dabalin ('sing-ga' miti). Dhumarratti, w jalqaba jechaa irratti dubbifamaadha: water, word, woman jechuuf hidhii kee marsi, hin dhiisin.","ex":[["Thank you for this gift.","Kennaa kanaaf galatoomi.","","",0],["I think this bag is my brother's.","Boorsaan kun kan obboleessa kooti natti fakkaata.","","",0],["My mother lives with my father in the village.","Haati koo abbaa koo wajjin baadiyyaa keessa jiraatti.","","",0],["I have five very good friends.","Ani hiriyoota baay'ee gaggaarii shan qaba.","","",0],["Please put the pen in the bag.","Maaloo qalamicha boorsaa keessa kaa'i.","","",0],["The phone is on the table.","Bilbilli minjaala irra jira.","'ph' in 'phone' = f.","'ph' jecha 'phone' keessaa = f.",0],["We sing every morning.","Ganama ganama ni faarfanna.","End 'sing' and 'morning' with ng – no extra g or vowel.","'sing' fi 'morning' ng'n xumuri – g yookiin dubbachiiftuu hin dabalin.",0]]}]},{"id":"clusters_endings","en":"Consonant clusters & word endings","om":"Dubbifamaa walitti aanan fi dhuma jechaa","icon":"🔚","level":1,"summary_en":"Stop on final consonants, say s + consonant without an extra i, and pronounce -ed and -s endings correctly.","summary_om":"Dubbifamaa dhumaa irratti dhaabbadhu, s + dubbifamaa i malee dubbadhu, -ed fi -s sirriitti dubbadhu.","sections":[{"h_en":"Don't add a vowel at the end","h_om":"Dhuma jechaa irratti dubbachiiftuu hin dabalin","p_en":"Most Afaan Oromoo words end in a vowel, and when Oromo borrows a word it adds one: hotel → hoteela, bank → baankii, computer → kompiitara. So learners often say 'booku', 'milki' or 'testi'. In English many words end in one, two or even three consonants, and you must stop on them: book, milk, test, bus, desk, friend, asked, months, texts. It may feel short, but the extra vowel makes your English harder to understand.","p_om":"Jechoonni Afaan Oromoo baay'een dubbachiiftuun xumuramu; jecha afaan biraa irraa yeroo liqeeffannus dubbachiiftuu itti daballa: hotel → hoteela, bank → baankii, computer → kompiitara. Kanaaf barattoonni 'booku', 'milki' yookiin 'testi' jedhu. Ingiliffa keessatti jechoonni baay'een dubbifamaa tokko, lama yookiin sadiin xumuramu; isaan irratti dhaabbachuu qabda: book, milk, test, bus, desk, friend, asked, months, texts. Gabaabaa sitti fakkaachuu danda'a, garuu dubbachiiftuun dabalataa Ingiliffa kee akka hin hubatamne godha."},{"h_en":"S + consonant at the start: no extra i","h_om":"Jalqaba jechaa s + dubbifamaa: i hin dabalin","p_en":"Afaan Oromoo words do not begin with two consonants, so loanwords get a vowel: sport → ispoortii, class → kilaasii. Learners therefore say 'ischool', 'istreet' or 'isport', and 'bilack' for 'black'. English freely starts words with sp, st, sk, sm, sn, str, spr, bl, br, cl, cr, fl, fr, gr, pl, pr, tr. Tip: begin with a long hiss – 'sssschool' – then make it shorter. Never put a vowel before the cluster or inside it.","p_om":"Jechoonni Afaan Oromoo dubbifamaa lamaan hin jalqaban; kanaaf jechoota liqeeffataman keessatti dubbachiiftuu itti daballa: sport → ispoortii, class → kilaasii. Kanaafuu barattoonni 'ischool', 'istreet', 'isport' akkasumas 'black' bakka jedhamuu 'bilack' jedhu. Ingiliffi garuu jechoota sp, st, sk, sm, sn, str, spr, bl, br, cl, cr, fl, fr, gr, pl, pr, tr'n jalqaban baay'ee qaba. Gorsa: 'sssschool' jechuun jalqabiitii suuta suuta gabaabsi. Dubbifamaa walitti aanan kana duratti yookiin gidduu isaanii dubbachiiftuu hin galchin.","table":{"head":["Not this / Akkas miti","Say / Akkas jedhi"],"rows":[["ischool","school"],["istudent","student"],["isport","sport"],["ispeak","speak"],["bilack","black"],["pilease","please"],["tiree","tree"],["kilass","class"]]}},{"h_en":"The -ed ending: /t/, /d/ or /ɪd/","h_om":"Dhuma -ed: /t/, /d/ yookiin /ɪd/","p_en":"The past ending -ed is not always read 'ed'. After voiceless sounds (p, k, f, s, sh, ch) it sounds /t/: worked, stopped, laughed, washed, watched. After voiced sounds and vowels it sounds /d/: played, lived, cleaned, called, opened. Only after t or d do we add a new syllable /ɪd/: wanted, needed, visited, decided. So 'worked' has one syllable – never 'work-ed'.","p_om":"Dhumni -ed (yeroo darbe) yeroo hunda 'ed' jedhamee hin dubbifamu. Sagalee qoonqoo malee dubbataman (p, k, f, s, sh, ch) booda /t/ jedhama: worked, stopped, laughed, washed, watched. Sagalee qoonqoo wajjin dubbataman fi dubbachiiftuu booda /d/ jedhama: played, lived, cleaned, called, opened. t yookiin d booda qofa birsaga haaraa /ɪd/ daballa: wanted, needed, visited, decided. Kanaaf 'worked' birsaga tokko qofa qaba – gonkumaa 'work-ed' miti.","table":{"head":["/t/","/d/","/ɪd/"],"rows":[["worked","played","wanted"],["stopped","lived","needed"],["washed","cleaned","visited"],["watched","called","decided"],["laughed","opened","started"]]}},{"h_en":"The -s ending: /s/, /z/ or /ɪz/","h_om":"Dhuma -s: /s/, /z/ yookiin /ɪz/","p_en":"The same idea works for -s – in plurals, in he/she/it verbs and in 's. After p, t, k, f and th it is /s/: cats, books, stops, laughs. After voiced sounds and vowels it is /z/: dogs, pens, plays, goes, lives. After the hissing sounds s, z, sh, ch, j and x it adds a syllable /ɪz/: buses, roses, dishes, watches, pages, boxes.","p_om":"Seerri kun -s irrattis hojjeta – maqaa baay'inaa, gochima he/she/it fi 's keessatti. p, t, k, f fi th booda /s/ jedhamee dubbifama: cats, books, stops, laughs. Sagalee qoonqoo wajjin dubbataman fi dubbachiiftuu booda /z/ jedhama: dogs, pens, plays, goes, lives. Sagalee 'ss' fakkaatan s, z, sh, ch, j fi x booda birsaga /ɪz/ dabala: buses, roses, dishes, watches, pages, boxes.","table":{"head":["/s/","/z/","/ɪz/"],"rows":[["cats","dogs","buses"],["books","pens","dishes"],["stops","plays","watches"],["laughs","goes","pages"],["months","lives","boxes"]]},"ex":[["I walked to school and played football.","Miilaan mana barumsaa deemee kubbaa miilaa taphadhe.","walked = /wɔkt/, played = /pleɪd/","walked = /wɔkt/, played = /pleɪd/",0],["She wanted a glass of milk.","Isheen aannan burcuqqoo tokko barbaadde.","wanted has two syllables: WAN-tɪd.","wanted birsaga lama qaba: WAN-tɪd.",0],["He watches the news every evening.","Inni galgala hunda oduu ni ilaala.","","",0],["The students asked the teacher three questions.","Barattoonni barsiisaa gaaffii sadii gaafatan.","","",0],["Please speak slowly.","Maaloo suuta dubbadhu.","Say 'speak', not 'ispeak'.","'speak' jedhi, 'ispeak' miti.",0],["Two buses stopped at the bus stop.","Awtobisoonni lama buufata awtobisii irratti dhaabbatan.","","",0]]}]},{"id":"word_order","en":"Word order: Subject – Verb – Object","om":"Tartiiba jechootaa: Raawwataa – Gochima – Raawwatamaa","icon":"🧱","level":1,"summary_en":"English puts the verb in the middle (SVO); Afaan Oromoo puts it at the end (SOV).","summary_om":"Ingiliffi gochima gidduutti kaa'a (R-G-R); Afaan Oromoo immoo dhumatti kaa'a (R-R-G).","sections":[{"h_en":"The verb comes second, not last","h_om":"Gochimni lammaffaa dhufa, dhuma irratti miti","p_en":"The biggest difference between the two languages is the place of the verb. Afaan Oromoo says Subject + Object + Verb: 'Ani buna nan dhuga' (I coffee drink). English says Subject + Verb + Object: 'I drink coffee.' Before you speak, find the verb and move it right after the subject. The object comes after the verb.","p_om":"Garaagarummaan afaan lamaanii inni guddaan iddoo gochimaati. Afaan Oromoo Raawwataa + Raawwatamaa + Gochima jedha: 'Ani buna nan dhuga'. Ingiliffi immoo Raawwataa + Gochima + Raawwatamaa jedha: 'I drink coffee.' Osoo hin dubbatin dura gochima barbaadiitii raawwataa booda kaa'i. Raawwatamaan (wanti) gochima booda dhufa.","table":{"head":["English (S + V + O)","Afaan Oromoo (S + O + V)","Oromo order in English words"],"rows":[["I drink coffee.","Ani buna nan dhuga.","I coffee drink."],["Chaltu reads a book.","Caaltuun kitaaba dubbisti.","Chaltu book reads."],["We bought a car yesterday.","Nuti kaleessa konkolaataa bitanne.","We yesterday car bought."],["The teacher is helping the students.","Barsiisaan barattoota gargaaraa jira.","Teacher students helping is."]]}},{"h_en":"Describing words come before the noun","h_om":"Jechoonni ibsan maqaa dura dhufu","p_en":"In Afaan Oromoo, adjectives, possessives, numbers and 'this/that' come after the noun: mana guddaa, mana koo, mana lama, mana kana. In English they come before the noun: a big house, my house, two houses, this house. Several of them can stand together: my two big houses.","p_om":"Afaan Oromoo keessatti ibsi maqaa, abbummaa agarsiistuun, lakkoofsi fi 'kana/sana' maqaa booda dhufu: mana guddaa, mana koo, mana lama, mana kana. Ingiliffa keessatti immoo maqaa dura dhufu: a big house, my house, two houses, this house. Hedduun isaanii walitti aananii dhufuu danda'u: my two big houses (manneen koo gurguddoo lamaan).","table":{"head":["English","Afaan Oromoo"],"rows":[["a big house","mana guddaa"],["my house","mana koo"],["two houses","mana lama / manneen lama"],["this house","mana kana"]]}},{"h_en":"Prepositions come before the noun","h_om":"Durduubeen maqaa dura dhufa","p_en":"Afaan Oromoo uses words and endings after the noun: mana keessa (in the house), minjaala irra (on the table), Jimmaa irraa (from Jimma), Adaamaatti (in/to Adama). English puts these words (prepositions) before the noun: in the house, on the table, from Jimma, to Adama.","p_om":"Afaan Oromoo jechoota yookiin dhuma maqaa booda dhufan fayyadama: mana keessa, minjaala irra, Jimmaa irraa, Adaamaatti. Ingiliffi jechoota kana (prepositions) maqaa dura kaa'a: in the house, on the table, from Jimma, to Adama."},{"h_en":"Place and time come at the end","h_om":"Bakki fi yeroon dhuma irratti dhufu","p_en":"Afaan Oromoo can put place and time words almost anywhere before the verb. English has a normal order: Subject + Verb + Object + Place + Time. 'I met my friend at the market yesterday.' Time can also go first: 'Yesterday I met my friend at the market.' But never put anything between the verb and its object: not 'I met yesterday my friend'.","p_om":"Afaan Oromoo jechoota bakkaa fi yeroo gochima dura iddoo kamittuu kaa'uu ni danda'a. Ingiliffi garuu tartiiba idilee qaba: Raawwataa + Gochima + Raawwatamaa + Bakka + Yeroo. 'I met my friend at the market yesterday.' Yeroon jalqabattis dhufuu danda'a: 'Yesterday I met my friend at the market.' Garuu gochimaa fi raawwatamaa isaa gidduu homaa hin galchin: 'I met yesterday my friend' hin jedhin."},{"h_en":"Every sentence needs a subject","h_om":"Himni hundi raawwataa barbaada","p_en":"In Afaan Oromoo the verb ending shows the person, so the pronoun is often dropped: 'Dhufe.' (He came.), 'Roobaa jira.' (It is raining.), 'Ni ho'a.' (It is hot.). English verbs don't show the person clearly, so a subject is always needed: 'He came.' When there is no real subject, English uses 'it' or 'there': 'It is raining.' 'It is late.' 'There is a problem.'","p_om":"Afaan Oromoo keessatti dhumni gochimaa raawwataa agarsiisa; kanaaf bamaqaan yeroo baay'ee ni hafa: 'Dhufe.', 'Roobaa jira.', 'Ni ho'a.' Gochimni Ingiliffaa raawwataa ifatti hin agarsiisu; kanaaf raawwataan yeroo hunda barbaachisa: 'He came.' Yeroo raawwataan dhugaa hin jirre, Ingiliffi 'it' yookiin 'there' fayyadama: 'It is raining.' 'It is late.' 'There is a problem.'","ex":[["I speak Afaan Oromoo and English.","Ani Afaan Oromoo fi Ingiliffa nan dubbadha.","","",0],["My sister drinks tea every morning.","Obboleettiin koo ganama ganama shaayii dhugdi.","","",0],["We visited our grandmother last Sunday.","Dilbata darbe akkoo keenya daawwanne.","","",0],["The children are playing in the yard.","Ijoolleen dallaa keessatti taphachaa jiru.","","",0],["It is very cold today.","Har'a qorri cimaadha.","English needs 'it' as the subject.","Ingiliffi 'it' akka raawwataatti barbaada.",0],["He came late.","Inni turee dhufe.","Not 'Came late.' – the subject is required.","'Came late.' miti – raawwataan dirqama.",0]]}]},{"id":"nouns_plurals","en":"Nouns & plurals","om":"Maqaa fi baay'ina","icon":"📦","level":1,"summary_en":"How to make English plurals: -s, -es, -ies, -ves and the common irregular plurals.","summary_om":"Akkaataa baay'ina Ingiliffaa itti uumnu: -s, -es, -ies, -ves fi baay'ina seera hin eegne.","sections":[{"h_en":"One book, two books","h_om":"Kitaaba tokko, kitaabota lama","p_en":"Afaan Oromoo makes plurals with endings such as -oota, -lee, -wwan or -een (barattoota, manneen, qubeewwan). English usually adds -s: book → books, student → students. One important difference: after a number, Afaan Oromoo often keeps the noun singular (kitaaba lama), but English always uses the plural after any number above one: two books, three students, ten birr – never 'two book'.","p_om":"Afaan Oromoo baay'ina dhuma akka -oota, -lee, -wwan yookiin -een fayyadamee uuma (barattoota, manneen, qubeewwan). Ingiliffi yeroo baay'ee -s dabala: book → books, student → students. Garaagarummaa barbaachisaa tokko: lakkoofsa booda Afaan Oromoo yeroo baay'ee maqaa tokkichaa dhiisa (kitaaba lama), Ingiliffi garuu lakkoofsa tokkoo ol booda yeroo hunda baay'ina fayyadama: two books, three students, ten birr – 'two book' gonkumaa hin jedhamu."},{"h_en":"Spelling rules for plurals","h_om":"Seera barreeffama baay'inaa","p_en":"Add -es after s, ss, sh, ch, x and some words ending in o. Change consonant + y to -ies, but keep vowel + y. Many words ending in f or fe change to -ves.","p_om":"s, ss, sh, ch, x fi jechoota o'n xumuraman tokko tokko booda -es dabali. Dubbifamaa + y gara -ies jijjiiri, dubbachiiftuu + y garuu akkuma jirutti dhiisi. Jechoonni f yookiin fe'n xumuraman baay'een -ves ta'u.","table":{"head":["Rule / Seera","Singular → Plural"],"rows":[["most nouns: + s / baay'een: + s","book → books, car → cars, girl → girls"],["s, ss, sh, ch, x: + es","bus → buses, class → classes, dish → dishes, watch → watches, box → boxes"],["some -o: + es","potato → potatoes, tomato → tomatoes, hero → heroes (but photo → photos, radio → radios)"],["consonant + y → ies","city → cities, baby → babies, country → countries"],["vowel + y: + s","day → days, boy → boys, key → keys"],["f / fe → ves","knife → knives, wife → wives, leaf → leaves, half → halves (but roof → roofs)"]]}},{"h_en":"Irregular plurals","h_om":"Baay'ina seera hin eegne","p_en":"A few very common nouns have special plurals – learn them by heart. Some nouns are the same in the singular and plural (sheep, fish). Some exist only in the plural because they have two parts (trousers, glasses, scissors), and 'clothes' is always plural. 'People' is the normal plural of 'person': 'Many people are here.'","p_om":"Maqaawwan baay'ee beekamoo muraasni baay'ina addaa qabu – garaan baradhu. Maqaawwan tokko tokko tokkichaa fi baay'inaan tokkuma (sheep, fish). Kaan immoo waan kutaa lama qabaniif baay'inaan qofa jiru (trousers, glasses, scissors); 'clothes' (uffata) yeroo hunda baay'inaan. 'Person' baay'ina idilee 'people' jedhu qaba: 'Many people are here.'","table":{"head":["Singular","Plural","Afaan Oromoo"],"rows":[["man","men","dhiira / dhiirota"],["woman","women","dubartii / dubartoota"],["child","children","mucaa / ijoollee"],["person","people","nama / namoota"],["foot","feet","miila / miilota"],["tooth","teeth","ilkaan / ilkaanota"],["mouse","mice","hantuuta / hantuuta baay'ee"],["sheep","sheep","hoolaa / hoolota"],["fish","fish","qurxummii / qurxummiiwwan"]]}},{"h_en":"Singular or plural verb?","h_om":"Gochima tokkichaa moo baay'inaa?","p_en":"The verb must agree with the noun: one subject takes 'is/was/has/goes', a plural subject takes 'are/were/have/go'. 'The child is happy.' – 'The children are happy.' Words like 'family', 'team' and 'police' need care: 'police' is always plural ('The police are coming'), while 'family' and 'team' are usually singular in American English ('My family is big').","p_om":"Gochimni maqaa wajjin walsimuu qaba: raawwataan tokkichaa 'is/was/has/goes' fudhata, raawwataan baay'inaa 'are/were/have/go' fudhata. 'The child is happy.' – 'The children are happy.' Jechoota akka 'family', 'team' fi 'police' irratti of eeggadhu: 'police' yeroo hunda baay'ina ('The police are coming'), 'family' fi 'team' immoo Ingiliffa Ameerikaa keessatti yeroo baay'ee tokkichaa ('My family is big').","ex":[["I have two sisters and three brothers.","Ani obboleettii lama fi obboleessa sadii qaba.","English needs the plural after a number.","Ingiliffi lakkoofsa booda baay'ina barbaada.",0],["The children are playing outside.","Ijoolleen ala taphachaa jiru.","","",0],["Three women and two men came to the meeting.","Walgahii sanatti dubartoonni sadii fi dhiironni lama dhufan.","","",0],["There are many cities in Oromia.","Oromiyaa keessa magaalonni baay'een jiru.","","",0],["Put the knives and the dishes on the table.","Billaawwanii fi saahiniiwwan minjaala irra kaa'i.","","",
