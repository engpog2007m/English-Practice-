":"Gochimoota madde: -s-, -am-, -at-","icon":"🛠️","level":3,"summary_en":"From one verb root Oromo builds 'make someone do' (-s/-siis), 'be done' (-am) and 'do for oneself' (-at/-adh) verbs.","summary_om":"Gochima irraa gochima haaraa uumuu: barsiisuu, beekamuu, bitachuu.","sections":[{"h_en":"Causative: -s-, -sis-, -siis-","h_om":"Gochisiisaa: -s-, -siis-","p_en":"Adding -s / -sis / -siis gives 'make or let someone do, cause to be'. Some causatives are slightly irregular, so learn them as words. Adjectives make causatives with -eessuu or -isuu.","table":{"head":["Base","Causative","English"],"rows":[["baruu (learn, get to know)","barsiisuu","teach"],["kolfuu (laugh)","kolfisiisuu","make laugh"],["nyaachuu (eat)","nyaachisuu","feed"],["beekuu (know)","beeksisuu","inform, announce"],["ka'uu (get up)","kaasuu","lift, raise"],["ba'uu (go out)","baasuu","take out; spend"],["bu'uu (go down)","buusuu","put down, unload"],["deebi'uu (return)","deebisuu","give back; answer"],["galuu (go in, home)","galchuu","bring in, put in"],["hojjechuu (work)","hojjechiisuu","make (someone) work"],["qulqulluu (clean, adj.)","qulqulleessuu","to clean"],["guddaa (big)","guddisuu","raise, enlarge"],["xiqqaa (small)","xiqqeessuu","reduce"]]},"ex":[["Our teacher teaches us Afaan Oromoo.","Barsiisaan keenya Afaan Oromoo nu barsiisa.","","",0],["He makes people laugh.","Inni nama kolfisiisa.","","",0],["Feed the baby.","Daa'ima nyaachisi.","","",0],["Lift this stone.","Dhagaa kana kaasi.","","",0]]},{"h_en":"Passive: -am-","h_om":"Gochamaa: -am-","p_en":"-am- makes 'be done': beekuu → beekamuu (be known, famous), jedhuu → jedhamuu (be called), ijaaruu → ijaaramuu (be built), gurguruu → gurguramuu (be sold), argachuu → argamuu (be found, be present), barreessuu → barreeffamuu (be written). Endings: -ama / -ame (he/it), -amti / -amte (she/it, f.), -amu / -aman (they). The doer, if mentioned, takes the instrumental ending -n / -dhaan.","ex":[["This book was written by a teacher.","Kitaabni kun barsiisaa tokkoon barreeffame.","","",0],["This house was built last year.","Manni kun bara darbe ijaarame.","","",0]]},{"h_en":"Impersonal passive: 'one, people'","h_om":"Gochamaa namaa hin agarsiisne","p_en":"The passive 'he' form often means 'one does / it is done': Akkas hin jedhamu 'One doesn't say it like that'.","ex":[["You don't say it like that.","Akkas hin jedhamu.","","",0],["No smoking here.","Asitti tamboon hin xuuxamu.","","",0]]},{"h_en":"For oneself: -at- / -adh- (-chuu verbs)","h_om":"Ofiif: -at- / -adh-","p_en":"Many -chuu verbs are 'middle' forms meaning 'do for oneself' or 'do to oneself': bituu (buy) → bitachuu (buy for oneself); fuudhuu (take) → fudhachuu (take for oneself, receive); dhiquu (wash) → dhiqachuu (wash oneself); eeguu (wait, guard) → eeggachuu (be careful; expect); arguu (see) → argachuu (get, find); uffachuu (dress oneself). They conjugate like nyaachuu.","ex":[["Wash your hands.","Harka kee dhiqadhu.","","",0],["I bought (myself) a house.","Mana bitadhe.","","",0],["Take this.","Kana fudhadhu.","","",0]]},{"h_en":"One root, many verbs","h_om":"Hundee tokko, gochimoota hedduu","p_en":"Recognizing the pieces helps you guess new words.","table":{"head":["Root verb","Causative","Passive","For oneself"],"rows":[["baruu (learn)","barsiisuu (teach)","baramuu (be learned, known)","barachuu (study, learn)"],["arguu (see)","agarsiisuu (show)","argamuu (be found, be present)","argachuu (get, find)"],["ijaaruu (build)","ijaarsisuu (have built)","ijaaramuu (be built)","ijaarrachuu (build for oneself)"]]},"ex":[["Show me this paper.","Waraqaa kana naaf agarsiisi.","","",0]]}]},{"id":"kan_akka_jedhe","en":"Relative clauses (kan) and reported speech (jedhe)","om":"Kan, akka fi jedhe","icon":"💬","level":3,"summary_en":"Describe nouns with clauses ('the man who came'), use kan for 'the one that / what', and report speech with jedhe and akka.","summary_om":"Hima 'kan' fi waan namni biraa jedhe dabarsuu.","sections":[{"h_en":"Relative clauses","h_om":"Hima ibsaa","p_en":"A clause describing a noun comes AFTER the noun, usually with no word for 'who / which / that'. The verb is in the dependent form. nama kaleessa dhufe 'the person who came yesterday'; kitaaba ani bite 'the book (that) I bought'. As subject, the noun takes its subject ending as usual.","ex":[["The man who came yesterday is my brother.","Namni kaleessa dhufe obboleessa kooti.","","",0],["Where is the book I bought?","Kitaabni ani bite eessa jira?","","",0]]},{"h_en":"kan: the one that, what","h_om":"Kan","p_en":"kan (eastern feminine: tan) stands for a noun: kan dhufe 'the one who came', kan ati jette 'what you said', kan ani barbaadu 'what I want'. waan ('thing') is also used for 'what': waan ati jette.","ex":[["Who is the one who came?","Kan dhufe eenyu?","","",0],["What you said is true.","Kan ati jette dhugaadha.","","",0],["I didn't hear what you said.","Waan ati jette hin dhageenye.","","",0]]},{"h_en":"Participles: 'closed', 'written'","h_om":"'Kan cufame'","p_en":"English participles like 'closed, written, married' are expressed with a relative clause (often passive) or an adjective: balbala cufame 'the door that was closed', balbala cufaa 'a closed door', kan heerumte 'married (woman)', kan fuudhe 'married (man)'."},{"h_en":"Saying: jedhuu","h_om":"Jedhuu","p_en":"jedhuu 'to say': jedha, jetta, jedha, jetti, jenna, jettu, jedhu; past jedhe, jette, jedhe, jette, jenne, jettan, jedhan. A direct quotation comes BEFORE jedhe.","ex":[["He said, \"I'll come.\"","\"Nan dhufa\" jedhe.","","",0],["They say it will rain.","Ni rooba jedhu.","","",0]]},{"h_en":"Reported speech: akka …","h_om":"Odeeffannoo dabarsuu: akka …","p_en":"For indirect speech use akka 'that' + clause + jedhe / himte / gaafate…: Akka dhufu jedhe 'He said (that) he would come'. Question words stay inside the clause.","ex":[["She told me that she was sick.","Akka dhukkubsatte natti himte.","","",0],["He asked me where you went.","Eessa akka deemte na gaafate.","","",0],["I don't know when he'll come.","Yoom akka dhufu hin beeku.","","",0]]},{"h_en":"Meaning and naming: jechuu, jedhamuu","h_om":"Jechuu fi jedhamuu","p_en":"jechuu (the other infinitive of jedhuu) means 'to mean': Kun maal jechuudha? 'What does this mean?' jedhamuu 'to be called': Maqaan koo Boontuu jedhama 'My name is Bontu'. Ask for words with: … Afaan Oromootiin akkamitti jedhama?","ex":[["What does this mean?","Kun maal jechuudha?","","",0],["How do you say 'thank you' in Afaan Oromoo? – You say 'Galatoomi'.","'Thank you' Afaan Oromootiin akkamitti jedhama? – 'Galatoomi' jedhama.","","",0]]}]},{"id":"affixes","en":"Affixes at a glance and word building","om":"Maxxantoota walumaagalaan","icon":"🧰","level":3,"summary_en":"A reference map of the prefixes, particles and suffixes of Oromo, plus the endings used to build new words.","summary_om":"Maxxantoota jechaa dura fi booda dabalaman gabaabinaan.","sections":[{"h_en":"Before the verb","h_om":"Gochima dura","p_en":"These small words stand directly in front of the verb.","table":{"head":["Particle","Meaning","Example"],"rows":[["ni / nan","affirmative (nan = I)","Ni dhufa. Nan beeka."],["hin","not; don't","Hin dhufu. Hin dhufin!"],["haa","let","Haa deemnu."],["wal","each other","Wal gargaaru."],["of","oneself","Of eeggadhu."],["na, si, isa… / naaf, natti…","object pronouns","Naa kenni. Natti himi."]]}},{"h_en":"Noun endings","h_om":"Xumura maqaa","p_en":"Endings attached to nouns, pronouns and adjectives.","table":{"head":["Ending","Meaning","Example"],"rows":[["-n / -ni / -i","subject","barataan, namni, fardi"],["-tu","focus: it is X who","Caalaatu dhufe."],["-icha / -ittii","the (specific)","namicha, namittii"],["-oota, -lee, -wwan, -een…","plural","namoota, maqaalee, manneen"],["long final vowel","of (owner)","mana namaa"],["-tti","at, in, to, per","Finfinneetti"],["-rraa, -dhaa","from","Finfinneerraa"],["-f, -dhaaf","for","barataaf"],["-n, -dhaan, -iin","by, with, in","harkaan, Afaan Oromootiin"],["-dha / -ti / -i","is","barataadha, kan kooti, Galaani"],["-s","also, and","Anis"],["-llee","even","Har'allee"]]}},{"h_en":"Verb endings","h_om":"Xumura gochimaa","p_en":"Endings attached to the verb stem.","table":{"head":["Ending","Meaning","Example"],"rows":[["-a, -ta, -ti, -na, -tu, -u","present","deema, deemta, deemti…"],["-e, -te, -ne, -tan, -an","past","deeme, deemte, deemne…"],["-eera","perfect","deemeera"],["-aa + jira / ture","continuous","deemaa jira"],["-ee","having done; and then","Ka'ee deeme."],["-i / -aa; -adhu / -adhaa","command","deemi, deemaa, nyaadhu"],["hin …-in / -inaa","don't","hin deemin"],["-uu","infinitive, verbal noun","deemuu"],["-uun / -uuf / -uudhaan","as subject / in order to / by doing","deemuun, deemuuf"],["-s-, -siis-","causative","barsiisuu"],["-am-","passive","beekamuu"],["-at- / -adh-","for oneself","bitachuu"]]}},{"h_en":"Building nouns","h_om":"Maqaa ijaaruu","p_en":"-aa (m) / -tuu (f): the person who does: barataa / barattuu (student), barsiisaa / barsiistuu (teacher), hojjetaa (worker). -ina: a quality: jabina (strength), dheerina (length), bareedina (beauty). -ummaa: a state, '-ness, -hood': namummaa (humanity), hiriyyummaa (friendship), Oromummaa (Oromo identity). Action and result nouns: hojii (work), barnoota (education), barreeffama (writing), jireenya (life, from jiraachuu). -iffaa: names of languages: Ingiliffaa (English), Amaariffaa (Amharic); Oromiffaa is an older name for Afaan Oromoo. farra 'against, anti-': farra malaammaltummaa 'anti-corruption'.","ex":[["He worked hard.","Jabinaan hojjete.","","",0],["Our friendship is strong.","Hiriyyummaan keenya cimaadha.","","",0]]},{"h_en":"Reading long words","h_om":"Jechoota dhedheeroo dubbisuu","p_en":"Because endings stack, long words are common. Break them into pieces: barattootaaf = barat-t-oota-a-f 'for the students'; deemuuf = deem-uu-f 'in order to go'; hin dagatinaa = hin + dagat + inaa 'don't forget (pl.)'.","ex":[["Give these books to the students.","Kitaabota kana barattootaaf kenni.","","",0],["Let's help each other.","Wal haa gargaarru.","","",0],["Don't forget! (to several people)","Hin dagatinaa!","","",0]]}]}];

 for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)L[i][j]=a[i-1]===b[j-1]?L[i-1][j-1]+1:Math.max(L[i-1][j],L[i][j-1]);

  $('p',{class:'hint'},fc.flip?'':T('flip')));
 const flip=()=>{fc.flip=!fc.flip;render()};
 card.addEventListener('click',flip);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});
 wrap.append($('p',{class:'count'},`${fc.queue.length} ${T('left')} · ${fc.total}`),card);
 const row=$('div',{class:'row'});
 if(canSpeak(lang))row.append($('button',{type:'button',onclick:()=>say(it.pre?`${it.pre}. ${it.t}`:it.t,lang,0.9)},T('listen')));
 row.append($('button',{type:'button',onclick:()=>{fc.queue.push(fc.queue.shift());fc.flip=false;render()}},T('again')),
  $('button',{type:'button',class:'main',onclick:()=>{known[ukey(u,i)]=1;saveKnown();fc.queue.shift();fc.flip=false;render()}},T('got')));
 wrap.append(row);app.append(wrap);
}

/* ----- Quiz ----- */
let qz=null;
function buildQuiz(u){
 const lang=tgt(),n=Math.min(10,u.items.length);
 const types=['tm','mt'];if(canSpeak(lang))types.push('au');
 return shuffle(u.items.map((_,i)=>i)).slice(0,n).map((i,qi)=>{
  const type=types[qi%types.length],it=u.items[i];
  const field=type==='mt'?(x=>display(x)):(x=>x.m);const ans=field(it);
  const pool=[...new Set(shuffle(u.items.filter((_,j)=>j!==i).map(field)).filter(v=>v!==ans))];
  return{i,type,ans,opts:shuffle([ans,...pool.slice(0,3)]),picked:null};
 });
}
function renderQuiz(u){
 const lang=tgt(),bk=ukey(u,'');
 if(!qz||qz.id!==bk)qz={id:bk,qs:buildQuiz(u),k:0};
 if(qz.k>=qz.qs.length){
  const sc=qz.qs.filter(q=>q.picked===q.ans).length;
  if(!(best[bk]>=sc)){best[bk]=sc;store.set('al2-best',best)}
  const wrong=qz.qs.filter(q=>q.picked!==q.ans);
  app.append($('div',{class:'card',style:'align-items:center;text-align:center'},
   $('p',{class:'sec-label'},T('score')),$('p',{class:'big-score'},`${sc}/${qz.qs.length}`),
   $('p',{class:'muted'},`${T('best')}: ${best[bk]}/${qz.qs.length}`),wrong.length?null:$('p',{},T('perfect'))));
  if(wrong.length){app.append($('p',{class:'sec-label'},T('review')));const l=$('div',{class:'list'});wrong.forEach(q=>l.append(itemCard(u,u.items[q.i],q.i,{compact:true})));app.append(l)}
  app.append($('button',{type:'button',class:'main',onclick:()=>{qz=null;render()}},T('restart')));
  return;
 }
 const q=qz.qs[qz.k],it=u.items[q.i];
 const box=$('div',{class:'card'});
 box.append($('p',{class:'count'},`${qz.k+1}/${qz.qs.length}`),$('p',{class:'muted'},T(q.type==='tm'?'qTM':q.type==='mt'?'qMT':'qAU')));
 const sayIt=()=>say(it.pre?`${it.pre}. ${it.t}`:it.t,lang,0.9);
 if(q.type==='au'){box.append($('button',{type:'button',class:'main',onclick:sayIt},'🔊 '+T('listen').replace(/^▶ /,'')));if(q.picked==null)setTimeout(sayIt,250)}
 else box.append($('p',{class:'qprompt',lang:q.type==='tm'?(lang==='en'?'en':'om'):(lang==='en'?'om':'en')},q.type==='tm'?display(it):it.m));
 const opts=$('div',{class:'opts'});
 q.opts.forEach(o=>{const b=$('button',{type:'button',disabled:q.picked!=null},o);
  if(q.picked!=null){if(o===q.ans)b.classList.add('right');else if(o===q.picked)b.classList.add('wrong')}
  b.addEventListener('click',()=>{q.picked=o;if(o===q.ans){known[ukey(u,q.i)]=1;saveKnown()}render()});opts.append(b)});
 box.append(opts);
 if(q.picked!=null){
  const ok=q.picked===q.ans;
  box.append($('p',{class:'res'},$('b',{},ok?T('right'):T('wrong')+' '),ok?'':q.ans));
  if(q.type!=='tm')box.append($('p',{class:'nt'},`${display(it)} = ${it.m}`));
  box.append($('button',{type:'button',class:'main',onclick:()=>{qz.k++;render()}},qz.k+1<qz.qs.length?T('next'):T('finish')));
 }
 app.append(box);
}

/* ===== START ===== */
if(hasTTS){pickVoices();speechSynthesis.onvoiceschanged=pickVoices}
route();

</script>
