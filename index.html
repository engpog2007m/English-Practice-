@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

*{box-sizing:border-box}
[hidden]{display:none!important}

#app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}

p{margin:0}
.muted{color:var(--muted)}

.grid{display:grid;grid-template-columns:1fr;gap:10px}

.warn{background:var(--warn);border-radius:12px;padding:10px 14px;font-size:.92rem}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:14px}
.tabs button{flex:1;background:transparent;min-height:40px}
.tabs button[aria-selected=true]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.known{border-color:var(--accent)}
.lbl{display:inline-block;align-self:flex-start;background:var(--chip);border-radius:8px;padding:2px 10px;font-weight:800;font-size:1.05rem}
.tgt{font-family:var(--display);font-size:1.45rem;line-height:1.3;overflow-wrap:anywhere}
.tgt .w{cursor:pointer;border-radius:6px;padding:0 1px}
.tgt .w.on{background:var(--gold);color:#2a2317}
.tgt .w.good{color:var(--good);text-decoration:underline;text-decoration-thickness:2px}
.tgt .w.bad{color:var(--bad);text-decoration:underline wavy}
.mng{overflow-wrap:anywhere}
.mng b{color:var(--warm)}
.nt{font-size:.92rem;color:var(--muted);overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:8px 14px;min-height:44px;cursor:pointer;background:var(--chip);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.main{background:var(--accent);color:var(--accent-fg)}
button.live{background:var(--bad);color:#fff}
button.sel{background:var(--accent);color:var(--accent-fg)}
button.link{background:transparent;padding:4px 0;min-height:36px;color:var(--accent);text-decoration:underline}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.res{font-size:.95rem;overflow-wrap:anywhere}
.res .sc{font-weight:800;font-variant-numeric:tabular-nums}
audio{width:100%;max-width:100%;height:40px}
.fc{background:var(--card);border:2px solid var(--line);border-radius:20px;min-height:220px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;cursor:pointer;user-select:none}
.fc .big{font-family:var(--display);font-size:1.8rem;line-height:1.25;overflow-wrap:anywhere}
.fc .hint{color:var(--muted);font-size:.85rem}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{justify-content:flex-start;text-align:left;background:var(--card);border:2px solid var(--line);font-weight:700;padding:10px 14px}
.opts button:disabled{opacity:1}
.opts button.right{border-color:var(--good);background:var(--soft)}
.opts button.wrong{border-color:var(--bad)}
.qprompt{font-family:var(--display);font-size:1.5rem;overflow-wrap:anywhere}
.big-score{font-family:var(--display);font-size:3rem;font-variant-numeric:tabular-nums}
.about{display:flex;flex-direction:column;gap:8px;font-size:.95rem}
.about ol{margin:0;padding-left:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

const EN_SOUNDS = {id:"sounds", icon:"👄", t:{en:"Hard sounds for Oromo speakers", om:"Sagalee rakkisoo"},
 intro:{om:"Afaan Oromoo keessatti jechi hundi dubbachiiftuun dhuma, qubeen lama walitti aanee jalqaba irratti hin jiru. Ingiliffaa keessatti garuu ni jiru (school, book). Kanneen asii suuta shaakali.",
        en:"In Afaan Oromoo every word ends in a vowel and no word starts with two consonants. English does both (school, book). These are the sounds Oromo speakers most often find hard."},
 items:[
 ["thank you","galatoomi","“th”: put your tongue between your teeth and blow. Not “t”, not “s”.","“th”: arraba ilkaan gidduu kaa'iitii afuura baasi. “t” yookiin “s” miti."],
 ["three","sadii","Same “th”. Three ≠ tree.","“th” tokkuma. three (3) fi tree (muka) adda."],
 ["this","kun / kana","Voiced “th”: tongue between teeth, with voice. Not “dis”.","“th” sagalee qabu: arraba ilkaan gidduu, sagalee waliin. “dis” miti."],
 ["mother","haadha","Voiced “th” in the middle of the word.","“th” jecha gidduutti."],
 ["very","baay'ee","“v”: top teeth on lower lip, with voice. Not “b” or “f”.","“v”: ilkaan gubbaa hidhii gadii irra kaa'i, sagalee waliin. “b” yookiin “f” miti."],
 ["village","ganda","Practise “v” at the start of a word.","“v” jalqaba jechaa irratti."],
 ["people","namoota","English “p” is a puff of air, not a hard “ph” and not “b”.","“p” Ingiliffaa afuura qofa: “ph” jabaa yookiin “b” miti."],
 ["paper","waraqaa","Two soft “p” sounds.","“p” laafaa lama."],
 ["school","mana barumsaa","Start directly with “sk”. Don't say “iskuul”.","Kallattiin “sk” jedhi. “iskuul” hin jedhin."],
 ["street","daandii","Three consonants: s-t-r. No vowel before or between them.","Qubee lafa jabaa sadii: s-t-r. Dubbachiiftuu hin dabalin."],
 ["sport","ispoortii","Say “sport”, not “i-sport”.","“sport” jedhi, “i-sport” miti."],
 ["book","kitaaba","End on “k”. Don't add a vowel: not “buk-u”.","“k” irratti dhaabi. “buk-u” hin jedhin."],
 ["work","hojii","End on “rk” with no vowel after it.","“rk” irratti xumuri; dubbachiiftuu hin dabalin."],
 ["ship","doonii","Short “i” (like Oromo i).","“i” gabaabaa (akka i Afaan Oromoo)."],
 ["sheep","hoolaa","Long “ee” sound (like Oromo ii). ship ≠ sheep!","“ii” dheeraa. ship fi sheep adda!"],
 ["live","jiraachuu","Short vowel.","Dubbachiiftuu gabaabaa."],
 ["leave","ka'uu / deemuu","Long vowel. live ≠ leave.","Dubbachiiftuu dheeraa. live fi leave adda."],
 ["know","beekuu","Silent “k”: say “no”.","“k” hin dubbifamu: “no” jedhi."],
 ["write","barreessuu","Silent “w”: sounds like “right”.","“w” hin dubbifamu: akka “right”."],

 ["teacher","barsiisaa","Stress the first part: TEA-cher.","Kutaa jalqabaa cimsi: TEA-cher."],
 ["computer","kompiitara","Stress the middle: com-PU-ter.","Gidduu cimsi: com-PU-ter."]

const EN_GRAMMAR = {id:"grammar", icon:"🧩", t:{en:"English grammar basics", om:"Seerluga Ingiliffaa"},
 intro:{om:"Seera 12 bu'uuraa. Tokkoon tokkoon isaa fakkeenya qaba: dhaggeeffadhu, dubbadhu, ilaali.",
        en:"Twelve core rules, each with an example to hear, say and check."},
 items:[
 ["I drink coffee.","Ani buna nan dhuga.","Word order: English is Subject–Verb–Object. Oromo puts the verb last.","Tartiiba jechaa: Ingiliffaa = Raawwataa–Gochima–Wanta. Afaan Oromoo gochima dhuma irratti kaa'a."],
 ["I am a student.","Ani barataadha.","“to be”: I am / you are / he, she, it is / we, they are. Oromo uses -dha.","“to be”: I am / you are / he, she, it is / we, they are. Afaan Oromoo -dha fayyadama."],
 ["She is at home.","Isheen mana jirti.","For a place, English still uses “is”. Oromo uses jira/jirti.","Iddoo yoo himtu Ingiliffaan “is” fayyadama. Afaan Oromoo jira/jirti."],
 ["I have a book. The book is new.","Kitaaba qaba. Kitaabni sun haaraadha.","a / an = one (first time). the = the one we know. Oromo has no articles.","a / an = tokko (yeroo jalqabaa). the = isa beekamu. Afaan Oromoo keessa hin jiru."],
 ["one book, two books","kitaaba tokko, kitaaba lama","Plural: add -s. Oromo often keeps the noun singular after a number.","Baay'ina: -s dabali. Afaan Oromoo lakkoofsa booda maqaa tokkichaan dhiisa."],
 ["He works every day.","Inni guyyaa guyyaan ni hojjeta.","Present simple: add -s for he / she / it.","Yeroo ammaa: he / she / it booda gochimarratti -s dabali."],
 ["I am working now.","Amma hojjechaa jira.","Present continuous = am / is / are + -ing (like Oromo “-aa jira”).","Yeroo ammaa itti fufaa = am / is / are + -ing (akka “-aa jira”)."],
 ["I worked yesterday. I went home.","Kaleessa hojjedhe. Mana deeme.","Past: add -ed. Common verbs are irregular: go → went, eat → ate.","Darbe: -ed dabali. Gochimni muraasni adda: go → went, eat → ate."],
 ["I will call you tomorrow.","Boru siif nan bilbila.","Future: will + verb. Oromo uses the present form for the future.","Gara fuulduraa: will + gochima. Afaan Oromoo bifa yeroo ammaa fayyadama."],
 ["Do you like coffee?","Buna ni jaallattaa?","Questions: Do / Does / Did + subject + verb. Oromo just raises the voice (-aa).","Gaaffii: Do / Does / Did + raawwataa + gochima. Afaan Oromoo sagalee ol kaasa (-aa)."],
 ["I don't eat meat.","Foon hin nyaadhu.","Negative: don't / doesn't / didn't + verb = Oromo “hin …”.","Dhabamsa: don't / doesn't / didn't + gochima = “hin …”."],
 ["This is my house.","Kun mana kooti.","my / your / his / her / our / their go BEFORE the noun. Oromo koo / kee go after.","my / your / his / her / our / their maqaa DURA dhufu. koo / kee booda dhufu."]
 ]};

 intro:{en:"Fourteen core patterns. Learn the pattern, then swap in new words.", om:"Seera bu'uuraa."},
 items:[
 ["Ani buna nan dhuga.","I drink coffee.","Word order is Subject–Object–Verb: “I coffee drink.”"],
 ["ani, ati, inni, isheen, nuti, isin, isaan","I, you, he, she, we, you (pl./respect), they","Subject pronouns. Isin is also the polite “you” for elders. Verb endings often show the subject, so pronouns can be dropped."],
 ["Ani barataadha. Ani barataa miti.","I am a student. I am not a student.","“is” = -dha after a long vowel (written attached), nothing after a short a. “is not” = miti."],
 ["Ani mana jira.","I am at home.","Location and existence use jiraachuu: jira (I/he), jirta (you), jirti (she), jirra (we), jirtu (you pl.), jiru (they)."],
 ["nan deema, ni deemta, ni deema, ni deemti, ni deemna, ni deemtu, ni deemu","I go, you go, he goes, she goes, we go, you (pl.) go, they go","Present tense of deemuu (to go): stem deem- + ending. The particle ni/nan marks a positive statement. Also used for the future."],
 ["deeme, deemte, deeme, deemte, deemne, deemtan, deeman","I went, you went, he went, she went, we went, you (pl.) went, they went","Past tense: stem + -e / -te / -ne / -tan / -an."],
 ["Hin deemu. Hin deemne.","I don't go. I didn't go.","Negative: hin + verb. Present ends in -u; the past is hin …ne for every person."],
 ["Deemaa jira.","I am going.","Continuous: verb in -aa + jira/jirta/jirti …"],
 ["mana koo, maqaa kee","my house, your name","Possessives come after the noun: koo (my), kee (your), isaa (his), ishee (her), keenya (our), keessan (your pl.), isaanii (their)."],
 ["Manni koo guddaadha.","My house is big.","Subject marking: a noun that is the subject takes -n / -ni / -tu (mana → manni, maqaa → maqaan)."],
 ["Buna ni dhugdaa?","Do you drink coffee?","Yes/no questions: rising voice and/or lengthened final vowel."],
 ["Kottu! Taa'i! Deemi!","Come! Sit! Go!","Imperatives (one person). Plural/respect adds -aa: Kottaa! Taa'aa! Deemaa!"],
 ["Hin deemin!","Don't go!","Negative command: hin + verb + -in (plural/respect: -inaa)."],
 ["Buna fi shaayii","coffee and tea","“and” = fi. In speech it attaches to the word before it (bunaafi)."]
 ]};

const hasTTS='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const canRec=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
let voices={en:null,om:null};
function pickVoices(){if(!hasTTS)return;const v=speechSynthesis.getVoices(),had=!!voices.om;
 voices.en=v.find(x=>/^en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;
 voices.om=v.find(x=>/^(om|gaz)\b/i.test(x.lang))||null;
 if(state.view&&had!==!!voices.om)render();}
const canSpeak=lang=>hasTTS&&(lang==='en'?true:!!voices.om);
function say(text,lang,rate,onword,onend){
 if(!hasTTS)return;speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang=lang==='en'?'en-US':'om-ET';u.rate=rate;
 const v=voices[lang];if(v)u.voice=v;
 if(onword)u.onboundary=e=>{if(e.name==='word')onword(e.charIndex)};
 u.onend=u.onerror=()=>onend&&onend();speechSynthesis.speak(u);
}
let stopActive=()=>{};
function norm(s){return s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9'\s]/g,' ').split(/\s+/).filter(Boolean)}
function score(target,heard){
 const a=norm(target),b=norm(heard),n=a.length,m=b.length;
 const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)L[i][j]=a[i-1]===b[j-1]?L[i-1][j-1]+1:Math.max(L[i-1][j],L[i][j-1]);
 const hit=new Array(n).fill(false);let i=n,j=m;
 while(i>0&&j>0){if(a[i-1]===b[j-1]){hit[i-1]=true;i--;j--}else if(L[i-1][j]>=L[i][j-1])i--;else j--}
 return{hit,pct:n?Math.round(100*L[n][m]/n):0};
}

function targetEl(it,lang){
 const p=$('p',{class:'tgt',lang:lang==='en'?'en':'om'});const words=[];
 it.t.split(/(\s+)/).forEach(tok=>{if(!tok)return;if(/^\s+$/.test(tok)){p.append(tok);return}
  const s=$('span',{class:'w'},tok);
  if(canSpeak(lang))s.addEventListener('click',()=>say(tok.replace(/[^\p{L}\p{N}']/gu,''),lang,0.8));
  words.push(s);p.append(s)});

}
function itemCard(u,it,i,compact){

 const clear=()=>words.forEach(w=>w.classList.remove('good','bad','on'));

 if(canSpeak(lang)){
  const play=rate=>{stopActive();clear();
   let pos=0;const starts=words.map(w=>{const x=it.t.indexOf(w.textContent,pos);pos=x+w.textContent.length;return x});
   const txt=it.pre?`${it.pre}. ${it.t}`:it.t,off=it.pre?it.pre.length+2:0;
   say(txt,lang,rate,ci=>{ci-=off;let idx=-1;starts.forEach((s,j)=>{if(s<=ci)idx=j});words.forEach((w,j)=>w.classList.toggle('on',j===idx))},clear)};
  row.append($('button',{type:'button',class:'main',onclick:()=>play(0.95)},T('listen')),$('button',{type:'button',onclick:()=>play(0.6)},T('slow')));
 }

 if(lang==='en'&&SR){
  const chk=$('button',{type:'button',class:'main'},T('check'));let on=false;
  chk.addEventListener('click',()=>{
   if(on){stopActive();return}
   stopActive();if(hasTTS)speechSynthesis.cancel();clear();res.hidden=true;
   const rg=new SR();rg.lang='en-US';rg.interimResults=false;rg.maxAlternatives=3;let got=false;
   const fin=()=>{on=false;chk.classList.remove('live');chk.textContent=T('check');stopActive=()=>{}};
   rg.onresult=ev=>{got=true;let b=null;for(const alt of ev.results[0]){const s=score(it.t,alt.transcript);if(!b||s.pct>b.pct)b={...s,text:alt.transcript}}
    let wi=0;words.forEach(w=>{const n=norm(w.textContent).length;const ok=b.hit.slice(wi,wi+n).every(Boolean);wi+=n;if(n)w.classList.add(ok?'good':'bad')});
    res.hidden=false;res.textContent='';res.append($('span',{class:'sc'},`${T('score')}: ${b.pct}%`),` · ${T('heard')} “${b.text}” · ${b.pct>=80?T('great'):T('tryAgain')}`);
    if(b.pct>=80&&!known[k]){known[k]=1;store.set('al-known',known);c.classList.add('known');if(kb)kb.classList.add('sel')}};
   rg.onerror=ev=>{got=true;res.hidden=false;res.textContent=T(ev.error==='not-allowed'||ev.error==='service-not-allowed'?'denied':ev.error==='network'?'net':'nothing')};
   rg.onend=()=>{if(!got){res.hidden=false;res.textContent=T('nothing')}fin()};
   try{rg.start();on=true;chk.classList.add('live');chk.textContent=T('listening');stopActive=()=>{try{rg.stop()}catch(e){}}}catch(e){fin()}
  });

/* ----- Quiz ----- */
let qz=null;
function buildQuiz(u){
 const lang=tgtLang(),n=Math.min(10,u.items.length);
 const types=['tm','mt'];if(canSpeak(lang))types.push('au');
 return shuffle(u.items.map((_,i)=>i)).slice(0,n).map((i,qi)=>{
  const type=types[qi%types.length],it=u.items[i];
  const field=type==='mt'?(x=>display(x)):(x=>x.m);const ans=field(it);
  const pool=shuffle(u.items.filter((_,j)=>j!==i).map(field).filter(v=>v!==ans));
  const opts=shuffle([ans,...[...new Set(pool)].slice(0,3)]);
  return{i,type,ans,opts,picked:null};
 });
}

 const bk=`${state.track}:${u.id}`;
 if(qz.k>=qz.qs.length){
  const sc=qz.qs.filter(q=>q.picked===q.ans).length;
  if(!(best[bk]>=sc)){best[bk]=sc;store.set('al-best',best)}
  const wrong=qz.qs.filter(q=>q.picked!==q.ans);
  app.append($('div',{class:'card',style:'align-items:center;text-align:center'},
   $('p',{class:'sec-label'},T('score')),$('p',{class:'big-score'},`${sc}/${qz.qs.length}`),
   $('p',{class:'muted'},`${T('best')}: ${best[bk]}/${qz.qs.length}`),
   wrong.length?null:$('p',{},T('perfect'))));
  if(wrong.length){app.append($('p',{class:'sec-label'},T('review')));const l=$('div',{class:'list'});wrong.forEach(q=>l.append(itemCard(u,u.items[q.i],q.i,true)));app.append(l)}
  app.append($('button',{type:'button',class:'main',onclick:()=>{qz=null;render()}},T('restart')));
  return;
 }
 const q=qz.qs[qz.k],it=u.items[q.i];
 const box=$('div',{class:'card'});
 box.append($('p',{class:'count'},`${qz.k+1}/${qz.qs.length}`));
 box.append($('p',{class:'muted'},T(q.type==='tm'?'qTM':q.type==='mt'?'qMT':'qAU')));
 const sayIt=()=>say(it.pre?`${it.pre}. ${it.t}`:it.t,lang,0.9);
 if(q.type==='au'){box.append($('button',{type:'button',class:'main',onclick:sayIt},'🔊 '+T('listen').replace(/^▶ /,'')));if(q.picked==null)setTimeout(sayIt,250)}
 else box.append($('p',{class:'qprompt',lang:q.type==='tm'?(lang==='en'?'en':'om'):(lang==='en'?'om':'en')},q.type==='tm'?display(it):it.m));
 const opts=$('div',{class:'opts'});
 q.opts.forEach(o=>{const b=$('button',{type:'button',disabled:q.picked!=null},o);
  if(q.picked!=null){if(o===q.ans)b.classList.add('right');else if(o===q.picked)b.classList.add('wrong')}
  b.addEventListener('click',()=>{q.picked=o;if(o===q.ans){known[key(u.id,q.i)]=1;store.set('al-known',known)}render()});opts.append(b)});
 box.append(opts);
 if(q.picked!=null){
  const ok=q.picked===q.ans;
  box.append($('p',{class:'res'},$('b',{},ok?T('right'):T('wrong')+' '),ok?'':q.ans));
  if(q.type!=='tm')box.append($('p',{class:'nt'},`${display(it)} = ${it.m}`));
  box.append($('button',{type:'button',class:'main',onclick:()=>{qz.k++;render()}},qz.k+1<qz.qs.length?T('next'):T('finish')));
 }
 app.append(box);
}

/* ===== START ===== */
if(hasTTS){pickVoices();speechSynthesis.onvoiceschanged=pickVoices}
route();
