<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Haasaa Ingiliffaa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: single column, max 560px, 16px side gutter. Header + language toggle, how-to box, progress bar, then stacked sentence cards. */
:root{
  --bg:#fbf6ec; --card:#fffdf8; --fg:#2b2418; --muted:#74685a; --line:#eadfc9;
  --accent:#1f7a4d; --accent-fg:#ffffff; --warm:#c8531f; --soft:#e7f2ea; --gold:#e9b949; --warn:#fbe9d9;
  --good:#1f7a4d; --bad:#c0392b;
  --display:'Fraunces',Georgia,serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1812; --card:#232018; --fg:#f2ead9; --muted:#b0a590; --line:#3a3528;
  --accent:#58c28a; --accent-fg:#10231a; --warm:#f08a58; --soft:#1f3328; --gold:#e9b949; --warn:#3a2a1c;
  --good:#58c28a; --bad:#ff7b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1812; --card:#232018; --fg:#f2ead9; --muted:#b0a590; --line:#3a3528;
  --accent:#58c28a; --accent-fg:#10231a; --warm:#f08a58; --soft:#1f3328; --gold:#e9b949; --warn:#3a2a1c;
  --good:#58c28a; --bad:#ff7b6b; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-family:var(--display);font-size:2rem;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.lang button{border-radius:0;min-height:36px;padding:4px 12px;background:transparent;font-weight:800}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.how{background:var(--soft);border-radius:14px;padding:14px 16px;font-size:.95rem}
.how ol{margin:6px 0 0;padding-left:20px}
.bar{display:flex;align-items:center;gap:12px}
.meter{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.count{font-variant-numeric:tabular-nums;font-weight:800;min-width:3.2em;text-align:right}
.note{background:var(--warn);border-radius:12px;padding:10px 14px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.done{border-color:var(--accent)}
.en{font-family:var(--display);font-size:1.4rem;line-height:1.3;margin:0;overflow-wrap:anywhere}
.en .w{cursor:pointer;border-radius:6px;padding:0 2px}
.en .w.on{background:var(--gold);color:#2b2418}
.en .w.good{color:var(--good);text-decoration:underline;text-decoration-thickness:2px}
.en .w.bad{color:var(--bad);text-decoration:underline wavy}
.om{margin:0;color:var(--muted);overflow-wrap:anywhere}
.om b{color:var(--warm);font-weight:800}
.row{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;background:var(--soft);color:var(--fg);display:inline-flex;align-items:center;gap:6px}
button.main{background:var(--accent);color:var(--accent-fg)}
button.live{background:var(--bad);color:#fff}
button.ok.sel{background:var(--accent);color:var(--accent-fg)}
button.hard.sel{background:var(--warm);color:#fff}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rec{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.rec input[type=file]{display:none}
.rec audio{width:100%;max-width:100%}
.res{margin:0;font-size:.95rem;overflow-wrap:anywhere}
.res .sc{font-weight:800;font-variant-numeric:tabular-nums}
.tiny{font-size:.85rem;color:var(--muted);margin:0}
.reset{align-self:center;background:transparent;color:var(--muted);text-decoration:underline;font-weight:600}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Haasaa Ingiliffaa</h1>
      <p class="sub" data-k="sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="l-om" aria-pressed="true">Oromoo</button>
      <button type="button" id="l-en" aria-pressed="false">English</button>
    </div>
  </header>

  <section class="how">
    <b data-k="howT"></b>
    <ol>
      <li data-k="h1"></li><li data-k="h2"></li><li data-k="h3"></li><li data-k="h4"></li><li data-k="h5"></li>
    </ol>
  </section>

  <div class="bar"><div class="meter"><i id="fill"></i></div><div class="count" id="count">0/0</div></div>
  <div class="note" id="nospeech" hidden data-k="noTTS"></div>
  <div class="note" id="norecog" hidden data-k="noASR"></div>

  <main class="wrap" id="list" style="gap:12px"></main>
  <button class="reset" id="reset" data-k="reset"></button>
</div>

<script>
const T={
om:{
 sub:"Hima Ingiliffaa dhaggeeffadhu, ol-ol jedhi, sagalee kee mirkaneessi.",
 howT:"Akkaataa itti shaakaltu:",
 h1:"“Dhaggeeffadhu” tuqi. Hima sana dhaggeeffadhu.",
 h2:"Jechoota tuqi; jecha tokko tokko dhaggeeffachuu dandeessa.",
 h3:"“Dubbadhu, ilaali” tuqi, sana booda hima sana dubbadhu. Jechi sirrii ta'e magariisa, kan dogoggore diimaa ta'a.",
 h4:"Yoo barbaadde “Waraabi” tuqi; sagalee kee dhaggeeffadhu.",
 h5:"Yeroo jabaattu “Ani jedheera” tuqi.",
 noTTS:"Bilbila kee irratti sagaleen Ingiliffaa hin dhaga'amu. Chrome yaali.",
 noASR:"Browser kun dubbii hin hubatu. Chrome (Android) yookiin Safari (iPhone) fayyadami; yeroo ammaa hima ofiin dubbisii dhaggeeffadhu.",
 listen:"▶ Dhaggeeffadhu", slow:"🐢 Suuta", meaning:"Hiika:",
 check:"🎤 Dubbadhu, ilaali", listening:"⏹ Dhaggeessaa jira… (tuqi)",
 rec:"🔴 Waraabi", stop:"⏹ Dhaabi", recFile:"🎙 Sagalee koo waraabi",
 ok:"✓ Ani jedheera", hard:"Ulfaataa dha", reset:"Haaraa jalqabi",
 heard:"Dhaga'ame:", score:"Qabxii:", great:"Baayyee gaarii! 👏", again:"Irra deebi'ii yaali. Jechoota diimaa suuta jedhi.",
 nospeech:"Homaa hin dhaga'ame. Maayikiroofoonitti dhiʼaadhuu irra deebi'i.",
 denied:"Maayikiroofoonii eeyyamuu qabda (Allow).", netErr:"Interneetii kee ilaali.",
 tip:"Waraabuu erga xumurtee asitti dhaggeeffadhu."
},
en:{
 sub:"Hear the English sentence, say it out loud, and check your voice.",
 howT:"How to practice:",
 h1:"Tap “Listen” to hear the sentence.",
 h2:"Tap any word to hear just that word.",
 h3:"Tap “Speak & check”, then say the sentence. Correct words turn green; missed words turn red.",
 h4:"Optional: tap “Record” and listen to your own voice.",
 h5:"When you feel confident, tap “I said it”.",
 noTTS:"This device has no English voice. Try Chrome.",
 noASR:"This browser can't recognise speech. Use Chrome (Android) or Safari (iPhone). For now, say each sentence and compare by ear.",
 listen:"▶ Listen", slow:"🐢 Slow", meaning:"Meaning (Afaan Oromoo):",
 check:"🎤 Speak & check", listening:"⏹ Listening… (tap to stop)",
 rec:"🔴 Record", stop:"⏹ Stop", recFile:"🎙 Record my voice",
 ok:"✓ I said it", hard:"This is hard", reset:"Start over",
 heard:"Heard:", score:"Score:", great:"Great job! 👏", again:"Try again. Say the red words slowly.",
 nospeech:"Nothing heard. Move closer to the microphone and try again.",
 denied:"Please allow the microphone.", netErr:"Check your internet connection.",
 tip:"After recording, listen back here."
}};
let lang='om';
try{const s=localStorage.getItem('haasaa-lang');if(s==='en'||s==='om')lang=s}catch(e){}
function applyLang(){
  document.documentElement.lang=lang==='om'?'om':'en';
  document.querySelectorAll('[data-k]').forEach(e=>{e.textContent=T[lang][e.dataset.k]});
  document.getElementById('l-om').setAttribute('aria-pressed',lang==='om');
  document.getElementById('l-en').setAttribute('aria-pressed',lang==='en');
  document.querySelectorAll('.card').forEach(c=>c._refresh&&c._refresh());
  try{localStorage.setItem('haasaa-lang',lang)}catch(e){}
}
const tt=k=>T[lang][k];

/* ---------- scoring (pure) ---------- */
function norm(s){return s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9'\s]/g,' ').split(/\s+/).filter(Boolean)}
function score(target,heard){
  const a=norm(target),b=norm(heard);
  const n=a.length,m=b.length,L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)L[i][j]=a[i-1]===b[j-1]?L[i-1][j-1]+1:Math.max(L[i-1][j],L[i][j-1]);
  const hit=new Array(n).fill(false);let i=n,j=m;
  while(i>0&&j>0){if(a[i-1]===b[j-1]){hit[i-1]=true;i--;j--}else if(L[i-1][j]>=L[i][j-1])i--;else j--}
  return {hit,pct:n?Math.round(100*L[n][m]/n):0};
}

/* ---------- data ---------- */
const S=[
["How are you?","Akkam jirta?"],
["I am doing well, thank God.","Nagaan jira, Waaqayyoof galata."],
["How was your day?","Guyyaan kee akkam ture?"],
["My day was good.","Guyyaan koo gaarii ture."],
["Are you at home?","Mana jirtaa?"],
["I am at home.","Mana jira."],
["I am at work.","Hojii irra jira."],
["I am going to school.","Mana barumsaa deemaa jira."],
["I went to church today.","Har'a waldaa deeme."],
["What are you doing now?","Ammaa maal hojjachaa jirta?"],
["What did you do today?","Har'a maal hojjatte?"],
["I am cooking rice.","Rice hojjachaa jira."],
["Did you eat?","Nyaatee jirtaa?"],
["I am tired and I want to sleep.","Dadhabee jira, rafuu barbaada."],
["I am resting at home.","Mana keessa boqonnaa fudhachaa jira."],
["Are you awake?","Dammaqxee jirtaa?"],
["I miss you.","Sin yaadaa jira."],
["I love you.","Sin jaalladha."],
["You are beautiful.","Ati bareedduu dha."],
["Thank you, my love.","Galatoomi jaalallee koo."],
["I want to see you soon.","Dhiyootti si arguu barbaada."],
["When can we talk?","Yoom haasa'uu dandeenya?"],
["I am here for you.","Ani siif jira."],
["Learning English is important.","Afaan Ingiliffaa baruun barbaachisaa dha."],
["God willing, we will go to church together.","Fedhaan Waaqayyoo yoo ta'e, waldaa waliin deemna."],
["Good morning. Have a good day.","Akkam bulte? Guyyaa gaarii qabaadhu."]
];
const KEY='haasaa-v1';
let prog={};
try{prog=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){prog={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}}

/* ---------- capabilities ---------- */
const hasTTS='speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const canRec=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
if(!hasTTS)document.getElementById('nospeech').hidden=false;
if(!SR)document.getElementById('norecog').hidden=false;

let voice=null;
function pickVoice(){
  if(!hasTTS)return;
  const v=speechSynthesis.getVoices();
  voice=v.find(x=>/^en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;
}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,rate,onword,onend){
  if(!hasTTS){document.getElementById('nospeech').hidden=false;return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=rate;if(voice)u.voice=voice;
  if(onword)u.onboundary=e=>{if(e.name==='word')onword(e.charIndex)};
  u.onend=u.onerror=()=>onend&&onend();
  speechSynthesis.speak(u);
}

/* ---------- cards ---------- */
const list=document.getElementById('list');
const urls={};
let activeRec=null; // only one recognition/recording at a time
function stopActive(){if(activeRec){try{activeRec()}catch(e){}activeRec=null}}
function mk(k,cls,fn){const b=document.createElement('button');b.type='button';b.dataset.k=k;if(cls)b.className=cls;b.addEventListener('click',fn);return b}

S.forEach(([en,om],i)=>{
  const c=document.createElement('article');c.className='card';c.id='c'+i;
  const p=document.createElement('p');p.className='en';
  const words=[];
  en.split(/(\s+)/).forEach(t=>{
    if(!t)return;
    if(/^\s+$/.test(t)){p.append(t);return}
    const s=document.createElement('span');s.className='w';s.textContent=t;
    s.addEventListener('click',()=>say(t.replace(/[^\w']/g,''),0.8));
    words.push(s);p.append(s);
  });
  const clearMarks=()=>words.forEach(w=>w.classList.remove('good','bad'));
  const m=document.createElement('p');m.className='om';
  const mb=document.createElement('b');mb.dataset.k='meaning';m.append(mb,' ',om);

  const play=rate=>{
    stopActive();clearMarks();
    words.forEach(w=>w.classList.remove('on'));
    let pos=0;const starts=words.map(w=>{const k=en.indexOf(w.textContent,pos);pos=k+w.textContent.length;return k});
    say(en,rate,ci=>{let idx=0;starts.forEach((s,j)=>{if(s<=ci)idx=j});words.forEach((w,j)=>w.classList.toggle('on',j===idx))},()=>words.forEach(w=>w.classList.remove('on')));
  };
  const r1=document.createElement('div');r1.className='row';
  r1.append(mk('listen','main',()=>play(0.95)),mk('slow',null,()=>play(0.6)));

  /* speak & check */
  const res=document.createElement('p');res.className='res';res.hidden=true;
  let lastRes=null;
  const showRes=()=>{
    if(!lastRes){res.hidden=true;return}
    res.hidden=false;res.textContent='';
    if(lastRes.err){res.textContent=tt(lastRes.err);return}
    const sc=document.createElement('span');sc.className='sc';sc.textContent=tt('score')+' '+lastRes.pct+'%';
    res.append(sc,' · '+tt('heard')+' “'+lastRes.text+'” · '+(lastRes.pct>=80?tt('great'):tt('again')));
  };
  const chk=mk('check','main',()=>{
    if(chk._on){stopActive();return}
    stopActive();if(hasTTS)speechSynthesis.cancel();
    clearMarks();lastRes=null;showRes();
    const rg=new SR();rg.lang='en-US';rg.interimResults=false;rg.maxAlternatives=3;
    let got=false;
    const finish=()=>{chk._on=false;chk.classList.remove('live');chk.textContent=tt('check');activeRec=null};
    rg.onresult=ev=>{
      got=true;let best=null;
      for(const alt of ev.results[0]){const sc=score(en,alt.transcript);if(!best||sc.pct>best.pct)best={...sc,text:alt.transcript}}
      words.forEach((w,j)=>w.classList.add(best.hit[j]?'good':'bad'));
      lastRes=best;showRes();
      if(best.pct>=80){prog[i]='ok';save();paint()}
    };
    rg.onerror=ev=>{
      got=true;
      lastRes={err:ev.error==='not-allowed'||ev.error==='service-not-allowed'?'denied':ev.error==='network'?'netErr':'nospeech'};showRes();
    };
    rg.onend=()=>{if(!got){lastRes={err:'nospeech'};showRes()}finish()};
    try{rg.start();chk._on=true;chk.classList.add('live');chk.textContent=tt('listening');activeRec=()=>rg.stop()}
    catch(e){finish()}
  });
  chk._refresh=()=>{chk.textContent=chk._on?tt('listening'):tt('check')};
  if(!SR)chk.hidden=true;
  r1.append(chk);

  /* record & replay */
  const rec=document.createElement('div');rec.className='rec';
  const au=document.createElement('audio');au.controls=true;au.hidden=true;
  const setAudio=blob=>{if(urls[i])URL.revokeObjectURL(urls[i]);urls[i]=URL.createObjectURL(blob);au.src=urls[i];au.hidden=false};
  let rbtn;
  if(canRec){
    rbtn=mk('rec',null,async()=>{
      if(rbtn._on){stopActive();return}
      stopActive();if(hasTTS)speechSynthesis.cancel();
      try{
        const st=await navigator.mediaDevices.getUserMedia({audio:true});
        const mr=new MediaRecorder(st);const parts=[];
        mr.ondataavailable=e=>e.data.size&&parts.push(e.data);
        mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());rbtn._on=false;rbtn.classList.remove('live');rbtn.textContent=tt('rec');activeRec=null;
          if(parts.length)setAudio(new Blob(parts,{type:mr.mimeType||'audio/webm'}))};
        mr.start();rbtn._on=true;rbtn.classList.add('live');rbtn.textContent=tt('stop');activeRec=()=>mr.stop();
      }catch(e){lastRes={err:'denied'};showRes()}
    });
    rbtn._refresh=()=>{rbtn.textContent=rbtn._on?tt('stop'):tt('rec')};
    rec.append(rbtn);
  }else{
    const lab=document.createElement('label');lab.className='btn';const ls=document.createElement('span');ls.dataset.k='recFile';lab.append(ls);
    const inp=document.createElement('input');inp.type='file';inp.accept='audio/*';inp.setAttribute('capture','');
    inp.addEventListener('change',()=>{const f=inp.files&&inp.files[0];if(f)setAudio(f)});
    lab.append(inp);rec.append(lab);
  }
  rec.append(au);
  const tip=document.createElement('p');tip.className='tiny';tip.dataset.k='tip';rec.append(tip);

  const r2=document.createElement('div');r2.className='row';
  const ok=mk('ok','ok',()=>{prog[i]=prog[i]==='ok'?'':'ok';save();paint()});
  const hard=mk('hard','hard',()=>{prog[i]=prog[i]==='hard'?'':'hard';save();paint()});
  r2.append(ok,hard);
  c.append(p,m,r1,res,rec,r2);
  c._ok=ok;c._hard=hard;
  c._refresh=()=>{chk._refresh();rbtn&&rbtn._refresh();showRes()};
  list.append(c);
});

function paint(){
  let n=0;
  S.forEach((_,i)=>{
    const c=document.getElementById('c'+i);
    c._ok.classList.toggle('sel',prog[i]==='ok');
    c._hard.classList.toggle('sel',prog[i]==='hard');
    c.classList.toggle('done',prog[i]==='ok');
    if(prog[i]==='ok')n++;
  });
  document.getElementById('count').textContent=n+'/'+S.length;
  document.getElementById('fill').style.width=(100*n/S.length)+'%';
}
document.getElementById('reset').addEventListener('click',()=>{prog={};save();paint()});
document.getElementById('l-om').addEventListener('click',()=>{lang='om';applyLang()});
document.getElementById('l-en').addEventListener('click',()=>{lang='en';applyLang()});
applyLang();paint();
</script>

</body></html>
