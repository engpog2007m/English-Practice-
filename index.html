laces and times with who, which, that, whose, where and when.","summary_om":"Namoota, wantoota, bakkeewwan fi yeroo who, which, that, whose, where fi when'n ibsuu.","sections":[{"h_en":"The relative words","h_om":"Jechoota hima ibsaa","p_en":"A relative clause tells us which person or thing we mean. Afaan Oromoo usually puts a relative verb after the noun, sometimes with 'kan': 'nama dhufe' (the man who came). English needs a relative word right after the noun.","p_om":"Himni ibsaa (relative clause) nama yookiin wanta kam akka jechaa jirru nutti hima. Afaan Oromoo yeroo baay'ee maqaa booda gochima ibsaa kaa'a, yeroo tokko tokko 'kan' wajjin: 'nama dhufe' (the man who came). Ingiliffi maqaa booda battalumatti jecha hima ibsaa barbaada.","table":{"head":["Word","Used for","Example","Afaan Oromoo"],"rows":[["who","people","the woman who called","dubartii bilbilte"],["which","things, animals","the bus which goes to Ambo","awtobisii gara Amboo deemu"],["that","people or things","the book that I read","kitaaba ani dubbise"],["whose","possession","the boy whose bag was lost","mucaa boorsaan isaa bade"],["where","places","the town where I was born","magaalaa ani itti dhaladhe"],["when","times","the day when we met","guyyaa nuti itti wal agarre"]]}},{"h_en":"Subject or object?","h_om":"Raawwataa moo raawwatamaa?","p_en":"If the relative word is the subject of the clause, you must use it: 'The man who lives next door is a doctor.' If it is the object, you can leave it out, especially in speech: 'The book (that) I bought is interesting.' 'The people (who) we met were friendly.'","p_om":"Jechi hima ibsaa raawwataa hima sanaa yoo ta'e, dirqama fayyadamuu qabda: 'The man who lives next door is a doctor.' Raawwatamaa yoo ta'e, keessumaa dubbii keessatti, dhiisuu dandeessa: 'The book (that) I bought is interesting.' 'The people (who) we met were friendly.'"},{"h_en":"Don't repeat the pronoun","h_om":"Bamaqaa irra hin deebi'in","p_en":"Afaan Oromoo can repeat a pronoun inside the clause: 'namoota ani isaan wajjin hojjedhu'. English does not: 'the people I work with' – not 'the people I work with them'. 'The man who I met' – not 'the man who I met him'. A preposition can go at the end: 'the house I live in' = 'the house where I live'.","p_om":"Afaan Oromoo hima ibsaa keessatti bamaqaa irra deebi'ee fayyadamuu danda'a: 'namoota ani isaan wajjin hojjedhu'. Ingiliffi garuu akkas hin godhu: 'the people I work with' – 'the people I work with them' miti. 'The man who I met' – 'the man who I met him' miti. Durduubeen dhumatti dhufuu danda'a: 'the house I live in' = 'the house where I live'."},{"h_en":"Extra information: commas","h_om":"Odeeffannoo dabalataa: qoodduu","p_en":"Sometimes the clause only adds extra information about a person or thing that is already clear. Then put commas around it and don't use 'that': 'My sister, who lives in Dubai, is visiting us next week.' 'Finfinnee, which is the capital, is growing fast.'","p_om":"Yeroo tokko tokko himni ibsaa odeeffannoo dabalataa nama yookiin wanta duraanuu ifa ta'e irratti dabala qofa. Yeroo kana qoodduudhaan marsi, 'that' hin fayyadamin: 'My sister, who lives in Dubai, is visiting us next week.' 'Finfinnee, which is the capital, is growing fast.'","ex":[["The man who lives next door is a doctor.","Namni ollaa keenya jiraatu doktora.","","",0],["The book that I bought yesterday is very interesting.","Kitaabni ani kaleessa bitadhe baay'ee nama hawwata.","","",0],["Do you know the girl whose father is a pilot?","Intala abbaan ishee pilootii ta'e ni beektaa?","","",0],["That's the hospital where I was born.","Sun hospitaala ani itti dhaladhe.","","",0],["I'll never forget the day when we met.","Guyyaa nuti itti wal agarre gonkumaa hin irraanfadhu.","","",0],["The people I work with are very kind.","Namoonni ani isaan wajjin hojjedhu baay'ee gaggaarii.","Oromo repeats 'isaan'; English doesn't.","Afaan Oromoo 'isaan' irra deebi'a; Ingiliffi hin deebi'u.",0],["My sister, who lives in Dubai, is coming next week.","Obboleettiin koo, kan Dubaay jiraattu, torbee dhufu ni dhufti.","","",0]]}]},{"id":"passive","en":"Active & passive voice","om":"Hima raawwataa fi hima raawwatamaa","icon":"🔄","level":2,"summary_en":"be + past participle in every tense, the agent with 'by', and passive forms in formal requests and instructions.","summary_om":"be + unka raawwatame yeroo hunda keessatti, raawwataa 'by'n, akkasumas hima raawwatamaa gaaffii fi qajeelfama seera qabeessa keessatti.","sections":[{"h_en":"What the passive is","h_om":"Himni raawwatamaa maali","p_en":"In an active sentence the subject does the action: 'Hana wrote the letter.' In a passive sentence the subject receives the action: 'The letter was written by Hana.' We use the passive when the action or the receiver is more important than the doer. Afaan Oromoo makes the passive inside the verb with -am- (barreessuu → barreeffamuu, ijaaruu → ijaaramuu, nyaachuu → nyaatamuu). English uses a form of 'be' + the past participle (V3), and shows the doer with 'by' (Oromo -n / -tiin / -dhaan).","p_om":"Hima raawwataa keessatti raawwataan gocha raawwata: 'Hana wrote the letter.' Hima raawwatamaa keessatti immoo raawwataan himaa gocha fudhata: 'The letter was written by Hana.' Gochi yookiin kan gocha fudhatu raawwataa caalaa yeroo barbaachisaa ta'u hima raawwatamaa fayyadamna. Afaan Oromoo hima raawwatamaa gochima keessatti -am- dabaluun uuma (barreessuu → barreeffamuu, ijaaruu → ijaaramuu, nyaachuu → nyaatamuu). Ingiliffi unka 'be' + unka raawwatame (V3) fayyadama, raawwataa immoo 'by'n agarsiisa (Afaan Oromoo -n / -tiin / -dhaan)."},{"h_en":"The passive in every tense","h_om":"Hima raawwatamaa yeroo hunda keessatti","p_en":"Only the form of 'be' changes; the main verb is always V3.","p_om":"Unka 'be' qofatu jijjiirama; gochimni ijoon yeroo hunda unka V3 qaba.","table":{"head":["Tense","Form","Example","Afaan Oromoo"],"rows":[["Present simple","am/is/are + V3","Coffee is grown in Jimma.","Bunni Jimmaa keessatti ni oomishama."],["Present continuous","am/is/are being + V3","A new road is being built.","Daandiin haaraan ijaaramaa jira."],["Present perfect","has/have been + V3","The letter has been sent.","Xalayaan sun ergameera."],["Past simple","was/were + V3","This house was built in 1990.","Manni kun bara 1990 ijaarame."],["Past continuous","was/were being + V3","The car was being repaired.","Konkolaataan sun suphamaa ture."],["Past perfect","had been + V3","The flight had been canceled.","Balaliin sun haqamee ture."],["Future (will)","will be + V3","The results will be announced tomorrow.","Bu'aan boru ni beeksifama."],["Future (going to)","am/is/are going to be + V3","The bridge is going to be repaired.","Riqichi suphamuuf jira."],["Future perfect","will have been + V3","It will have been finished by June.","Waxabajjii dura xumuramee ta'a."],["Modal verbs","can/must/should + be + V3","This medicine must be kept cold.","Qorichi kun bakka qabbanaa'aa keessatti kuufamuu qaba."]]}},{"h_en":"From active to passive","h_om":"Hima raawwataa irraa gara raawwatamaatti","p_en":"The object of the active sentence becomes the subject; keep the tense of the verb and use be + V3; the old subject goes after 'by' (in object form). 'They helped me.' → 'I was helped (by them).' 'My sister is painting a picture.' → 'A picture is being painted by my sister.' Only verbs with an object can be passive: 'happen, die, arrive, come, sleep' cannot ('It was happened' is wrong). The perfect continuous and future continuous tenses are almost never made passive.","p_om":"Raawwatamaan hima raawwataa raawwataa ta'a; yeroo gochimaa eegiitii be + V3 fayyadami; raawwataan duraa 'by' booda (unka raawwatamaatiin) dhufa. 'They helped me.' → 'I was helped (by them).' 'My sister is painting a picture.' → 'A picture is being painted by my sister.' Gochimoota raawwatamaa qaban qofatu hima raawwatamaa ta'uu danda'a: 'happen, die, arrive, come, sleep' hin danda'an ('It was happened' dogoggora). Yeroowwan perfect continuous fi future continuous gonkumaa jechuun hima raawwatamaa hin ta'an.","table":{"head":["Active subject","Passive: by + …"],"rows":[["I","by me"],["you","by you"],["he","by him"],["she","by her"],["it","by it"],["we","by us"],["they","by them"]]}},{"h_en":"When to leave out 'by'","h_om":"Yoom 'by' dhiisna","p_en":"Most passive sentences have no 'by' phrase, because the doer is unknown, unimportant or obvious: 'My phone was stolen.' 'English is spoken here.' 'The road was closed.' Add 'by' only when the doer is new or important information: 'This song was written by Ali Birra.'","p_om":"Himoonni raawwatamaa baay'een gaalee 'by' hin qaban; sababni isaas raawwataan hin beekamu, barbaachisaa miti yookiin ifa: 'My phone was stolen.' 'English is spoken here.' 'The road was closed.' Raawwataan odeeffannoo haaraa yookiin barbaachisaa yoo ta'e qofa 'by' dabali: 'This song was written by Ali Birra.'"},{"h_en":"Passive infinitive and 'It's time for'","h_om":"Unka 'to be + V3' fi 'It's time for'","p_en":"The passive also appears after verbs and nouns with to be + V3: 'I want the letter to be written today.' 'There is a lot of work to be done.' 'This form needs to be signed.' And: 'It is time for the decision to be made.' (more common: 'It's time to make the decision').","p_om":"Hima raawwatamaa gochimootaa fi maqaawwan booda to be + V3 wajjinis ni mul'ata: 'I want the letter to be written today.' 'There is a lot of work to be done.' 'This form needs to be signed.' Akkasumas: 'It is time for the decision to be made.' (caalaatti baramaa: 'It's time to make the decision')."},{"h_en":"Formal requests and instructions","h_om":"Gaaffii fi qajeelfama seera qabeessa","p_en":"Notices, letters and official instructions often use the passive to sound polite and impersonal: 'You are requested to pay before April.' 'Passengers are asked not to smoke.' 'Visitors are advised to keep their tickets.' Old or very formal English can also turn an order into a passive with let: 'Let the work be completed.' In everyday English, a simple active request is better: 'Please pay before April.' Informal English also uses get + V3 (get married, get lost, get hurt) and have something done ('I had my hair cut').","p_om":"Beeksisni, xalayaan fi qajeelfamni mootummaa kabajaa fi haala dhuunfaa hin taaneen dubbachuuf yeroo baay'ee hima raawwatamaa fayyadamu: 'You are requested to pay before April.' 'Passengers are asked not to smoke.' 'Visitors are advised to keep their tickets.' Ingiliffi durii yookiin baay'ee seera qabeessi ajaja let fayyadamee gara hima raawwatamaatti jijjiiruu danda'a: 'Let the work be completed.' Ingiliffa guyyaa guyyaa keessatti gaaffiin hima raawwataa salphaan caala: 'Please pay before April.' Ingiliffi idilee get + V3 (get married, get lost, get hurt) fi have something done ('I had my hair cut' – rifeensa koo natti muran) fayyadama.","ex":[["English is spoken in many countries.","Ingiliffi biyyoota baay'ee keessatti ni dubbatama.","","",0],["My phone was stolen yesterday.","Bilbilli koo kaleessa hatame.","","",0],["This book was written by a famous Oromo writer.","Kitaabni kun barreessaa Oromoo beekamaa tokkoon barreeffame.","","",0],["A new school is being built near the river.","Manni barumsaa haaraan laga bira ijaaramaa jira.","","",0],["The results will be announced next week.","Bu'aan torbee dhufu ni beeksifama.","","",0],["Passengers are asked not to smoke.","Imaltoonni tamboo akka hin xuuxne gaafatamu.","","",0],["I want this letter to be posted today.","Xalayaan kun har'a akka ergamu nan barbaada.","","",0]]}]},{"id":"conditionals_real","en":"Conditionals 1: zero and first","om":"Hima 'yoo' 1: zero fi first","icon":"🌦️","level":2,"summary_en":"If + present for facts and real future possibilities; unless, as long as, in case; if vs when.","summary_om":"If + yeroo ammaa dhugaa fi carraa yeroo dhufuu dhugaaf; unless, as long as, in case; if fi when.","sections":[{"h_en":"If = yoo","h_om":"If = yoo","p_en":"English 'if' is Oromo 'yoo'. The if-clause can come first or second; when it comes first, put a comma after it: 'If it rains, we'll stay home.' / 'We'll stay home if it rains.' One big difference: after 'yoo', Afaan Oromoo often uses a past-looking form for the future (Yoo boru roobe…), but English uses the PRESENT: 'If it rains tomorrow…' – never 'If it rained tomorrow' (that is a different type) and never 'If it will rain'.","p_om":"'If' Ingiliffaa fi 'yoo' Afaan Oromoo hiika tokko qabu. Himni 'if' jalqabatti yookiin lammaffaa dhufuu danda'a; yeroo jalqabatti dhufu, isa booda qoodduu kaa'i: 'If it rains, we'll stay home.' / 'We'll stay home if it rains.' Garaagarummaa guddaa tokko: 'yoo' booda Afaan Oromoo yeroo dhufuuf yeroo baay'ee unka yeroo darbe fakkaatu fayyadama (Yoo boru roobe…), Ingiliffi garuu yeroo AMMAA fayyadama: 'If it rains tomorrow…' – 'If it rained tomorrow' (kun gosa biraa) miti, 'If it will rain' gonkumaa miti."},{"h_en":"Zero conditional: always true","h_om":"Zero conditional: yeroo hunda dhugaa","p_en":"If / when + present simple, present simple – for facts, rules and things that always happen: 'If you heat ice, it melts.' 'If I drink coffee at night, I can't sleep.' 'If' and 'when' mean almost the same here.","p_om":"If / when + yeroo ammaa salphaa, yeroo ammaa salphaa – dhugaa, seeraa fi wantoota yeroo hunda raawwatamaniif: 'If you heat ice, it melts.' 'If I drink coffee at night, I can't sleep.' Asitti 'if' fi 'when' hiika walfakkaataa qabu."},{"h_en":"First conditional: a real possibility","h_om":"First conditional: carraa dhugaa","p_en":"If + present simple, will + base verb – for something that may really happen in the future: 'If it rains tomorrow, we'll stay at home.' The main clause can also have can, may, might, should or an imperative: 'If you finish early, you can go home.' 'If you see Lensa, tell her to call me.'","p_om":"If + yeroo ammaa salphaa, will + gochima bu'uuraa – wanta yeroo dhufu dhugumaan raawwatamuu danda'uuf: 'If it rains tomorrow, we'll stay at home.' Himni ijoon can, may, might, should yookiin ajaja qabaachuu danda'a: 'If you finish early, you can go home.' 'If you see Lensa, tell her to call me.'"},{"h_en":"Unless, as long as, in case; if or when?","h_om":"Unless, as long as, in case; if moo when?","p_en":"unless = if … not: 'Unless you hurry, you'll miss the bus.' (= If you don't hurry…) as long as / provided (that) = only if: 'You can borrow my car as long as you drive carefully.' in case = because it might happen: 'Take an umbrella in case it rains.' Use 'when' for something you are sure will happen, 'if' for something possible: 'When I see him, I'll tell him' (I will see him) vs 'If I see him…' (maybe).","p_om":"unless = if … not: 'Unless you hurry, you'll miss the bus.' (= Yoo hin ariifatin…) as long as / provided (that) = yoo … qofa: 'You can borrow my car as long as you drive carefully.' in case = waan ta'uu danda'uuf: 'Take an umbrella in case it rains.' Wanta akka raawwatamu mirkanaa'eef 'when', wanta raawwatamuu danda'uuf 'if' fayyadami: 'When I see him, I'll tell him' (isa nan arga) fi 'If I see him…' (tarii)."},{"h_en":"Common mistakes","h_om":"Dogoggora baramoo","p_en":"Check the if-clause first: present tense, no 'will'.","p_om":"Dursa hima 'if' ilaali: yeroo ammaa, 'will' malee.","table":{"head":["Wrong / Dogoggora","Right / Sirrii"],"rows":[["If she will come, I will tell her.","If she comes, I will tell her."],["If it will rain, we stay home.","If it rains, we'll stay home."],["If you will heat water, it boils.","If you heat water, it boils."],["Unless you don't study, you'll fail.","Unless you study, you'll fail."]]},"ex":[["If you heat ice, it melts.","Cabbiin yoo ho'ifame ni baqa.","","",0],["If it rains tomorrow, we'll stay at home.","Yoo boru roobe, mana turra.","","",0],["If you finish early, you can go home.","Yoo dafte xumurte, mana galuu dandeessa.","","",0],["If you see Lensa, tell her to call me.","Yoo Lensaa argite, akka natti bilbiltu itti himi.","","",0],["Unless you hurry, you'll miss the bus.","Yoo ariifachuu baatte, awtobisii ni dhabda.","","",0],["Take an umbrella in case it rains.","Yoo roobe jedhii dibaabee qabadhu.","","",0],["You can borrow my car as long as you drive carefully.","Of eeggannoon yoo oofte, konkolaataa koo fudhachuu dandeessa.","","",0]]}]},{"id":"phrasal_verbs","en":"30 common phrasal verbs","om":"Gochimoota gaalee 30 baramoo","icon":"🧩","level":2,"summary_en":"Verb + particle combinations like get up, look for, give up – their meanings and word order.","summary_om":"Gochima + jecha xiqqaa akka get up, look for, give up – hiika fi tartiiba isaanii.","sections":[{"h_en":"What is a phrasal verb?","h_om":"Gochimni gaalee maali?","p_en":"A phrasal verb is a verb + a small word (up, down, on, off, in, out, back, away, over, after, for). The meaning is often completely new: 'give' + 'up' = stop trying. Afaan Oromoo usually uses one single verb for these: give up = dhiisuu, look for = barbaaduu, wake up = dammaquu. Phrasal verbs are very common in spoken English, so learn them as whole words.","p_om":"Gochimni gaalee gochima + jecha xiqqaa (up, down, on, off, in, out, back, away, over, after, for) irraa ijaarama. Hiikni isaa yeroo baay'ee guutummaatti haaraa ta'a: 'give' + 'up' = yaaluu dhiisuu. Afaan Oromoo kanaaf yeroo baay'ee gochima tokko qofa fayyadama: give up = dhiisuu, look for = barbaaduu, wake up = dammaquu. Gochimoonni gaalee dubbii Ingiliffaa keessatti baay'ee mul'atu; kanaaf akka jecha guutuu tokkootti baradhu."},{"h_en":"Everyday life","h_om":"Jireenya guyyaa guyyaa","p_en":"Phrasal verbs for daily routines and movement.","p_om":"Gochimoota gaalee sirna guyyaa guyyaa fi sochiif.","table":{"head":["Phrasal verb","Meaning","Afaan Oromoo"],"rows":[["wake up","stop sleeping","dammaquu"],["get up","leave your bed","ka'uu"],["sit down","take a seat","taa'uu"],["stand up","rise to your feet","ka'uu, dhaabbachuu"],["lie down","rest flat","ciisuu"],["put on","dress in (clothes)","uffachuu"],["take off","remove (clothes); leave the ground","baafachuu; (xiyyaara) ka'uu"],["turn on / off","start / stop a machine or light","banuu, qabsiisuu / cufuu, dhaamsuu"],["turn up / down","make louder / quieter","sagalee ol kaasuu / gad buusuu"],["go out","leave home for fun","ba'uu (bashannanuuf)"],["come back","return","deebi'uu"],["come in","enter","seenuu"],["get on / off","enter / leave a bus, train","yaabbachuu / bu'uu"],["eat out","eat at a restaurant","alatti nyaachuu"]]}},{"h_en":"Work, study and people","h_om":"Hojii, barnoota fi namoota","p_en":"Phrasal verbs for work, study and relationships.","p_om":"Gochimoota gaalee hojii, barnootaa fi walitti dhufeenyaaf.","table":{"head":["Phrasal verb","Meaning","Afaan Oromoo"],"rows":[["look for","try to find","barbaaduu"],["look after","take care of","kunuunsuu, eeguu"],["look up","find in a dictionary","galmee jechootaa keessatti barbaaduu"],["find out","discover information","baruu, qorachuu"],["fill in / fill out","complete a form","guutuu"],["write down","write on paper","barreeffachuu"],["give up","stop trying / stop a habit","dhiisuu"],["give back","return","deebisuu"],["pick up","lift; collect someone","kaasuu; fudhachuu"],["put off","postpone","booda dabarsuu"],["call back","phone again","deebisanii bilbiluu"],["hang up","end a phone call","bilbila cufuu"],["run out of","have no more","… dhumuu"],["break down","stop working (machine)","hojii dhaabuu, dadhabuu"],["grow up","become an adult","guddachuu"],["get along with","have a good relationship","… wajjin walii galuu"],["look forward to","wait happily for","hawwiin eeguu"],["set up","start, organize","dhaabuu, hundeessuu"],["carry on","continue","itti fufuu"],["turn down","refuse","diduu"]]}},{"h_en":"Word order: separable or not","h_om":"Tartiiba: kan addaan ba'u fi kan hin baane","p_en":"With many phrasal verbs that take an object, the object can go in the middle or at the end: 'Turn off the light' / 'Turn the light off'. But a pronoun (it, them, her…) must go in the middle: 'Turn it off' – not 'Turn off it'. Some phrasal verbs never separate: 'look after the baby / look after her' – not 'look her after'; also look for, get on, get off, run out of.","p_om":"Gochimoota gaalee raawwatamaa fudhatan baay'ee wajjin, raawwatamaan gidduu yookiin dhumatti dhufuu danda'a: 'Turn off the light' / 'Turn the light off'. Bamaqaan (it, them, her…) garuu dirqama gidduu dhufa: 'Turn it off' – 'Turn off it' miti. Gochimoonni gaalee tokko tokko gonkumaa addaan hin ba'an: 'look after the baby / look after her' – 'look her after' miti; akkasumas look for, get on, get off, run out of.","ex":[["I wake up at six, but I get up at half past six.","Sa'aatii 12tti nan dammaqa, garuu sa'aatii 12 fi walakkaatti nan ka'a.","","",0],["Put on your jacket; it's cold.","Jaakkeetii kee uffadhu; ni qorra.","","",0],["Can you turn off the TV? – Sure, I'll turn it off.","Televiziyoona cufuu dandeessaa? – Tole, nan cufa.","","",0],["I'm looking for my keys.","Furtuuwwan koo barbaadaa jira.","","",0],["My grandmother looks after my children.","Akkoon koo ijoollee koo kunuunsiti.","","",0],["Please fill in this form.","Maaloo unka kana guuti.","","",0],["We've run out of sugar.","Sukkaarri nu jalaa dhumeera.","","",0],["Don't give up – you're almost there!","Hin dhiisin – dhiyaatteetta!","","",0]]}]},{"id":"word_formation","en":"Word formation & spelling rules","om":"Uumama jechootaa fi seera barreeffamaa","icon":"🏗️","level":2,"summary_en":"Prefixes and suffixes that build new words, and the spelling rules for adding endings (silent e, doubling, y → i).","summary_om":"Maxxantuu jalqabaa fi dhumaa jechoota haaraa ijaaran, akkasumas seera barreeffamaa dhuma itti dabaluuf (e callistuu, dachaa, y → i).","sections":[{"h_en":"Prefixes","h_om":"Maxxantuu jalqabaa (prefixes)","p_en":"A prefix is added at the beginning of a word. Many make opposites: un- (happy → unhappy), dis- (agree → disagree, advantage → disadvantage), in- (correct → incorrect, visible → invisible), im- before m/p (possible → impossible, polite → impolite), il- before l (legal → illegal, literate → illiterate), ir- before r (regular → irregular), mis- = wrongly (understand → misunderstand), non- (smoker → non-smoker). Afaan Oromoo shows these ideas with 'hin' or 'kan hin …' (kan hin danda'amne = impossible). Other prefixes: re- = again (rewrite), pre- = before (prepay), over- = too much (overeat), bi- = two (bilingual), multi- = many, co- = together (co-worker).","p_om":"Maxxantuun jalqabaa jalqaba jechaatti dabalama. Baay'een isaanii faallaa uumu: un- (happy → unhappy), dis- (agree → disagree, advantage → disadvantage), in- (correct → incorrect, visible → invisible), im- m/p dura (possible → impossible, polite → impolite), il- l dura (legal → illegal, literate → illiterate), ir- r dura (regular → irregular), mis- = dogoggoraan (understand → misunderstand), non- (smoker → non-smoker). Afaan Oromoo yaada kana 'hin' yookiin 'kan hin …' n ibsa (kan hin danda'amne = impossible). Maxxantuu biroo: re- = irra deebi'uu (rewrite), pre- = dura (prepay), over- = hamma ol (overeat), bi- = lama (bilingual = afaan lama dubbataa), multi- = baay'ee, co- = waliin (co-worker)."},{"h_en":"Suffixes that make nouns","h_om":"Maxxantuu dhumaa maqaa uuman","p_en":"People: -er, -or, -ist, -ian (teach → teacher, act → actor, art → artist, library → librarian). Abstract nouns: -ness (kind → kindness), -ment (agree → agreement), -tion/-sion (inform → information, decide → decision), -ity (able → ability), -ship (friend → friendship), -hood (child → childhood), -dom (free → freedom). Afaan Oromoo does the same with -aa/-tuu (barsiisaa, barsiiftuu), -ummaa (gaarummaa, hiriyummaa) and -ina (dheerina). Some words come from Greek or Latin parts: -logy = study (biology), -phobia = fear (hydrophobia = fear of water), -cide = killing (insecticide).","p_om":"Namoota: -er, -or, -ist, -ian (teach → teacher, act → actor, art → artist, library → librarian). Maqaa yaadaa: -ness (kind → kindness), -ment (agree → agreement), -tion/-sion (inform → information, decide → decision), -ity (able → ability), -ship (friend → friendship), -hood (child → childhood), -dom (free → freedom). Afaan Oromoos haaluma kanaan -aa/-tuu (barsiisaa, barsiiftuu), -ummaa (gaarummaa, hiriyummaa) fi -ina (dheerina) fayyadama. Jechoonni tokko tokko kutaa Giriikii yookiin Laatinii irraa dhufu: -logy = qo'annoo (biology), -phobia = sodaa (hydrophobia = bishaan sodaachuu), -cide = ajjeessuu (insecticide = farra ilbiisotaa)."},{"h_en":"Suffixes that make adjectives and adverbs","h_om":"Maxxantuu dhumaa ibsa uuman","p_en":"-ful = full of (care → careful, help → helpful, beauty → beautiful); -less = without (care → careless, home → homeless, hope → hopeless); -able/-ible = can be (wash → washable, read → readable); -y (rain → rainy, sun → sunny); -ous (danger → dangerous, fame → famous); -al (nation → national); -ive (create → creative). Most adverbs add -ly (quick → quickly), but 'friendly', 'lovely' and 'lonely' are adjectives.","p_om":"-ful = … kan guute (care → careful, help → helpful, beauty → beautiful); -less = … malee (care → careless, home → homeless, hope → hopeless); -able/-ible = kan … danda'amu (wash → washable, read → readable); -y (rain → rainy, sun → sunny); -ous (danger → dangerous, fame → famous); -al (nation → national); -ive (create → creative). Ibsi gochimaa baay'een -ly dabala (quick → quickly), garuu 'friendly', 'lovely' fi 'lonely' ibsa maqaa ta'u."},{"h_en":"Spelling: the silent e","h_om":"Barreeffama: e callistuu","p_en":"Drop a silent final e before an ending that starts with a vowel: make → making, love → lovable, write → writing, scarce → scarcity. Keep it before an ending that starts with a consonant: hope → hopeful, love → lovely, care → careless, hate → hateful. Exceptions: true → truly, whole → wholly, due → duly, nine → ninth, awe → awful, argue → argument; and keep the e in agree → agreeable, see → seeing, dye → dyeing (to keep it different from dying).","p_om":"E callistuu dhumaa dhuma dubbachiiftuun jalqabu dura haqi: make → making, love → lovable, write → writing, scarce → scarcity. Dhuma dubbifamaan jalqabu dura eegi: hope → hopeful, love → lovely, care → careless, hate → hateful. Adda: true → truly, whole → wholly, due → duly, nine → ninth, awe → awful, argue → argument; akkasumas e eegi: agree → agreeable, see → seeing, dye → dyeing (dying irraa adda gochuuf)."},{"h_en":"Spelling: doubling the last consonant","h_om":"Barreeffama: dubbifamaa dhumaa dachaa gochuu","p_en":"Double the last consonant before a vowel ending (-ing, -ed, -er, -est) when a word ends in one vowel + one consonant AND the last syllable is stressed: stop → stopped, big → bigger, run → running, fit → fitted, begin → beginning, prefer → preferred, occur → occurred, control → controlled. Don't double when the stress is not on the last syllable: visit → visited, open → opened, offer → offered, deliver → delivered, whisper → whispered. American English writes traveled, quarreled; British English travelled, quarrelled. Never double w, x or y (fix → fixed, play → played).","p_om":"Jechi dubbachiiftuu tokko + dubbifamaa tokkoon yoo xumurame FI birsagni dhumaa dhiibbaa yoo qabaate, dhuma dubbachiiftuun jalqabu (-ing, -ed, -er, -est) dura dubbifamaa dhumaa dachaa godhi: stop → stopped, big → bigger, run → running, fit → fitted, begin → beginning, prefer → preferred, occur → occurred, control → controlled. Dhiibbaan birsaga dhumaa irra yoo hin jiraanne dachaa hin godhin: visit → visited, open → opened, offer → offered, deliver → delivered, whisper → whispered. Ingiliffi Ameerikaa traveled, quarreled; Ingiliffi Biriteenii travelled, quarrelled barreessa. W, x yookiin y gonkumaa dachaa hin godhin (fix → fixed, play → played)."},{"h_en":"Spelling: y → i, and joining words","h_om":"Barreeffama: y → i, akkasumas jechoota walitti makuu","p_en":"After a consonant, change y to i before most endings: happy → happiness / happily, carry → carried, easy → easier, beauty → beautiful, plenty → plentiful, lucky → luckily, library → librarian, fly → flier (also flyer). Keep y before -ing (study → studying) and after a vowel (play → player, buy → buyer, enjoy → enjoyment). Exceptions: shy → shyly / shyness, dry → dryness, day → daily, pay → paid, say → said. When you join words, 'full' becomes -ful (beautiful, careful), 'all' becomes al- (already, altogether, always, almost), and 'well' becomes wel- (welcome, welfare). US: skillful, fulfill; UK: skilful, fulfil.","p_om":"Dubbifamaa booda, dhuma baay'ee dura y gara i jijjiiri: happy → happiness / happily, carry → carried, easy → easier, beauty → beautiful, plenty → plentiful, lucky → luckily, library → librarian, fly → flier (yookiin flyer). -ing dura (study → studying) fi dubbachiiftuu booda (play → player, buy → buyer, enjoy → enjoyment) y eegi. Adda: shy → shyly / shyness, dry → dryness, day → daily, pay → paid, say → said. Yeroo jechoota walitti maktu, 'full' -ful ta'a (beautiful, careful), 'all' al- ta'a (already, altogether, always, almost), 'well' immoo wel- ta'a (welcome, welfare). US: skillful, fulfill; UK: skilful, fulfil.","ex":[["It's impossible to finish today.","Har'a xumuruun hin danda'amu.","","",0],["I'm sorry – I misunderstood your question.","Dhiifama – gaaffii kee dogoggoraan hubadhe.","","",0],["Thank you for your kindness.","Gaarummaa keetiif galatoomi.","","",0],["Be careful – the floor is wet.","Of eeggadhu – lafti jiidhaadha.","","",0],["She is a bilingual teacher.","Isheen barsiiftuu afaan lama dubbattuudha.","","",0],["We were planning a trip, and we stopped at a café.","Imala karoorfachaa turre, kafeetti dhaabbanne.","","",0],["He was the happiest man in the village.","Inni ganda sana keessatti nama hunda caalaa gammadaa ture.","","",0]]}]},{"id":"future_cont_perfect","en":"Future continuous & future perfect","om":"Yeroo dhufu itti fufaa fi raawwatame","icon":"🛰️","level":3,"summary_en":"will be + -ing for actions in progress at a future time, and will have + past participle for actions finished before it.","summary_om":"will be + -ing gocha yeroo dhufu tokkotti itti fufaa ta'uuf, will have + V3 gocha yeroo sana dura xumuramuuf.","sections":[{"h_en":"Future continuous: will be + -ing","h_om":"Yeroo dhufu itti fufaa: will be + -ing","p_en":"Use it for an action that will be in progress at a particular time in the future: 'This time tomorrow I'll be flying to Nairobi.' 'Don't call at eight – we'll be having dinner.' It is also a polite way to ask about plans: 'Will you be using the car tonight?' Negative: won't be + -ing.","p_om":"Gocha yeroo dhufu keessaa yeroo murtaa'e tokkotti raawwatamaa jiraatuuf fayyadami: 'This time tomorrow I'll be flying to Nairobi.' 'Don't call at eight – we'll be having dinner.' Karoora nama tokkoo kabajaan gaafachuufis ni fayyada: 'Will you be using the car tonight?' Dhabamsa: won't be + -ing."},{"h_en":"Future perfect: will have + V3","h_om":"Yeroo dhufu raawwatame: will have + V3","p_en":"Use it for an action that will be finished before a certain time in the future. It often comes with 'by' (= not later than) or 'by the time' + present: 'By 2030 I will have finished university.' 'By the time you arrive, we'll have eaten.'","p_om":"Gocha yeroo dhufu murtaa'e tokko dura xumuramuuf fayyadami. Yeroo baay'ee 'by' (= sana caalaa hin turin) yookiin 'by the time' + yeroo ammaa wajjin dhufa: 'By 2030 I will have finished university.' 'By the time you arrive, we'll have eaten.'"},{"h_en":"Future perfect continuous (briefly)","h_om":"Yeroo dhufu raawwatamaa itti fufaa (gabaabinaan)","p_en":"will have been + -ing shows how long something will have continued at a future point: 'In June I'll have been working here for ten years.' It is not very common, but you will meet it in speeches and anniversaries.","p_om":"will have been + -ing yeroo dhufu tokkotti gochi tokko hammam akka itti fufe agarsiisa: 'In June I'll have been working here for ten years.' Baay'ee hin baay'atu, garuu haasawa fi ayyaana waggaa keessatti ni argatta."},{"h_en":"Afaan Oromoo has no special form","h_om":"Afaan Oromoo unka addaa hin qabu","p_en":"Afaan Oromoo usually expresses these ideas with time words and ordinary forms: 'Boru sa'aatii kanatti hojjechaa nan jiraadha' (I'll be working), 'Sa'aatii 11 dura hojii kana nan xumura' (I'll have finished before five). So when you see a future time point (this time tomorrow, at eight tonight, by Friday, by the time…), think about which English form you need: in progress → will be + -ing; finished before → will have + V3.","p_om":"Afaan Oromoo yaada kana yeroo baay'ee jechoota yeroo fi unka idileetiin ibsa: 'Boru sa'aatii kanatti hojjechaa nan jiraadha' (I'll be working), 'Sa'aatii 11 dura hojii kana nan xumura' (I'll have finished before five). Kanaaf yeroo qabxii yeroo dhufuu (this time tomorrow, at eight tonight, by Friday, by the time…) argitu, unka Ingiliffaa kam akka barbaaddu yaadi: itti fufaa → will be + -ing; dura xumurame → will have + V3.","ex":[["This time tomorrow I'll be flying to Nairobi.","Boru yeroo kanatti gara Naayroobiitti balali'aa nan jiraadha.","","",1],["Don't call me at eight – I'll be watching the match.","Sa'aatii 2tti natti hin bilbilin – taphicha ilaalaa nan jiraadha.","","",1],["Will you be using your laptop this evening?","Galgala kana laaptooppii kee fayyadamaa jirtaa?","","",1],["By Friday I will have finished the report.","Jimaata dura gabaasa kana nan xumura.","","",0],["By the time you get home, we'll have cooked dinner.","Osoo ati mana hin ga'in irbaata qopheessinee jirra.","","",1],["Next month we'll have been married for twenty years.","Ji'a dhufu erga fuudhee heerumnee waggaa digdama guutna.","","",1]]}]},{"id":"conditionals_unreal","en":"Conditionals 2: second, third and mixed","om":"Hima 'yoo' 2: second, third fi walmakaa","icon":"💭","level":3,"summary_en":"Imaginary present and past situations: If I had…, I would…; If I had known…, I would have…; wish.","summary_om":"Haala yaadaa yeroo ammaa fi darbe: If I had…, I would…; If I had known…, I would have…; wish.","sections":[{"h_en":"Second conditional: imaginary now or future","h_om":"Second conditional: yaada yeroo ammaa yookiin dhufuu","p_en":"If + past simple, would + base verb – for situations that are not true now, or are unlikely: 'If I had a lot of money, I would build a school in my village.' (But I don't have it.) The past form here does NOT mean past time. With be, formal English uses 'were' for all persons: 'If I were you, I'd see a doctor.' 'If I am you' is wrong. Afaan Oromoo uses osoo / utuu for unreal situations: 'Osoon qarshii baay'ee qabaadhee…'","p_om":"If + yeroo darbe salphaa, would + gochima bu'uuraa – haala amma dhugaa hin taane yookiin raawwatamuuf carraa xiqqaa qabuuf: 'If I had a lot of money, I would build a school in my village.' (Garuu hin qabu.) Unki yeroo darbe asitti yeroo darbe hin agarsiisu. 'Be' wajjin Ingiliffi seera qabeessi nama hundaaf 'were' fayyadama: 'If I were you, I'd see a doctor.' 'If I am you' dogoggora. Afaan Oromoo haala dhugaa hin taaneef osoo / utuu fayyadama: 'Osoon qarshii baay'ee qabaadhee…'"},{"h_en":"Third conditional: imaginary past","h_om":"Third conditional: yaada yeroo darbe","p_en":"If + past perfect (had + V3), would have + V3 – for things that did not happen in the past, often regrets: 'If I had studied harder, I would have passed.' (I didn't study, and I didn't pass.) Afaan Oromoo: 'Osoon cimsee qo'adhee, silaa qormaata nan darba ture.'","p_om":"If + yeroo darbe raawwatame (had + V3), would have + V3 – wantoota yeroo darbe hin raawwatamneef, yeroo baay'ee gaabbii: 'If I had studied harder, I would have passed.' (Hin qo'anne, hin darbines.) Afaan Oromoo: 'Osoon cimsee qo'adhee, silaa qormaata nan darba ture.'"},{"h_en":"Could, might in the main clause","h_om":"Could, might hima ijoo keessatti","p_en":"Instead of would, the main clause can use could (= would be able to) or might (= would perhaps): 'If I had more time, I could help you.' 'If she had asked me, I might have said yes.' (In older British texts you may also see 'should' with I/we instead of 'would'.)","p_om":"Hima ijoo keessatti would bakka could (= danda'a ture) yookiin might (= tarii … ture) fayyadamuun ni danda'ama: 'If I had more time, I could help you.' 'If she had asked me, I might have said yes.' (Barreeffama Biriteenii durii keessatti I/we wajjin would bakka 'should' ni argatta.)"},{"h_en":"Mixed conditionals","h_om":"Hima 'yoo' walmakaa","p_en":"Sometimes the condition and the result are in different times. Past condition → present result: 'If I had taken that job, I would be rich now.' Present condition → past result: 'If I weren't afraid of flying, I would have visited you last year.'","p_om":"Yeroo tokko tokko haalli fi bu'aan yeroo adda adda keessa jiru. Haala yeroo darbe → bu'aa yeroo ammaa: 'If I had taken that job, I would be rich now.' Haala yeroo ammaa → bu'aa yeroo darbe: 'If I weren't afraid of flying, I would have visited you last year.'"},{"h_en":"Wish and if only","h_om":"Wish fi if only","p_en":"Use wish / if only + past for a present situation you want to be different: 'I wish I had a car.' 'I wish I spoke French.' Use wish + past perfect for a past regret: 'I wish I had listened to my mother.' Use wish + would for something annoying you want someone to change: 'I wish you would stop shouting.'","p_om":"Haala amma jiru akka adda ta'u yoo hawwite wish / if only + yeroo darbe fayyadami: 'I wish I had a car.' 'I wish I spoke French.' Gaabbii yeroo darbeef wish + yeroo darbe raawwatame fayyadami: 'I wish I had listened to my mother.' Wanta nama aarsu namni tokko akka jijjiiru hawwuuf wish + would fayyadami: 'I wish you would stop shouting.'"},{"h_en":"All conditionals at a glance","h_om":"Hima 'yoo' hunda walitti qabaa","p_en":"Compare the four main types.","p_om":"Gosoota ijoo afran wal bira qabi.","table":{"head":["Type","If-clause","Main clause","Use","Example"],"rows":[["Zero","present","present","always true","If you heat ice, it melts."],["First","present","will + V1","real possibility","If it rains, we'll stay home."],["Second","past","would + V1","imaginary now / unlikely","If I had wings, I would fly."],["Third","had + V3","would have + V3","imaginary past","If I had known, I would have come."],["Mixed","had + V3","would + V1","past cause, present result","If I had saved money, I would have a car now."]]},"ex":[["If I had a car, I would drive to work.","Osoon konkolaataa qabaadhee, konkolaataan hojiitti nan deema ture.","","",1],["If I were you, I would apologize.","Osoon ani si ta'ee, dhiifama nan gaafadha ture.","","",1],["What would you do if you won a million birr?","Osoo qarshii miliyoona tokko injifattee maal goota turte?","","",1],["If we had left earlier, we wouldn't have missed the bus.","Osoo dafnee kaanee, silaa awtobisiin nu hin darbu ture.","","",1],["If she had asked me, I might have helped her.","Osoo isheen na gaafattee, tarii ishee nan gargaara ture.","","",1],["I wish I had more free time.","Osoon yeroo boqonnaa dabalataa qabaadhee nan hawwa.","","",1]]}]},{"id":"reported_speech","en":"Reported speech","om":"Dubbii gabaasuu (reported speech)","icon":"🗨️","level":3,"summary_en":"Reporting what people said, asked and told us to do: say vs tell, tense changes, questions and commands.","summary_om":"Wanta namoonni jedhan, gaafatan fi akka goonu nutti himan gabaasuu: say fi tell, jijjiirama yeroo, gaaffii fi ajaja.","sections":[{"h_en":"Direct and reported speech; say and tell","h_om":"Dubbii kallattii fi gabaafame; say fi tell","p_en":"Afaan Oromoo often repeats the exact words with 'jedhe': '\"Nan dhufa\" jedhe.' It can also report with 'akka': 'Akka dhufu nutti hime.' English often reports without quotation marks: He said (that) he would come. Use 'say' without a person ('She said she was tired') or with 'to' ('She said to me…'). Use 'tell' with a person and no 'to': 'She told me she was tired.' Not 'She said me' or 'She told to me'.","p_om":"Afaan Oromoo yeroo baay'ee jecha nama sanaa akkuma jirutti 'jedhe' wajjin irra deebi'a: '\"Nan dhufa\" jedhe.' 'Akka' fayyadamees gabaasuu danda'a: 'Akka dhufu nutti hime.' Ingiliffi yeroo baay'ee mallattoo waraabbii malee gabaasa: He said (that) he would come. 'Say' nama malee ('She said she was tired') yookiin 'to' wajjin ('She said to me…') fayyadami. 'Tell' nama wajjin, 'to' malee fayyadami: 'She told me she was tired.' 'She said me' yookiin 'She told to me' miti."},{"h_en":"Tense changes (backshift)","h_om":"Jijjiirama yeroo (backshift)","p_en":"When the reporting verb is in the past (said, told, asked), the verb in the reported part usually moves one step back in time.","p_om":"Gochimni gabaasu yeroo darbe keessa yoo jiraate (said, told, asked), gochimni kutaa gabaafamee yeroo baay'ee tarkaanfii tokko gara duubaatti deebi'a.","table":{"head":["Direct speech","Reported speech"],"rows":[["\"I am tired.\" (present simple)","She said she was tired. (past simple)"],["\"I'm working.\" (present continuous)","He said he was working. (past continuous)"],["\"I have finished.\" (present perfect)","She said she had finished. (past perfect)"],["\"I saw him.\" (past simple)","He said he had seen him. (past perfect – or no change)"],["\"I will call.\" (will)","She said she would call."],["\"I can swim.\" (can)","He said he could swim."],["\"I may be late.\" (may)","She said she might be late."],["\"I must go.\" (must)","He said he had to go."],["\"I'm going to travel.\"","She said she was going to travel."]]}},{"h_en":"Pronouns, time and place words","h_om":"Bamaqaa, jechoota yeroo fi bakkaa","p_en":"Change pronouns to fit the new speaker (I → he/she, my → his/her, we → they). Change time and place words when the time or place is different.","p_om":"Bamaqaa dubbataa haaraa wajjin akka walsimutti jijjiiri (I → he/she, my → his/her, we → they). Yeroon yookiin bakki yoo adda ta'e jechoota yeroo fi bakkaa jijjiiri.","table":{"head":["Direct","Reported"],"rows":[["today","that day"],["tonight","that night"],["tomorrow","the next day / the following day"],["yesterday","the day before / the previous day"],["next week","the following week"],["last week","the week before"],["now","then"],["ago","before"],["here","there"],["this","that"]]}},{"h_en":"Reported questions","h_om":"Gaaffii gabaafame","p_en":"Reported questions use normal statement word order – no inversion, no do/does/did, no question mark. Wh- questions keep the question word: 'Where do you live?' → 'He asked me where I lived.' Yes/no questions use if or whether: 'Are you ready?' → 'She asked if I was ready.'","p_om":"Gaaffiin gabaafame tartiiba hima idilee fayyadama – gochima gara jalqabaatti hin fidu, do/does/did hin fayyadamu, mallattoo gaaffii hin qabu. Gaaffiin Wh- jecha gaaffii isaa eega: 'Where do you live?' → 'He asked me where I lived.' Gaaffiin eeyyee/lakki if yookiin whether fayyadama: 'Are you ready?' → 'She asked if I was ready.'"},{"h_en":"Reported commands and requests","h_om":"Ajajaa fi gaaffii gabaafame","p_en":"Use tell / ask + person + (not) to + verb: 'Sit down.' → 'He told me to sit down.' 'Please don't be late.' → 'She asked us not to be late.' Other useful verbs: advise, remind, warn, order, beg. No tense change is needed when the reporting verb is in the present ('He says he's tired') or when the fact is still true ('She said she lives in Adama').","p_om":"tell / ask + nama + (not) to + gochima fayyadami: 'Sit down.' → 'He told me to sit down.' 'Please don't be late.' → 'She asked us not to be late.' Gochimoota gargaaran biroo: advise, remind, warn, order, beg. Gochimni gabaasu yeroo ammaa yoo ta'e ('He says he's tired'), yookiin dhugaan sun ammas dhugaa yoo ta'e ('She said she lives in Adama'), yeroo jijjiiruun hin barbaachisu.","ex":[["She said she was tired.","Isheen akka dadhabde dubbatte.","","",0],["He told me he would call later.","Inni booda akka natti bilbilu natti hime.","","",0],["She asked me where I lived.","Isheen eessa akka jiraadhu na gaafatte.","","",0],["The doctor asked if I smoked.","Doktorri tamboo xuuxuu koo na gaafate.","","",1],["The teacher told us to open our books.","Barsiisaan akka kitaabota keenya banannu nutti hime.","","",0],["My mother asked me not to come home late.","Haati koo akka ani turee hin galle na gaafatte.","","",1],["He says he's coming tomorrow.","Boru akka dhufu dubbata.","","",0]]}]},{"id":"linking_words","en":"Linking words for writing and speaking","om":"Walqabsiistota barreeffamaa fi dubbii","icon":"🪢","level":3,"summary_en":"Words to add ideas, contrast, give results, reasons and purposes, compare and replace – and how to punctuate them.","summary_om":"Jechoota yaada dabaluuf, wal faallessuuf, bu'aa, sababaa fi kaayyoo kennuuf, wal bira qabuu fi bakka buusuuf – akkasumas sirna tuqaalee isaanii.","sections":[{"h_en":"Adding ideas","h_om":"Yaada dabaluu","p_en":"also, too, as well, in addition (to), besides, moreover, furthermore, additionally, again, not only … but also, another thing is. Afaan Oromoo: akkasumas, dabalataan, kana malees, -s (anis = me too). 'Also' goes before the main verb; 'too' and 'as well' go at the end: 'She also speaks French.' / 'She speaks French too.' 'Moreover' and 'furthermore' are formal and start a new sentence: 'The house is cheap. Moreover, it is close to the school.' 'In addition to' and 'besides' are followed by a noun or -ing: 'In addition to English, she speaks Arabic.'","p_om":"also, too, as well, in addition (to), besides, moreover, furthermore, additionally, again, not only … but also, another thing is. Afaan Oromoo: akkasumas, dabalataan, kana malees, -s (anis = me too). 'Also' gochima ijoo dura dhufa; 'too' fi 'as well' dhumatti dhufu: 'She also speaks French.' / 'She speaks French too.' 'Moreover' fi 'furthermore' seera qabeessa, hima haaraa jalqabu: 'The house is cheap. Moreover, it is close to the school.' 'In addition to' fi 'besides' booda maqaa yookiin -ing dhufa: 'In addition to English, she speaks Arabic.'"},{"h_en":"Contrast","h_om":"Wal faallessuu","p_en":"but, however, nevertheless, still, yet, on the other hand, in contrast (to), whereas, while, although, though, even though, despite / in spite of. Afaan Oromoo: garuu, haa ta'u malee, ta'us, gama biraatiin, -us. 'However' and 'nevertheless' start a new sentence or clause: 'It was raining. However, we went out.' 'Although' + a clause, but 'despite / in spite of' + a noun or -ing: 'Although it was raining…' / 'Despite the rain…' / 'In spite of being tired, he kept working.' 'Whereas' and 'while' compare two facts: 'Tola likes tea, whereas his wife prefers coffee.'","p_om":"but, however, nevertheless, still, yet, on the other hand, in contrast (to), whereas, while, although, though, even though, despite / in spite of. Afaan Oromoo: garuu, haa ta'u malee, ta'us, gama biraatiin, -us. 'However' fi 'nevertheless' hima yookiin kutaa hima haaraa jalqabu: 'It was raining. However, we went out.' 'Although' + hima, 'despite / in spite of' garuu + maqaa yookiin -ing: 'Although it was raining…' / 'Despite the rain…' / 'In spite of being tired, he kept working.' 'Whereas' fi 'while' dhugaa lama wal bira qabu: 'Tola likes tea, whereas his wife prefers coffee.'","ex":[["The hotel was expensive. However, the service was excellent.","Hoteelli sun qaalii ture. Haa ta'u malee, tajaajilli isaa baay'ee gaarii ture.","","",0],["Despite the rain, the market was full of people.","Roobni jiraatus gabaan namaan guutamee ture.","","",0],["In addition to her job, she studies at night.","Hojii ishee dabalatee halkan ni baratti.","","",0]]},{"h_en":"Result","h_om":"Bu'aa","p_en":"so, therefore, consequently, as a result, hence, thus, accordingly. Afaan Oromoo: kanaaf, kanaafuu, sababa kanaatiin, kana irraa kan ka'e. 'So' joins two clauses in everyday speech; the others are more formal and usually start a sentence: 'The road was closed. As a result, we arrived late.' 'Hence' and 'thus' are mostly used in academic writing.","p_om":"so, therefore, consequently, as a result, hence, thus, accordingly. Afaan Oromoo: kanaaf, kanaafuu, sababa kanaatiin, kana irraa kan ka'e. 'So' dubbii guyyaa guyyaa keessatti kutaa hima lama walitti qabsiisa; kanneen biroon caalaatti seera qabeessa, yeroo baay'ee hima jalqabu: 'The road was closed. As a result, we arrived late.' 'Hence' fi 'thus' caalaatti barreeffama barnootaa keessatti fayyadu.","ex":[["The road was closed. As a result, we arrived late.","Daandiin cufamee ture. Kanaafuu barfannee geenye.","","",1],["He didn't study; therefore, he failed the exam.","Inni hin qo'anne; kanaaf qormaata kufe.","","",0]]},{"h_en":"Reason and purpose","h_om":"Sababaa fi kaayyoo","p_en":"Reason: because, since, as, for (formal, after a comma), due to / owing to + noun. 'Since it's late, let's go home.' 'The flight was delayed due to bad weather.' Afaan Oromoo: waan … -eef, sababni isaas, sababa …tiin. Purpose: to, in order to, so as to, so that + clause, for + noun, for the purpose of + -ing. 'I saved money in order to buy a car.' 'Speak slowly so that everyone can understand.' Afaan Oromoo: -uuf, akka … -uuf.","p_om":"Sababa: because, since, as, for (seera qabeessa, qoodduu booda), due to / owing to + maqaa. 'Since it's late, let's go home.' 'The flight was delayed due to bad weather.' Afaan Oromoo: waan … -eef, sababni isaas, sababa …tiin. Kaayyoo: to, in order to, so as to, so that + hima, for + maqaa, for the purpose of + -ing. 'I saved money in order to buy a car.' 'Speak slowly so that everyone can understand.' Afaan Oromoo: -uuf, akka … -uuf.","ex":[["The flight was delayed due to bad weather.","Balaliin sababa haala qilleensaa hamaatiin tureera.","","",0],["Speak slowly so that everyone can understand.","Akka namni hundi hubatuuf suuta dubbadhu.","","",0]]},{"h_en":"Similarity, alternatives and conditions","h_om":"Walfakkeenya, filannoo fi haala","p_en":"Similarity: likewise, similarly, in the same way. Alternatives and replacement: instead of, rather than, in place of, in lieu of (formal) + noun or -ing: 'He drank tea instead of coffee.' (Bakka bunaa shaayii dhuge.) Condition: as long as / so long as, provided (that), on condition that: 'You can stay as long as you are quiet.'","p_om":"Walfakkeenya: likewise, similarly, in the same way. Filannoo fi bakka buusuu: instead of, rather than, in place of, in lieu of (seera qabeessa) + maqaa yookiin -ing: 'He drank tea instead of coffee.' (Bakka bunaa shaayii dhuge.) Haala: as long as / so long as, provided (that), on condition that: 'You can stay as long as you are quiet.'","ex":[["He drank tea instead of coffee.","Bakka bunaa shaayii dhuge.","","",0],["You can stay as long as you are quiet.","Hamma callistanitti turuu dandeessu.","","",1]]},{"h_en":"Everyday or formal?","h_om":"Guyyaa guyyaa moo seera qabeessa?","p_en":"Choose the linking word that fits the situation, and punctuate it correctly: 'but' and 'so' join two clauses after a comma; 'However', 'Therefore', 'Moreover' usually start a sentence and are followed by a comma, or come after a semicolon: '…; however, …'.","p_om":"Walqabsiistuu haala sanaaf mijatu filadhuu sirna tuqaalee isaa sirriitti fayyadami: 'but' fi 'so' qoodduu booda kutaa hima lama walitti qabsiisu; 'However', 'Therefore', 'Moreover' yeroo baay'ee hima jalqabanii qoodduu fudhatu, yookiin mallattoo semicolon (;) jedhamu booda dhufu: '…; however, …'.","table":{"head":["Meaning","Everyday","Formal"],"rows":[["adding","and, also, too, plus","moreover, furthermore, in addition, additionally"],["contrast","but, though, still","however, nevertheless, whereas, in contrast"],["result","so","therefore, consequently, as a result, hence, thus"],["reason","because, since, as","due to, owing to, for"],["purpose","to, so (that)","in order to, so as to, for the purpose of"],["similarity","like, the same","likewise, similarly"],["replacement","instead of","in place of, in lieu of"]]}}]}];
const LES_OM=[{"id":"alphabet","en":"The Qubee alphabet","om":"Qubee Afaan Oromoo","icon":"🔤","level":1,"summary_en":"Afaan Oromoo is written in Qubee, a Latin-based alphabet in which each letter or letter pair always stands for the same sound.","summary_om":"Afaan Oromoo Qubeedhaan barreeffama; qubeen hundi yeroo hunda sagalee tokko qofa bakka bu'a.","sections":[{"h_en":"Qubee at a glance","h_om":"Qubee walumaagalaan","p_en":"Since the early 1990s Afaan Oromoo has been written with Qubee, an alphabet built on the Latin letters you already know. The big advantage: spelling is phonetic. You write what you hear and you read what you see, with no silent letters and no letters that change their sound. Qubee has 5 vowels (a, e, i, o, u), each of which can be short or long, and a set of consonants. Five consonants are written with two letters but count as ONE sound and one letter: ch, dh, ny, ph, sh. The apostrophe (') is also a letter: it writes the glottal stop, called hudhaa. Counted the traditional way, that gives 5 vowels + 27 consonants (including hudhaa) = 32 letters. The letters p, v and z appear mainly in borrowed words (poolisii 'police', viizaa 'visa', zeeroo 'zero')."},{"h_en":"Letter names and key words","h_om":"Maqaa qubee fi jechoota fakkeenyaa","p_en":"In school, consonants are named by adding -a: ba, ca, da, fa… Vowels are named by their own sound. Learn one key word for each letter; it will help you remember the sound.","table":{"head":["Letter","Name","Key word","Meaning"],"rows":[["a","a","abbaa","father"],["b","ba","bishaan","water"],["c","ca","cimaa","strong"],["d","da","daandii","road"],["e","e","eessa","where"],["f","fa","farda","horse"],["g","ga","gaara","mountain"],["h","ha","harka","hand"],["i","i","ija","eye"],["j","ja","ji'a","month, moon"],["k","ka","kitaaba","book"],["l","la","lama","two"],["m","ma","mana","house"],["n","na","nama","person"],["o","o","Oromoo","Oromo"],["p","pa","poolisii","police"],["q","qa","qarshii","birr, money"],["r","ra","rooba","rain"],["s","sa","saree","dog"],["t","ta","tokko","one"],["u","u","urjii","star"],["v","va","viizaa","visa"],["w","wa","waraqaa","paper"],["x","xa","xiqqaa","small"],["y","ya","yoom","when"],["z","za","zeeroo","zero"],["ch","cha","nyaachuu","to eat"],["dh","dha","dhugaa","truth"],["ny","nya","nyaata","food"],["ph","pha","buphaa","egg"],["sh","sha","shan","five"],["'","hudhaa","har'a","today"]]}},{"h_en":"Capital letters","h_om":"Qubee guddaa fi xiqqaa","p_en":"Capitals are used much as in English: at the start of a sentence and for names of people, places, days and months (Caalaa, Oromiyaa, Finfinnee, Wiixata, Fulbaana). For a two-letter consonant, only the first letter becomes a capital: Dhugaa, Nyaata, Shaashamannee. Unlike English 'I', the pronoun ani ('I') is written in small letters in the middle of a sentence.","ex":[["My name is Chala.","Maqaan koo Caalaa jedhama.","","",0],["I am learning Afaan Oromoo.","Ani Afaan Oromoo barachaan jira.","","",0],["Write your name in Qubee.","Maqaa kee Qubeedhaan barreessi.","","",0],["Today we'll learn new letters.","Har'a qubee haaraa baranna.","","",0]]},{"h_en":"Punctuation names","h_om":"Maqaa mallattoolee sirna qubee","p_en":"Afaan Oromoo uses the same punctuation marks as English. It is useful to know their names, because teachers and textbooks use them. Names can differ a little between schools.","table":{"head":["Mark","Afaan Oromoo","English"],"rows":[[".","tuqaa","period, full stop"],[",","qoodduu","comma"],[":","tuqlamee","colon"],["?","mallattoo gaaffii","question mark"],["!","mallattoo raajeffannoo","exclamation mark"],["'","hudhaa","apostrophe / glottal stop"],["( )","hammattuu","parentheses"],["\" \"","mallattoo waraabbii","quotation marks"]]},"ex":[["Finfinne is the capital city of Oromia.","Finfinneen magaalaa guddoo Oromiyaati.","Sentence starts with a capital and ends with tuqaa (.).","",0]]}]},{"id":"vowels","en":"Vowels and vowel length","om":"Dubbachiiftuu fi dheerina isaanii","icon":"🅰️","level":1,"summary_en":"Oromo has five vowels; each can be short or long, and length changes the meaning of words.","summary_om":"Dubbachiiftuun shan; tokkoon tokkoon isaanii gabaabaa ykn dheeraa ta'uu danda'a, dheerinni immoo hiika jecha jijjiira.","sections":[{"h_en":"The five vowels","h_om":"Dubbachiiftuuwwan shanan","p_en":"Each vowel has one clear sound; it never glides or goes silent as in English. A long vowel is the same sound held about twice as long. Long vowels are written by doubling the letter: aa, ee, ii, oo, uu.","table":{"head":["Vowel","Sounds roughly like","Short","Long"],"rows":[["a / aa","'u' in 'but' / 'a' in 'father'","lama (two)","maal (what)"],["e / ee","'e' in 'bet' / 'ay' in 'day' (no glide)","erguu (to send)","eessa (where)"],["i / ii","'i' in 'bit' / 'ee' in 'see'","ija (eye)","biiftuu (sun)"],["o / oo","short 'o' / 'o' in 'go' held long","tokko (one)","hoolaa (sheep)"],["u / uu","'u' in 'put' / 'oo' in 'food'","quba (finger)","aduu (sun)"]]}},{"h_en":"Length changes meaning","h_om":"Dheerinni hiika jijjiira","p_en":"Short and long vowels are as different as two separate letters. Many word pairs differ only in vowel length, so train your ear and your spelling from day one.","table":{"head":["Short","Meaning","Long","Meaning"],"rows":[["lafa","ground, land","laafaa","soft"],["hara","lake","haaraa","new"],["gala","he goes home","gaala","camel"],["gara","toward","gaara","mountain"],["sa'a","cow","sa'aa","hour, watch"],["ana","me","aanaa","district"]]}},{"h_en":"How long vowels are written","h_om":"Akkaataa dheerinni itti barreeffamu","p_en":"Always show length by doubling, never with accents or an added h. A vowel is never written three times. Two different vowels do not stand side by side inside a word: between them you will find a consonant such as y or w, or the glottal stop ' (bu'aa 'profit', ga'uu 'to arrive'). Final vowels count too: Oromoo ends in a long oo, while Oromiyaa ends in a long aa."},{"h_en":"Length also carries grammar","h_om":"Dheerinni seerluga ni agarsiisa","p_en":"Length is not only about vocabulary. It also marks grammar: a long final vowel can turn a statement into a question (Ni dhufta. → Ni dhuftaa?), make a possessive (nama 'person' → mana namaa 'someone's house'), or separate a noun from a verb (barataa 'student' vs barata 'he studies').","ex":[["The student studies.","Barataan ni barata.","barataa (student) vs barata (he studies).","",0],["I saw a camel on the mountain.","Gaala gaara irratti arge.","","",0],["I have two cows.","Sa'a lama qaba.","","",0],["I've been waiting for you for two hours.","Sa'aa lama si eegeera.","","",0],["He built a new house.","Mana haaraa ijaare.","","",0]]}]},{"id":"consonants","en":"Consonants and special sounds","om":"Dubbifamtoota fi sagaleewwan addaa","icon":"🗣️","level":1,"summary_en":"Most Oromo consonants sound as in English, but c, q, x, ph, dh, ny and the glottal stop ' need special practice.","summary_om":"Dubbifamtoonni baay'een akka Afaan Ingiliffaa dubbifamu; garuu c, q, x, ph, dh, ny fi ' shaakala addaa barbaadu.","sections":[{"h_en":"Familiar consonants","h_om":"Dubbifamtoota beekamoo","p_en":"b, d, f, h, j, k, l, m, n, s, t, w, y sound much as in English. A few reminders: g is always hard as in 'go' (gaara); j is as in 'jam'; y is as in 'yes' (yoom); s is always 's', never 'z'; h is pronounced even in the middle of a word (dhihoo 'near'); r is a quick tap or a light roll of the tongue (rooba)."},{"h_en":"Ejectives: c, q, x, ph","h_om":"Dubbifamtoota dhooyaa: c, q, x, ph","p_en":"These four are 'ejective' sounds, typical of Cushitic languages. Close your throat (as if holding your breath), make the consonant, and release it with a small pop. They are separate letters from their plain partners and can change meaning.","table":{"head":["Letter","Ejective version of","Examples"],"rows":[["c","ch (as in 'church')","cimaa (strong), ciree (breakfast)"],["q","k","qarshii (birr), qalama (pen)"],["x","t","xiqqaa (small), xaafii (teff)"],["ph","p","buphaa (egg), laphee (chest)"]]}},{"h_en":"dh: the implosive d","h_om":"dh: sagalee 'd' ol harkifamu","p_en":"dh is NOT the 'th' of English. It is a d made while pulling air slightly inward, which gives it a hollow, 'swallowed' quality. It is very common: dhugaa (truth), dhufuu (to come), haadha (mother), dhagaa (stone)."},{"h_en":"ny, sh, ch","h_om":"ny, sh, ch","p_en":"ny is one sound, like Spanish ñ or the 'ny' in 'canyon': nyaata (food), funyaan (nose). sh is as in 'ship': shan (five), bishaan (water). ch is as in 'church' and is rare outside verbs ending in -chuu (nyaachuu, barachuu) and words built from them (barbaachisaa 'necessary'). Do not confuse c (ejective) with ch (plain)."},{"h_en":"Letters for borrowed words","h_om":"Qubee jechoota liqeeffamaniif","p_en":"p, v and z are used mostly in words taken from other languages: poolisii (police), viizaa (visa), zeeroo (zero). The native 'p'-type sound is the ejective ph. The glottal stop ' gets its own lesson.","ex":[["I have a little money.","Qarshii xiqqoo qaba.","","",0],["Tell the truth.","Dhugaa dubbadhu.","","",0],["He bought two eggs.","Buphaa lama bite.","","",0],["Eat the food.","Nyaata nyaadhu.","","",0],["Be strong!","Cimaa ta'i!","","",0]]}]},{"id":"gemination","en":"Double consonants (gemination)","om":"Dubbifamaa jabaa (qubee dachaa)","icon":"✌️","level":1,"summary_en":"A doubled consonant is held longer, and doubling can completely change a word's meaning.","summary_om":"Dubbifamaan lama ta'ee yoo barreeffame cimee dubbifama; kunis hiika jecha jijjiiruu danda'a.","sections":[{"h_en":"What gemination is","h_om":"Cimsuun maali?","p_en":"A geminate (double) consonant is pronounced longer and with more pressure, the way English joins two sounds in 'bookcase' or 'hot tea'. In writing you simply double the letter: abbaa (father), tokko (one), akka (like), dubbii (matter), gubbaa (top), xiqqaa (small)."},{"h_en":"Single vs double changes meaning","h_om":"Tokko fi lama hiika jijjiira","p_en":"Just like vowel length, consonant length separates words. Read each pair aloud and exaggerate the long consonant.","table":{"head":["Single","Meaning","Double","Meaning"],"rows":[["badaa","bad","baddaa","highlands"],["sodaa","fear","soddaa","in-law"],["bane","he opened","banne","we opened"],["baruu","to learn, to know","barruu","text, writing"]]}},{"h_en":"ch, dh, ny, ph, sh are never doubled","h_om":"ch, dh, ny, ph, sh hin dachaa'an","p_en":"The five two-letter consonants can be pronounced long in some words, but by agreed convention they are always written only once, so words do not become unreadable. Write laphee (chest), not 'laphphee'; mudhii (waist), not 'mudhdhii'. When you read these letters, length has to be learned from the word itself."},{"h_en":"Where doubling appears","h_om":"Dachaa'uun eessatti mul'ata?","p_en":"A word never begins with a double consonant. Inside words, doubling is everywhere in grammar: plurals (mana → manneen 'houses'), verb endings (ni nyaatta 'you eat', bitte 'you bought'), commands (kenni 'give!') and plural adjectives (xiqqaa → xixiqqaa). Hearing doubles clearly will help you catch these forms.","ex":[["My father lives in the highlands.","Abbaan koo baddaa jiraata.","","",0],["He opened the door; we opened the window.","Inni balbala bane; nuti foddaa banne.","","",0],["Read this text.","Barruu kana dubbisi.","","",0],["I'm not afraid of my in-law.","Soddaa koo hin sodaadhu.","","",0]]}]},{"id":"glottal_stop","en":"The glottal stop (hudhaa)","om":"Hudhaa (')","icon":"⏸️","level":1,"summary_en":"The apostrophe ' writes the glottal stop, a real consonant with three simple spelling rules.","summary_om":"Hudhaan (') dubbifamaa dhugaa dha; seerota sadan itti fayyadama isaa baradhu.","sections":[{"h_en":"The sound","h_om":"Sagalee isaa","p_en":"The glottal stop is a quick closing of the throat, the little catch you hear in the middle of 'uh-oh'. In Qubee it is written with a straight apostrophe ' and is called hudhaa (also laagee). It is a full consonant, not decoration: leaving it out is a spelling mistake (write ji'a 'month', never 'jia')."},{"h_en":"Rule 1: between two identical vowels","h_om":"Seera 1: dubbachiiftuu walfakkaatu gidduutti","p_en":"When a break is heard between two of the same vowel, write ': sa'a (cow), sa'aa (hour), re'ee (goat), bu'uu (to go down), qe'ee (home, homestead), taa'aa (sit! – to several people)."},{"h_en":"Rule 2: between two different vowels","h_om":"Seera 2: dubbachiiftuu adda addaa gidduutti","p_en":"Different vowels meeting inside a word are separated by ': ga'uu (to arrive), ka'i (get up!), ji'a (month), bu'aa (profit), fe'uu (to load), ida'uu (to add), deebi'uu (to return)."},{"h_en":"Rule 3: after a consonant","h_om":"Seera 3: dubbifamaa booda","p_en":"Some words have a break right after a consonant. Write the ' exactly there: har'a (today), baay'ee (very, many), bal'aa (wide), mul'achuu (to appear), cal'isuu (to be quiet)."},{"h_en":"Variant spellings and verb forms","h_om":"Barreeffama garaa garaa","p_en":"Older texts and some regions write h or y instead of ': tahuu, gahuu, dhagahuu, dhagayuu. This course always uses ' (ta'uu, ga'uu, dhaga'uu). Watch out in verb forms: the ' often merges with a following t or n, so ta'uu 'to become' gives taate 'you became', ka'uu gives kaate 'you got up', and deebi'uu gives deebite 'you returned'.","ex":[["I worked a lot today.","Har'a baay'ee hojjedhe.","","",0],["Next month I'm going to Finfinne.","Ji'a dhufu Finfinnee deema.","","",0],["Get up, let's go!","Ka'i, haa deemnu!","","",0],["He made a big profit.","Bu'aa guddaa argate.","","",0],["I have five goats.","Re'ee shan qaba.","","",0]]}]},{"id":"writing_rules","en":"Spelling rules: suffixes, -dha, fi and loanwords","om":"Seera barreeffamaa","icon":"✍️","level":1,"summary_en":"Write what you say: attach suffixes to the word, use -dha correctly, write fi separately, and adapt foreign words to Oromo sound patterns.","summary_om":"Akkuma dubbannu barreessina: maxxantoota (-dha, -tti, -tiin) jechatti maxxansinee, 'fi' immoo adda baasnee barreessina.","sections":[{"h_en":"Suffixes are part of the word","h_om":"Maxxantoonni jecha waliin barreeffamu","p_en":"In English, 'is', 'in', 'with' and 'for' are separate words, so English speakers are tempted to write Oromo endings apart. Don't: an Oromo ending has no meaning on its own and is written joined to its word.","table":{"head":["Wrong","Right","Meaning"],"rows":[["Oromiyaa dha","Oromiyaadha","it is Oromia"],["barataa dha","barataadha","(he/I) is/am a student"],["Afaan Oromoo tiin","Afaan Oromootiin","in Afaan Oromoo"],["mana keessa tti","mana keessatti","inside the house"],["Finfinnee rraa","Finfinneerraa","from Finfinne"],["kan Caalaa ti","kan Caalaati","it is Chala's"],["hojii dhaaf","hojiidhaaf","for work"]]}},{"h_en":"When to use -dha ('is')","h_om":"Yeroo -dha itti fayyadamnu","p_en":"The ending -dha means 'is/am/are' and is attached only after a LONG final vowel: barataadha, gaariidha, Oromoodha. After a word ending in a short -a, nothing is added (Kun mana. 'This is a house.' – not 'manaadha'). After a word ending in a consonant, add -i (Kun Galaani. 'This is Galaan.'). After an owner (possessor) the ending is -ti instead: Kun kan kooti 'This is mine', Kun mana Caalaati 'This is Chala's house'. In relaxed speech -dha is often dropped (Ani barataa).","ex":[["I am a student.","Ani barataadha.","","",0],["This is a house.","Kun mana.","","",0],["This is Galaan.","Kun Galaani.","","",0],["This book is mine.","Kitaabni kun kan kooti.","","",0]]},{"h_en":"Writing fi ('and')","h_om":"Barreeffama 'fi'","p_en":"fi ('and') is written as a separate word, the convention of schools and the media. Note the sound change before it: a short final vowel becomes long, and a word ending in a consonant adds -ii: harka + miila → harkaa fi miila (hands and feet); dhiira + dubartii → dhiiraa fi dubartii (men and women); aannan + dhadhaa → aannanii fi dhadhaa (milk and butter). Words already ending in a long vowel stay the same: Caalaa fi Tolaa. In speech fi is glued to the word (harkaafi), and some writers, including older textbooks, write it attached; both spellings are understood.","ex":[["Men and women are equal.","Dhiiraa fi dubartiin walqixa.","","",0]]},{"h_en":"-ti or -tti?","h_om":"-ti moo -tti?","p_en":"One t or two makes a big difference. -ti is the 'is of / belongs to' ending; -tti means 'in, at, to'. Compare: Inni barsiisaa Adaamaati 'He is a teacher from (of) Adama' with Inni Adaamaatti barsiisa 'He teaches in Adama'.","ex":[["He teaches in Adama.","Inni Adaamaatti barsiisa.","","",0],["Speak in Afaan Oromoo.","Afaan Oromootiin dubbadhu.","","",0]]},{"h_en":"Borrowed words: no initial clusters","h_om":"Jechoota liqeeffaman","p_en":"An Oromo word never begins with two consonants, and inside a word no more than two consonants stand together. Words also rarely end in a consonant (n is the usual exception: bishaan, afaan, isin). So foreign words are adapted: a vowel is added or inserted and a final vowel is added: sport → ispoortii, stadium → istaadiyeemii, president → pirezidaantii, bank → baankii, computer → kompiitara, hotel → hoteela."},{"h_en":"No extra vowels in Oromo words","h_om":"Dubbachiiftuu dabalataa hin galchinu","p_en":"The reverse mistake is also common: inserting an i between two consonants that belong together (sometimes called irra-butaa). Two consonants side by side are perfectly normal in Oromo, so write harka (hand), not 'harika'; faaydaa (benefit), not 'faayidaa'; baankii, not 'baanikii'; ilma (son), not 'ilima'."}]},{"id":"word_order","en":"Word order: subject – object – verb","om":"Tartiiba jechootaa","icon":"🧱","level":1,"summary_en":"In Oromo the verb comes last, describing words follow the noun, and 'prepositions' come after the noun.","summary_om":"Afaan Oromoo keessatti gochimni dhuma hima irratti dhufa: raawwataa – wanta – gochima.","sections":[{"h_en":"The verb goes last","h_om":"Gochimni dhuma irratti dhufa","p_en":"The basic order is Subject – Object – Verb. 'Chala drinks coffee' is literally 'Chala coffee drinks'. Time and place words usually come early, after the subject.","ex":[["Chala drinks coffee.","Caalaan buna dhuga.","Literally: Chala coffee drinks.","",0],["Tola went to Adama yesterday.","Tolaan kaleessa Adaamaa deeme.","Literally: Tola yesterday Adama went.","",0]]},{"h_en":"Describers follow the noun","h_om":"Ibsitoonni maqaa booda dhufu","p_en":"Adjectives, owners, 'this/that' and numbers all come AFTER the noun they describe: mana guddaa (a big house), mana Caalaa (Chala's house), mana kana (this house), mana lama (two houses), mana koo (my house)."},{"h_en":"Postpositions, not prepositions","h_om":"Maxxantoota booda dhufan","p_en":"Words like 'in', 'on', 'under' come after the noun: mana keessa (in the house), minjaala irra (on the table), siree jala (under the bed). Many case endings are attached directly: Finfinneetti (in Finfinne)."},{"h_en":"Questions keep the same order","h_om":"Gaaffiin tartiiba wal fakkaatu qaba","p_en":"Question words do not move to the front as in English; they sit where the answer would be, usually just before the verb: Eessa deemta? 'Where are you going?' (lit. where you-go?). Answer: Gabaa deema. 'I'm going to the market.'"},{"h_en":"Subject pronouns are optional","h_om":"Bamaqaan raawwataa dirqama miti","p_en":"The verb ending already shows who is acting, so pronouns are often dropped: Deemne. 'We went.' Use the pronoun for emphasis or contrast, or when two persons share the same verb form. Small particles come directly before the verb: ni (affirmative), hin (not), haa (let), and object pronouns: Isa argeera 'I have seen him'.","ex":[["Our teacher brought us a new book.","Barsiisaan keenya kitaaba haaraa nuuf fide.","","",0],["The children play ball.","Ijoolleen kubbaa taphatu.","","",0],["Where do you live?","Eessa jiraatta?","","",0]]},{"h_en":"Parts of speech","h_om":"Gosoota jechaa","p_en":"Oromo has the same word classes as English. Teachers and Oromo-language grammar books use these names (older or regional terms in brackets).","table":{"head":["English","Afaan Oromoo","Examples"],"rows":[["noun","maqaa","mana (house), Caalaa"],["pronoun","bamaqaa","ani (I), isa (him)"],["verb","gochima (also gocha)","deemuu (to go), nyaate (he ate)"],["adjective","ibsa maqaa (also maqibsa)","guddaa (big), diimaa (red)"],["adverb","ibsa gochimaa (also gochibsa)","suuta (slowly), har'a (today)"],["postposition / preposition","durduubee (also maxxantoo)","keessa (in), irra (on), gara (towards)"],["conjunction","walqabsiistuu","fi (and), garuu (but), yookiin (or)"],["interjection","raajeffannoo","Ishoo! (hooray!), Wayyoo! (oh no!)"]]}}]},{"id":"pronouns","en":"Subject pronouns and respect","om":"Bamaqaa raawwataa fi kabaja","icon":"🙋","level":1,"summary_en":"Learn the seven subject pronouns and how Oromo uses plural forms to show respect.","summary_om":"Bamaqaa ani, ati, inni, isheen, nuti, isin, isaan fi akkaataa kabajaan itti fayyadaman.","sections":[{"h_en":"The subject pronouns","h_om":"Bamaqaa raawwataa","p_en":"These are the forms used for the subject of a sentence. There is a separate 'you' for one person (ati) and for several people (isin).","table":{"head":["English","Afaan Oromoo","Note"],"rows":[["I","ani",""],["you (one person)","ati",""],["he","inni",""],["she","isheen","Also: isiin, ishiin (regional)"],["we","nuti","Also: nuyi, nu'i (regional)"],["you (several people; one person, respectfully)","isin","plural / respect"],["they; he/she (respectfully)","isaan","plural / respect"]]}},{"h_en":"Dropping the pronoun","h_om":"Bamaqaa dhiisuu","p_en":"Because the verb ending shows the person, pronouns are often left out: Deemne 'We went', Dhufte 'You came / She came'. Keep the pronoun when you want emphasis or contrast, or when a form is ambiguous: ati and isheen share many verb forms, and so do ani and inni.","ex":[["Did you go, or did she go?","Ati deemte moo isheen deemte?","","",0]]},{"h_en":"Respect: isin and isaan","h_om":"Kabaja: isin fi isaan","p_en":"Politeness is built into the grammar. Speak to an elder, a stranger, a teacher or an official with isin and plural verb forms, even if it is one person. Talk ABOUT a respected person (a parent, an elder) with isaan and plural verbs. Using ati with an elder can sound rude; using isin with a child sounds overly formal.","ex":[["How are you? (to an elder)","Akkam jirtu?","To a friend: Akkam jirta?","",0],["My father is coming today.","Abbaan koo har'a dhufu.","Plural verb dhufu shows respect for the father.","",0]]},{"h_en":"There is no 'it'","h_om":"'It' hin jiru","p_en":"Oromo has no word for 'it'. Things are 'he' or 'she' according to the gender of the noun, and usually no pronoun is needed at all: Eessa jira? 'Where is it?' (masculine thing), Eessa jirti? (feminine thing)."},{"h_en":"Pronouns change with their role","h_om":"Bamaqaan akka hojii isaatti jijjiirama","p_en":"The forms above are only for subjects. As objects and with endings they change: ani → na (me), naaf (for me), natti (to me); ati → si, siif, sitti. You will meet these in the lesson on object pronouns. Two handy short forms: add -s for 'too' (Anis 'me too', Atis 'you too'), and use hoo to ask 'and you?'.","ex":[["I'm a teacher. And you?","Ani barsiisaadha. Ati hoo?","","",0],["She came from Adama.","Isheen Adaamaa irraa dhufte.","","",0],["We are students.","Nuti barattoota.","","",0],["Where are you (all) from?","Isin eessaa dhuftan?","","",0]]}]},{"id":"copula","en":"To be: -dha, miti, ture","om":"Gochima 'ta'uu': -dha, miti, ture","icon":"🧩","level":1,"summary_en":"Oromo has no separate verb 'is/am/are': it uses the ending -dha, the word miti for 'is not', and ture for 'was'.","summary_om":"Afaan Oromoo keessatti 'is/am/are' jechuuf -dha, haaluuf miti, yeroo darbeef immoo ture fayyadamna.","sections":[{"h_en":"Present: -dha, nothing, -i, -ti","h_om":"Yeroo ammaa: -dha, homaa, -i, -ti","p_en":"To say 'X is Y', put the describing word (a noun or adjective) at the end and attach the 'is' ending to it. The ending does NOT change with the person: it is the same for I, you, he, we, they. Which ending you use depends on how the last word ends: long vowel → -dha; short -a → nothing; consonant → -i; an owner ('of someone') → -ti.","table":{"head":["Afaan Oromoo","English","Why"],"rows":[["Ani barataadha.","I am a student.","long vowel + dha"],["Isheen barsiistuudha.","She is a teacher.","long vowel + dha"],["Nuti Oromoodha.","We are Oromo.","long vowel + dha"],["Inni dheeraadha.","He is tall.","long vowel + dha"],["Kun mana.","This is a house.","short -a: nothing"],["Inni gurraacha.","He is black / dark-skinned.","short -a: nothing"],["Kun Galaani.","This is Galaan.","consonant + i"],["Inni hiriyyaa kooti.","He is my friend.","owner + ti"]]}},{"h_en":"Negative: miti","h_om":"Haaluu: miti","p_en":"'Is not' is miti, placed after the describing word. The -dha disappears: Ani barataa miti 'I am not a student'. miti is the same for every person.","ex":[["I am not a student.","Ani barataa miti.","","",0],["This is not my house.","Kun mana koo miti.","","",0],["He is not Chala.","Inni Caalaa miti.","","",0]]},{"h_en":"Questions","h_om":"Gaaffii","p_en":"Lengthen the last vowel and raise your voice: barataadha → barataadhaa? Answer with Eeyyee (yes) or Lakki (no).","ex":[["Are you a student? – Yes, I am.","Ati barataadhaa? – Eeyyee, barataadha.","","",0],["Is this your house? – No.","Kun mana keetii? – Lakki, mana koo miti.","","",0]]},{"h_en":"Past: ture / hin turre","h_om":"Yeroo darbe: ture / hin turre","p_en":"'Was/were' is ture (from the verb turuu 'to stay'). It agrees with the subject: ani/inni ture, ati/isheen turte, nuti turre, isin turtan, isaan turan. In everyday speech you will also hear plain ture used for everyone. 'Was not' is hin turre for all persons.","table":{"head":["Person","was","was not"],"rows":[["ani","barataa ture","barataa hin turre"],["ati","barataa turte","barataa hin turre"],["inni","barataa ture","barataa hin turre"],["isheen","barattuu turte","barattuu hin turre"],["nuti","barattoota turre","barattoota hin turre"],["isin","barattoota turtan","barattoota hin turre"],["isaan","barattoota turan","barattoota hin turre"]]},"ex":[["She was a teacher.","Isheen barsiistuu turte.","","",0],["He was not a teacher.","Inni barsiisaa hin turre.","","",0]]},{"h_en":"Where -dha is not used","h_om":"Bakka -dha hin fayyadamne","p_en":"-dha only links a noun or adjective. For location ('is at home') Oromo uses jira (lesson on jiraachuu), and for 'will be / to be' it uses the verb ta'uu (lesson on becoming). Compare: Inni barsiisaadha 'He is a teacher' – Inni mana jira 'He is at home' – Barsiisaa ta'uu barbaada 'He wants to be a teacher'.","ex":[["This coffee is tasty.","Bunni kun mi'aawaadha.","","",0]]}]},{"id":"nouns_gender","en":"Nouns and gender","om":"Maqaa fi saala","icon":"⚧️","level":1,"summary_en":"Every Oromo noun is masculine or feminine; you mostly notice the gender through agreement on verbs, adjectives and 'this/that'.","summary_om":"Maqaan hundi dhiira ykn dhalaa dha; saalli kun gochima, ibsa maqaa fi kun/tun irratti mul'ata.","sections":[{"h_en":"Two genders, no 'it'","h_om":"Saala lama","p_en":"Oromo nouns are masculine or feminine. Most nouns do not show their gender in their own form; it becomes visible in the words that agree with them: the verb (dhufe 'he came' / dhufte 'she came'), 'this' (kun/tun), adjectives (guddaa/guddoo 'big'), and in eastern speech also possessives (kee/tee 'your')."},{"h_en":"People and animals: natural gender","h_om":"Namaa fi bineensa","p_en":"For people and animals, grammatical gender follows natural sex. Many pairs use different words or a change of ending.","table":{"head":["Masculine","Feminine","English"],"rows":[["abbaa","haadha","father / mother"],["ilma","intala","son / daughter, girl"],["obboleessa","obboleettii","brother / sister"],["dhiira","dubartii","man, male / woman"],["jaarsa","jaartii","old man / old
