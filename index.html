!","Torbee dhufu wal argina!","","",0]]}]},{"id":"modals_ability","en":"Modal verbs 1: can, could, may, might","om":"Gochima gargaaraa 1: can, could, may, might","icon":"💪","level":1,"summary_en":"Ability, permission, requests and possibility with can, could, be able to, may and might.","summary_om":"Dandeettii, eeyyama, gaaffii kabajaa fi carraa can, could, be able to, may fi might'n ibsuu.","sections":[{"h_en":"How modal verbs work","h_om":"Gochimni gargaaraa akkamitti hojjeta","p_en":"Can, could, may, might, must, should, will and would are modal verbs. They never change: no -s for he/she/it, no -ed, no 'to' after them, and no do/does in questions or negatives. 'She can swim' (not 'cans', not 'can to swim'). 'Can you come?' 'I can't come.' In Afaan Oromoo, danda'uu is a normal verb that changes with the person (nan danda'a, ni dandeessa, ni dandeessi…); in English 'can' stays the same.","p_om":"Can, could, may, might, must, should, will fi would gochima gargaaraa (modal) jedhamu. Isaan gonkumaa hin jijjiiraman: he/she/it'f -s hin fudhatan, -ed hin fudhatan, isaan booda 'to' hin dhufu, gaaffii fi dhabamsa keessattis do/does hin barbaachisu. 'She can swim' ('cans' miti, 'can to swim' miti). 'Can you come?' 'I can't come.' Afaan Oromoo keessatti danda'uu gochima idilee raawwataa wajjin jijjiiramu (nan danda'a, ni dandeessa, ni dandeessi…); Ingiliffa keessatti 'can' akkuma jirutti hafa.","table":{"head":["Positive","Negative","Question"],"rows":[["I can swim.","I can't (cannot) swim.","Can you swim?"],["She could read at five.","She couldn't read.","Could she read?"],["It may rain.","It may not rain.","—"],["He might come.","He might not come.","—"]]}},{"h_en":"Ability: can, could, be able to","h_om":"Dandeettii: can, could, be able to","p_en":"Use 'can' for ability now (I can speak three languages) and 'could' for general ability in the past (When I was young, I could run very fast). For other tenses use 'be able to': 'I'll be able to help you tomorrow.' 'I haven't been able to sleep.' For one specific success in the past, use 'was able to' or 'managed to': 'The fire was big, but everyone was able to get out.'","p_om":"Dandeettii ammaaf 'can' fayyadami (I can speak three languages), dandeettii waliigalaa yeroo darbeef immoo 'could' (When I was young, I could run very fast). Yeroo biroof 'be able to' fayyadami: 'I'll be able to help you tomorrow.' 'I haven't been able to sleep.' Milkaa'ina addaa tokko yeroo darbe keessatti ibsuuf 'was able to' yookiin 'managed to' fayyadami: 'The fire was big, but everyone was able to get out.'"},{"h_en":"Permission and requests","h_om":"Eeyyamaa fi gaaffii kabajaa","p_en":"Ask for permission with Can I…? (informal), Could I…? (more polite) or May I…? (formal): 'May I come in?' Ask someone to do something with Can you…? or, more politely, Could you…?: 'Could you help me, please?' Answers: 'Yes, of course.' 'Sure.' 'Sorry, you can't.' Afaan Oromoo uses '…danda'aa?' and 'maaloo' in the same way.","p_om":"Eeyyama gaafachuuf Can I…? (salphaa), Could I…? (kabaja caalu) yookiin May I…? (seera qabeessa) fayyadami: 'May I come in?' Namni tokko akka waa siif godhu gaafachuuf Can you…? yookiin, caalaatti kabajaan, Could you…? fayyadami: 'Could you help me, please?' Deebii: 'Yes, of course.' 'Sure.' 'Sorry, you can't.' Afaan Oromoo haaluma kanaan '…danda'aa?' fi 'maaloo' fayyadama."},{"h_en":"Possibility: may, might, could, can't","h_om":"Carraa: may, might, could, can't","p_en":"'May', 'might' and 'could' mean 'perhaps' (tarii, …uu mala): 'It may rain.' 'He might be at home.' 'That could be true.' 'Might' is a little less sure. 'Can't' means you are sure something is impossible: 'That can't be Tola – he's in Jimma.' (For 'must' = sure it's true, see Modal verbs 2.)","p_om":"'May', 'might' fi 'could' 'tarii' (…uu mala) jechuudha: 'It may rain.' 'He might be at home.' 'That could be true.' 'Might' xiqqoo shakkii caalu qaba. 'Can't' wanti tokko akka hin danda'amne mirkanaa'uu kee agarsiisa: 'That can't be Tola – he's in Jimma.' ('Must' = dhugaa ta'uu isaa mirkanaa'uu, barnoota Modal verbs 2 ilaali.)","ex":[["I can swim, but I can't ride a bicycle.","Daakuu nan danda'a, garuu biskileetii oofuu hin danda'u.","","",0],["When I was young, I could run very fast.","Yeroo ani xiqqaa turetti baay'ee saffisaan fiiguu nan danda'a ture.","","",0],["Can I use your phone?","Bilbila kee fayyadamuu nan danda'aa?","","",0],["Could you help me, please?","Maaloo na gargaaruu dandeessaa?","","",0],["May I come in?","Seenuu nan danda'aa?","","",0],["It might rain this afternoon.","Har'a waaree booda roobuu mala.","","",0],["That can't be true!","Sun dhugaa ta'uu hin danda'u!","","",0],["Will you be able to come tomorrow?","Boru dhufuu ni dandeessaa?","","",0]]}]},{"id":"comparison","en":"Comparatives & superlatives","om":"Madaalchisuu: caalaa fi hunda caalaa","icon":"📊","level":1,"summary_en":"taller than, more expensive than, the tallest, the most beautiful, as … as.","summary_om":"taller than, more expensive than, the tallest, the most beautiful, as … as.","sections":[{"h_en":"Comparatives: -er than / more … than","h_om":"Caalaa: -er than / more … than","p_en":"Afaan Oromoo keeps the adjective the same and adds caalaa or irra: 'Abdiin Tolaa caalaa dheeraadha.' English changes the adjective: short adjectives add -er (tall → taller), long adjectives use 'more' (expensive → more expensive). Then add 'than': 'Abdi is taller than Tola.' Never use both: not 'more taller'.","p_om":"Afaan Oromoo ibsa maqaa hin jijjiiru; caalaa yookiin irra itti dabala: 'Abdiin Tolaa caalaa dheeraadha.' Ingiliffi garuu ibsa maqaa jijjiira: ibsi gabaabaan -er dabala (tall → taller), ibsi dheeraan 'more' fayyadama (expensive → more expensive). Sana booda 'than' dabali: 'Abdi is taller than Tola.' Lamaan isaanii walitti hin fayyadamin: 'more taller' miti.","table":{"head":["Adjective","Rule","Comparative","Superlative"],"rows":[["tall, short, old","+ er / + est","taller","the tallest"],["nice, large","+ r / + st","nicer","the nicest"],["big, hot, thin","double + er / est","bigger","the biggest"],["easy, happy, busy","y → ier / iest","easier","the easiest"],["expensive, beautiful","more / the most","more expensive","the most expensive"],["good","irregular","better","the best"],["bad","irregular","worse","the worst"],["far","irregular","farther / further","the farthest / furthest"],["many, much","irregular","more","the most"],["little","irregular","less","the least"]]}},{"h_en":"Superlatives: the -est / the most","h_om":"Hunda caalaa: the -est / the most","p_en":"To say something is number one in a group, use the + -est or the most: 'the tallest student', 'the most beautiful city'. After a superlative use 'in' + a place or group (the best player in the team) and 'of' + a number or period (the best day of my life). Oromo uses 'hunda caalaa' or 'hunda irra'.","p_om":"Wanti tokko garee tokko keessatti lakkoofsa tokkoffaa ta'uu isaa himuuf the + -est yookiin the most fayyadami: 'the tallest student', 'the most beautiful city'. Hunda caalaa booda 'in' + bakka yookiin garee (the best player in the team), akkasumas 'of' + lakkoofsa yookiin yeroo (the best day of my life) fayyadami. Afaan Oromoo 'hunda caalaa' yookiin 'hunda irra' fayyadama."},{"h_en":"As … as, the same as, different from","h_om":"As … as, the same as, different from","p_en":"Use as + adjective + as for equal things: 'My bag is as heavy as yours.' (Boorsaan koo akkuma kan keetii ulfaata.) Use not as … as for 'less': 'This road isn't as long as that one.' Other useful patterns: the same as, similar to, different from, like: 'Her dress is the same as mine.' 'He looks like his father.'","p_om":"Wantoota walqixa ta'aniif as + ibsa maqaa + as fayyadami: 'My bag is as heavy as yours.' (Boorsaan koo akkuma kan keetii ulfaata.) 'Gadi' jechuuf not as … as fayyadami: 'This road isn't as long as that one.' Haalota gargaaran biroo: the same as, similar to, different from, like: 'Her dress is the same as mine.' 'He looks like his father.'"},{"h_en":"Making comparisons stronger","h_om":"Madaalchisa cimsuu","p_en":"Use much, far, a lot or a bit before a comparative: 'much bigger', 'a bit cheaper'. Repeat for a growing change: 'bigger and bigger', 'more and more expensive'. Use 'the … the …' for two things that change together: 'The more you practice, the better you speak.' Common mistakes: 'more better', 'the most best', 'very taller'.","p_om":"Caalaa dura much, far, a lot yookiin a bit fayyadami: 'much bigger', 'a bit cheaper'. Jijjiirama guddachaa deemu agarsiisuuf irra deebi'i: 'bigger and bigger', 'more and more expensive'. Wantoota lama waliin jijjiiraman agarsiisuuf 'the … the …' fayyadami: 'The more you practice, the better you speak.' Dogoggora baramoo: 'more better', 'the most best', 'very taller'.","ex":[["Abdi is taller than Tola.","Abdiin Tolaa caalaa dheeraadha.","","",0],["This car is more expensive than that one.","Konkolaataan kun kan sana caalaa qaaliidha.","","",0],["This is the best restaurant in town.","Kun mana nyaataa magaalaa keessaa hunda caalaa gaariidha.","","",0],["My bag isn't as heavy as yours.","Boorsaan koo akka kan keetii hin ulfaatu.","","",0],["Today is much hotter than yesterday.","Har'a kaleessa caalaa baay'ee ho'a.","","",0],["Her answer is different from mine.","Deebiin ishee kan koo irraa adda.","","",0],["The more you practice, the better you speak.","Hammuma caalaatti shaakaltu, caalaatti gaariitti dubbatta.","","",1]]}]},{"id":"conjunctions","en":"Conjunctions: and, but, so, because…","om":"Walqabsiistota: and, but, so, because…","icon":"🔗","level":1,"summary_en":"Joining words and sentences with and, but, or, so, because, when, while, if, unless, although, and word pairs.","summary_om":"Jechootaa fi himoota and, but, or, so, because, when, while, if, unless, although fi walqabsiistota lamaan dhufaniin walitti qabsiisuu.","sections":[{"h_en":"And, but, or, so","h_om":"And, but, or, so","p_en":"and = fi (and also -s): 'tea and coffee'; but = garuu; or = yookiin (in questions often moo: 'Tea or coffee?' = 'Shaayii moo buna?'); so = kanaaf (result). Afaan Oromoo often joins two actions with the -ee form of the verb: 'Mana dhaqee nyaate' – English needs 'and': 'He went home and ate.' Put a comma before but/so when they join two full sentences: 'I was tired, so I went to bed.'","p_om":"and = fi (akkasumas -s): 'tea and coffee'; but = garuu; or = yookiin (gaaffii keessatti yeroo baay'ee moo: 'Tea or coffee?' = 'Shaayii moo buna?'); so = kanaaf (bu'aa). Afaan Oromoo gocha lama yeroo baay'ee unka -ee gochimaatiin walitti qabsiisa: 'Mana dhaqee nyaate' – Ingiliffi 'and' barbaada: 'He went home and ate.' But/so yeroo hima guutuu lama walitti qabsiisan isaan dura qoodduu (,) kaa'i: 'I was tired, so I went to bed.'"},{"h_en":"Because, because of, so","h_om":"Because, because of, so","p_en":"'Because' + a full sentence gives the reason: 'I stayed home because it was raining.' (Waan roobaa tureef mana ture.) 'Because of' + a noun: 'because of the rain' (sababa roobaatiin). 'So' gives the result: 'It was raining, so I stayed home.' Don't use 'because' and 'so' together in one sentence.","p_om":"'Because' + hima guutuu sababa kenna: 'I stayed home because it was raining.' (Waan roobaa tureef mana ture.) 'Because of' + maqaa: 'because of the rain' (sababa roobaatiin). 'So' bu'aa kenna: 'It was raining, so I stayed home.' Hima tokko keessatti 'because' fi 'so' walitti hin fayyadamin."},{"h_en":"Time: when, while, before, after, until","h_om":"Yeroo: when, while, before, after, until","p_en":"when (yeroo), while (osoo … -uu / yeroo), before (… dura), after (erga … booda), as soon as (akkuma … -een), until (hanga … -tti). Remember: for the future use a present verb after them – 'I'll wait until you come', not 'until you will come'.","p_om":"when (yeroo), while (osoo … -uu / yeroo), before (… dura), after (erga … booda), as soon as (akkuma … -een), until (hanga … -tti). Yaadadhu: yeroo dhufuuf isaan booda gochima yeroo ammaa fayyadami – 'I'll wait until you come', 'until you will come' miti."},{"h_en":"If, unless, although","h_om":"If, unless, although","p_en":"if = yoo; unless = if … not (yoo … baate / yoo … hin): 'Unless you hurry, you'll miss the bus.' although / though / even though = -us, yoo … ta'e illee: 'Although he was sick, he went to work.' (Inni dhukkubsatus hojii deeme.) Important: don't add 'but' after 'although' – 'Although he was sick, but he went' is wrong. Use one or the other.","p_om":"if = yoo; unless = yoo … baate / yoo … hin: 'Unless you hurry, you'll miss the bus.' although / though / even though = -us, yoo … ta'e illee: 'Although he was sick, he went to work.' (Inni dhukkubsatus hojii deeme.) Barbaachisaa: 'although' booda 'but' hin dabalin – 'Although he was sick, but he went' dogoggora. Tokko qofa fayyadami."},{"h_en":"Pairs: both … and, either … or, neither … nor","h_om":"Lamaan dhufan: both … and, either … or, neither … nor","p_en":"both … and (… fi … lachuu): 'Both Tola and Abdi passed.' either … or (yookiin … yookiin …): 'You can pay either in cash or by card.' neither … nor (… -s … -s hin…): 'Neither Tola nor Abdi came.' not only … but also: 'She speaks not only English but also French.'","p_om":"both … and (… fi … lachuu): 'Both Tola and Abdi passed.' either … or (yookiin … yookiin …): 'You can pay either in cash or by card.' neither … nor (… -s … -s hin…): 'Neither Tola nor Abdi came.' (Tolaanis Abdiinis hin dhufne.) not only … but also: 'She speaks not only English but also French.'","ex":[["I like tea, but my brother likes coffee.","Ani shaayii nan jaalladha, obboleessi koo garuu buna jaallata.","","",0],["Do you want tea or coffee?","Shaayii moo buna barbaadda?","","",0],["She was tired, so she went to bed early.","Isheen dadhabdee turte, kanaaf dafte ciifte.","","",0],["We stayed at home because it was raining.","Waan roobaa tureef mana turre.","","",0],["He went to work although he was sick.","Inni dhukkubsatus hojii deeme.","","",0],["Call me when you arrive.","Yeroo geesse natti bilbili.","","",0],["Unless you study, you won't pass the exam.","Yoo qo'achuu baatte, qormaata hin darbitu.","","",0],["Neither my mother nor my father speaks English.","Haati koos abbaan koos Ingiliffa hin dubbatan.","","",0]]}]},{"id":"punctuation","en":"Capital letters & punctuation","om":"Qubee guddaa fi sirna tuqaalee","icon":"✍️","level":1,"summary_en":"When to use capital letters, and how to use the full stop, comma, question mark, apostrophe and quotation marks.","summary_om":"Yoom qubee guddaa fayyadamnu, akkasumas tuqaa, qoodduu, mallattoo gaaffii, hudhaa fi mallattoo waraabbii akkamitti fayyadamnu.","sections":[{"h_en":"Capital letters","h_om":"Qubee guddaa","p_en":"Use a capital letter for: the first word of a sentence; the word 'I' (always – 'I' not 'i'); names of people, towns, rivers and countries (Tola, Adama, Awash, Ethiopia); nationalities and languages (Ethiopian, Oromo, English); days, months and holidays (Monday, January, Irreecha, Christmas); titles before names (Mr. Tola, Dr. Lensa); and the main words in titles of books and films. Seasons are not capitalized: summer, winter.","p_om":"Qubee guddaa kanneen armaan gadiitiif fayyadami: jecha jalqabaa hima tokkoo; jecha 'I' (yeroo hunda – 'I' malee 'i' miti); maqaa namootaa, magaalotaa, laggeenii fi biyyootaa (Tola, Adama, Awash, Ethiopia); lammummaa fi afaan (Ethiopian, Oromo, English); guyyoota, ji'oota fi ayyaanota (Monday, January, Irreecha, Christmas); maqaa kabajaa maqaa dura dhufu (Mr. Tola, Dr. Lensa); akkasumas jechoota ijoo mata-duree kitaabaa fi fiilmii keessaa. Waqtiileen qubee guddaa hin fudhatan: summer, winter."},{"h_en":"Full stop, question mark, exclamation mark","h_om":"Tuqaa, mallattoo gaaffii, mallattoo dinqisiifannaa","p_en":"End a statement with a full stop (.) – Americans call it a period. End a direct question with a question mark (?). A question reported inside a statement ends with a full stop: 'She asked where I lived.' Use the exclamation mark (!) for strong feeling, and only one: 'Help!' not 'Help!!!' in formal writing. American English puts a period after Mr., Mrs., Dr.; British English often doesn't.","p_om":"Hima idilee tuqaa (.) dhaan xumuri; Ameerikaanonni 'period' jedhanii waamu. Gaaffii kallattii mallattoo gaaffii (?) dhaan xumuri. Gaaffiin hima idilee keessatti gabaafame tuqaadhaan xumurama: 'She asked where I lived.' Miira cimaaf mallattoo dinqisiifannaa (!) fayyadami, tokko qofa: barreeffama seera qabeessa keessatti 'Help!' malee 'Help!!!' miti. Ingiliffi Ameerikaa Mr., Mrs., Dr. booda tuqaa kaa'a; Ingiliffi Biriteenii yeroo baay'ee hin kaa'u."},{"h_en":"The comma","h_om":"Qoodduu (,)","p_en":"Use a comma: between items in a list (tea, coffee, and milk – the last comma is optional); after an opening word or phrase (However, … / Yesterday, …); before but, so, or when they join two full sentences; after an if-clause at the start (If it rains, we'll stay home); when you speak to someone by name (Tola, come here.); and in dates (May 5, 2024). In numbers, English uses a comma for thousands and a point for decimals: 1,500 birr; 2.5 kilos.","p_om":"Qoodduu fayyadami: tarree keessatti wantoota gidduu (tea, coffee, and milk – qoodduun dhumaa filannoodha); jecha yookiin gaalee jalqabaa booda (However, … / Yesterday, …); but, so, or dura yeroo hima guutuu lama walitti qabsiisan; hima 'if' jalqabatti dhufe booda (If it rains, we'll stay home); nama maqaan waamtu (Tola, come here.); akkasumas guyyaa ji'aa keessatti (May 5, 2024). Lakkoofsa keessatti Ingiliffi kumaaf qoodduu, kurnaafaaf immoo tuqaa fayyadama: 1,500 birr; 2.5 kilos."},{"h_en":"The apostrophe","h_om":"Hudhaa (')","p_en":"In Qubee the apostrophe (hudhaa) is a real sound – the glottal stop in ta'uu, bu'aa, har'a. In English it is silent and has two jobs only: (1) it shows missing letters in short forms: don't (do not), it's (it is), I'm (I am), we'll (we will); (2) it shows possession: Tola's book, the students' books. Never use it to make a plural: 'apples' not 'apple's'. And 'its' (possessive) has no apostrophe.","p_om":"Qubee keessatti hudhaan sagalee dhugaati – ta'uu, bu'aa, har'a keessatti. Ingiliffa keessatti garuu hin dubbifamu; hojii lama qofa qaba: (1) unka gabaabaa keessatti qubee hafe agarsiisa: don't (do not), it's (it is), I'm (I am), we'll (we will); (2) abbummaa agarsiisa: Tola's book, the students' books. Baay'ina uumuuf gonkumaa hin fayyadamin: 'apples' malee 'apple's' miti. 'Its' (abbummaa) hudhaa hin qabu."},{"h_en":"Quotation marks, colon, hyphen","h_om":"Mallattoo waraabbii, colon fi sarara walqabsiisaa","p_en":"Quotation marks show someone's exact words. American English uses double marks and puts the comma or period inside: He said, “I'm tired.” (British English often uses single marks.) A colon (:) introduces a list or an explanation: 'You need three things: a pen, paper and time.' A hyphen (-) joins words used together as one adjective before a noun: a five-year-old girl, a well-known singer, a part-time job.","p_om":"Mallattoon waraabbii jecha nama tokkoo akkuma jirutti agarsiisa. Ingiliffi Ameerikaa mallattoo dachaa fayyadamee qoodduu yookiin tuqaa keessa kaa'a: He said, “I'm tired.” (Ingiliffi Biriteenii yeroo baay'ee mallattoo tokkee fayyadama.) Mallattoon colon (:) jedhamu tarree yookiin ibsa dursa: 'You need three things: a pen, paper and time.' Sararri walqabsiisaa (-) jechoota akka ibsa maqaa tokkootti maqaa dura dhufan walitti qabsiisa: a five-year-old girl, a well-known singer, a part-time job.","ex":[["My name is Chaltu, and I live in Ambo.","Maqaan koo Caaltuu; ani Amboo keessa jiraadha.","","",0],["I speak Afaan Oromoo, Amharic, and English.","Ani Afaan Oromoo, Afaan Amaaraa fi Ingiliffa nan dubbadha.","","",0],["We celebrate Irreecha in September or October.","Irreecha Fulbaana yookiin Onkoloolessa keessa kabajna.","","",0],["If you want something to eat, there's bread in the kitchen.","Yoo nyaata barbaadde, kushinaa keessa daabboon jira.","","",0],["It's Tola's car, not the teacher's.","Konkolaataan kun kan Tolaati, kan barsiisaa miti.","","",0],["She said, “I'll be there at five.”","Isheen “Sa'aatii 11tti achin ga'a” jette.","","",0]]}]},{"id":"silent_letters","en":"Silent letters & spelling patterns","om":"Qubeewwan callisoo fi haala barreeffamaa","icon":"🤫","level":2,"summary_en":"Letters that are written but not pronounced, the many sounds of GH and CH, and common word endings.","summary_om":"Qubeewwan barreeffamanii hin dubbifamne, sagaleewwan GH fi CH, akkasumas dhuma jechootaa baramoo.","sections":[{"h_en":"Letters you write but don't say","h_om":"Qubeewwan barreeffamanii hin dubbifamne","p_en":"In Qubee every written letter is pronounced. English has many silent letters, left over from how words were pronounced hundreds of years ago. Learn the common patterns below; when you meet a new word, check its pronunciation. A Qubee reader who says the k in 'know' or the b in 'climb' will not be understood easily.","p_om":"Qubee keessatti qubeen barreeffame hundi ni dubbifama. Ingiliffi garuu qubeewwan callisoo (silent letters) baay'ee qaba; isaan akkaataa jechoonni waggoota dhibbaan dura itti dubbatamaa turan irraa hafan. Haala baramoo armaan gadii baradhu; yeroo jecha haaraa argitu, akkaataa itti dubbifamu mirkaneeffadhu. Dubbisaan Qubee k 'know' keessaa yookiin b 'climb' keessaa dubbatu salphaatti hin hubatamu.","table":{"head":["Silent letter / Qubee callisaa","Where / Eessatti","Examples / Fakkeenya"],"rows":[["k","kn- at the start / jalqabatti","know, knife, knee, knock"],["w","wr-, and some words / jechoota tokko","write, wrong, answer, two, who"],["b","after m, before t / m booda, t dura","climb, comb, thumb, debt, doubt"],["l","-alk, -alf, -ould, -alm","walk, talk, half, could, should, calm"],["h","some words at the start / jalqabatti","hour, honest, honor"],["t","-sten, -stle, Christmas","listen, castle, whistle, Christmas"],["p","ps-, -pt, cupboard","psychology, receipt, cupboard"],["n","-mn at the end / dhuma irratti","autumn, column"],["d","some words / jechoota tokko","Wednesday, handsome, sandwich"],["g","-gn","sign, foreign, design"],["u","after g / g booda","guess, guitar, guard, build"],["gh","-ght, -igh, -eigh","night, light, daughter, eight, high"]]}},{"h_en":"GH and CH","h_om":"GH fi CH","p_en":"GH is usually silent (night, thought, through), but at the end of some words it sounds like f: laugh, enough, rough, cough, tough. CH has three sounds. Most often it is /tʃ/ as in church, cheap, chair (like Qubee ch). In words from Greek it is /k/: school, chemistry, Christmas, stomach, character, technology. In words from French it is /ʃ/ (sh): machine, chef, Chicago, brochure.","p_om":"GH yeroo baay'ee hin dubbifamu (night, thought, through), garuu dhuma jechoota tokko tokkoo irratti 'f' jedhama: laugh, enough, rough, cough, tough. CH sagalee sadii qaba. Yeroo baay'ee /tʃ/ jedhama, akka church, cheap, chair (akka ch Qubee). Jechoota afaan Giriikii irraa dhufan keessatti /k/ jedhama: school, chemistry, Christmas, stomach, character, technology. Jechoota afaan Faransaayii irraa dhufan keessatti /ʃ/ (sh) jedhama: machine, chef, Chicago, brochure.","table":{"head":["Spelling","Sound","Examples"],"rows":[["gh","silent / hin dubbifamu","night, light, thought, daughter"],["gh","f","laugh, enough, cough, tough"],["ch","ch","church, cheap, chair, teacher"],["ch","k","school, chemistry, stomach, Christmas"],["ch","sh","machine, chef, brochure"]]}},{"h_en":"Common endings that don't sound as written","h_om":"Dhuma jechootaa akka barreeffamanitti hin dubbifamne","p_en":"Some endings are very frequent and have a fixed pronunciation. -tion is /ʃən/: station, information. -sion is /ʃən/ or /ʒən/: mission, television, decision. -ture is /tʃər/: picture, future, nature. -ous is /əs/: famous, dangerous. -age at the end of a longer word is /ɪdʒ/: village, message, language. Learn them once and you can read thousands of words.","p_om":"Dhumni jechootaa tokko tokko baay'ee mul'atu, akkaataa itti dubbifaman murtaa'aa qabu. -tion /ʃən/ jedhama: station, information. -sion /ʃən/ yookiin /ʒən/ jedhama: mission, television, decision. -ture /tʃər/ jedhama: picture, future, nature. -ous /əs/ jedhama: famous, dangerous. -age dhuma jecha dheeraa irratti /ɪdʒ/ jedhama: village, message, language. Al tokko yoo baratte, jechoota kumaatamaan lakkaa'aman dubbisuu dandeessa.","ex":[["I know the answer.","Deebii isaa nan beeka.","k and w are silent: /noʊ/, /ˈænsər/.","k fi w hin dubbifaman: /noʊ/, /ˈænsər/.",0],["Write your name on the first line.","Maqaa kee sarara jalqabaa irratti barreessi.","","",0],["Listen! Someone is knocking on the door.","Dhaggeeffadhu! Namni tokko balbala rukutaa jira.","","",0],["We waited for an hour.","Sa'aatii tokko eegne.","'hour' starts with a vowel sound, so we say 'an hour'.","'hour' sagalee dubbachiiftuun jalqaba; kanaaf 'an hour' jenna.",0],["She laughed at my joke.","Isheen qoosaa koo irratti kolfite.","","",0],["My daughter is learning the guitar at school.","Intalli koo mana barumsaatti gitaara barachaa jirti.","","",0],["The information is in the message.","Odeeffannoon ergaa keessa jira.","","",0]]}]},{"id":"stress_intonation","en":"Stress & intonation","om":"Dhiibbaa sagalee fi ol-gadi bu'iinsa sagalee","icon":"🎵","level":2,"summary_en":"Word stress, sentence stress and weak forms, and the rising and falling voice in statements and questions.","summary_om":"Dhiibbaa jechaa, dhiibbaa himaa fi unkaalee laafaa, akkasumas sagalee ol ka'uu fi gad bu'uu hima fi gaaffii keessatti.","sections":[{"h_en":"Word stress","h_om":"Dhiibbaa jechaa (word stress)","p_en":"In an English word with two or more syllables, one syllable is stressed: it is longer, louder and higher (TEAcher, baNAna, comPUter). The other syllables become weak, often with schwa. In Afaan Oromoo the accent is more regular and every vowel stays clear, so learners often stress the wrong syllable or say all syllables with the same strength. Wrong stress can make a correct word impossible to understand, so learn the stress with each new word. Dictionaries mark it with ˈ before the stressed syllable: /ˈtiːtʃər/.","p_om":"Jecha Ingiliffaa birsaga lama yookiin isaa ol qabu keessatti birsaga tokko dhiibbaa (stress) qaba: inni dheeraa, cimaa fi ol ka'aadha (TEAcher, baNAna, comPUter). Birsagoonni hafan laafaa ta'u, yeroo baay'ee schwa ta'u. Afaan Oromoo keessatti dhiibbaan sagalee caalaatti seera qabeessa, dubbachiiftuun hundis ifatti dubbatama; kanaaf barattoonni birsaga dogoggoraa cimsu, yookiin birsaga hunda qixa cimsu. Dhiibbaan dogoggoraa jecha sirrii illee akka hin hubatamne gochuu danda'a; kanaaf jecha haaraa hunda dhiibbaa isaa wajjin baradhu. Galmee jechootaa keessatti birsaga cimaa dura mallattoon ˈ kaa'ama: /ˈtiːtʃər/.","table":{"head":["Pattern / Seera","Examples / Fakkeenya"],"rows":[["Most two-syllable nouns and adjectives: first syllable / birsaga 1ffaa","TAble, DOCtor, HAPpy, MOther"],["Most two-syllable verbs: second syllable / birsaga 2ffaa","beGIN, deCIDE, reLAX, forGET"],["-tion, -sion: the syllable before / birsaga isaan dura jiru","inforMAtion, eduCAtion, deCIsion"],["-ic, -ity: the syllable before","BAsic, ecoNOMic, uniVERsity, aBIlity"],["Same word, noun or verb / maqaa yookiin gochima","a REcord – to reCORD; a PREsent – to preSENT; an OBject – to obJECT"]]}},{"h_en":"Sentence stress and weak forms","h_om":"Dhiibbaa himaa fi unkaalee laafaa","p_en":"In a sentence, English stresses the content words – nouns, main verbs, adjectives, adverbs, question words and negatives – and says the small grammar words quickly and weakly: 'I WANT to GO to the MARket.' Here 'to' sounds /tə/ and 'the' sounds /ðə/. Other weak forms: and /ən/, for /fər/, of /əv/, can /kən/, was /wəz/, are /ər/. This is why English speech sounds fast. It also carries meaning: 'I can SWIM' (/kən/), but 'I CAN'T swim' (/kænt/, stressed). Moving the stress shows contrast: 'I didn't take YOUR pen' means I took someone else's.","p_om":"Hima keessatti Ingiliffi jechoota hiika qaban – maqaa, gochima ijoo, ibsa maqaa, ibsa gochimaa, jechoota gaaffii fi dhabamsa – cimsee dubbata; jechoota xixiqqoo seerlugaa ammoo ariitiin fi laafinaan dubbata: 'I WANT to GO to the MARket.' Asitti 'to' /tə/, 'the' immoo /ðə/ jedhama. Unkaalee laafaa biroo: and /ən/, for /fər/, of /əv/, can /kən/, was /wəz/, are /ər/. Kanaafidha dubbiin Ingiliffaa ariifataa sitti fakkaatu. Kun hiikaafis barbaachisaadha: 'I can SWIM' (/kən/), garuu 'I CAN'T swim' (/kænt/, cimaa). Dhiibbaa jijjiiruun garaagarummaa agarsiisa: 'I didn't take YOUR pen' jechuun qalama nama biraa fudhadhe jechuudha."},{"h_en":"Statements and Wh- questions fall","h_om":"Hima idilee fi gaaffiin Wh- gad bu'a","p_en":"Intonation is the music of the voice. In ordinary statements and in Wh- questions (what, where, who, why, how…), the voice goes down at the end: 'I live in Adama. ↘' 'Where do you live? ↘' Questions with a question word usually fall in Afaan Oromoo too, so this is easy. Don't let your voice go up at the end of a Wh- question in English – it can sound surprised, or as if you didn't hear.","p_om":"Ol-gadi bu'iinsi sagalee (intonation) weedduu sagalee keeti. Hima idilee fi gaaffii jecha gaaffiitiin jalqabu (what, where, who, why, how…) keessatti, dhuma irratti sagaleen gad bu'a: 'I live in Adama. ↘' 'Where do you live? ↘' Afaan Oromoo keessattis gaaffiin jecha gaaffii qabu yeroo baay'ee gad bu'a; kanaaf kun salphaadha. Gaaffii Wh- Ingiliffaa dhuma irratti sagalee ol hin kaasin – dinqisiifannaa yookiin akka waan hin dhageenye fakkaata."},{"h_en":"Yes/no questions rise; choices and lists","h_om":"Gaaffiin eeyyee/lakki ol ka'a; filannoo fi tarree","p_en":"Yes/no questions usually rise at the end: 'Are you ready? ↗' 'Do you speak English? ↗' In Afaan Oromoo we often make a yes/no question only by raising the voice and lengthening the last vowel (Ni dhufta. → Ni dhuftaa?). English also puts a helping verb at the front (Do you…? Are you…?) – and the voice still rises. In a choice question the voice rises on the first option and falls on the last: 'Tea ↗ or coffee? ↘' Lists work the same way: 'apples ↗, bananas ↗ and oranges ↘'.","p_om":"Gaaffiin eeyyee/lakki dhuma irratti yeroo baay'ee ol ka'a: 'Are you ready? ↗' 'Do you speak English? ↗' Afaan Oromoo keessatti gaaffii eeyyee/lakki sagalee ol kaasuu fi dubbachiiftuu dhumaa dheeressuun qofa uumna (Ni dhufta. → Ni dhuftaa?). Ingiliffi gochima gargaaraa jalqabatti ni dabala (Do you…? Are you…?) – sagaleen garuu ammas ol ka'a. Gaaffii filannoo keessatti filannoo jalqabaa irratti sagaleen ol ka'a, isa dhumaa irratti gad bu'a: 'Tea ↗ or coffee? ↘' Tarreenis haaluma kanaan: 'apples ↗, bananas ↗ and oranges ↘'."},{"h_en":"Question tags: rising or falling","h_om":"Gaaffii xiqqaa dhuma himaa: ol ka'uu yookiin gad bu'uu","p_en":"A question tag (isn't it? don't you?) – like Oromo 'mitii?' – can rise or fall. Rising ↗ is a real question: you are not sure. 'The bus leaves at six, doesn't it? ↗' Falling ↘ means you expect the listener to agree: 'It's a beautiful day, isn't it? ↘' See the Questions lesson for how to form tags.","p_om":"Gaaffiin xiqqaan dhuma hima irratti dabalamu (isn't it? don't you?) – akka 'mitii?' Afaan Oromoo – ol ka'uu yookiin gad bu'uu danda'a. Yoo ol ka'e ↗, dhugumaan gaafachaa jirta – shakkii qabda: 'The bus leaves at six, doesn't it? ↗' Yoo gad bu'e ↘, dhaggeeffataan akka walii galu eegda: 'It's a beautiful day, isn't it? ↘' Akkaataa gaaffiin kun itti uumamu barnoota 'Gaaffii' keessatti ilaali.","ex":[["Where do you WORK? ↘","Eessa hojjetta?","Wh- question: the voice falls.","Gaaffii Wh-: sagaleen gad bu'a.",0],["Do you like COFfee? ↗","Buna ni jaallattaa?","Yes/no question: the voice rises.","Gaaffii eeyyee/lakki: sagaleen ol ka'a.",0],["Would you like TEA ↗ or COFfee? ↘","Shaayii moo buna barbaadda?","","",0],["I CAN'T come toMORrow.","Boru dhufuu hin danda'u.","Stress 'can't' so the listener hears the negative.","Dhabamsi akka dhaga'amuuf 'can't' cimsi.",0],["We'll preSENT our PROject on FRIday.","Jimaata pirojektii keenya ni dhiyeessina.","","",0],["It's hot today, isn't it? ↘","Har'a ni ho'a, mitii?","","",0]]}]},{"id":"homophones","en":"Homophones & homographs","om":"Jechoota sagalee yookiin barreeffama tokko qaban","icon":"👯","level":2,"summary_en":"Words that sound the same but are spelled differently, words spelled the same but said differently, and easily confused pairs.","summary_om":"Jechoota sagalee tokko garuu barreeffama adda qaban, barreeffama tokko garuu sagalee adda qaban, akkasumas jechoota walitti makaman.","sections":[{"h_en":"Homophones: same sound, different spelling","h_om":"Homophones: sagalee tokko, barreeffama adda","p_en":"Homophones are words that sound exactly the same but have different spellings and meanings. When you listen, the context tells you which word it is; when you write, you must choose the right spelling. They cause many spelling mistakes, even for native speakers (their/there/they're, your/you're, its/it's).","p_om":"Homophones jechoota sagalee guutummaatti tokko qaban, garuu barreeffamaa fi hiika adda qabanidha. Yeroo dhaggeeffattu, haalli dubbii jecha kamii akka ta'e sitti hima; yeroo barreessitu garuu barreeffama sirrii filachuu qabda. Isaan dogoggora barreeffamaa baay'ee fidu, namoota afaan isaanii Ingiliffa ta'eef illee (their/there/they're, your/you're, its/it's).","table":{"head":["Words / Jechoota","Hiika / Meanings"],"rows":[["to / too / two","gara / -s, baay'ee / lama"],["there / their / they're","achi / kan isaanii / isaan … (they are)"],["hear / here","dhaga'uu / as"],["right / write","sirrii, mirga / barreessuu"],["buy / by / bye","bituu / …n, bira / nagaatti"],["see / sea","arguu / galaana"],["know / no","beekuu / lakki"],["hour / our","sa'aatii / kan keenya"],["son / sun","ilma / aduu"],["week / weak","torbee / dadhabaa"],["meet / meat","wal arguu / foon"],["flour / flower","daakuu / abaaboo"],["whole / hole","guutuu / boolla"],["peace / piece","nagaa / kutaa"],["sale / sail","gurgurtaa / dooniin imaluu"],["plain / plane","salphaa, ifa / xiyyaara"],["its / it's","kan isaa (wantaa) / it is"],["your / you're","kee / you are"],["weather / whether","haala qilleensaa / yoo … (moo)"],["waste / waist","balleessuu, balfa / mudhii"],["sent / scent / cent","erge / urgaa / saantima"]]}},{"h_en":"Homographs: same spelling, different sound","h_om":"Homographs: barreeffama tokko, sagalee adda","p_en":"Homographs are spelled the same but pronounced differently, with different meanings. Here the sentence tells you how to read the word. Many are noun–verb pairs where the stress moves (see the Stress lesson).","p_om":"Homographs jechoota barreeffama tokko qaban garuu sagalee fi hiika adda qabanidha. Asitti himni akkaataa jechi itti dubbifamu sitti hima. Isaan keessaa baay'een maqaa fi gochima ta'anii dhiibbaan isaanii jijjiirama (barnoota Dhiibbaa Sagalee ilaali).","table":{"head":["Word / Jecha","Sound 1 – meaning","Sound 2 – meaning"],"rows":[["read","/riːd/ dubbisuu (present)","/rɛd/ dubbise (past)"],["live","/lɪv/ jiraachuu","/laɪv/ jiraataa; kallattiin (live TV)"],["close","/kloʊz/ cufuu","/kloʊs/ dhiyoo"],["wind","/wɪnd/ bubbee","/waɪnd/ maruu"],["tear","/tɪr/ imimmaan","/tɛr/ ciruu"],["minute","/ˈmɪnɪt/ daqiiqaa","/maɪˈnuːt/ baay'ee xiqqaa"],["use","/juːs/ itti fayyadama (noun)","/juːz/ fayyadamuu (verb)"],["present","/ˈprɛzənt/ kennaa; yeroo ammaa","/prɪˈzɛnt/ dhiyeessuu"],["record","/ˈrɛkərd/ galmee","/rɪˈkɔrd/ waraabuu, galmeessuu"]]}},{"h_en":"Same word, two meanings","h_om":"Jecha tokko, hiika lama","p_en":"Some words have the same spelling and the same sound but completely different meanings (homonyms). Again, only the context helps: 'bank' (baankii / qarqara lagaa), 'can' (danda'uu / xaasaa), 'date' (guyyaa / beellama jaalalaa), 'bolt' (qabduu balbalaa / tasa fiiguu), 'calf' (jabbii / sarbaa lukaa), 'light' (ibsaa / salphaa), 'right' (mirga / sirrii), 'fair' (haqa qabeessa / bazaarii), 'fine' (gaarii / adabbii maallaqaa), 'watch' (ilaaluu / sa'aatii harkaa), 'match' (kibriitii / tapha), 'kind' (gosa / arjaa).","p_om":"Jechoonni tokko tokko barreeffamaa fi sagalee tokko qabaatanii hiika guutummaatti adda qabu (homonyms). Asittis haalli dubbii qofatu nu gargaara: 'bank' (baankii / qarqara lagaa), 'can' (danda'uu / xaasaa), 'date' (guyyaa / beellama jaalalaa), 'bolt' (qabduu balbalaa / tasa fiiguu), 'calf' (jabbii / sarbaa lukaa), 'light' (ibsaa / salphaa), 'right' (mirga / sirrii), 'fair' (haqa qabeessa / bazaarii), 'fine' (gaarii / adabbii maallaqaa), 'watch' (ilaaluu / sa'aatii harkaa), 'match' (kibriitii / tapha), 'kind' (gosa / arjaa)."},{"h_en":"Easily confused pairs","h_om":"Jechoota salphaatti walitti makaman","p_en":"Some pairs are not exact homophones but sound close enough to be confused: accept (fudhachuu) / except (… malee); quiet (callisaa) / quite (baay'ee, guutumaan); lose (dhabuu) / loose (laafaa, bal'aa); desert (gammoojjii) / dessert (nyaata mi'aawaa nyaata booda); beside (cinaa) / besides (dabalataan); advice (gorsa – noun) / advise (gorsuu – verb). Learn them in pairs, with an example sentence for each.","p_om":"Jechoonni tokko tokko sagalee guutummaatti tokko hin qaban, garuu walitti dhiyaachuu isaaniitiin ni makamu: accept (fudhachuu) / except (… malee); quiet (callisaa) / quite (baay'ee, guutumaan); lose (dhabuu) / loose (laafaa, bal'aa); desert (gammoojjii) / dessert (nyaata mi'aawaa nyaata booda); beside (cinaa) / besides (dabalataan); advice (gorsa – maqaa) / advise (gorsuu – gochima). Lamaan lamaan, tokkoon tokkoon isaanii hima fakkeenyaa wajjin baradhu.","ex":[["Their children are over there.","Ijoolleen isaanii achi jiru.","","",0],["I want to buy two books, too.","Anis kitaabota lama bituu barbaada.","","",0],["Can you open this can?","Xaasaa kana banuu dandeessaa?","","",0],["I read this book last year; now I'm reading it again.","Kitaaba kana bara darbe dubbise; amma irra deebi'ee dubbisaa jira.","First 'read' = /rɛd/ (past).","'read' jalqabaa = /rɛd/ (yeroo darbe).",0],["Everyone came except Lemi.","Lammii malee namni hundi dhufe.","","",0],["Please be quiet; the baby is sleeping.","Maaloo callisi; daa'imni rafaa jira.","","",0],["Don't lose your key – this lock is loose.","Furtuu kee hin dhabin – cufaan kun laafaadha.","","",0]]}]},{"id":"past_continuous","en":"Past continuous","om":"Yeroo darbe itti fufaa","icon":"🎞️","level":2,"summary_en":"was/were + -ing for actions in progress in the past, interrupted actions, and actions at the same time.","summary_om":"was/were + -ing gocha yeroo darbe keessatti itti fufaa tureef, gocha addaan citeef fi gocha yeroo tokkotti raawwatamaniif.","sections":[{"h_en":"Form: was / were + verb-ing","h_om":"Unka: was / were + gochima-ing","p_en":"Afaan Oromoo uses the verb + -aa and 'ture': 'Ani dubbisaa ture.' English uses was/were + -ing: 'I was reading.' Negative: 'I wasn't reading.' 'They weren't listening.' Question: 'Was she sleeping?' 'What were you doing?'","p_om":"Afaan Oromoo gochima + -aa fi 'ture' fayyadama: 'Ani dubbisaa ture.' Ingiliffi was/were + -ing fayyadama: 'I was reading.' Dhabamsa: 'I wasn't reading.' 'They weren't listening.' Gaaffii: 'Was she sleeping?' 'What were you doing?'","table":{"head":["English","Afaan Oromoo"],"rows":[["I was writing.","Ani barreessaa ture."],["You were writing.","Ati barreessaa turte."],["He was writing.","Inni barreessaa ture."],["She was writing.","Isheen barreessaa turte."],["We were writing.","Nuti barreessaa turre."],["They were writing.","Isaan barreessaa turan."]]}},{"h_en":"In progress at a time in the past","h_om":"Yeroo murtaa'e tokkotti itti fufaa ture","p_en":"Use it for an action that was happening at a particular moment in the past: 'At eight o'clock last night I was watching TV.' 'This time yesterday we were traveling to Harar.' The action started before that moment and continued after it.","p_om":"Gocha yeroo darbe keessaa yeroo murtaa'e tokkotti raawwatamaa tureef fayyadami: 'At eight o'clock last night I was watching TV.' 'This time yesterday we were traveling to Harar.' Gochichi yeroo sana dura jalqabee yeroo sana booda itti fufe."},{"h_en":"Interrupted actions: was doing … when … did","h_om":"Gocha addaan cite: was doing … when … did","p_en":"Use the past continuous for the longer background action and the past simple for the short action that interrupted it: 'I was cooking when the lights went out.' (Yeroo ibsaan dhaamu, ani nyaata bilcheessaa ture.) 'While I was walking home, I met an old friend.'","p_om":"Gocha dheeraa duubaa (background) agarsiisuuf yeroo darbe itti fufaa, gocha gabaabaa isa addaan kute agarsiisuuf immoo yeroo darbe salphaa fayyadami: 'I was cooking when the lights went out.' (Yeroo ibsaan dhaamu, ani nyaata bilcheessaa ture.) 'While I was walking home, I met an old friend.'"},{"h_en":"Two actions at the same time","h_om":"Gocha lama yeroo tokkotti","p_en":"Use the past continuous for both actions with 'while': 'While I was studying, my brother was playing music.' (Osoo ani qo'achaa jiruu, obboleessi koo muuziqaa taphachiisaa ture.) In stories, it sets the scene: 'It was a cold morning. People were waiting for the bus…'","p_om":"'While' wajjin gocha lamaaniifuu yeroo darbe itti fufaa fayyadami: 'While I was studying, my brother was playing music.' (Osoo ani qo'achaa jiruu, obboleessi koo muuziqaa taphachiisaa ture.) Seenaa keessatti haala jalqabaa ibsa: 'It was a cold morning. People were waiting for the bus…'","ex":[["What were you doing at nine o'clock?","Sa'aatii 3tti maal gochaa turte?","","",0],["I was sleeping when you called.","Yeroo ati bilbiltu ani rafaa ture.","","",0],["She was talking on the phone while she was driving.","Isheen osoo konkolaataa oofaa jirtuu bilbilaan dubbachaa turte.","","",0],["We weren't watching TV; we were studying.","Nuti televiziyoona ilaalaa hin turre; qo'achaa turre.","","",0],["It was raining when we left the house.","Yeroo nuti mana keessaa baane roobaa ture.","","",0],["While the teacher was explaining, the students were taking notes.","Osoo barsiisaan ibsaa jiruu, barattoonni yaadannoo qabachaa turan.","","",0]]}]},{"id":"present_perfect","en":"Present perfect","om":"Yeroo ammaa raawwatame","icon":"✅","level":2,"summary_en":"have/has + past participle for results now, experiences (ever/never), and unfinished time (for/since).","summary_om":"have/has + unka raawwatame bu'aa ammaaf, muuxannoof (ever/never) fi yeroo hin xumuramneef (for/since).","sections":[{"h_en":"Form: have / has + past participle","h_om":"Unka: have / has + unka raawwatame (V3)","p_en":"Make it with have/has + the past participle (V3): 'I have eaten.' 'She has finished.' Short forms: I've, he's, we've. Negative: haven't / hasn't. Question: 'Have you eaten?' The closest Oromo form is the -eera ending: 'Nyaadheera.' (I have eaten.)","p_om":"Have/has + unka raawwatame (V3) fayyadamii uumi: 'I have eaten.' 'She has finished.' Unka gabaabaa: I've, he's, we've. Dhabamsa: haven't / hasn't. Gaaffii: 'Have you eaten?' Unki Afaan Oromoo isatti dhiyaatu dhuma -eera qaba: 'Nyaadheera.' (I have eaten.)","table":{"head":["English","Afaan Oromoo"],"rows":[["I have eaten.","Ani nyaadheera."],["You have eaten.","Ati nyaatteetta."],["He has eaten.","Inni nyaateera."],["She has eaten.","Isheen nyaatteetti."],["We have eaten.","Nuti nyaanneerra."],["You (pl.) have eaten.","Isin nyaattaniittu."],["They have eaten.","Isaan nyaataniiru."]]}},{"h_en":"A past action with a result now: just, already, yet","h_om":"Gocha darbe bu'aa amma qabu: just, already, yet","p_en":"Use it when the past action matters now: 'I've lost my key' (so I can't open the door now). 'She has watered the garden' (it's wet now). Often with: just = a moment ago (amma, ammuma); already = sooner than expected (duraanuu); yet = until now, in questions and negatives (ammallee, hanga ammaatti): 'Have you eaten yet?' (Nyaatteettaa?) 'I haven't finished yet.' (Ammallee hin xumurre.)","p_om":"Gochi darbe yeroo amma barbaachisaa ta'u fayyadami: 'I've lost my key' (kanaaf amma balbala banuu hin danda'u). 'She has watered the garden' (amma jiidhaadha). Yeroo baay'ee kanneen wajjin dhufa: just = amma, ammuma; already = duraanuu (hamma eegame dura); yet = hanga ammaatti, gaaffii fi dhabamsa keessatti (ammallee): 'Have you eaten yet?' (Nyaatteettaa?) 'I haven't finished yet.' (Ammallee hin xumurre.)"},{"h_en":"Experience: ever, never, been / gone","h_om":"Muuxannoo: ever, never, been / gone","p_en":"Use it for life experience when the time is not important: 'Have you ever been to Harar?' 'I've never seen snow.' Afaan Oromoo says this with -ee beekuu: 'Harar deemtee beektaa?' 'Ani cabbii argee hin beeku.' Note: 'He has been to Harar' = he went and came back; 'He has gone to Harar' = he is there now.","p_om":"Muuxannoo jireenyaa yeroon isaa barbaachisaa hin taaneef fayyadami: 'Have you ever been to Harar?' 'I've never seen snow.' Afaan Oromoo kana -ee beekuun ibsa: 'Harar deemtee beektaa?' 'Ani cabbii argee hin beeku.' Hubachiisa: 'He has been to Harar' = deemee deebi'eera; 'He has gone to Harar' = amma achi jira."},{"h_en":"Unfinished time: for, since, how long","h_om":"Yeroo hin xumuramne: for, since, how long","p_en":"Use the present perfect for a situation that started in the past and is still true: 'I have lived here for five years / since 2019.' Afaan Oromoo uses the PRESENT for this: 'Erga bara 2019 as asitti jiraadha.' Translating directly gives the mistake 'I live here since 2019'. for + a period (for two hours, for a week, for ten years); since + a starting point (since Monday, since 8 o'clock, since I was a child).","p_om":"Haala yeroo darbe jalqabee ammas itti fufaa jiruuf yeroo ammaa raawwatame fayyadami: 'I have lived here for five years / since 2019.' Afaan Oromoo kanaaf yeroo AMMAA fayyadama: 'Erga bara 2019 as asitti jiraadha.' Kallattiin yoo hiikte dogoggora 'I live here since 2019' uuma. for + dheerina yeroo (for two hours, for a week, for ten years); since + yeroo jalqabaa (since Monday, since 8 o'clock, since I was a child).","table":{"head":["for (dheerina yeroo)","since (yeroo jalqabaa)"],"rows":[["for ten minutes","since 9 o'clock"],["for three days","since Monday"],["for a month","since January"],["for five years","since 2019"],["for a long time","since I was a child"]]}},{"h_en":"Present perfect or past simple?","h_om":"Yeroo ammaa raawwatame moo yeroo darbe salphaa?","p_en":"If you say WHEN it happened (yesterday, last year, in 2010, two days ago, when I was young), use the past simple: 'I saw him yesterday' – not 'I have seen him yesterday'. If the time is not given or is still continuing (today, this week, ever, so far), use the present perfect. Note: in American English the past simple is also common with just, already and yet ('Did you eat yet?').","p_om":"Yoo YEROO itti raawwatame himte (yesterday, last year, in 2010, two days ago, when I was young), yeroo darbe salphaa fayyadami: 'I saw him yesterday' – 'I have seen him yesterday' miti. Yoo yeroon hin kennamne yookiin ammallee itti fufaa jiraate (today, this week, ever, so far), yeroo ammaa raawwatame fayyadami. Hubachiisa: Ingiliffa Ameerikaa keessatti yeroo darbe salphaan just, already fi yet wajjinis ni baay'ata ('Did you eat yet?').","ex":[["I've lost my phone. Have you seen it?","Bilbila koo dhabeera. Argiteettaa?","","",0],["The bus has just left.","Awtobisiin amma ka'e.","","",0],["Have you finished your homework yet? – Not yet.","Hojii manaa kee xumurteettaa? – Ammallee.","","",0],["Have you ever been to Harar? – No, never.","Harar deemtee beektaa? – Lakki, gonkumaa.","","",0],["I've never eaten fish.","Ani qurxummii nyaadhee hin beeku.","","",0],["We have known each other for ten years.","Waggaa kudhaniif wal beekna.","","",1],["She has worked at the hospital since 2018.","Isheen erga bara 2018 as hospitaala sana keessa hojjetti.","","",0],["I saw that film last week.","Fiilmii sana torbee darbe ilaale.","Past time given → past simple.","Yeroon darbe kenname → yeroo darbe salphaa.",0]]}]},{"id":"present_perfect_continuous","en":"Present perfect continuous","om":"Yeroo ammaa raawwatamaa itti fufaa","icon":"⏱️","level":2,"summary_en":"have/has been + -ing for activities that started in the past and are still going on, or have just stopped.","summary_om":"have/has been + -ing gocha yeroo darbe jalqabee ammas itti fufaa jiru yookiin amma dhaabbateef.","sections":[{"h_en":"Form: have / has been + verb-ing","h_om":"Unka: have / has been + gochima-ing","p_en":"Make it with have/has + been + -ing: 'I have been waiting.' 'She has been studying.' Negative: 'I haven't been sleeping well.' Question: 'How long have you been learning English?' Short forms: I've been, she's been.","p_om":"Have/has + been + -ing fayyadamii uumi: 'I have been waiting.' 'She has been studying.' Dhabamsa: 'I haven't been sleeping well.' Gaaffii: 'How long have you been learning English?' Unka gabaabaa: I've been, she's been."},{"h_en":"When we use it","h_om":"Yoom fayyadamna","p_en":"(1) An activity that began in the past and is still going on, with for, since or how long: 'I have been writing this book for five months.' 'We've been playing since four o'clock.' (2) An activity that has just stopped and has a visible result: 'You're wet – have you been running?' 'Her eyes are red; she's been crying.' (3) To complain about something annoying: 'Someone has been using my computer!'","p_om":"(1) Gocha yeroo darbe jalqabee ammas itti fufaa jiru, for, since yookiin how long wajjin: 'I have been writing this book for five months.' 'We've been playing since four o'clock.' (2) Gocha amma dhaabbate kan bu'aan isaa mul'atu: 'You're wet – have you been running?' 'Her eyes are red; she's been crying.' (3) Wanta nama aarsu komachuuf: 'Someone has been using my computer!'"},{"h_en":"Afaan Oromoo uses the continuous present here","h_om":"Asitti Afaan Oromoo yeroo ammaa itti fufaa fayyadama","p_en":"Afaan Oromoo expresses this with the -aa jira form and a time phrase: 'Erga ganamaa as si eegaa jira.' 'Sa'aatii tokko guutuu eegaa jira.' If you translate word for word, you get 'I am waiting for you since morning' – which is wrong in English. When a sentence has for/since/how long and the action is still continuing, use 'have been -ing': 'I have been waiting for you since this morning.'","p_om":"Afaan Oromoo kana unka -aa jira fi jecha yeroo fayyadamee ibsa: 'Erga ganamaa as si eegaa jira.' 'Sa'aatii tokko guutuu eegaa jira.' Jecha jechaan yoo hiikte 'I am waiting for you since morning' argatta – kun Ingiliffa keessatti dogoggora. Himni tokko for/since/how long yoo qabaatee gochichi ammas itti fufaa jiraate, 'have been -ing' fayyadami: 'I have been waiting for you since this morning.'"},{"h_en":"Simple or continuous perfect?","h_om":"Raawwatame salphaa moo itti fufaa?","p_en":"The simple form focuses on the result or the number: 'I've written three letters.' The continuous form focuses on the activity and its length: 'I've been writing letters all morning.' Stative verbs (know, like, have = own, be) stay simple: 'I've known him for years' – not 'I've been knowing'.","p_om":"Unki salphaan bu'aa yookiin baay'ina irratti xiyyeeffata: 'I've written three letters.' Unki itti fufaan gochaa fi dheerina isaa irratti xiyyeeffata: 'I've been writing letters all morning.' Gochimoonni haala ibsan (know, like, have = qabaachuu, be) unka salphaan hafu: 'I've known him for years' – 'I've been knowing' miti.","ex":[["I've been waiting for you for an hour!","Sa'aatii tokko guutuu si eegaa jira!","","",0],["She has been learning English since last year.","Isheen erga bara darbee as Ingiliffa barachaa jirti.","","",0],["How long have you been living in Adama?","Adaamaa keessa jiraachaa yeroo hammamii ta'e?","","",1],["It has been raining all day.","Guyyaa guutuu roobaa jira.","","",0],["You look tired. Have you been working late?","Dadhabde fakkaatta. Halkan dheeraa hojjechaa turteettaa?","","",1],["We've been talking about you.","Waa'ee kee dubbachaa turre.","","",0]]}]},{"id":"past_perfect","en":"Past perfect & past perfect continuous","om":"Yeroo darbe raawwatame fi itti fufaa","icon":"⏪","level":2,"summary_en":"had + past participle for the earlier of two past events, and had been + -ing for duration before a past moment.","summary_om":"had + unka raawwatame taatee yeroo darbe lama keessaa isa duraaf, had been + -ing dheerina yeroo darbe dura tureef.","sections":[{"h_en":"Form: had + past participle","h_om":"Unka: had + unka raawwatame (V3)","p_en":"Make it with had + V3 – the same for every person: 'I had eaten.' 'They had left.' Short form: I'd, she'd. Negative: hadn't. Question: 'Had you met him before?' The Oromo equivalent uses -ee ture: 'Nyaadhee ture.' (I had eaten.) 'Isaan ka'anii turan.' (They had left.)","p_om":"Had + V3 fayyadamii uumi – nama hundaaf tokkuma: 'I had eaten.' 'They had left.' Unka gabaabaa: I'd, she'd. Dhabamsa: hadn't. Gaaffii: 'Had you met him before?' Unki Afaan Oromoo isatti dhiyaatu -ee ture fayyadama: 'Nyaadhee ture.' (I had eaten.) 'Isaan ka'anii turan.' (They had left.)"},{"h_en":"The earlier of two past events","h_om":"Taatee yeroo darbe lama keessaa isa duraa","p_en":"When you talk about the past and want to go back to an even earlier time, use the past perfect for the earlier action: 'When I got to the airport, the plane had taken off.' (Yeroo ani buufata xiyyaaraa ga'u, xiyyaarri ka'ee ture.) Compare: 'When I got there, the plane took off' = it left after I arrived. Common time words: before, after, already, just, by the time, when, until, never.","p_om":"Waa'ee yeroo darbe dubbachaa osoo jirtuu yeroo caalaa duraatti deebi'uu yoo barbaadde, gocha isa duraatiif yeroo darbe raawwatame fayyadami: 'When I got to the airport, the plane had taken off.' (Yeroo ani buufata xiyyaaraa ga'u, xiyyaarri ka'ee ture.) Wal bira qabi: 'When I got there, the plane took off' = erga ani ga'ee booda ka'e. Jechoota yeroo baramoo: before, after, already, just, by the time, when, until, never."},{"h_en":"When it isn't needed","h_om":"Yoom hin barbaachifne","p_en":"If the order is already clear from before or after, the past simple is also fine: 'I ate after I (had) washed my hands.' Don't use the past perfect just because something is 'very past': 'My grandfather was born in 1930' – not 'had been born'.","p_om":"Tartiibni isaa before yookiin after irraa yoo ifa ta'e, yeroo darbe salphaanis sirriidha: 'I ate after I (had) washed my hands.' Wanti tokko 'baay'ee darbe' waan ta'eef qofa yeroo darbe raawwatame hin fayyadamin: 'My grandfather was born in 1930' – 'had been born' miti."},{"h_en":"Past perfect continuous: had been + -ing","h_om":"Yeroo darbe raawwatamaa itti fufaa: had been + -ing","p_en":"Use had been + -ing to stress how long an activity continued before another past moment: 'When she arrived, I had been waiting for two hours.' (Yeroo isheen dhuftu, ani sa'aatii lama guutuu eegaa ture.) 'He was tired because he had been working all night.' Negative: hadn't been; question: 'Had you been waiting long?'","p_om":"Gochi tokko taatee yeroo darbe biraa dura hammam akka itti fufe cimsuuf had been + -ing fayyadami: 'When she arrived, I had been waiting for two hours.' (Yeroo isheen dhuftu, ani sa'aatii lama guutuu eegaa ture.) 'He was tired because he had been working all night.' Dhabamsa: hadn't been; gaaffii: 'Had you been waiting long?'","ex":[["When we reached the cinema, the film had already started.","Yeroo nuti mana fiilmii geenyu, fiilmiin jalqabee ture.","","",0],["I had never seen the sea before I went to Djibouti.","Osoon Jibuutii hin deemin dura galaana argee hin beeku ture.","","",1],["She was happy because she had passed the exam.","Isheen waan qormaata darbiteef gammaddee turte.","","",0],["Had you met him before the wedding?","Cidha sana dura isa argitee turtee?","","",0],["They had been walking for five hours when they found water.","Yeroo bishaan argatan, sa'aatii shan guutuu deemaa turan.","","",0],["By the time the police came, the thief had run away.","Yeroo poolisiin dhufu, hattichi baqatee ture.","","",0]]}]},{"id":"tenses_overview","en":"All 12 tenses at a glance","om":"Yeroowwan 12 walitti qabaa","icon":"🗂️","level":2,"summary_en":"One table for all English tenses, with forms, signal words and the closest Afaan Oromoo forms.","summary_om":"Gabatee tokko yeroowwan Ingiliffaa hundaaf: unka, jechoota mallattoo fi unka Afaan Oromoo itti dhiyaatu.","sections":[{"h_en":"Time and aspect","h_om":"Yeroo fi akkaataa (aspect)","p_en":"A tense is the form of the verb that shows the time of an action. English combines three times (past, present, future) with four aspects: simple (the action as a fact), continuous (in progress: be + -ing), perfect (completed before a point: have + V3) and perfect continuous (in progress up to a point: have been + -ing). 3 × 4 = 12 tenses. Afaan Oromoo has fewer verb forms and uses time words more, so the English system needs practice.","p_om":"Yeroon (tense) unka gochimaa yeroo gochi itti raawwatame agarsiisuudha. Ingiliffi yeroo sadii (darbe, ammaa, dhufu) akkaataa afur wajjin walitti qindeessa: salphaa (gocha akka dhugaatti), itti fufaa (raawwatamaa jiru: be + -ing), raawwatame (qabxii tokko dura xumurame: have + V3) fi raawwatamaa itti fufaa (hanga qabxii tokkootti itti fufe: have been + -ing). 3 × 4 = yeroowwan 12. Afaan Oromoo unka gochimaa xiqqaa qaba, jechoota yeroo caalaatti fayyadama; kanaaf sirni Ingiliffaa kun shaakala barbaada."},{"h_en":"The 12 tenses","h_om":"Yeroowwan 12","p_en":"Each row shows the form, an example and the closest Afaan Oromoo form (the verb 'write' – barreessuu). For the future continuous and future perfect forms, Afaan Oromoo has no exact match; the table gives a natural way to express the same idea.","p_om":"Tarreen hundi unka, fakkeenya fi unka Afaan Oromoo itti dhiyaatu agarsiisa (gochima 'write' – barreessuu). Unka future continuous fi future perfect'f Afaan Oromoo unka sirriitti walsimu hin qabu; gabateen karaa uumamaa yaada sana ittiin ibsinu kenna.","table":{"head":["Tense","Form","Example","Afaan Oromoo"],"rows":[["Present simple","V1 / V1+s","She writes letters.","Isheen xalayaa ni barreessiti."],["Present continuous","am/is/are + -ing","She is writing now.","Isheen amma barreessaa jirti."],["Present perfect","have/has + V3","She has written it.","Isheen barreessiteetti."],["Present perfect continuous","have/has been + -ing","She has been writing since 9.","Isheen erga sa'aatii 3 as barreessaa jirti."],["Past simple","V2","She wrote it yesterday.","Isheen kaleessa barreessite."],["Past continuous","was/were + -ing","She was writing when I came.","Yeroo ani dhufu isheen barreessaa turte."],["Past perfect","had + V3","She had written it before I came.","Osoon hin dhufin dura barreessitee turte."],["Past perfect continuous","had been + -ing","She had been writing for an hour.","Sa'aatii tokko barreessaa turte."],["Future simple","will + V1","She will write tomorrow.","Isheen boru ni barreessiti."],["Future continuous","will be + -ing","She will be writing at 9.","Sa'aatii 3tti barreessaa jirti ta'a."],["Future perfect","will have + V3","She will have written it by Friday.","Jimaata dura ni xumurti."],["Future perfect continuous","will have been + -ing","By June she will have been writing for a year.","Waxabajjii yoo ga'u, erga barreessuu jalqabdee waggaa tokko guutti."]]}},{"h_en":"Negatives and questions","h_om":"Dhabamsaa fi gaaffii","p_en":"In every tense, the FIRST helping verb does the work: add 'not' after it for the negative, and move it before the subject for a question. If there is no helping verb (present and past simple), add do/does/did.","p_om":"Yeroo hunda keessatti gochimni gargaaraa JALQABAA hojii hojjeta: dhabamsaaf isa booda 'not' dabali, gaaffiif immoo raawwataa dura fidi. Gochimni gargaaraa yoo hin jirre (yeroo ammaa fi darbe salphaa), do/does/did dabali.","table":{"head":["Tense","Negative","Question"],"rows":[["Present simple","She doesn't write.","Does she write?"],["Present continuous","She isn't writing.","Is she writing?"],["Present perfect","She hasn't written.","Has she written?"],["Past simple","She didn't write.","Did she write?"],["Past continuous","She wasn't writing.","Was she writing?"],["Past perfect","She hadn't written.","Had she written?"],["Future","She won't write.","Will she write?"]]}},{"h_en":"Signal words","h_om":"Jechoota mallattoo","p_en":"Some time words point to a particular tense.","p_om":"Jechoonni yeroo tokko tokko yeroo (tense) murtaa'e tokko agarsiisu.","table":{"head":["Tense","Signal words"],"rows":[["Present simple","always, usually, often, every day, on Mondays"],["Present continuous","now, right now, at the moment, today, this week"],["Present perfect","ever, never, just, already, yet, so far, for, since"],["Present perfect continuous","for, since, how long, all day, lately"],["Past simple","yesterday, last week, ago, in 2010, when I was young"],["Past continuous","while, when, at 8 o'clock yesterday"],["Past perfect","before, after, already, by the time, never … before"],["Future","tomorrow, next week, soon, in two days, I think"]]}},{"h_en":"How Afaan Oromoo forms map to English","h_om":"Unki Afaan Oromoo akkamitti Ingiliffatti hiikama","p_en":"Use this as a translation guide. ni + verb (nan deema) → present simple OR future (I go / I will go). -aa jira (deemaa jira) → present continuous; with erga…as or a duration → present perfect continuous. Past -e (deeme) → past simple. -aa ture (deemaa ture) → past continuous or 'used to'. -eera (deemeera) → present perfect. -ee beeka / -ee hin beeku → have ever / have never. -ee ture (deemee ture) → past perfect. -uuf jira / -uuf jedha → be going to / be about to.","p_om":"Kana akka qajeelfama hiikkaatti fayyadami. ni + gochima (nan deema) → present simple YOOKIIN future (I go / I will go). -aa jira (deemaa jira) → present continuous; erga…as yookiin dheerina yeroo wajjin → present perfect continuous. Yeroo darbe -e (deeme) → past simple. -aa ture (deemaa ture) → past continuous yookiin 'used to'. -eera (deemeera) → present perfect. -ee beeka / -ee hin beeku → have ever / have never. -ee ture (deemee ture) → past perfect. -uuf jira / -uuf jedha → be going to / be about to.","ex":[["I usually walk, but today I'm taking the bus.","Yeroo baay'ee miilaan deema, har'a garuu awtobisiin deemaa jira.","","",0],["I've lived here since 2020.","Erga bara 2020 as asitti jiraadha.","Oromo present → English present perfect.","Yeroo ammaa Oromoo → present perfect Ingiliffaa.",0],["When I arrived, they had already eaten.","Yeroo ani ga'u isaan nyaatanii turan.","","",0],["She was cooking when the guests came.","Yeroo keessummoonni dhufan isheen nyaata bilcheessaa turte.","","",0],["We'll call you when we get there.","Yeroo achi geenyu siif ni bilbilla.","","",0],["Have you ever eaten kitfo?","Kitfoo nyaattee beektaa?","","",0]]}]},{"id":"adjectives_adverbs","en":"Adjectives & adverbs","om":"Ibsa maqaa fi ibsa gochimaa","icon":"🎨","level":2,"summary_en":"Where adjectives go, their order, -ed vs -ing adjectives, adverbs with -ly, and very / too / enough.","summary_om":"Iddoo ibsa maqaa, tartiiba isaanii, -ed fi -ing, ibsa gochimaa -ly, akkasumas very / too / enough.","sections":[{"h_en":"Adjectives don't change","h_om":"Ibsi maqaa hin jijjiiramu","p_en":"An adjective describes a noun. In English it comes before the noun (a tall man) or after be and verbs like look, feel, seem, smell, taste, sound and become (He is tall; The food smells good). Unlike Afaan Oromoo, English adjectives have no masculine/feminine or plural forms: dheeraa / dheertuu / dhedheeroo are all 'tall' – a tall man, a tall woman, tall people.","p_om":"Ibsi maqaa maqaa ibsa. Ingiliffa keessatti maqaa dura (a tall man), yookiin be fi gochimoota akka look, feel, seem, smell, taste, sound fi become booda dhufa (He is tall; The food smells good). Akka Afaan Oromoo, ibsi maqaa Ingiliffaa unka dhiiraa/dhalaa yookiin baay'inaa hin qabu: dheeraa / dheertuu / dhedheeroo hundi 'tall' – a tall man, a tall woman, tall people."},{"h_en":"Order of adjectives","h_om":"Tartiiba ibsa maqaa","p_en":"When there are several adjectives before a noun, English follows a fixed order. In practice, use two or three at most: 'a beautiful old Ethiopian coffee pot', 'a big black dog', 'a nice new cotton shirt'.","p_om":"Ibsi maqaa hedduun maqaa tokko dura yoo dhufan, Ingiliffi tartiiba murtaa'e hordofa. Hojii irratti lama yookiin sadii qofa fayyadami: 'a beautiful old Ethiopian coffee pot', 'a big black dog', 'a nice new cotton shirt'.","table":{"head":["1 opinion","2 size","3 age","4 shape","5 color","6 origin","7 material","8 purpose","noun"],"rows":[["beautiful","small","old","round","black","Ethiopian","clay","coffee","pot"],["nice","big","new","","white","","cotton","","shirt"]]}},{"h_en":"-ed or -ing?","h_om":"-ed moo -ing?","p_en":"Adjectives ending in -ed describe how a person feels; adjectives ending in -ing describe the thing that causes the feeling: 'I'm bored – this film is boring.' 'She's interested in history – history is interesting.' Saying 'I am boring' means other people find you boring! Pairs: bored/boring, interested/interesting, tired/tiring, excited/exciting, surprised/surprising, confused/confusing, worried/worrying.","p_om":"Ibsi maqaa -ed'n xumuramu akkaataa namni tokko itti dhaga'amu ibsa; kan -ing'n xumuramu immoo wanta miira sana fidu ibsa: 'I'm bored – this film is boring.' 'She's interested in history – history is interesting.' 'I am boring' jechuun namoonni biroo si nuffu jechuudha! Lamaan lamaan: bored/boring, interested/interesting, tired/tiring, excited/exciting, surprised/surprising, confused/confusing, worried/worrying."},{"h_en":"Adverbs of manner: -ly","h_om":"Ibsa gochimaa haalaa: -ly","p_en":"An adverb describes a verb: how something is done. Most are adjective + -ly: slow → slowly, careful → carefully, quiet → quietly, easy → easily, happy → happily. Afaan Oromoo often adds -aan or -tti (saffisaan, sirriitti) or uses suuta. Irregular: good → well; fast, hard, late, early stay the same. Watch out: hardly = almost not; lately = recently. Put the adverb after the verb AND its object: 'She speaks English well' – not 'She speaks well English'. After look/feel/smell/taste use an adjective: 'You look good', 'I feel bad'.","p_om":"Ibsi gochimaa gochima ibsa: wanti tokko akkamitti akka raawwatamu. Baay'een isaanii ibsa maqaa irratti -ly dabaluun uumamu: slow → slowly, careful → carefully, quiet → quietly, easy → easily, happy → happily. Afaan Oromoo yeroo baay'ee -aan yookiin -tti dabala (saffisaan, sirriitti), yookiin suuta fayyadama. Seera hin eegne: good → well; fast, hard, late, early akkuma jiranitti hafu. Of eeggadhu: hardly = gonkumaa jechuun dhiyaata; lately = dhiyeenya. Ibsa gochimaa gochimaa fi raawwatamaa isaa BOODA kaa'i: 'She speaks English well' – 'She speaks well English' miti. Look/feel/smell/taste booda ibsa maqaa fayyadami: 'You look good', 'I feel bad'."},{"h_en":"Very, too, enough, so","h_om":"Very, too, enough, so","p_en":"Afaan Oromoo uses baay'ee for both 'very' and 'too', but English separates them. 'very hot' = baay'ee ho'aa (just a fact); 'too hot' = more than is good or possible: 'The tea is too hot to drink.' 'Enough' comes AFTER an adjective or adverb: 'old enough', 'fast enough' – but before a noun: 'enough money'. 'So' + adjective + that: 'It was so cold that we stayed inside.'","p_om":"Afaan Oromoo 'very' fi 'too' lamaaniifuu baay'ee fayyadama, Ingiliffi garuu adda baasa. 'very hot' = baay'ee ho'aa (dhugaa qofa); 'too hot' = hamma barbaachisuu yookiin danda'amu ol: 'The tea is too hot to drink.' 'Enough' ibsa maqaa yookiin ibsa gochimaa BOODA dhufa: 'old enough', 'fast enough' – maqaa dura garuu: 'enough money'. 'So' + ibsa maqaa + that: 'It was so cold that we stayed inside.'","ex":[["He is a tall man, and she is a tall woman.","Inni nama dheeraadha; isheen immoo dubartii dheertuudha.","English 'tall' doesn't change for gender.","'tall' Ingiliffaa saalaan hin jijjiiramu.",0],["The film was boring, so we were bored.","Fiilmichi nuffisiisaa ture; kanaaf nuffine.","","",0],["She speaks English very well.","Isheen Ingiliffa baay'ee gaariitti dubbatti.","","",0],["Please drive slowly; the road is wet.","Maaloo suuta oofi; daandiin jiidhaadha.","","",0],["This tea is too hot to drink.","Shaayiin kun dhuguuf baay'ee ho'aadha.","","",0],["He isn't old enough to drive.","Inni konkolaataa oofuuf umuriin isaa hin geenye.","","",0],["The food smells good.","Nyaanni urgaa gaarii qaba.","","",0]]}]},{"id":"modals_obligation","en":"Modal verbs 2: must, have to, should, would","om":"Gochima gargaaraa 2: must, have to, should, would","icon":"📏","level":2,"summary_en":"Obligation, prohibition and advice; deduction; offers and polite requests; preferences with would rather / prefer.","summary_om":"Dirqama, dhorkaa fi gorsa; tilmaama mirkanaa'aa; gargaarsa dhiyeessuu fi gaaffii kabajaa; would rather / prefer.","sections":[{"h_en":"Must and have to","h_om":"Must fi have to","p_en":"Both express obligation. 'Must' often shows the speaker's own feeling, and appears in rules and signs: 'I must call my mother.' 'Passengers must wear seat belts.' 'Have to' shows an obligation from outside and is more common in speech: 'I have to work on Saturday.' 'She has to wear a uniform.' 'Must' has no past or future, so use had to and will have to. Afaan Oromoo uses -uu qaba: 'Hojjechuu qaba.'","p_om":"Lamaanuu dirqama ibsu. 'Must' yeroo baay'ee miira dubbataa agarsiisa, seeraa fi mallattoo keessattis mul'ata: 'I must call my mother.' 'Passengers must wear seat belts.' 'Have to' dirqama alaa dhufe agarsiisa, dubbii keessattis caalaatti ni baay'ata: 'I have to work on Saturday.' 'She has to wear a uniform.' 'Must' unka yeroo darbee fi dhufuu hin qabu; kanaaf had to fi will have to fayyadami. Afaan Oromoo -uu qaba fayyadama: 'Hojjechuu qaba.'"},{"h_en":"Mustn't or don't have to? A trap","h_om":"Mustn't moo don't have to? Kiyyoo","p_en":"These look similar but mean very different things. 'You mustn't (must not) smoke here' = it is forbidden. 'You don't have to come' = it is not necessary; you can choose. Be careful: in Afaan Oromoo '…uu hin qabdu' usually means 'must not', so learners say 'You don't have to smoke here' when they mean 'You mustn't'. For 'not necessary', Oromo says '…uun dirqama miti' or 'barbaachisaa miti'.","p_om":"Kunneen walfakkaatu fakkaatu, garuu hiika baay'ee adda qabu. 'You mustn't (must not) smoke here' = dhorkaadha. 'You don't have to come' = barbaachisaa miti; filachuu dandeessa. Of eeggadhu: Afaan Oromoo keessatti '…uu hin qabdu' yeroo baay'ee 'must not' jechuudha; kanaaf barattoonni 'You mustn't' jechuu barbaadanii 'You don't have to smoke here' jedhu. 'Barbaachisaa miti' jechuuf Afaan Oromoo '…uun dirqama miti' yookiin 'barbaachisaa miti' jedha.","table":{"head":["English","Meaning","Afaan Oromoo"],"rows":[["You mustn't park here.","It is forbidden. / Dhorkaadha.","Asitti konkolaataa dhaabuu hin qabdu."],["You don't have to park here.","It isn't necessary. / Dirqama miti.","Asitti dhaabuun dirqama miti."],["You must come.","It is necessary.","Dhufuu qabda."],["You don't have to come.","You can choose.","Dhufuun dirqama miti."]]}},{"h_en":"Advice: should, ought to, had better","h_om":"Gorsa: should, ought to, had better","p_en":"Use should / shouldn't + base verb for advice and opinions: 'You should see a doctor.' 'You shouldn't drive so fast.' 'Ought to' means the same (a little more formal). 'Had better' ('d better) is stronger, a warning: 'You'd better hurry, or you'll miss the bus.' Afaan Oromoo often says this with '-uu qabda' or 'Yoo … wayya' (it's better if…).","p_om":"Gorsaa fi yaadaaf should / shouldn't + gochima bu'uuraa fayyadami: 'You should see a doctor.' 'You shouldn't drive so fast.' 'Ought to' hiikuma tokko qaba (xiqqoo seera qabeessa). 'Had better' ('d better) caalaatti cimaadha, akeekkachiisa: 'You'd better hurry, or you'll miss the bus.' Afaan Oromoo kana yeroo baay'ee '-uu qabda' yookiin 'Yoo … wayya' jechuun ibsa."},{"h_en":"Being sure: must, can't","h_om":"Mirkanaa'uu: must, can't","p_en":"Must and can't are also used for logical conclusions. 'You must be tired after that long trip' = I'm sure you are. 'He can't be at work – it's Sunday' = I'm sure he isn't. About the past: must have / can't have + V3: 'She must have forgotten.'","p_om":"Must fi can't yaada sababaan irra ga'ameefis ni fayyadu. 'You must be tired after that long trip' = akka dadhabde mirkanaa'eera. 'He can't be at work – it's Sunday' = akka achi hin jirre mirkanaa'eera. Yeroo darbeef: must have / can't have + V3: 'She must have forgotten.'"},{"h_en":"Offers and polite requests","h_om":"Gargaarsa dhiyeessuu fi gaaffii kabajaa","p_en":"Offers: 'I'll carry that for you.' 'Shall I open the window?' 'Would you like some tea?' (Note: 'Would you like…?' is an offer; 'Do you like…?' asks about your taste.) 'I'd like…' (= I would like) is a polite 'I want'. Requests become more polite as they get longer.","p_om":"Gargaarsa dhiyeessuu: 'I'll carry that for you.' 'Shall I open the window?' 'Would you like some tea?' (Hubachiisa: 'Would you like…?' waa dhiyeessuudha; 'Do you like…?' immoo waan jaallattu gaafata.) 'I'd like…' (= I would like) jechuun 'I want' kabajaan dubbachuudha. Gaaffiin hamma dheeratuun kabajni isaa dabala.","table":{"head":["Politeness","Request"],"rows":[["direct / kallattii","Open the door."],["neutral","Can you open the door?"],["polite / kabajaa","Could you open the door, please?"],["more polite","Would you mind opening the door?"],["very polite","I was wondering if you could open the door."]]}},{"h_en":"Preferences: would rather, prefer","h_om":"Filannoo: would rather, prefer","p_en":"To say what you prefer: 'I prefer tea to coffee' (in general). 'I'd prefer to walk' / 'I'd rather walk' (now, in this situation) – note: 'would rather' + base verb, no 'to'. Negative: 'I'd rather not go.' Afaan Oromoo uses '… naaf wayya' or 'filadha': 'Bunarra shaayii filadha.'","p_om":"Waan filattu himuuf: 'I prefer tea to coffee' (waliigalaan). 'I'd prefer to walk' / 'I'd rather walk' (amma, haala kana keessatti) – hubachiisa: 'would rather' + gochima bu'uuraa, 'to' malee. Dhabamsa: 'I'd rather not go.' Afaan Oromoo '… naaf wayya' yookiin 'filadha' fayyadama: 'Bunarra shaayii filadha.'","ex":[["I have to work on Saturday.","Sanbata hojjechuu qaba.","","",0],["You mustn't smoke here.","Asitti tamboo xuuxuu hin qabdu.","","",0],["You don't have to come if you're busy.","Yoo hojii qabaatte, dhufuun dirqama miti.","","",0],["We had to wait for two hours.","Sa'aatii lama eeguuf dirqamne.","","",0],["You should see a doctor.","Doktora ilaaluu qabda.","Also: Yoo doktora ilaalte wayya.","Akkasumas: Yoo doktora ilaalte wayya.",0],["Would you like some coffee? – Yes, please.","Buna dhuguu ni barbaaddaa? – Eeyyee, maaloo.","","",0],["Would you mind closing the window?","Maaloo foddaa naaf cufuu dandeessaa?","","",0],["I'd rather stay at home tonight.","Har'a galgala mana turuu naaf wayya.","","",0]]}]},{"id":"gerund_infinitive","en":"Gerund or infinitive?","om":"-ing moo to + gochima?","icon":"🔀","level":2,"summary_en":"When to use the -ing form and when to use to + verb; verbs that change meaning; make/let; purpose 'to'.","summary_om":"Yoom unka -ing, yoom immoo to + gochima fayyadamnu; gochimoota hiika jijjiiran; make/let; 'to' kaayyoof.","sections":[{"h_en":"One Oromo form, two English forms","h_om":"Unka Oromoo tokko, unka Ingiliffaa lama","p_en":"Afaan Oromoo uses the -uu form (dubbisuu, daakuu) as a noun: 'Daakuun fayyaaf gaariidha.' English has two forms: the gerund (-ing: swimming) and the infinitive (to swim). As the subject of a sentence and after a preposition, use -ing: 'Swimming is good for you.' 'I'm good at drawing.' 'Thank you for coming.' 'Before leaving, lock the door.'","p_om":"Afaan Oromoo unka -uu (dubbisuu, daakuu) akka maqaatti fayyadama: 'Daakuun fayyaaf gaariidha.' Ingiliffi unka lama qaba: gerund (-ing: swimming) fi infinitive (to swim). Akka raawwataa himaatti fi durduubee booda -ing fayyadami: 'Swimming is good for you.' 'I'm good at drawing.' 'Thank you for coming.' 'Before leaving, lock the door.'"},{"h_en":"Verbs followed by -ing","h_om":"Gochimoota -ing fudhatan","p_en":"After these verbs use -ing: enjoy, finish, mind, avoid, keep, suggest, practice, consider, miss, imagine, deny, risk, can't stand, give up, look forward to. 'I enjoy reading.' 'Have you finished eating?' 'Would you mind waiting?'","p_om":"Gochimoota kanneen booda -ing fayyadami: enjoy, finish, mind, avoid, keep, suggest, practice, consider, miss, imagine, deny, risk, can't stand, give up, look forward to. 'I enjoy reading.' 'Have you finished eating?' 'Would you mind waiting?'"},{"h_en":"Verbs followed by to + verb","h_om":"Gochimoota to + gochima fudhatan","p_en":"After these verbs use to + base verb: want, need, decide, hope, plan, learn, agree, promise, refuse, would like, forget, afford, manage, expect, offer, seem. 'She decided to study law.' 'I can't afford to buy a car.' 'To' also expresses purpose, like Oromo -uuf: 'I came here to learn English.' (Ingiliffa barachuuf as dhufe.) Don't say 'for to learn' or 'for learn'.","p_om":"Gochimoota kanneen booda to + gochima bu'uuraa fayyadami: want, need, decide, hope, plan, learn, agree, promise, refuse, would like, forget, afford, manage, expect, offer, seem. 'She decided to study law.' 'I can't afford to buy a car.' 'To' kaayyoos ibsa, akka -uuf Afaan Oromoo: 'I came here to learn English.' (Ingiliffa barachuuf as dhufe.) 'for to learn' yookiin 'for learn' hin jedhin."},{"h_en":"Both forms – same or different meaning","h_om":"Unka lamaanuu – hiika tokko yookiin adda","p_en":"Some verbs take both with almost no difference: like, love, hate, start, begin, continue, prefer ('It started raining / to rain'). Others change meaning.","p_om":"Gochimoonni tokko tokko unka lamaanuu fudhatu, garaagarummaan hiikaa hin jiru jechuun ni danda'ama: like, love, hate, start, begin, continue, prefer ('It started raining / to rain'). Kaan immoo hiika jijjiiru.","table":{"head":["Verb","+ -ing","+ to + verb"],"rows":[["stop","He stopped smoking. (quit – dhiise)","He stopped to smoke. (in order to – xuuxuuf dhaabbate)"],["remember","I remember meeting her. (memory of the past)","Remember to lock the door. (don't forget)"],["forget","I'll never forget visiting Harar. (past event)","Don't forget to call me. (a task)"],["try","Try adding salt. (as an experiment)","I tried to open it. (made an effort)"]]}},{"h_en":"Verb + person + to; make and let","h_om":"Gochima + nama + to; make fi let","p_en":"With want, ask, tell, help, expect, allow, advise: verb + person + to + verb: 'I want you to help me.' (Akka ati na gargaartu nan barbaada.) 'She asked me to wait.' Not 'I want that you help me'. With make (force) and let (allow), use the base verb without 'to': 'My father made me clean the car.' 'Let me help you.'","p_om":"Want, ask, tell, help, expect, allow, advise wajjin: gochima + nama + to + gochima: 'I want you to help me.' (Akka ati na gargaartu nan barbaada.) 'She asked me to wait.' 'I want that you help me' miti. Make (dirqisiisuu) fi let (hayyamuu) wajjin 'to' malee gochima bu'uuraa fayyadami: 'My father made me clean the car.' 'Let me help you.'","ex":[["I enjoy reading novels.","Asoosama dubbisuu nan jaalladha.","","",0],["Swimming is good exercise.","Daakuun sochii qaamaa gaariidha.","","",0],["She decided to study law.","Isheen seera barachuuf murteessite.","","",0],["I came here to learn English.","Ingiliffa barachuuf as dhufe.","","",0],["He stopped smoking last year.","Inni bara darbe tamboo xuuxuu dhiise.","","",0],["We stopped to buy some bread.","Daabboo bitachuuf dhaabbanne.","","",0],["I want you to help me.","Akka ati na gargaartu nan barbaada.","","",0],["Thank you for coming.","Waan dhufteef galatoomi.","","",0]]}]},{"id":"relative_clauses","en":"Relative clauses: who, which, that, where","om":"Hima ibsaa: who, which, that, where","icon":"🧷","level":2,"summary_en":"Describing people, things, p
