negative ends in -ne for every person (hin dhufne). After an infinitive, baachuu means 'not to': yoo dhufuu baatte (if you don't come).","om":"Gochimni 'hin'n haalama (hin beeku); maqaa fi ibsa maqaa booda immoo 'miti' dhufa (barsiisaa miti). Dhabamsi yeroo darbee bamaqaa hundaaf -ne dhaan xumurama (hin dhufne). 'Baachuu' maqaa gochimaa booda 'not to' jechuudha: yoo dhufuu baatte. Afaan Ingiliffaa keessatti 'not', 'don't', 'didn't' fayyadamna."}},"items":[["I don't know him.","Isa hin beeku.","","",0],["He isn't my brother.","Inni obboleessa koo miti.","","",0],["That's not true.","Sun dhugaa miti.","","",0],["It didn't rain yesterday.","Kaleessa hin roobne.","","",0],["They didn't come.","Isaan hin dhufne.","","",0],["She isn't at home.","Isheen mana hin jirtu.","","",0],["We don't want it.","Hin barbaannu.","","",0],["I'm not hungry.","Beela hin qabu.","","",0],["I don't have any money.","Maallaqa hin qabu.","Also: Qarshii hin qabu.","Akkasumas: Qarshii hin qabu.",0],["There's nothing.","Homaa hin jiru.","","",0],["Nobody came.","Namni tokkollee hin dhufne.","","",0],["Not now.","Amma miti.","","",0],["No, thank you.","Lakki, galatoomi.","","",0],["If you don't come, let me know.","Yoo dhufuu baatte natti himi.","","",0],["If he doesn't call, we'll leave.","Yoo inni bilbiluu baate, ni deemna.","","",0]]},{"id":"commands","en":"Commands & instructions","om":"Ajaja fi qajeelfama","icon":"📢","group":"basics","intros":{"rwb":{"en":"Commands to one person usually end in -i or -u (deemi, nyaadhu); to several people, or to someone you respect, they end in -aa (deemaa, nyaadhaa). Negative commands use hin ... -in (plural -inaa): hin deemin. 'Let's' and 'let him/her' use haa: Haa deemnu. English commands have one form for everyone (Go!); adding 'please' makes them polite.","om":"Ajajni nama tokkoof -i ykn -u (deemi, nyaadhu), namoota baay'ee ykn nama kabajamaaf -aa (deemaa, nyaadhaa) dhaan xumurama. Ajajni dhabamsaa 'hin ... -in' (baay'inaaf -inaa): hin deemin. 'Let's' fi 'let him' 'haa'n ibsamu: Haa deemnu. Afaan Ingiliffaa keessatti ajajni unka tokko qaba (Go!); 'please' dabaluun kabaja agarsiisa."}},"items":[["Come here.","As koottu.","Respect/plural: As koottaa. koottu is irregular (from dhufuu).","Kabajaaf/baay'inaaf: As koottaa. 'koottu' unka ajajaa addaa gochima dhufuuti.",0],["Go.","Deemi.","Respect/plural: Deemaa.","Kabajaaf/baay'inaaf: Deemaa.",0],["Sit down.","Taa'i.","Respect/plural: Taa'aa.","Kabajaaf/baay'inaaf: Taa'aa.",0],["Stand up. / Get up.","Ka'i.","Respect/plural: Ka'aa.","Kabajaaf/baay'inaaf: Ka'aa.",0],["Stop!","Dhaabbadhu!","Respect/plural: Dhaabbadhaa!","Kabajaaf/baay'inaaf: Dhaabbadhaa!",0],["Wait a moment.","Xiqqoo eegi.","Respect/plural: Xiqqoo eegaa.","Kabajaaf/baay'inaaf: Xiqqoo eegaa.",0],["Listen.","Dhaggeeffadhu.","Respect/plural: Dhaggeeffadhaa.","Kabajaaf/baay'inaaf: Dhaggeeffadhaa.",0],["Come quickly.","Dafii koottu.","Respect/plural: Dafaa koottaa.","Kabajaaf/baay'inaaf: Dafaa koottaa.",0],["Come back.","Deebi'i.","Respect/plural: Deebi'aa.","Kabajaaf/baay'inaaf: Deebi'aa.",0],["Give me that.","Sana naa kenni.","Respect/plural: Sana naa kennaa.","Kabajaaf/baay'inaaf: Sana naa kennaa.",0],["Bring it here.","As fidi.","Respect/plural: As fidaa.","Kabajaaf/baay'inaaf: As fidaa.",0],["Tell me.","Natti himi.","Respect/plural: Natti himaa.","Kabajaaf/baay'inaaf: Natti himaa.",0],["Follow me.","Na duukaa bu'i.","Respect/plural: Na duukaa bu'aa.","Kabajaaf/baay'inaaf: Na duukaa bu'aa.",0],["Be quiet.","Callisi.","Respect/plural: Callisaa.","Kabajaaf/baay'inaaf: Callisaa.",0],["Calm down.","Tasgabbaa'i.","Respect/plural: Tasgabbaa'aa.","Kabajaaf/baay'inaaf: Tasgabbaa'aa.",0],["Don't go.","Hin deemin.","Respect/plural: Hin deeminaa.","Kabajaaf/baay'inaaf: Hin deeminaa.",0],["Don't touch it.","Hin tuqin.","Respect/plural: Hin tuqinaa.","Kabajaaf/baay'inaaf: Hin tuqinaa.",0],["Don't be late.","Hin turin.","Respect/plural: Hin turinaa.","Kabajaaf/baay'inaaf: Hin turinaa.",0],["Don't move!","Hin sochoo'in!","Respect/plural: Hin sochoo'inaa!","Kabajaaf/baay'inaaf: Hin sochoo'inaa!",0],["Keep it short.","Haasaa kee gabaabsi.","","",0],["Let's go.","Haa deemnu.","haa + verb = let's / let him / let her.","'haa' + gochima = 'let's / let him / let her'.",0],["Let him come.","Inni haa dhufu.","","",0],["Let her sleep.","Isheen haa raftu.","","",0]]},{"id":"possession","en":"Mine & yours","om":"Kan koo, kan kee","icon":"🔑","group":"basics","intros":{"rwb":{"en":"Possessives follow the noun: mana koo (my house), mana kee (your house), mana isaa/ishee (his/her house), mana keenya (our house). 'Mine', 'yours' etc. use kan: kan koo, kan kee. Many speakers say kiyya instead of koo.","om":"Abbummaa ibsuuf bamaqaan maqaa booda dhufa: mana koo, mana kee, mana isaa/ishee, mana keenya. 'Mine, yours' ibsuuf 'kan' fayyadami: kan koo, kan kee. Afaan Ingiliffaa keessatti my/your maqaa dura, mine/yours immoo kophaa dhufu."}},"items":[["This is mine.","Kun kan kooti.","Also: Kun kan kiyya.","Akkasumas: Kun kan kiyya.",0],["This is yours.","Kun kan keeti.","Respect/plural: Kun kan keessanii.","Kabajaaf/baay'inaaf: Kun kan keessanii.",1],["Whose is this?","Kun kan eenyuuti?","","",0],["It's his.","Kan isaati.","","",0],["It's hers.","Kan isheeti.","","",0],["It's theirs.","Kan isaaniiti.","","",0],["These books are ours.","Kitaabonni kun kan keenya.","","",0],["Is this your money?","Kun maallaqa keetii?","","",0],["Our house is far.","Manni keenya fagoodha.","","",0],["Her brother is at home.","Obboleessi ishee mana jira.","","",0],["He is my friend.","Inni hiriyaa kooti.","","",0],["She is my sister.","Isheen obboleettii kooti.","","",0],["They are our friends.","Isaan hiriyoota keenya.","","",0]]},{"id":"counting","en":"Numbers in use","om":"Lakkoofsa itti fayyadamuu","icon":"🔢","group":"basics","intros":{"rwb":{"en":"Numbers 11–19 are kudha + unit (kudha tokko), and tens take -ii before a unit (digdamii shan = 25). Ordinals add -ffaa (tokkoffaa, lammaffaa). Use meeqa for 'how many' and prices, and hammam for amounts.","om":"Lakkoofsi 11–19 'kudha' fi lakkoofsa tokkee walitti qabata (kudha tokko); kurnoonni lakkoofsa duratti -ii fudhatu (digdamii shan = 25). Lakkoofsi tartiibaa -ffaa dabalata (tokkoffaa, lammaffaa). 'Meeqa' lakkoofsaa fi gatiif, 'hammam' immoo baay'inaaf fayyadami."}},"items":[["How many?","Meeqa?","","",0],["Count from one to ten.","Tokko irraa hanga kudhanitti lakkaa'i.","","",0],["How many students are in fourth grade?","Kutaa afraffaa keessa barattoonni meeqa jiru?","","",0],["There are twenty-five people here.","Namoonni digdamii shan as jiru.","","",0],["My daughter is eleven.","Umriin intala kootii waggaa kudha tokko.","","",0],["One hundred and fifty birr.","Qarshii dhibba tokkoo fi shantama.","","",0],["About two thousand people came.","Namoonni gara kuma lamaa dhufan.","","",0],["The house costs one million birr.","Gatiin mana kanaa qarshii miliyoona tokko.","","",0],["He came first.","Inni tokkoffaa dhufe.","","",0],["This is my second visit.","Kun dhufaatii koo lammaffaa.","","",0],["Give me half.","Walakkaa naa kenni.","","",0],["I called you twice.","Si'a lama siif bilbileera.","","",0],["How many times?","Si'a meeqa?","","",0],["Divide it in two.","Bakka lamatti qoodi.","","",0]]},{"id":"time","en":"Times, schedules and being late","om":"Yeroo, sagantaa fi turuu","icon":"⏰","group":"daily","intros":{"pse":{"en":"Ethiopian time counts the hours from sunrise, so 7 a.m. is sa'aatii tokko (1 o'clock) and noon is sa'aatii jaha (6). Always check which system someone means. In the US punctuality matters a lot: if you will be late, call or text ahead and give a short reason.","om":"Sa'aatiin Itoophiyaa ba'iinsa aduutii lakkaa'ama: 7:00 a.m. = sa'aatii tokko, walakkaa guyyaa = sa'aatii jaha. Kanaafuu yeroo hunda sirna kamiin akka jedhame gaafadhu. Ameerikaatti yeroo eeguun baay'ee barbaachisaadha; yoo turte, dursitee bilbili ykn ergaa ergi, sababa gabaabaas kenni."},"rwb":{"en":"Oromo has single words for the days around today: dheengadda (day before yesterday), kaleessa, har'a, boru, iftaan (day after tomorrow), plus eda (last night). The weekdays are Wiixata, Qibxata, Roobii, Kamiisa, Jimaata, Sanbata, Dilbata. In English, use 'on' before days: on Saturday.","om":"Afaan Oromoo guyyoota har'a naannoo jiraniif jecha tokkoon qaba: dheengadda, kaleessa, har'a, boru, iftaan, akkasumas eda (halkan darbe). Guyyoonni torbanii: Wiixata, Qibxata, Roobii, Kamiisa, Jimaata, Sanbata, Dilbata. Afaan Ingiliffaa keessatti guyyaa dura 'on' dhufa: on Saturday."}},"items":[["What time is it?","Sa'aatii meeqa?","","",0],["What time does the meeting start?","Walgahiin sa'aatii meeqatti jalqaba?","","",0],["It starts at 9 a.m.","Ganama sa'aatii sadiitti jalqaba.","9 a.m. (European time) = sa'aatii 3 ganamaa in Ethiopian time.","9 a.m. sa'aatii Awrooppaa = sa'aatii 3 ganamaa sa'aatii Itoophiyaatiin.",0],["What time does it finish?","Sa'aatii meeqatti xumurama?","","",0],["It ends around noon.","Naannoo walakkaa guyyaatti xumurama.","","",0],["When does the store open?","Suuqiin yoom banama?","","",0],["It's open from 8 a.m. to 6 p.m.","Sa'aatii 2 ganamaa hanga sa'aatii 12 galgalaatti banaadha.","Given here in Ethiopian time (2 = 8 a.m., 12 = 6 p.m.).","",0],["Is that Ethiopian time or European time?","Kun sa'aatii Itoophiyaatiin moo sa'aatii Awrooppaatiin?","","",0],["How long does it take?","Yeroo hangamii fudhata?","","",0],["Let's start on time.","Yeroo isaatti haa jalqabnu.","","",0],["Don't be late!","Hin turin!","Respect/plural: Hin turinaa!","",0],["I'll be there on time.","Yerootti achitti nan argama.","","",0],["I'm on my way.","Karaa irran jira.","","",0],["We're running late.","Yeroon nu darbaa jira.","","",0],["I'll be about ten minutes late.","Daqiiqaa kudhan qofa nan tura.","","",0],["Sorry I'm late.","Waanan tureef dhiifama.","","",0],["I got stuck in traffic.","Tiraafikiin na qabe.","","",0],["The bus didn't come on time.","Awtobusiin yeroo isaatti hin dhufne.","","",0],["I overslept.","Hirriibni na fudhate.","","",0],["I lost track of time.","Yeroon akka darbe hin hubanne.","","",0],["Something came up at the last minute.","Dhuma irratti dhimmi tasaa na mudate.","","",0],["What day is it today?","Har'a guyyaa kami?","","",0],["Today is Monday.","Har'a Wiixata.","","",0],["What's the date today?","Har'a guyyaa meeqa?","","",0],["I'll come on Saturday.","Sanbata nan dhufa.","Also: Gaafa Sanbataa nan dhufa.","Akkasumas: Gaafa Sanbataa nan dhufa.",0],["I came yesterday.","Kaleessa dhufe.","","",0],["He came the day before yesterday.","Inni dheengadda dhufe.","","",0],["We're leaving the day after tomorrow.","Nuti iftaan ni deemna.","","",0],["Come early in the morning.","Ganama barii koottu.","","",0],["I'll come tonight.","Har'a halkan nan dhufa.","","",0],["He came last night.","Inni eda dhufe.","","",0],["Last week I was in Finfinnee.","Torbaan darbe Finfinnee ture.","","",0],["I'll be back next week.","Torbaan dhufu nan deebi'a.","","",0],["Which day will you come?","Guyyaa kam dhufta?","","",0],["Will you come today or tomorrow?","Har'a moo boru dhufta?","","",0],["I drink coffee every day.","Guyyaa guyyaan buna nan dhuga.","","",0],["We meet once a week.","Torbaanitti al tokko wal agarra.","","",0],["I'll be back in a little while.","Xiqqoo booda nan deebi'a.","","",0]]},{"id":"food","en":"Talking about food","om":"Waa'ee nyaataa haasa'uu","icon":"🍲","group":"daily","intros":{"pse":{"en":"Food is a friendly topic in both cultures. Ethiopian hosts keep urging guests to eat more and may feed them by hand (gursha) as a sign of love; American hosts usually offer once or twice, and 'No thanks, I'm full' is simply accepted. Complimenting the cook is always welcome.","om":"Nyaanni aadaa lamaan keessattuu dubbii jaalalaati. Itoophiyaatti keessummeessaan keessummaa 'nyaadhu, nyaadhu' jechuun ni dhiibbaasa, jaalalaafis ni gursha; Ameerikaatti garuu yeroo tokko ykn lama qofa dhiyeessu, 'No thanks, I'm full' jennaanis ni fudhatama. Nama nyaata qopheesse galateeffachuun yeroo hunda gaariidha."},"rwb":{"en":"Meals are often shared from one large plate of injera (biddeena), and hosts keep offering more — say Quufeera (I'm full) politely, more than once if needed. Many people fast on certain days (no meat or dairy), so ask before offering. Koottu nyaadhu! ('Come and eat!') is a real invitation, often said even to passers-by.","om":"Nyaanni yeroo baay'ee saanii guddaa tokko irraa biddeenaan waliin nyaatama; abbaan manaa itti dabaluu hin dhaabu — 'Quufeera' jedhii safuun himi, yoo barbaachise irra deebi'ii. Namoonni hedduun guyyoota murtaa'an irratti soomu (foon fi aannan hin nyaatan), kanaaf dura gaafadhu. 'Koottu nyaadhu!' affeerraa dhugaati."}},"items":[["I'm hungry.","Beela'eera.","","",0],["I'm thirsty.","Dheebodheera.","Also: Dheebuun na qabe.","",0],["I'm full.","Quufeera.","","",0],["What's for dinner?","Irbaataaf maaltu jira?","","",0],["Come, let's eat together.","Koottu, waliin haa nyaannu.","Respect/plural: Koottaa, waliin haa nyaannu.","",0],["Help yourself!","Fedhii keetiin fudhadhu!","","",0],["Try some of this.","Mee kana dhandhami.","","",0],["This is delicious!","Kun baay'ee mi'aawaadha!","","",0],["It tastes like chicken.","Akka foon lukkuu mi'aawa.","","",0],["It's too salty.","Soogiddi itti baay'ateera.","Also: Soogiddi baay'ate.","",0],["Would you like some more?","Dabalataa barbaaddaa?","","",0],["Just a little, please.","Xiqqoo qofa, maaloo.","","",0],["No more for me, thanks.","Galatoomi, ana gaheera.","","",0],["I don't eat meat.","Ani foon hin nyaadhu.","","",0],["I'm fasting.","Soomaan jira.","Orthodox Christians fast from animal products on many days; Muslims fast in Ramadan. Also: Soomaa jira.","",0],["What's your favorite food?","Nyaanni ati caalaatti jaallattu maali?","","",0],["I love injera with shiro.","Biddeena shiroo waliin baay'een jaalladha.","Also: buddeena (injera).","",0],["Who made this? It's amazing!","Kana eenyutu qopheesse? Baay'ee mi'aawaadha!","","",0],["Come and eat!","Koottu nyaadhu!","Respect/plural: Koottaa nyaadhaa!","Kabajaaf/baay'inaaf: Koottaa nyaadhaa!",0],["Are you hungry?","Beela qabdaa?","","",0],["The food is delicious.","Nyaanni mi'aawaadha.","","",0],["It tastes good.","Ni mi'aawa.","","",0],["The food is hot.","Nyaanni ho'aadha.","","",0],["The tea has no sugar.","Shaayiin sukkaara hin qabu.","","",0],["What would you like to drink?","Maal dhuguu barbaadda?","","",0],["More stew, please.","Maaloo, ittoo naaf dabali.","","",0],["Please pass the injera.","Maaloo, biddeena naaf dabarsi.","biddeena = injera. Also: buddeena.","Akkasumas: buddeena.",0],["I don't drink alcohol.","Dhugaatii alkoolii hin dhugu.","","",0],["Is the food ready?","Nyaanni qophaa'eeraa?","","",0],["Let's have lunch together.","Laaqana wajjin haa nyaannu.","","",0],["Wash your hands before you eat.","Utuu hin nyaatin harka dhiqadhu.","","",0],["The bill, please.","Maaloo, herrega naaf fidi.","","",0]]},{"id":"confused","en":"Not understanding, repeating and 'I don't know'","om":"Hubachuu dhabuu, irra deebi'uu fi 'Hin beeku'","icon":"❓","group":"daily","intros":{"pse":{"en":"It is normal—and polite—to ask people to repeat or explain in English; nodding when you don't understand causes bigger problems later. 'Sorry?' or 'Pardon?' with rising intonation means 'Please say that again'; a bare 'What?' can sound rude. There are also many ways to say 'I don't know', from neutral ('I'm not sure') to very casual ('Beats me').","om":"Ingiliffaan akka irra deebi'amu ykn akka ibsamu gaafachuun baratamaa fi kabajaadha; osoo hin hubatin mataa sochoosuun booda rakkoo guddaa fida. 'Sorry?' ykn 'Pardon?' sagalee ol ka'aan jechuun 'irra deebi'i' jechuudha; 'What?' qofti safuu dhabummaa fakkaachuu danda'a. 'Hin beeku' jechuufis karaa baay'eetu jira: 'I'm not sure' irraa kaasee hanga 'Beats me' (salphaa) tti."},"rwb":{"en":"Learners are warmly encouraged — saying Suuta suutaan barachaa jira ('I'm learning slowly') usually earns a smile and patience. Naaf hin galle (lit. 'it didn't reach me') is the everyday way to say 'I don't understand'. To learn a new word, ask ... akkamitti jedhama? ('How do you say ...?').","om":"Barattoonni afaanii jajjabeeffamu — 'Suuta suutaan barachaa jira' jechuun yeroo baay'ee obsa si argamsiisa. 'Naaf hin galle' jechuun 'I don't understand' jechuudha. Jecha haaraa baruuf '... akkamitti jedhama?' jedhii gaafadhu; Afaan Ingiliffaatiin 'How do you say ...?' jedhama."}},"items":[["Sorry? / Pardon?","Dhiifama, maal jette?","Respect/plural: Dhiifama, maal jettan?","",0],["Could you say that again, please?","Maaloo irra deebi'ii jechuu dandeessaa?","","",0],["Could you speak more slowly?","Suuta jettee dubbachuu dandeessaa?","","",0],["I didn't catch that.","Sirriitti hin dhageenye.","","",0],["I don't understand.","Naaf hin galle.","","",0],["I'm confused.","Dubbiin kun na burjaajeesse.","Also: Wal na jalaa makeera.","",1],["I can't make sense of this.","Kana hubachuu hin dandeenye.","","",0],["It's over my head.","Kun hubannaa koo ol.","Means: too difficult for me to understand.","",0],["What do you mean?","Maal jechuu kee?","","",0],["What does 'fragile' mean?","'Fragile' jechuun maal jechuudha?","","",0],["How do you spell that?","Akkamitti barreeffama?","","",0],["How do you say 'thank you' in Oromo?","'Thank you' Afaan Oromootiin akkamitti jedhama?","","",0],["Could you explain that a bit more?","Xiqqoo caalaatti ibsuu dandeessaa?","","",0],["Can you give me an example?","Fakkeenya naaf kennuu dandeessaa?","","",0],["So what you're saying is...","Kanaafuu waan ati jechaa jirtu...","","",0],["Is that clear?","Ifaadhaa?","","",0],["Got it. / I see.","Naaf gale.","","",0],["I don't know.","Hin beeku.","","",0],["I have no idea.","Homaa hin beeku.","","",0],["I'm not sure.","Sirriitti hin beeku.","","",0],["Beats me.","Dhuguma hin beeku.","Very informal.","",0],["Your guess is as good as mine.","Anis akkuma kee hin beeku.","","",0],["Let me think about it.","Mee itti haa yaadu.","","",0],["I'll find out for you.","Gaafadhee sitti hima.","","",0],["Do you speak Afaan Oromoo?","Afaan Oromoo ni dubbattaa?","Respect/plural: Afaan Oromoo ni dubbattuu?","Kabajaaf/baay'inaaf: Afaan Oromoo ni dubbattuu?",0],["Do you speak English?","Afaan Ingiliffaa ni dubbattaa?","","",0],["I speak a little Oromo.","Afaan Oromoo xiqqoo nan dubbadha.","","",0],["I'm learning slowly.","Suuta suutaan barachaa jira.","","",0],["I understand.","Naaf galeera.","","",0],["Do you understand?","Siif galeeraa?","Respect/plural: Isiniif galeeraa?","Kabajaaf/baay'inaaf: Isiniif galeeraa?",0],["Please speak slowly.","Maaloo, suuta dubbadhu.","Respect/plural: Maaloo, suuta dubbadhaa.","Kabajaaf/baay'inaaf: Maaloo, suuta dubbadhaa.",0],["You speak very fast.","Baay'ee daftee dubbatta.","","",0],["Please repeat that.","Maaloo, irra deebi'i.","Respect/plural: Maaloo, irra deebi'aa.","Kabajaaf/baay'inaaf: Maaloo, irra deebi'aa.",0],["Speak louder, please.","Maaloo, sagalee ol kaasii dubbadhu.","","",0],["What did you say?","Maal jette?","Respect/plural: Maal jettan?","Kabajaaf/baay'inaaf: Maal jettan?",0],["What does 'bareedaa' mean?","'Bareedaa' jechuun maal jechuudha?","","",0],["What's this called in Oromo?","Kun Afaan Oromootiin maal jedhama?","","",0],["Please write it down for me.","Maaloo, naaf barreessi.","","",0],["I forgot.","Irraanfadhe.","Also: Dagadhe.","Akkasumas: Dagadhe.",0]]},{"id":"questions","en":"Asking questions and getting information","om":"Gaaffii gaafachuu fi odeeffannoo argachuu","icon":"🔍","group":"daily","intros":{"pse":{"en":"English questions usually need a helper verb (do, does, did, is, can): 'Where do you live?', not 'Where you live?'. Oromo builds questions with question words (maal, eenyu, eessa, yoom, akkam, meeqa, hangam) and intonation. 'How + adjective' questions ask for measurements: How tall? How far? How long?","om":"Gaaffiin Ingiliffaa yeroo baay'ee gochima gargaaraa (do, does, did, is, can) barbaada: 'Where do you live?' — 'Where you live?' miti. Afaan Oromoo gaaffii jechoota gaaffii (maal, eenyu, eessa, yoom, akkam, meeqa, hangam) fi sagaleen ijaara. 'How' + ibsa maqaa safara gaafata: How tall? How far? How long?"},"rwb":{"en":"Question words usually come right before the verb: Eessa deemta? (Where are you going?), Yoom dhufta? (When are you coming?). Use eenyu for people and names, maal for things, and add -tu to a questioned subject: Eenyutu dhufe? (Who came?). In English the question word comes first in the sentence.","om":"Jechi gaaffii yeroo baay'ee gochima dura dhufa: Eessa deemta? Yoom dhufta? Namaa fi maqaaf 'eenyu', wantaaf 'maal' fayyadami; raawwataa gaafatamuuf '-tu' dabali: Eenyutu dhufe? Afaan Ingiliffaa keessatti jechi gaaffii hima jalqaba dhufa: Where are you going?"}},"items":[["Who is that man?","Namichi sun eenyu?","","",0],["What is this?","Kun maali?","","",0],["What's this called in English?","Kun Ingiliffaan maal jedhama?","","",0],["Where do you work?","Eessa hojjatta?","","",0],["When is your birthday?","Guyyaan dhaloota keetii yoom?","","",0],["Why are you late?","Maaliif turte?","","",0],["Which bus should I take?","Awtobusii kam fudhachuu qaba?","","",0],["Whose bag is this?","Boorsaan kun kan eenyuuti?","","",0],["How do you make coffee?","Buna akkamitti qopheessita?","","",0],["How much does it cost?","Gatiin isaa meeqa?","","",0],["How many students are in the class?","Daree keessa barattoonni meeqa jiru?","","",0],["How often do you play football?","Torbanitti yeroo meeqa kubbaa miilaa taphatta?","Oromo asks 'how many times a week'.","",0],["How long have you been here?","Asitti yeroo hangamiif turte?","","",0],["How far is the airport?","Buufanni xiyyaaraa hangam fagaata?","","",0],["How tall are you?","Dheerinni kee hangam?","","",0],["What kind of music do you like?","Muuziqaa gosa akkamii jaallatta?","","",0],["What's the weather like?","Qilleensi akkam jira?","","",0],["May I ask a question?","Gaaffii tokko gaafachuu danda'aa?","","",0],["Can you tell me where the library is?","Manni kitaabaa eessa akka jiru natti himuu dandeessaa?","","",0],["Do you know if the bank is open?","Baankiin banaa ta'uu isaa beektaa?","","",0],["Is there a bus to Nekemte?","Awtobusiin gara Naqamteetti deemu jiraa?","","",0],["What is that?","Sun maali?","","",0],["Who is that?","Sun eenyu?","","",0],["Who are you?","Ati eenyu?","Respect/plural: Isin eenyu?","Kabajaaf/baay'inaaf: Isin eenyu?",0],["Where is it?","Eessa jira?","For a feminine noun: Eessa jirti?","Maqaa dhalaatiif: Eessa jirti?",0],["Where are you going?","Eessa deemta?","Respect/plural: Eessa deemtu? Also: Garam deemta?","Kabajaaf/baay'inaaf: Eessa deemtu? Akkasumas: Garam deemta?",0],["Where are you coming from?","Eessaa dhufta?","","",0],["When will you come?","Yoom dhufta?","","",0],["Why?","Maaliif?","","",0],["How was it?","Akkam ture?","","",0],["Which one?","Isa kam?","For a feminine noun: Ishee kam?","Maqaa dhalaatiif: Ishee kam?",0],["Which school do you go to?","Mana barumsaa kamitti barattaa?","","",0],["How many oranges did you buy?","Burtukaana meeqa bitte?","","",0],["How much water do you need?","Bishaan hammam barbaadda?","hammam = how much (amount); meeqa = how many / what price.","'hammam' baay'inaaf, 'meeqa' lakkoofsaa fi gatiif.",0],["How long does it take?","Yeroo hammam fudhata?","","",0],["What happened?","Maaltu ta'e?","","",0],["What's the matter with you?","Maal taate?","Respect/plural: Maal taatan?","Kabajaaf/baay'inaaf: Maal taatan?",0],["What do you want?","Maal barbaadda?","Respect/plural: Maal barbaaddu?","Kabajaaf/baay'inaaf: Maal barbaaddu?",0],["Who did this?","Kana eenyutu godhe?","","",0],["Who answered the question?","Gaaffii eenyutu deebise?","","",0]]},{"id":"changes","en":"Talking about change","om":"Jijjiirama ibsuu","icon":"📈","group":"daily","intros":{"pse":{"en":"To describe change, English uses verbs like go up, go down, get better and get worse, often in the present continuous ('Prices are rising'). Oromo uses verbs such as dabaluu (increase), hir'achuu (decrease), fooyya'uu (improve) and hammaachuu (get worse), with -aa jira for change that is still happening: Gatiin dabalaa jira.","om":"Jijjiirama ibsuuf Ingiliffaan gochimoota akka go up, go down, get better, get worse fayyadamu, yeroo baay'ee yeroo ammaa itti fufaatiin ('Prices are rising'). Afaan Oromootiin dabaluu, hir'achuu, fooyya'uu fi hammaachuu fayyadamna; jijjiirama ammallee itti fufaaf -aa jira: 'Gatiin dabalaa jira.'"}},"items":[["Prices are going up.","Gatiin dabalaa jira.","","",0],["The price of teff has gone down.","Gatiin xaafii gad bu'eera.","","",0],["Things are getting better.","Wanti hundi fooyya'aa jira.","","",0],["The situation is getting worse.","Haalli hammaachaa jira.","","",0],["It's getting colder.","Qilleensi qabbanaa'aa jira.","","",0],["The days are getting shorter.","Guyyoonni gabaabbachaa jiru.","","",0],["My English is improving.","Ingiliffaan koo fooyya'aa jira.","","",0],["More and more people use smartphones.","Namoonni bilbila ismaartii fayyadaman guyyaa guyyaan dabalaa jiru.","","",0],["Unemployment is a growing problem.","Hojii dhabdummaan rakkoo dabalaa jiruudha.","","",0],["A lot has changed in the city.","Magaalaa keessatti wanti baay'een jijjiirameera.","","",0],["He's not the same anymore.","Inni akka duraa miti.","","",0],["Times have changed.","Yeroon jijjiirameera.","","",0],["Nothing has changed.","Homtuu hin jijjiiramne.","","",0]]},{"id":"hurry","en":"Hurrying and waiting","om":"Ariifachuu fi eeguu","icon":"⏳","group":"daily","intros":{"pse":{"en":"'Hurry up!' is direct and fine with friends; with others say 'We need to hurry' or 'Could you be quick, please?'. To ask someone to wait, 'Just a moment' or 'Hang on a second' are common. In Oromo, Ariifadhu! (hurry) and Xiqqoo eegi! (wait a little) are the basics; add maaloo to be polite.","om":"'Hurry up!' kallattiidha, hiriyootaaf ni ta'a; namoota biroof 'We need to hurry' ykn 'Could you be quick, please?' jedhi. Akka namni eegu gaafachuuf 'Just a moment' ykn 'Hang on a second' baratamoodha. Afaan Oromootiin 'Ariifadhu!' fi 'Xiqqoo eegi!' bu'uuradha; kabajaaf 'maaloo' dabali."}},"items":[["Hurry up!","Ariifadhu!","Respect/plural: Ariifadhaa!","",0],["We need to hurry.","Ariifachuu qabna.","","",0],["Come quickly!","Dafii kottu!","","",0],["Let's go, we're late!","Haa deemnu, yeroon nu darbeera!","","",0],["Get a move on!","Socho'i!","Informal.","",0],["We don't have much time.","Yeroo baay'ee hin qabnu.","","",0],["There's no rush. Take your time.","Ariifachuun hin barbaachisu. Suuta jedhi.","","",0],["Slow down!","Suuta deemi!","","",0],["Wait a minute.","Xiqqoo eegi.","Respect/plural: Xiqqoo eegaa.","",0],["Just a moment, please.","Maaloo daqiiqaa tokko.","","",0],["Hang on a second.","Mee xiqqoo turi.","","",0],["Wait for me!","Na eegi!","","",0],["Please wait here.","Maaloo asitti eegi.","","",0],["I'll be right back.","Amma deebi'ee dhufa.","","",0]]},{"id":"likes","en":"Likes, dislikes and preferences","om":"Jaallachuu, jibbuu fi filachuu","icon":"👍","group":"daily","intros":{"pse":{"en":"English grades liking: I love > I really like > I like > I don't mind > I don't really like > I hate. 'Hate' is strong; 'I'm not a big fan of...' is a gentle way to say you dislike something. For preferences use 'I prefer X to Y' or 'I'd rather...'. Oromo uses jaallachuu (like), jibbuu (hate) and caalchisuu or filachuu (prefer).","om":"Ingiliffaan jaallachuu sadarkaan ibsu: I love > I really like > I like > I don't mind > I don't really like > I hate. 'Hate' cimaadha; 'I'm not a big fan of...' laaffisee jibbuu ibsa. Filannoof 'I prefer X to Y' ykn 'I'd rather...' jedhi. Afaan Oromootiin jaallachuu, jibbuu fi caalchisuu/filachuu fayyadamna."},"rwb":{"en":"Jaallachuu covers both 'like' and 'love', and barbaaduu means 'want' (Eastern speakers also use fedhuu). To say you prefer something, Oromo says it is 'better for you': Shaayii na wayya (I prefer tea). In questions, moo means 'or': Shaayii moo buna?","om":"'Jaallachuu' 'like' fi 'love' lamaanuu ibsa; 'barbaaduu' immoo 'want' (Bahaa: fedhuu). Filannoo ibsuuf 'na wayya' jedhama: Shaayii na wayya. Gaaffii keessatti 'moo' = 'or': Shaayii moo buna?"}},"items":[["I like coffee.","Buna nan jaalladha.","","",0],["I love music.","Muuziqaa baay'een jaalladha.","","",0],["I'm really into football.","Kubbaa miilaatiif fedhii guddaa qaba.","","",0],["I enjoy cooking.","Nyaata qopheessuun na gammachiisa.","","",0],["What do you like doing in your free time?","Yeroo boqonnaa kee maal gochuu jaallatta?","","",0],["My favorite color is blue.","Halluun ani caalaatti jaalladhu cuquliisa.","","",0],["I don't like spicy food.","Nyaata barbaree baay'ee qabu hin jaalladhu.","","",0],["I'm not a big fan of horror movies.","Fiilmii sodaachisaa baay'ee hin jaalladhu.","","",0],["It's not my cup of tea.","Kun waan ani jaalladhu miti.","Idiom: not something I enjoy.","",0],["I hate waiting.","Eeguu nan jibba.","","",0],["I can't stand the noise.","Sagalee kana obsuu hin danda'u.","","",0],["Which do you prefer, tea or coffee?","Shaayii fi buna keessaa kam caalchifta?","","",0],["I prefer tea to coffee.","Buna caalaa shaayii nan jaalladha.","","",0],["I'd rather stay home tonight.","Har'a galgala mana turuu nan filadha.","","",0],["I don't mind.","Anaaf tokkuma.","","",0],["I really like it.","Baay'een jaalladha.","","",0],["I don't like it.","Hin jaalladhu.","","",0],["Do you like Oromo food?","Nyaata Oromoo ni jaallattaa?","","",0],["What do you like?","Maal jaallatta?","","",0],["I want water.","Bishaan barbaada.","Also: Bishaan nan fedha. (Eastern)","Akkasumas: Bishaan nan fedha. (Bahaa)",0],["I don't want anything.","Homaa hin barbaadu.","","",0],["I want to go home.","Mana galuun barbaada.","","",0],["I prefer tea.","Shaayii na wayya.","Lit. 'Tea is better for me.'","Afaan Ingiliffaatiin 'I prefer tea' jedhama.",0],["Which do you prefer?","Kam si wayya?","","",0],["It's my favorite.","Kun filannoo kooti.","","",0],["My favorite color is green.","Halluun ani jaalladhu magariisa.","","",0],["I like playing football.","Kubbaa miilaa taphachuu nan jaalladha.","","",0],["I like this place.","Bakki kun natti tola.","","",0]]},{"id":"ability","en":"Ability: can, easy and difficult","om":"Dandeettii: danda'uu, salphaa fi ulfaataa","icon":"🧠","group":"daily","intros":{"pse":{"en":"Use 'can' for ability now ('I can swim'), 'could' for the past ('I could read at four'), and 'be able to' for other tenses ('I'll be able to come'). Oromo uses danda'uu: Nan danda'a (I can), Hin danda'u (I can't). English also has colorful ways to call something easy ('a piece of cake') or hard ('easier said than done').","om":"Dandeettii ammaaf 'can' ('I can swim'), kan darbeef 'could' ('I could read at four'), yeroo biroof ammoo 'be able to' ('I'll be able to come') fayyadami. Afaan Oromootiin danda'uu: 'Nan danda'a', 'Hin danda'u'. Ingiliffaan waan salphaa ('a piece of cake') fi waan ulfaataa ('easier said than done') ibsuuf jechamoota bareedoo qaba."},"rwb":{"en":"Danda'uu means 'can / be able to', while beekuu ('know') is used for learned skills like driving or writing. Ni danda'amaa? asks whether something is possible at all. Both follow an infinitive: Fiiguu dandeessaa? (Can you run?).","om":"'Danda'uu' = 'can'; 'beekuu' immoo ogummaa baratamaaf (konkolaataa oofuu, barreessuu) oola. 'Ni danda'amaa?' wanti tokko danda'amaa moo hin danda'amu gaafata. Lamaanuu maqaa gochimaa booda dhufu: Fiiguu dandeessaa? Afaan Ingiliffaa keessatti 'can' gochima dura dhufa: Can you run?"}},"items":[["Can you swim?","Daakuu ni dandeessaa?","","",0],["I can drive.","Konkolaataa oofuu nan danda'a.","","",0],["I can't sing at all.","Faarfachuu homaa hin danda'u.","","",0],["I speak a little English.","Ingiliffaa xiqqoo nan dubbadha.","","",0],["I could read when I was four.","Yeroo waggaa afurii ture dubbisuu nan danda'a ture.","","",0],["Will you be able to come?","Dhufuu ni dandeessaa?","","",0],["I'm good at math.","Herrega keessatti cimaadha.","","",0],["I'm not very good at cooking.","Nyaata qopheessuu keessatti baay'ee hin cimu.","","",0],["It's easy.","Salphaadha.","","",0],["It's a piece of cake.","Baay'ee salphaadha.","Idiom: very easy.","",0],["Anyone can do it.","Namni kamiyyuu hojjachuu danda'a.","","",0],["I could do it with my eyes closed.","Ija cufadhee hojjachuu nan danda'a.","","",0],["It's hard.","Ulfaataadha.","Also: Cimaadha.","",0],["It's really complicated.","Baay'ee walxaxaadha.","","",0],["It's easier said than done.","Dubbachuun salphaa, hojjachuun ulfaataadha.","","",0],["I tried, but I couldn't do it.","Yaaleera, garuu hin dandeenye.","","",0],["I can.","Nan danda'a.","","",0],["I can't.","Hin danda'u.","","",0],["Can you run?","Fiiguu dandeessaa?","Respect/plural: Fiiguu dandeessuu?","Kabajaaf/baay'inaaf: Fiiguu dandeessuu?",0],["Can you drive?","Konkolaataa oofuu dandeessaa?","","",0],["Do you know how to write Oromo?","Afaan Oromoo barreessuu beektaa?","beekuu (know how) for learned skills; danda'uu for ability.","'beekuu' ogummaa baratamaaf; 'danda'uu' dandeettiif.",0],["Yes, I can read and write it.","Eeyyee, dubbisuus barreessuus nan danda'a.","","",0],["Can you cook?","Nyaata bilcheessuu beektaa?","","",0],["She can't swim.","Isheen daakuu hin dandeessu.","","",0],["I can't come today.","Har'a dhufuu hin danda'u.","","",0],["Is it possible?","Ni danda'amaa?","","",0],["It's possible.","Ni danda'ama.","","",0],["It's impossible.","Hin danda'amu.","","",0],["I'll try.","Nan yaala.","","",0]]},{"id":"linking","en":"Linking ideas and adding information","om":"Yaada walitti hidhuu fi odeeffannoo dabaluu","icon":"🔗","group":"daily","intros":{"pse":{"en":"Linking words make your English sound fluent: and, but, so, because, also, however, although. Oromo equivalents include fi (and), garuu (but), kanaafuu (so), waan ...-eef (because), kana malees (besides) and haa ta'u malee (however). Note that Oromo often puts the reason first: Waanan dhukkubsadheef hin dhufne ('Because I was sick, I didn't come').","om":"Jechoonni walqabsiistuun Ingiliffaa kee qajeelaa godhu: and, but, so, because, also, however, although. Afaan Oromootiin: fi, garuu, kanaafuu, waan ...-eef, kana malees, haa ta'u malee. Afaan Oromoo yeroo baay'ee sababa dursa: 'Waanan dhukkubsadheef hin dhufne.'"}},"items":[["I like tea and coffee.","Shaayii fi buna nan jaalladha.","","",0],["It's cheap but good.","Gatiin isaa salphaa, garuu gaariidha.","","",0],["I was tired, so I went to bed.","Dadhabee ture; kanaafuu rafe.","","",0],["I didn't come because I was sick.","Waanan dhukkubsadheef hin dhufne.","","",0],["In addition, we need more chairs.","Kana irratti dabalees, teessoo dabalataa barbaanna.","","",0],["On top of that, it started to rain.","Kana malees, roobni roobuu jalqabe.","","",0],["However, the plan didn't work.","Haa ta'u malee, karoorri sun hin milkoofne.","","",0],["Although it was raining, we went out.","Roobaa ture ta'us, ala baane.","","",0],["Either tea or coffee is fine.","Shaayii ykn buna, kamiyyuu ni ta'a.","","",0],["Neither he nor she came.","Inni hin dhufne, isheenis hin dhufne.","","",0],["Not only is it cheap, it's also good.","Gatiin isaa salphaa qofa osoo hin taane, gaariis.","","",0],["As soon as I got home, I called you.","Akkuman mana gaheen siif bilbile.","","",0],["If it rains, we'll stay home.","Yoo roobe, mana turra.","","",0],["Unless you hurry, you'll miss the bus.","Yoo hin ariifatin, awtobusiin si darba.","","",0]]},{"id":"describing","en":"Describing people, things and age","om":"Namoota, wantoota fi umurii ibsuu","icon":"🖼️","group":"daily","intros":{"pse":{"en":"English uses 'be' + adjective ('She's tall') and 'have' for features ('He has curly hair'). 'What's she like?' asks about personality; 'What does she look like?' asks about appearance. In Oromo the adjective follows the noun (nama dheeraa = a tall person), and many adjectives have a female form (dheertuu). Asking an adult's age is normal in Ethiopia but can be impolite in the US.","om":"Ingiliffaan 'be' + ibsa maqaa ('She's tall') fi 'have' ('He has curly hair') fayyadamu. 'What's she like?' amala gaafata; 'What does she look like?' ammoo bifa gaafata. Afaan Oromootiin ibsi maqaa maqaa booda dhufa (nama dheeraa), baay'een isaanii bifa dhalaa qabu (dheertuu). Umurii nama ga'eessaa gaafachuun Itoophiyaatti baratamaadha, Ameerikaatti garuu safuu dhabummaa ta'uu danda'a."},"rwb":{"en":"Most describing words change for gender and number: dheeraa (tall, male), dheertuu (female), dhedheeroo (plural, with the first syllable repeated). The copula -dha is attached: Inni dheeraadha. In English, comments on someone's weight can be rude; compliments are always safer.","om":"Jechoonni ibsa hedduun korniyaa fi baay'inaan jijjiiramu: dheeraa (dhiira), dheertuu (dubartii), dhedheeroo (baay'ina). '-dha' jecha irratti maxxanfama: Inni dheeraadha. Afaan Ingiliffaa keessatti ulfaatina nama tokkoo dubbachuun safuu cabsuu danda'a; galateeffannaan garuu yeroo hunda nagaadha."}},"items":[["What does she look like?","Isheen maal fakkaatti?","","",0],["She's tall, with long hair.","Isheen dheertuudha, rifeensa dheeraa qabdi.","","",0],["He's short and a bit heavy.","Inni gabaabaa fi xiqqoo furdaadha.","","",0],["What's he like?","Amalli isaa akkam?","Asks about personality.","",0],["He's very kind.","Inni nama gaarii fi garaa laafaadha.","","",0],["She's very talkative.","Isheen baay'ee haasofti.","","",0],["He's a bit shy.","Inni xiqqoo qaana'a.","","",0],["She's really smart.","Isheen baay'ee cimtuudha.","","",0],["What color is your car?","Konkolaataan kee halluu maalii?","","",0],["How big is the house?","Manni sun hangam guddaa?","","",0],["It's an old wooden box.","Saanduqa mukaa moofaadha.","","",0],["How old are you?","Umuriin kee meeqa?","Can be impolite to ask adults in the US.","",0],["I'm twenty-five.","Waggaa digdamii shan.","","",0],["She's in her thirties.","Umuriin ishee soddomaa fi afurtama gidduu.","","",0],["He's older than me.","Inni umuriin ana caala.","","",0],["She looks young for her age.","Umurii isheetiin yoo ilaalamu, dargaggeettii fakkaatti.","","",0],["Act your age!","Akka umurii keetti ta'i!","Said to an adult behaving childishly.","",0],["He is tall.","Inni dheeraadha.","","",0],["She is tall.","Isheen dheertuudha.","","",0],["They are tall.","Isaan dhedheeroodha.","","",0],["He is short.","Inni gabaabaadha.","To/about a woman: Isheen gabaabduudha.","Dubartiif: Isheen gabaabduudha.",0],["He is thin.","Inni qal'aadha.","Also: qallaa.","Akkasumas: qallaa.",1],["He is fat.","Inni furdaadha.","To/about a woman: Isheen furdoodha.","Dubartiif: Isheen furdoodha.",1],["She is beautiful.","Isheen bareedduudha.","","",0],["He is handsome.","Inni bareedaadha.","","",0],["He is brown-skinned.","Inni magaalaadha.","","",0],["She has long hair.","Rifeensi ishee dheeraadha.","","",0],["He is an elder.","Inni maanguddoodha.","","",0],["She is still young.","Isheen ammallee xiqqoodha.","","",0],["He is strong.","Inni jabaadha.","","",0],["What does he look like?","Inni maal fakkaata?","","",0],["He looks like his father.","Inni abbaa isaa fakkaata.","","",0]]},{"id":"tv","en":"TV and entertainment","om":"Televizhinii fi bashannana","icon":"📺","group":"daily","intros":{"pse":{"en":"TV shows and streaming series are a big part of American small talk ('Did you watch...?'), and 'binge-watching' a whole series is common. Useful words: channel, remote, episode, series, the news, commercials (ads). Never reveal the ending of a show someone hasn't seen—that's a 'spoiler'.","om":"Sagantaaleen televizhinii fi seeriin Ameerikaatti haasaa salphaa keessatti baay'ee ka'u ('Did you watch...?'). Jechoota gargaaran: channel, remote, episode, series, the news, commercials. Nama hin ilaalin xumura sagantaa itti hin himin — sun 'spoiler' jedhama."}},"items":[["What's on TV tonight?","Har'a galgala televizhinii irra maaltu jira?","","",0],["Let's watch the news.","Oduu haa ilaallu.","","",0],["Can I change the channel?","Chaanaala jijjiiruu danda'aa?","","",0],["Where's the remote?","Riimootiin eessa?","","",0],["Turn it up, please.","Maaloo sagalee isaa ol kaasi.","","",0],["Turn off the TV.","Televizhinicha cufi.","","",0],["I love this show.","Sagantaa kana baay'een jaalladha.","","",0],["This show is boring.","Sagantaan kun nama nuffisiisa.","","",0],["There are too many ads.","Beeksisni baay'ateera.","","",0],["Is this a rerun?","Kun irra deebidhaa?","","",0],["Have you seen the new series?","Seerii haaraa ilaalteettaa?","","",0],["Don't tell me how it ends!","Akkamitti akka xumuramu natti hin himin!","","",0]]},{"id":"sports","en":"Sports and the gym","om":"Ispoortii fi jiimii","icon":"🏃","group":"daily","intros":{"pse":{"en":"At an American gym a trainer may ask about your fitness goals and how often you can work out. Common phrases: work out (exercise), get in shape, warm up, a set of ten. 'Football' in Ethiopia means soccer; in the US 'football' is American football, so say 'soccer'.","om":"Jiimii Ameerikaa keessatti leenjisaan kaayyoo kee fi torbanitti yeroo meeqa shaakaluu akka dandeessu si gaafata. Jechoota baratamoo: work out, get in shape, warm up. Itoophiyaatti 'football' kubbaa miilaati; Ameerikaatti garuu 'football' taphicha Ameerikaati, kanaafuu kubbaa miilaatiin 'soccer' jedhi."},"rwb":{"en":"Football is the most popular sport, and Ethiopia's long-distance runners — many of them Oromo — are famous worldwide. Mo'uu means 'to win' and mo'amuu 'to lose (be beaten)'. Haa taphannu! means 'Let's play!'","om":"Kubbaan miilaa ispoortii hunda caalaa jaallatama; fiigdonni fageenya dheeraa Itoophiyaa — kanneen hedduun Oromoo — addunyaa irratti beekamoodha. 'Mo'uu' = 'win', 'mo'amuu' = 'lose'. 'Haa taphannu!' jechuun 'Let's play!' jechuudha."}},"items":[["I want to get in shape.","Qaama koo cimsuu barbaada.","","",0],["How often do you work out?","Torbanitti yeroo meeqa sochii qaamaa hojjatta?","","",0],["I go to the gym three times a week.","Torbanitti yeroo sadii jiimii deema.","","",0],["I haven't exercised in a long time.","Yeroo dheeraaf sochii qaamaa hin hojjanne.","","",0],["Let's start with a warm-up.","Qaama ho'isuun haa jalqabnu.","","",0],["I like running.","Fiiguu nan jaalladha.","","",0],["I'm out of breath.","Hafuura baafachuu dadhabe.","","",0],["My muscles are sore.","Maashaan koo na dhukkuba.","","",1],["Don't overdo it.","Of hin dadhabsiisin.","","",0],["Which team do you support?","Garee kam deeggarta?","","",0],["Who won the game?","Taphicha eenyutu mo'ate?","","",0],["It was a draw.","Walqixa ba'an.","","",0],["Do you want to play basketball with us?","Baasketboolii nu waliin taphachuu barbaaddaa?","","",0],["Do you play football?","Kubbaa miilaa ni taphattaa?","","",0],["I watch football.","Kubbaa miilaa nan daawwadha.","","",0],["Who's playing?","Eenyutu taphata?","","",0],["Who won?","Eenyutu mo'e?","","",0],["We won!","Nuti moone!","","",1],["We lost.","Mo'amne.","","",0],["The score is two to one.","Bu'aan lama tokko.","","",0],["Let's play.","Haa taphannu.","","",0],["Let's go running.","Fiiguuf haa deemnu.","","",0],["I'm tired; I ran a lot.","Dadhabeera; baay'een fiige.","","",0],["Ethiopian runners are famous.","Fiigdonni Itoophiyaa beekamoodha.","","",0]]},{"id":"everyday","en":"Everyday expressions","om":"Jechamoota guyyaa guyyaa","icon":"💬","group":"daily","intros":{"pse":{"en":"These short expressions come up constantly in spoken English. Many have no word-for-word Oromo equivalent, so learn them as whole chunks. Watch your tone: 'Never mind' and 'Whatever' can sound dismissive if said sharply.","om":"Jechamoonni gabaabaan kun haasaa Ingiliffaa keessatti yeroo hunda dhaga'amu. Baay'een isaanii jecha jechaan hiika Afaan Oromoo hin qaban; kanaafuu akkuma jiranitti bari. Sagalee kee eeggadhu: 'Never mind' fi 'Whatever' cimsitee yoo jette tuffii fakkaachuu danda'u."}},"items":[["Really?","Dhugaa?","","",0],["You're kidding!","Qoosaa jirta!","","",0],["Just kidding.","Qoosaan.","","",0],["That makes sense.","Sun ni gala.","","",0],["Sounds good.","Gaarii fakkaata.","","",0],["Good idea!","Yaada gaarii!","","",0],["Of course.","Eeyyee, dhugumaan.","","",0],["Never mind.","Dhiisi, homaa miti.","","",0],["It's up to you.","Murtiin kan keeti.","","",0],["Me too.","Anis.","","",0],["I'm ready.","Qophaa'eera.","","",0],["I'm coming!","Dhufaa jira!","","",0],["Let's go!","Haa deemnu!","","",0],["Come here.","As kottu.","Respect/plural: As kottaa.","",0],["What's going on?","Maaltu ta'aa jira?","","",0],["I have no choice.","Filannoo hin qabu.","","",0],["Where's the restroom?","Manni fincaanii eessa?","In the US say 'restroom' or 'bathroom' rather than 'toilet'.","",0]]},{"id":"family","en":"Family","om":"Maatii","icon":"👨‍👩‍👧","group":"daily","intros":{"rwb":{"en":"Oromo family words are precise: adeera (father's brother) vs eessuma (mother's brother), adaadaa (father's sister) vs haboo (mother's sister). The firstborn (angafa) and the youngest (quxisuu) have their own words and roles. In English, 'uncle' and 'aunt' cover both sides of the family.","om":"Jechoonni maatii Oromoo addaan baasaadha: adeera (obboleessa abbaa) fi eessuma (obboleessa haadhaa), adaadaa (obboleettii abbaa) fi haboo (obboleettii haadhaa). Angafaa fi quxisuun jecha fi gahee addaa qabu. Afaan Ingiliffaa keessatti 'uncle' fi 'aunt' gama abbaa fi haadhaa lamaanuuf tajaajilu."}},"items":[["Do you have children?","Ijoollee qabdaa?","Respect/plural: Ijoollee qabduu?","Kabajaaf/baay'inaaf: Ijoollee qabduu?",0],["Yes, I have three children.","Eeyyee, ijoollee sadii qaba.","","",0],["How many brothers and sisters do you have?","Obboloota meeqa qabda?","obboloota = siblings (brothers and sisters).","'obboloota' obboleeyyanii fi obboleettota lamaanuu ibsa.",0],["I have two brothers and one sister.","Obboleeyyan lama fi obboleettii tokko qaba.","","",0],["I don't have a brother.","Obboleessa hin qabu.","","",0],["Is your husband at home?","Abbaan manaa kee mana jiraa?","","",0],["Is your wife there?","Haati manaa kee jirtii?","","",0],["How is your mother?","Haati kee akkam jirti?","Respect/plural: Haati keessan akkam jirti?","Kabajaaf/baay'inaaf: Haati keessan akkam jirti?",0],["My father's name is Adam.","Maqaan abbaa koo Aadami.","","",0],["My mother is Amina.","Haati koo Aaminaadha.","","",0],["My eldest is called Gutu.","Angafni koo Guutuu jedhama.","","",0],["My youngest is called Hawi.","Quxisuun koo Hawwii jedhamti.","","",1],["My uncle loves me.","Adeerri koo na jaallata.","adeera = father's brother; eessuma = mother's brother.","adeera = obboleessa abbaa; eessuma = obboleessa haadhaa.",0],["She is my aunt.","Isheen haboo kooti.","haboo = mother's sister; adaadaa = father's sister.","haboo = obboleettii haadhaa; adaadaa = obboleettii abbaa.",0],["He is my brother-in-law.","Inni soddaa kooti.","soddaa covers in-laws in general.","'soddaa' firoota gaa'elaan dhufan hunda ibsa.",0],["Whose child is this?","Kun mucaa eenyuuti?","","",0],["She is Abdi's daughter.","Isheen intala Abdiiti.","","",0],["Give my regards to your family.","Maatii keetiin nagaa naaf jedhi.","","",1]]},{"id":"home","en":"At home","om":"Mana keessatti","icon":"🏠","group":"daily","intros":{"rwb":{"en":"Household instructions are simple commands: Balbala cufi (close the door), Ibsaa dhaamsi (turn off the light). Note the different verbs: you ibsuu a lamp but qabsiisuu a fire, and you dhaamsuu both. English uses 'turn on/off' for lights and 'light/put out' for fires.","om":"Ajajni mana keessaa salphaadha: Balbala cufi, Ibsaa dhaamsi. Gochimoota garaagaraa hubadhu: ibsaa 'ibsuu', ibidda immoo 'qabsiisuu'; lamaanuu 'dhaamsuu'. Afaan Ingiliffaa keessatti ibsaaf 'turn on/off', ibiddaaf 'light/put out' fayyadamna."}},"items":[["Open the door.","Balbala bani.","Respect/plural: Balbala banaa. Also: hulaa instead of balbala (Eastern)","Kabajaaf/baay'inaaf: Balbala banaa. Akkasumas: 'hulaa' bakka 'balbala' (Bahaa)",0],["Close the door.","Balbala cufi.","Respect/plural: Balbala cufaa.","Kabajaaf/baay'inaaf: Balbala cufaa.",0],["Lock the door.","Balbala furtuun cufi.","","",0],["Turn on the light.","Ibsaa ibsi.","","",0],["Turn off the light.","Ibsaa dhaamsi.","","",0],["Light the fire.","Ibidda qabsiisi.","","",0],["Put out the fire.","Ibidda dhaamsi.","","",0],["There's no electricity.","Ibsaan hin jiru.","","",0],["Is there water?","Bishaan jiraa?","","",0],["Wake up early.","Barii ka'i.","","",0],["Go to bed on time.","Yeroon rafi.","","",0],["I'm sleepy.","Hirribni na qabeera.","","",0],["Did you sleep well?","Sirriitti rafte?","","",0],["Wash your hands.","Harka dhiqadhu.","Respect/plural: Harka dhiqadhaa.","Kabajaaf/baay'inaaf: Harka dhiqadhaa.",0],["Where is the toilet?","Manni fincaanii eessa jira?","","",0],["Sweep the floor.","Lafa haxaawi.","","",0],["Clean the yard.","Mooraa qulqulleessi.","","",0],["Don't let anyone in.","Nama tokkollee hin seensisin.","","",0]]},{"id":"cooking","en":"Cooking","om":"Nyaata qopheessuu","icon":"🍲","group":"daily","intros":{"rwb":{"en":"Everyday cooking centers on stews (ittoo) made with onions, butter and berbere pepper (barbaree), eaten with injera or bread. Useful verbs: bilcheessuu (cook), danfisuu (boil), waaduu (roast), muruu (cut), dhandhamuu (taste). Commands to one person end in -i (danfisi), to several in -aa (danfisaa).","om":"Nyaanni guyyaa guyyaa ittoo shunkurtaa, dhadhaa fi barbareedhaan qophaa'u irratti hundaa'a; biddeena ykn daabboodhaan nyaatama. Gochimoota barbaachisoo: bilcheessuu, danfisuu, waaduu, muruu, dhandhamuu. Ajajni nama tokkoof -i (danfisi), namoota baay'eef immoo -aa (danfisaa) dhaan xumurama."}},"items":[["Cook the food.","Nyaata bilcheessi.","Also: Nyaata tolchi.","Akkasumas: Nyaata tolchi.",0],["I'm cooking.","Nyaata bilcheessaa jira.","","",0],["Who's cooking lunch today?","Har'a laaqana eenyutu qopheessa?","","",0],["Boil the water.","Bishaan danfisi.","","",0],["The water is boiling.","Bishaan danfaa jira.","","",0],["Cut the onions.","Shunkurtaa muri.","Also: Shunkurtaa ciri.","Akkasumas: Shunkurtaa ciri.",0],["Wash the vegetables.","Kuduraa dhiqi.","kuduraa = vegetables, muduraa = fruit (some books reverse them).","kuduraa = vegetables, muduraa = fruit.",1],["Add salt.","Soogidda itti dabali.","","",0],["Add a little pepper.","Barbaree xiqqoo itti naqi.","","",0],["Taste the stew.","Ittoo dhandhami.","","",0],["Roast the meat.","Foon waadi.","","",0],["The food is cooked.","Nyaanni bilchaateera.","","",0],["This meat is raw.","Foon kun dheedhiidha.","","",0]]},{"id":"ethiopian_time","en":"Ethiopian time & calendar","om":"Sa'aa fi dhaha Itoophiyaa","icon":"🕐","group":"daily","intros":{"rwb":{"en":"Ethiopian time counts the hours from sunrise: 7 a.m. is sa'aa tokko (one o'clock), noon is sa'aa jaha and 6 p.m. is sa'aa kudha lama — add or subtract six hours, and use ganama / waaree booda / galgala / halkan to show the part of the day. The Ethiopian calendar has twelve 30-day months plus a short 13th month, runs about 7–8 years behind the Western calendar, and the new year starts on 11 September (12 September before a leap year). When you make an appointment, always check which clock is meant.","om":"Sa'aan Itoophiyaa ba'iinsa aduu irraa lakkaa'ama: ganama sa'aa 7 Awurooppaa = sa'aa tokko, waaree = sa'aa jaha, galgala sa'aa 6 = sa'aa kudha lama; kanaaf sa'aa jaha dabali ykn hir'isi, 'ganama, waaree booda, galgala, halkan' jechuun kutaa guyyaa ibsi. Dhahni Itoophiyaa ji'oota guyyaa 30 qaban kudha lama fi ji'a gabaabaa 13ffaa qaba; bara Awurooppaa irraa waggaa 7–8 duubatti hafa, barri haaraan Fulbaana 1 (11 Seeptember) jalqaba. Beellama yeroo qabattu sa'aa isa kam akka ta'e mirkaneeffadhu."}},"items":[["What time is it?","Sa'aatiin meeqa?","Also: Sa'aan meeqa?","Akkasumas: Sa'aan meeqa?",0],["It's 7 a.m. (one o'clock Ethiopian).","Ganama sa'aa tokko.","","",0],["It's 10 a.m.","Ganama sa'aa afur.","10 a.m. minus 6 hours = 4.","Sa'aa 10 Awurooppaa irraa 6 hir'isi = 4.",0],["It's noon.","Waaree, sa'aa jaha.","","",0],["It's 3 p.m.","Waaree booda sa'aa sagal.","","",0],["It's 6 p.m.","Galgala sa'aa kudha lama.","","",0],["It's 1 a.m.","Halkan sa'aa torba.","","",0],["It's 8:15 a.m.","Sa'aa lamaa fi ruubii.","ruubii = a quarter (of an hour).","ruubii = kurmaana sa'aa.",0],["It's 8:30 a.m.","Sa'aa lamaa fi walakkaa.","","",0],["It's 8:45 a.m.","Sa'aa sadii ruubiin hir'ata.","","",1],["What time shall we meet?","Sa'aa meeqatti wal agarra?","","",0],["At 8 in the morning (2 o'clock Ethiopian).","Ganama sa'aa lamatti.","","",0],["Ethiopian time or Western time?","Sa'aa Itoophiyaatiin moo sa'aa Awurooppaatiin?","Colloquially Western time is called sa'aa faranjii.","Haasaa idilee keessatti 'sa'aa faranjii' jedhama.",1],["What's the date today in the Ethiopian calendar?","Akka lakkoobsa Itoophiyaatti har'a guyyaa meeqa?","","",1],["The Ethiopian New Year starts in September.","Barri haaraan Itoophiyaa Fulbaana keessa jalqaba.","","",0],["The thirteenth month has five or six days.","Ji'i kudha sadaffaan guyyaa shan ykn jaha qaba.","It is called Qaammee in Oromo (Pagume in Amharic).","Ji'i kun Afaan Oromootiin 'Qaammee' jedhama.",1]]},{"id":"weather","en":"Weather & seasons","om":"Haala qilleensaa","icon":"⛅","group":"daily","intros":{"rwb":{"en":"Oromia has rainy and dry seasons rather than the four Western ones: birraa (Sept–Nov, sunny and flowering), bona (Dec–Feb, dry), arfaasaa (Mar–May, short rains) and ganna (Jun–Aug, main rains); names vary a little by region. Rain matters in a farming society — a good harvest depends on it. English speakers talk about winter, spring, summer and fall.","om":"Oromiyaan yeroo rooba fi gogiinsaa qabdi: birraa (Fulbaana–Sadaasa), bona (Muddee–Guraandhala), arfaasaa (Bitootessa–Caamsaa) fi ganna (Waxabajjii–Hagayya); maqaan naannoodhaan xiqqoo garaagara. Hawaasa qonnaan bulaa keessatti rooba irratti dubbachuun barbaachisaadha — midhaan gaariin rooba irratti hundaa'a. Afaan Ingiliffaa keessatti 'winter, spring, summer, fall' jedhama."}},"items":[["What's the weather like today?","Har'a haalli qilleensaa akkam?","","",0],["It's very hot today.","Har'a baay'ee ho'aadha.","","",0],["It's cold.","Ni qorra.","","",0],["It's raining.","Roobaa jira.","","",0],["The rain has stopped.","Roobni dhaabbateera.","","",0],["It's windy.","Bubbeen jira.","","",0],["It's cloudy.","Duumessi jira.","","",0],["It's foggy this morning.","Ganama kana hurriin jira.","","",0],["The sun is burning hot.","Aduun nama gubdi.","","",0],["What a beautiful day!","Guyyaa bareedaa!","","",0],["The rainy season has started.","Ganni seeneera.","","",0],["It didn't rain enough last year.","Bara darbe roobni ga'aan hin roobne.","","",0],["Take an umbrella.","Dibaabee qabadhu.","","",0]]},{"id":"pharmacy","en":"At the pharmacy","om":"Mana qorichaatti","icon":"💊","group":"services","intros":{"pse":{"en":"In the US many medicines need a doctor's prescription, and pharmacists will not sell antibiotics without one, while in Ethiopia they are often sold over the counter. Pharmacists can still advise you on simple problems like colds and headaches: describe your symptoms and ask about the dose and side effects.","om":"Ameerikaatti qorichoonni baay'een waraqaa ajaja doktoraa malee hin gurguraman; antibaayootikiin keessumaa. Itoophiyaatti garuu yeroo baay'ee kallattiin ni gurguramu. Ogeessi mana qorichaa dhukkuba salphaa (utaalloo, dhukkubbii mataa) irratti si gorsuu danda'a: mallattoo dhukkuba keetii himi, hanga fudhattu fi miidhaa cinaa isaa gaafadhu."},"rwb":{"en":"Pharmacies (mana qorichaa) are common in towns, and pharmacists often give advice directly. Ask how often to take a medicine: Guyyaatti si'a meeqa? Liqimsuu means 'to swallow' and fudhachuu 'to take'.","om":"Manneen qorichaa magaalota keessatti baay'ee jiru; ogeessi qorichaas gorsa ni kenna. Qoricha yeroo meeqa akka fudhattu gaafadhu: Guyyaatti si'a meeqa? Afaan Ingiliffaa keessatti qoricha fudhachuuf 'take', liqimsuuf 'swallow' jedhama."}},"items":[["Where's the nearest pharmacy?","Manni qorichaa dhiyoo jiru eessa?","","",0],["I need something for a headache.","Dhukkubbii mataatiif qoricha barbaada.","","",0],["Do you have anything for a cold?","Qoricha utaalloo qabdaa?","","",1],["I have a sore throat.","Qoonqoon na dhukkuba.","","",0],["I have a cough.","Qufaa qaba.","","",0],["I have a fever.","Ho'a qaamaa qaba.","","",0],["Do I need a prescription for this?","Kanaaf waraqaan ajaja qorichaa barbaachisaa?","","",0],["Here's my prescription.","Kunoo waraqaa ajaja qorichaa koo.","","",0],["How many should I take?","Meeqa fudhachuu qaba?","","",0],["Take two tablets three times a day.","Guyyaatti yeroo sadii, kiniinii lama lama fudhadhu.","","",0],["Take it after meals.","Nyaata booda fudhadhu.","","",0],["Does it have any side effects?","Miidhaa cinaa qabaa?","","",0],["It may make you sleepy.","Hirriba sitti fiduu danda'a.","","",0],["Is it safe for children?","Daa'immaniif rakkoo hin qabuu?","","",0],["I'm allergic to penicillin.","Penisiliiniif alarjii qaba.","","",0],["Do you have bandages?","Faashaa qabdaa?","","",1],["Keep out of reach of children.","Bakka daa'imman hin geenye kaa'i.","Common label on medicine.","",0],["Where is the pharmacy?","Manni qorichaa eessa jira?","Also: faarmaasii.","Akkasumas: faarmaasii.",0],["I need medicine for a headache.","Qoricha dhukkubbii mataa barbaada.","","",0],["Do you have a prescription?","Waraqaa qorichaa qabdaa?","","",1],["Take this medicine.","Qoricha kana fudhadhu.","Respect/plural: Qoricha kana fudhadhaa.","Kabajaaf/baay'inaaf: Qoricha kana fudhadhaa.",0],["Swallow this pill.","Kiniinii kana liqimsi.","","",0],["How many times a day?","Guyyaatti si'a meeqa?","","",0],["Three times a day, after meals.","Guyyaatti si'a sadii, nyaata booda.","","",0],["Don't take it on an empty stomach.","Garaa duwwaa hin fudhatin.","","",0],["I'm taking medicine.","Qoricha fudhachaa jira.","","",0],["You will get an injection.","Lilmoon siif kennama.","","",1],["Have you been vaccinated?","Talaallii fudhatte?","","",0],["I need a check-up.","Qorannoo fayyaa barbaada.","","",0],["You'll be fine.","Ni fayyita.","","",0]]},{"id":"health","en":"Seeing the doctor","om":"Doktoratti mul'achuu","icon":"🩺","group":"services","intros":{"pse":{"en":"At a US clinic you'll be asked about your symptoms, how long you've had them, your medical history and allergies, so prepare those answers. Describe pain with 'It hurts here' or 'I have a pain in my...'. In Oromo the body part is usually the subject: Mataan na dhukkuba ('My head hurts me').","om":"Kilinika Ameerikaatti waa'ee mallattoo dhukkubaa, yeroo hangamii akka si qabe, seenaa fayyaa kee fi alarjii ni gaafatamta; deebii isaanii dursitee qopheessi. Dhukkubbii ibsuuf 'It hurts here' ykn 'I have a pain in my...' jedhi. Afaan Oromootiin qaamni qaamaa raawwataa ta'a: 'Mataan na dhukkuba.'"},"rwb":{"en":"To say something hurts, make the body part the subject: Mataan na dhukkuba ('my head hurts me'). Na dhukkuba on its own means 'I'm sick'. Wish a sick person well with Waaqayyo si haa fayyisu ('May God heal you'). In English you say 'My head hurts' or 'I have a headache'.","om":"Qaamni dhukkubu raawwataa ta'a: 'Mataan na dhukkuba'. 'Na dhukkuba' qofti 'dhukkubsadheera' jechuudha. Nama dhukkubsateef 'Waaqayyo si haa fayyisu' jedhi. Afaan Ingiliffaa keessatti 'My head hurts' ykn 'I have a headache' jedhama."}},"items":[["I need to see a doctor.","Doktora arguu barbaada.","","",0],["I'd like to make an appointment.","Beellama qabachuun barbaada.","","",0],["What seems to be the problem?","Maaltu si dhukkuba?","","",0],["I don't feel well.","Fayyaa natti hin dhaga'amu.","Also: Fayyaa hin qabu.","",1],["My head hurts.","Mataan na dhukkuba.","","",0],["I have a terrible backache.","Dugdi koo baay'ee na dhukkubaa jira.","","",0],["It hurts here.","Asitti na dhukkuba.","","",0],["How long have you had this pain?","Dhukkubbiin kun erga si qabee hangam ta'e?","","",0],["For about two weeks.","Gara torbee lamaa.","","",0],["I feel dizzy.","Mataan na marsaa jira.","Also: Mataan na marsa.","",0],["I've been throwing up.","Haqqisaa ture.","","",0],["Are you taking any medicine?","Qoricha kamiyyuu fudhachaa jirtaa?","","",0],["Do you have any allergies?","Alarjii qabdaa?","","",0],["Please take off your shirt.","Maaloo kamiisa kee baasi.","","",0],["We need to do a blood test.","Dhiigni kee qoratamuu qaba.","","",0],["Is it contagious?","Namatti ni daddarbaa?","","",0],["It's nothing serious.","Wanti hamaan hin jiru.","","",0],["You should rest for a few days.","Guyyoota muraasaaf boqochuu qabda.","","",0],["Get well soon!","Dafii fayyi!","Also a blessing: Waaqni fayyaa siif haa kennu.","",0],["I'm sick.","Na dhukkuba.","Lit. 'It hurts me.' Also: Dhukkubsadheera.","Akkasumas: Dhukkubsadheera.",0],["Are you sick?","Si dhukkubaa?","Respect/plural: Isin dhukkubaa?","Kabajaaf/baay'inaaf: Isin dhukkubaa?",0],["Where does it hurt?","Eessa si dhukkuba?","","",0],["I have a headache.","Mataan na dhukkuba.","Also: Mataa na dhukkuba.","Akkasumas: Mataa na dhukkuba.",0],["My stomach hurts.","Garaan na dhukkuba.","","",0],["I have a toothache.","Ilkaan na dhukkuba.","","",0],["My throat hurts.","Qoonqoon na dhukkuba.","","",0],["I have a fever.","Qandhoon na qabeera.","","",1],["I have a cough.","Qufaan na qabeera.","","",0],["I have a cold.","Utaalloon na qabeera.","","",1],["I have diarrhea.","Garaan na kaasa.","","",0],["I'm vomiting.","Haqqisaa jira.","","",1],["I can't breathe.","Hafuura baafachuu hin danda'u.","","",0],["I have high blood pressure.","Dhiibbaa dhiigaa qaba.","","",0],["I burned my hand.","Harki koo gubate.","","",0],["It got worse.","Natti hammaate.","","",0],["I feel better.","Fooyya'eera.","Also: Wayyaa'eera.","Akkasumas: Wayyaa'eera.",0],["I need a doctor.","Doktora na barbaachisa.","","",0],["Take me to the hospital.","Hospitaala na geessi.","","",0],["Get well soon. (lit. 'May God heal you')","Waaqayyo si haa fayyisu.","","",0]]},{"id":"restaurant","en":"At a restaurant","om":"Mana nyaataatti","icon":"🍽️","group":"services","intros":{"pse":{"en":"In US restaurants you usually wait to be seated, the server checks on you during the meal, and at the end you ask for 'the check' and leave a 15–20% tip. Reservations are made by phone or app with the number of people, the time and a name. Sharing one big plate of injera is normal in Ethiopia; in most American restaurants each person orders their own dish.","om":"Mana nyaataa Ameerikaa keessatti yeroo baay'ee hanga teessoo siif kennanitti eegda; tajaajilaan yeroo nyaattu si gaafata; dhuma irratti 'the check' gaafatta, tiippii %15–20 ni dhiifta. Iddoo qabachuuf bilbilaan ykn appiidhaan baay'ina namaa, sa'aatii fi maqaa himta. Itoophiyaatti gabatee tokko irraa waliin nyaachuun baratamaadha; Ameerikaatti garuu namni tokkoon tokkoon nyaata mataa isaa ajaja."}},"items":[["I'd like to make a reservation for Saturday.","Sanbataaf iddoo qabachuu barbaada.","","",0],["For how many people?","Namoota meeqaaf?","","",0],["A table for four, please.","Maaloo, minjaala nama afuriif.","","",0],["What time would you like?","Sa'aatii meeqatti barbaadda?","","",0],["Around seven o'clock.","Naannoo sa'aatii torbaa.","7 p.m. = sa'aatii 1 galgalaa in Ethiopian time.","",0],["Sorry, we're fully booked then.","Dhiifama, yeroo sanatti iddoon hundi qabameera.","","",0],["Could we see the menu, please?","Maaloo meenuu nuuf fiduu dandeessaa?","","",0],["Are you ready to order?","Ajajuuf qophaa'aadhaa?","Respect/plural: Ajajuuf qophaa'oodhaa?","",0],["What do you recommend?","Maal akka ajaju na gorsita?","","",0],["I'll have the chicken.","Ani foon lukkuu barbaada.","","",0],["Can I get it without onions?","Shunkurtii malee argachuu danda'aa?","","",0],["Is it very spicy?","Barbaree baay'ee qabaa?","","",0],["Could we have some water, please?","Maaloo bishaan xiqqoo nuuf fidi.","","",0],["That's all, thanks.","Kanuma, galatoomi.","","",0],["Excuse me, this isn't what I ordered.","Dhiifama, kun waanan ajaje miti.","","",0],["Everything was delicious.","Hundi isaa mi'aawaa ture.","","",0],["Could we have the check, please?","Maaloo herrega nuuf fidi.","British: 'the bill'.","",0],["Can we pay separately?","Adda addaan kaffaluu dandeenyaa?","","",0],["Is the tip included?","Tiippiin itti dabalameeraa?","","",0]]},{"id":"post","en":"At the post office","om":"Mana poostaatti","icon":"📮","group":"services","intros":{"pse":{"en":"US post offices also sell boxes and ship packages; the clerk will ask whether you want tracking or insurance. Write addresses in English order: name, street, city, state and ZIP code. In Ethiopia many people and offices use a P.O. Box (saanduqa poostaa) instead of a street address.","om":"Manni poostaa Ameerikaa saanduqa ni gurgura, paakeejiis ni erga; hojjetaan 'tracking' ykn inshuraansii barbaaddaa jedhee si gaafata. Teessoo akkaataa Ingiliffaatiin barreessi: maqaa, daandii, magaalaa, isteetii fi koodii poostaa (ZIP). Itoophiyaatti namoonni fi dhaabbileen baay'een teessoo daandii osoo hin taane saanduqa poostaa fayyadamu."},"rwb":{"en":"Post offices handle letters, parcels and P.O. boxes; home delivery is rare, so many people and businesses rent a box (saanduqa poostaa). Bring ID when you collect a parcel. Teessoo means address.","om":"Manni poostaa xalayaa, ergaa fi saanduqa poostaa tajaajila; xalayaan mana manatti hin geeffamu, kanaaf namoonni hedduun saanduqa poostaa fayyadamu. Ergaa fudhachuuf waraqaa eenyummaa qabadhu. 'Teessoo' jechuun 'address' jechuudha."}},"items":[["Where's the post office?","Manni poostaa eessa?","","",0],["I'd like to send this letter to Canada.","Xalayaa kana gara Kanaadaatti erguun barbaada.","","",0],["How much is a stamp for the US?","Teembiriin Ameerikaaf meeqa?","","",0],["I want to send a package.","Paakeejii erguun barbaada.","","",0],["What's in the package?","Paakeejicha keessa maaltu jira?","","",0],["How long will it take to arrive?","Gahuuf yeroo hangamii fudhata?","","",0],["Do you want to send it express?","Saffisaan erguu barbaaddaa?","","",0],["Can I track it?","Eessa akka gahe hordofuu danda'aa?","","",0],["Please fill out this form.","Maaloo unka kana guuti.","Also: Maaloo, unka kana guuti.","",0],["Fragile — handle with care.","Ni cabaa — of eeggannoon qabi.","","",0],["Is there any mail for me?","Xalayaan anaaf dhufe jiraa?","Also: Xalayaan naaf dhufe jiraa?","",0],["I'd like to rent a P.O. box.","Saanduqa poostaa kireeffachuu barbaada.","","",0],["What's your ZIP code?","Koodiin poostaa kee meeqa?","","",0],["Where is the post office?","Manni poostaa eessa jira?","","",0],["I want to send this by post.","Kana poostaan erguun barbaada.","","",0],["I want to send a letter to America.","Xalayaa gara Ameerikaatti erguun barbaada.","","",0],["How much is a stamp?","Teembiraan meeqa?","","",1],["I'm waiting for a parcel.","Ergaa tokko eegaa jira.","","",0],["Has my parcel arrived?","Ergaan koo ga'eeraa?","","",0],["When will it arrive?","Yoom ga'a?","","",0],["What's the address?","Teessoon isaa maali?","","",0],["I'd like a P.O. box.","Saanduqa poostaa barbaada.","","",0],["Show me your ID.","Waraqaa eenyummaa kee natti agarsiisi.","","",0]]},{"id":"shopping","en":"Shopping","om":"Gabaa bittaa","icon":"🛍️","group":"services","intros":{"pse":{"en":"Prices in US stores are fixed; bargaining is normal only at yard sales, flea markets and car dealers. In Ethiopian markets bargaining is expected: ask the price, offer less, and meet in the middle. In most US states sales tax is added at the register, so you pay a little more than the price tag.","om":"Suuqii Ameerikaa keessatti gatiin murtaa'aadha; gatii wal falmachuun gabaa meeshaa moofaa fi konkolaataa qofatti baratamaadha. Gabaa Itoophiyaa keessatti garuu gatii wal falmachuun barbaachisaadha: gatii gaafadhu, gad buusii dhiyeessi, gidduutti walii galaa. Isteetota Ameerikaa baay'ee keessatti gibirri gurgurtaa kaffaltii irratti dabalama."},"rwb":{"en":"Small shops (suuqii, dukkaana) sell most everyday goods, and clothes are often tried on in the shop or at the market. Natti ta'a means 'it fits / suits me'. In Oromo the color comes after the noun (shamiiza diimaa), but in English it comes before (a red shirt).","om":"Suuqiin xixiqqaan meeshaa guyyaa guyyaa hedduu gurgura; uffanni yeroo baay'ee suuqii ykn gabaa keessatti yaalamee bitama. 'Natti ta'a' jechuun 'it fits me' jechuudha. Afaan Oromoo keessatti halluun maqaa booda dhufa (shamiiza diimaa); Afaan Ingiliffaa keessatti garuu dura dhufa (a red shirt)."}},"items":[["How much is this?","Kun meeqa?","","",0],["How much are these shoes?","Kopheen kun meeqa?","","",0],["I'm just looking, thanks.","Ilaalaa jira qofa, galatoomi.","","",0],["Do you have this in a smaller size?","Kan kana irra xiqqaatu qabdaa?","","",0],["Can I try it on?","Uffadhee ilaaluu danda'aa?","","",0],["Where's the fitting room?","Kutaan itti uffatanii ilaalan eessa?","","",0],["It doesn't fit.","Sirriitti naaf hin taane.","","",0],["It's too expensive.","Baay'ee qaaliidha.","","",0],["Can you give me a discount?","Gatii naaf hir'isuu dandeessaa?","","",0],["What's your best price?","Gatiin dhumaa meeqa?","","",0],["I'll give you 200 birr.","Qarshii dhibba lama siif kenna.","","",0],["Okay, it's a deal.","Tole, walii galle.","","",0],["I'll take it.","Nan fudhadha.","","",0],["Is this on sale?","Kun gatii hir'ifameen gurguramaa jiraa?","","",0],["Do you take credit cards?","Kaardii kireeditii ni fudhattuu?","","",0],["Can I get a receipt?","Nagahee argachuu danda'aa?","","",0],["Could I get a bag, please?","Maaloo boorsaa naaf kenni.","","",1],["Where can I find rice?","Ruuzii eessatti argadha?","","",0],["Sorry, we're sold out.","Dhiifama, hundi gurguramee dhumeera.","","",0],["Is there a shop near here?","Suuqiin as dhihoo jiraa?","Also: dukkaana.","Akkasumas: dukkaana.",0],["I want to buy clothes.","Uffata bitachuun barbaada.","","",0],["I bought two shirts.","Shamiiza lama bitadhe.","","",0],["It fits me.","Natti ta'a.","","",0],["It doesn't fit me.","Natti hin ta'u.","","",0],["It's too big for me.","Natti bal'ata.","","",0],["It's too tight.","Natti dhiphata.","","",0],["Do you have a bigger one?","Kan guddaa qabdaa?","Smaller: Kan xiqqaa qabdaa?","Xiqqaa: Kan xiqqaa qabdaa?",0],["Do you have it in black?","Isa gurraacha qabdaa?","","",0],["Her dress is beautiful.","Uffanni ishee bareedaadha.","","",0],["What are you wearing?","Maal uffatte?","","",0],["I'm wearing a red shirt.","Shamiiza diimaa uffadheera.","","",0],["What time do you open?","Sa'aa meeqatti banama?","","",0]]},{"id":"money","en":"Money, rich and poor","om":"Maallaqa, sooressa fi hiyyeessa","icon":"💵","group":"services","intros":{"pse":{"en":"Talking openly about salaries is less common in the US than in Ethiopia, and 'How much do you make?' can feel rude. Lending money to friends happens in both cultures, but Americans usually expect it back on an agreed day. English has many casual words for money situations: 'broke' (no money), 'loaded' (very rich).","om":"Ameerikaatti waa'ee mindaa ifatti haasa'uun akka Itoophiyaa hin baratamne; 'How much do you make?' gaafachuun safuu dhabummaa fakkaata. Hiriyyaaf qarshii liqeessuun aadaa lamaan keessattuu jira; garuu Ameerikaanonni guyyaa waliif galame irratti akka deebi'u eegu. Ingiliffaan jechoota salphaa baay'ee qaba: 'broke' (qarshii hin qabu), 'loaded' (baay'ee sooressa)."},"rwb":{"en":"The currency is the birr; qarshii is also the everyday word for money. Small bills are often scarce, so carry change. Idaan kee narra jira means 'I owe you' (lit. 'your debt is on me').","om":"Maallaqni Itoophiyaa 'birrii' jedhama; 'qarshii' jechi maallaqa waliigalaas ibsa. Qarshiin xixiqqaan yeroo baay'ee hin argamu, kanaaf qabachuun gaariidha. 'Idaan kee narra jira' jechuun 'I owe you' jechuudha."}},"items":[["Can you change a 100-birr note?","Qarshii dhibbaa naaf jijjiiruu dandeessaa?","","",0],["I'm broke.","Qarshii tokkollee hin qabu.","Informal. Oromo idiom: Harki koo duwwaadha ('My hand is empty').","",0],["Can you lend me some money?","Qarshii xiqqoo na liqeessuu dandeessaa?","","",0],["I'll pay you back on Friday.","Jimaata siif deebisa.","","",0],["How much do I owe you?","Meeqa siif kaffaluu qaba?","","",0],["Where can I exchange dollars?","Doolaara eessatti jijjiiruu danda'a?","","",0],["Is there an ATM near here?","ATM'n dhiyoo jiraa?","","",0],["I want to open a bank account.","Herrega baankii banachuu barbaada.","","",0],["I can't afford it.","Kana bituuf humni koo hin gahu.","Also: Kana bituuf maallaqni koo hin ga'u.","",0],["It's on me.","Ani nan kaffala.","In Ethiopia the person who invites usually pays; in the US friends often split the bill.","",0],["Let's split the bill.","Walakkaa walakkaa haa kaffallu.","","",0],["I'm saving up for a car.","Konkolaataa bituuf qarshii kuusaa jira.","","",0],["He's very rich.","Inni baay'ee dureessa.","Also: sooressa.","",0],["She grew up poor.","Isheen hiyyummaa keessatti guddatte.","","",0],["They're struggling to make ends meet.","Jireenya isaanii gaggeessuuf rakkachaa jiru.","","",0],["Money doesn't grow on trees.","Qarshiin muka irratti hin biqilu.","Meaning: money is hard to get, so don't waste it.","Hiikni: qarshiin salphaatti hin argamu, hin balleessin.",0],["Money isn't everything.","Qarshiin waan hundaa miti.","","",0],["How much money do you have?","Maallaqa hammam qabda?","Also: Qarshii meeqa qabda?","Akkasumas: Qarshii meeqa qabda?",0],["I don't have small bills.","Qarshii xixiqqaa hin qabu.","","",0],["Give me my change.","Hambaa koo naa kenni.","","",1],["Is there a bank near here?","Baankiin as dhihoo jiraa?","","",0],["I want to withdraw money.","Maallaqa baafachuun barbaada.","","",0],["I want to deposit money.","Maallaqa galchuun barbaada.","","",0],["I owe you.","Idaan kee narra jira.","","",0],["You owe me 200 birr.","Idaan qarshii dhibba lamaa sirra jira.","","",0],["Can you lend me money until Friday?","Hanga Jimaataatti maallaqa naa liqeessuu dandeessaa?","","",0],["I'll pay you back tomorrow.","Boru siif nan deebisa.","","",0],["What's your monthly salary?","Mindaan kee ji'aan meeqa?","","",0],["Divide the money equally.","Maallaqa walqixxeetti qoodi.","","",0]]},{"id":"electronics","en":"At the electronics store and returns","om":"Suuqii elektirooniksii fi meeshaa deebisuu","icon":"📺","group":"services","intros":{"pse":{"en":"US electronics stores have fixed prices but frequent sales, and most accept returns within 14–30 days if you have the receipt. If something is faulty, explain the problem calmly, show the receipt, and ask for a repair, an exchange or a refund; if that fails, politely ask for the manager.","om":"Suuqiin elektirooniksii Ameerikaa gatii murtaa'aa qaba, garuu yeroo baay'ee gatii hir'isu. Baay'een isaanii guyyaa 14–30 keessatti nagahee yoo qabaatte meeshaa ni deebifatu. Meeshaan yoo hin hojjanne, rakkoo isaa tasgabbiin ibsi, nagahee agarsiisi, akka siif suphan, jijjiiran ykn qarshii siif deebisan gaafadhu; yoo hin taane itti gaafatamaa kabajaan gaafadhu."}},"items":[["I'm looking for a TV.","Televizhinii barbaadaa jira.","","",0],["This model is on sale this week.","Moodeelli kun torbee kana gatii hir'ifameen gurguramaa jira.","","",0],["Do you have a cheaper one?","Kan gatiin isaa salphaa ta'e qabdaa?","","",0],["Does it come with a warranty?","Wabii (gaaraantii) qabaa?","","",0],["Can you show me how it works?","Akkamitti akka hojjatu na agarsiisuu dandeessaa?","","",0],["I bought this TV here last month.","Televizhinii kana ji'a darbe asii bite.","","",0],["It doesn't work.","Hin hojjatu.","","",0],["The sound is terrible.","Sagaleen isaa baay'ee hamaadha.","","",0],["The screen keeps going black.","Iskiriiniin isaa yeroo yeroon dukkanaa'a.","","",0],["Have you tried turning it off and on again?","Cuftee deebistee banuu yaaltee?","","",0],["I'd like to return it.","Deebisuu barbaada.","","",0],["Can I exchange it for another one?","Isa biraatiin jijjiiruu danda'aa?","","",0],["I want a refund.","Qarshiin koo akka naaf deebi'u barbaada.","","",0],["Do you have the receipt?","Nagahee qabdaa?","","",0],["Sorry, we don't give refunds.","Dhiifama, qarshii hin deebisnu.","","",0],["Could I speak to the manager?","Itti gaafatamaa waliin haasa'uu danda'aa?","","",0]]},{"id":"emergency","en":"Emergencies and getting help","om":"Yeroo balaa fi gargaarsa argachuu","icon":"🚨","group":"services","intros":{"pse":{"en":"In the US, call 911 for police, fire or an ambulance; in Ethiopia police can be reached on 991, and other emergency numbers differ by city, so save the local ones. Speak slowly, give the exact location first, then say what happened. For everyday breakdowns (car, water, power) ask a neighbor or call a repair service.","om":"Ameerikaatti poolisii, ibidda dhaamsitootaa ykn ambulaansiif 911 bilbili; Itoophiyaatti poolisiin 991n argama, lakkoofsonni biroo magaalaadhaan adda waan ta'aniif kan naannoo keetii kuusadhu. Suuta dubbadhu: dura bakka sirrii himi, achiis waan ta'e ibsi. Rakkoo guyyaa guyyaa (konkolaataa, bishaan, ibsaa) yoo ta'e, ollaa gaafadhu ykn tajaajila suphaa bilbili."},"rwb":{"en":"In an emergency, short plural commands call on everyone around: Na birmadhaa! (Come and help me!), Qabaa! (Catch him!). Neighbors and passers-by usually respond quickly to a call for help. Learn the words for police (poolisii), hospital (hospitaala) and accident (balaa).","om":"Yeroo balaa ajaja gabaabaa unka baay'inaatiin nama naannoo hunda waamna: Na birmadhaa! Qabaa! Ollaan fi namni karaa irra jiru iyya gargaarsaatiif dafee deebii kenna. Jechoota poolisii, hospitaala fi balaa baradhu."}},"items":[["Help!","Na gargaaraa!","Also: Na birmadhaa!","",0],["Call an ambulance!","Ambulaansii waamaa!","","",0],["Call the police!","Poolisii waamaa!","","",0],["Fire!","Ibiddi ka'eera!","","",0],["Watch out!","Of eeggadhu!","Respect/plural: Of eeggadhaa!","",0],["There's been an accident.","Balaan qaqqabeera.","Also: Balaan ga'eera.","",0],["Two cars crashed.","Konkolaattonni lama walitti bu'an.","","",0],["Is anyone hurt?","Namni miidhame jiraa?","","",0],["Someone is badly hurt.","Namni tokko baay'ee miidhameera.","","",0],["He's not breathing.","Hafuura hin baafatu.","","",0],["She's unconscious.","Of hin beektu.","","",0],["Stay calm.","Tasgabbaa'i.","","",0],["Don't move him.","Hin sochoosin.","","",0],["Where are you exactly?","Sirriitti eessa jirta?","","",0],["I need a doctor right away.","Ammuma doktora barbaada.","","",0],["My car won't start.","Konkolaataan koo hin ka'u.","","",0],["Could you help me fix it?","Sirreessuuf na gargaaruu dandeessaa?","","",0],["The sink is leaking.","Iddoon miicaa bishaan coccobsaa jira.","","",0],["I can't turn the water off.","Bishaan cufuu hin dandeenye.","","",0],["The power is out.","Ibsaan dhaameera.","","",0],["Can you send someone to look at it?","Nama akka ilaalu naaf erguu dandeessaa?","","",0],["Thief!","Hattuu!","","",0],["Catch him!","Qabaa!","","",0],["Watch out — a car!","Of eeggadhu, konkolaataa!","","",0],["There's a fire!","Ibiddi ka'eera!","","",0],["Someone is hurt.","Namni miidhameera.","","",0],["Hurry, call a doctor!","Dafaa, doktora waamaa!","","",0],["Call an ambulance.","Ambulaansii waami.","","",0],["I'm lost.","Karaan na jalaa bade.","","",0],["Where is the police station?","Buufanni poolisii eessa jira?","","",0],["My bag was stolen.","Boorsaan koo hatame.","","",0],["I lost my passport.","Paaspoortiin koo na jalaa bade.","","",0]]},{"id":"police","en":"Police and reporting a crime","om":"Poolisii fi yakka gabaasuu","icon":"👮","group":"services","intros":{"pse":{"en":"To report a crime, give the facts clearly: what happened, when and where, what was taken, and what anyone you saw looked like. If US police stop you, stay calm, keep your hands visible and follow instructions; you may ask 'Am I under arrest?' and you have the right to a lawyer.","om":"Yakka gabaasuuf odeeffannoo ifa kenni: maaltu ta'e, yoom fi eessatti, maaltu hatame, namni ati argite maal fakkaata. Ameerikaatti poolisiin yoo si dhaabe, tasgabbaa'i, harki kee akka mul'atu godhi, ajaja hordofi; 'Am I under arrest?' gaafachuu dandeessa, abukaatoo argachuuf mirga qabda."}},"items":[["I want to report a theft.","Waa'ee hannaa
